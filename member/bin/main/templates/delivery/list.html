<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배송지 관리 - 고향사랑e음</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- 마이페이지 "배송지 관리" (AS-IS mypage/deliveryInfo.html 재현) - AS-IS는 라디오로 배송지
     하나를 고른 뒤 하단의 "기본배송지로 선택"/"삭제" 버튼으로 동작한다(행마다 버튼을 두지
     않음). 추가/수정은 AS-IS에서 팝업(Vue 모달)이지만 이 MSA는 별도 화면으로 대신한다. -->
<script th:inline="none">
function selectedDeliveryId() {
    var checked = document.querySelector('input[name="selectedDelivery"]:checked');
    return checked ? checked.value : null;
}
function setDefaultDelivery() {
    var id = selectedDeliveryId();
    if (!id) {
        alert('배송지를 선택해주세요.');
        return;
    }
    if (!confirm('정보를 수정 하시겠습니까?')) { return; }
    document.getElementById('defaultForm').action = '/delivery/' + id + '/default';
    document.getElementById('defaultForm').submit();
}
function deleteDelivery() {
    var id = selectedDeliveryId();
    if (!id) {
        alert('배송지를 선택해주세요.');
        return;
    }
    var isDefault = document.querySelector('input[name="selectedDelivery"]:checked').dataset.default === 'Y';
    var message = isDefault ? '기본배송지입니다. 삭제하시겠습니까?' : '선택하신 배송지를 삭제 하시겠습니까?';
    if (!confirm(message)) { return; }
    document.getElementById('deleteForm').action = '/delivery/' + id + '/delete';
    document.getElementById('deleteForm').submit();
}
</script>

<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{/}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/mypage}">마이페이지</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            배송지 관리
        </span>
        <h2 class="page-title-txt">배송지 관리</h2>
    </div>
</section>

<section id="contents" class="receipt-contents">
    <div class="center">
        <div class="s-contents mylist">
            <div class="btn_area">
                <button class="formBtn del" th:attr="data-url=@{/delivery/write}" onclick="location.href=this.dataset.url">배송지 추가</button>
            </div>

            <div class="list_body table-container w3c_v_2410">
                <div class="list_wrap mypage">
                    <table>
                        <caption>배송지관리 - 배송지명, 주소, 받는사람, 휴대폰전화번호로 구성</caption>
                        <thead class="list-title">
                        <tr class="items_wrap">
                            <th class="date-col s_radio" scope="col">선택</th>
                            <th class="date-col a_name" scope="col">배송지명</th>
                            <th class="date-col a_address" scope="col">주소</th>
                            <th class="date-col p_name" scope="col">받는사람</th>
                            <th class="date-col p_phone" scope="col">휴대전화번호</th>
                            <th class="date-col modify" scope="col">수정</th>
                        </tr>
                        </thead>
                        <tbody class="item_list-group">
                        <tr class="list-items" th:each="d, iter : ${deliveries}">
                            <td class="date-col s_radio">
                                <label class="sr-only" th:for="'sel' + ${iter.index}" th:text="${d.title} + ' 선택'"></label>
                                <input type="radio" name="selectedDelivery" th:id="'sel' + ${iter.index}"
                                       th:value="${d.userDeliveryId}" th:attr="data-default=${d.defaultFlag}">
                            </td>
                            <td class="date-col a_name">
                                <a th:href="@{'/delivery/edit/' + ${d.userDeliveryId}}" title="수정" th:text="${d.title}"></a>
                            </td>
                            <td class="date-col a_address">
                                <label th:for="'sel' + ${iter.index}">
                                    <span class="a_tag" th:if="${d.defaultFlag == 'Y'}">
                                        <span class="formBtn default">기본배송지</span>
                                    </span>
                                    <span th:text="${d.address} + (${d.addressDetail} != null ? ' ' + ${d.addressDetail} : '')"></span>
                                </label>
                            </td>
                            <td class="date-col p_name" th:text="${d.userName}"></td>
                            <td class="date-col p_phone" th:text="${d.mobile}"></td>
                            <td class="date-col modify">
                                <button type="button" aria-label="배송지 수정" th:attr="data-url=@{'/delivery/edit/' + ${d.userDeliveryId}}"
                                        onclick="location.href=this.dataset.url">
                                    <img class="icon-img" th:src="@{/images/icon/list-modify.png}" alt="">
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="list-none" th:if="${#lists.isEmpty(deliveries)}">등록된 배송지가 없습니다.</div>
        </div>

        <form id="defaultForm" method="post"></form>
        <form id="deleteForm" method="post"></form>

        <div class="btn-box many">
            <button type="button" class="blueBtn cancellation" onclick="setDefaultDelivery()">
                기본배송지로 선택<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
            </button>
            <button type="button" class="blueBtn u-confirm" onclick="deleteDelivery()">
                삭제<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
            </button>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
