<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>연계 준비중 - 고향사랑e음 (member service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1 th:text="${providerName} + ' 로그인'"><span class="badge">member</span></h1>
    <p class="result-box">
        <span th:text="${providerName}"></span> 연계는 코드 구현이 완료되었지만, 아직 방화벽/실제 연계 기관 승인이
        열리지 않아 이 환경에서는 비활성화(<code>enabled: false</code>) 상태입니다.<br>
        연계가 열리면 설정값만 채우면 바로 동작합니다.
    </p>
    <div class="links">
        <a th:href="@{${backUrl} != null ? ${backUrl} : '/login'}" th:text="${backLabel} != null ? ${backLabel} : '로그인으로 돌아가기'"></a>
    </div>
</div>
</body>
</html>
