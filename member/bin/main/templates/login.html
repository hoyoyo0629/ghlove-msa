<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 고향사랑e음</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/login-total.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>

<div th:replace="~{fragments/header :: site-header}"></div>

<div id="contents">
    <!-- AS-IS users/login.html의 로그인 카드 재현(.login-total/.login-box/.loginType 등
         클래스 그대로). AS-IS는 Vue data.tabId로 탭을 전환하지만, 이 프로젝트는 순수 JS로
         .currentB 클래스와 패널 display만 토글해서 동일한 결과를 낸다. -->
    <section class="login-total center">
        <div class="login-box general">
            <div class="loginType">
                <ul>
                    <li class="currentB" id="tab-nav-1">
                        <button type="button" onclick="loginSetTab(1)">아이디 로그인</button>
                    </li>
                    <li id="tab-nav-2">
                        <button type="button" onclick="loginSetTab(2)">금융/간편 인증</button>
                    </li>
                </ul>
            </div>

            <!-- 탭1: 아이디 로그인 -->
            <div id="tab-panel-1" th:if="${mfaStep != true}">
                <div class="login-title-box">
                    <img th:src="@{/images/icon/cli-icon-bullet.png}" alt="">
                    <h2 class="login-title">아이디 <strong>로그인</strong></h2>
                </div>

                <p class="success" th:if="${param.signup != null}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
                <p class="error" th:if="${param.passwordChanged != null}">비밀번호가 변경되었습니다. 다시 로그인해 주세요.</p>
                <p class="success" th:if="${param.withdrawn != null}">탈퇴 처리가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.</p>
                <p class="success" th:if="${param.reactivated != null}">휴면 해제가 완료되었습니다. 다시 로그인해 주세요.</p>
                <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

                <form th:action="@{/login}" method="post" id="login-general">
                    <input type="hidden" name="target" th:if="${param.target != null}" th:value="${param.target[0]}">
                    <div class="login-field-group">
                        <span class="login-field-items">
                            <input type="text" placeholder="아이디" id="loginId" name="loginId" required autofocus>
                        </span>
                        <span class="login-field-items">
                            <input type="password" placeholder="비밀번호" id="password" name="password" required>
                        </span>
                        <span class="login-field-check saveId">
                            <input type="checkbox" id="id_save">
                            <label for="id_save"><span class="marker"></span>아이디저장</label>
                        </span>
                    </div>
                    <div class="login-field-group">
                        <button id="loginBtn" class="login" type="submit">로그인</button>
                    </div>
                    <div class="login-field-group">
                        <div class="login-check-wrap">
                            <span class="find-wrap">
                                <a th:href="@{/find-idpw}">아이디·비밀번호찾기</a>
                            </span>
                            <span class="find-wrap">
                                <a th:href="@{/signup}" class="moreView deepGray"><strong>회원가입</strong></a>
                            </span>
                        </div>
                    </div>
                </form>

                <a th:href="@{/login/kakao}" class="btn-simple btn-simple--kakao">
                    <span class="btn-simple__logo"><img th:src="@{/images/kakao/kakaotalk_symbol_screen.png}" class="btn-simple__img" alt="" aria-hidden="true"></span>
                    <span class="btn-simple__txt">카카오톡 인증 로그인</span>
                </a>
                <a th:href="@{/login/naver}" class="btn-simple btn-simple--naver">
                    <span class="btn-simple__logo"><img th:src="@{/images/new/naver_logo_2.png}" class="btn-simple__img" alt="" aria-hidden="true"></span>
                    <span class="btn-simple__txt">네이버 인증 로그인</span>
                </a>
            </div>

            <!-- SFR-002 다중인증(MFA) 2단계 - 마이페이지에서 MFA를 켜둔 회원만 이 화면을 본다.
                 같은 로그인 화면 안에서 폼만 바뀌는 방식([[feedback-mock-integration-same-screen]]과
                 동일한 원칙) - 실제 SMS 연계가 없어(ums.enabled=false) devCode를 화면에 그대로
                 노출해 개발/테스트가 가능하게 한다. 연계가 붙으면 devCode 노출만 없애면 된다. -->
            <div id="tab-panel-mfa" th:if="${mfaStep == true}">
                <div class="login-title-box">
                    <img th:src="@{/images/icon/cli-icon-bullet.png}" alt="">
                    <h2 class="login-title">추가 <strong>인증</strong></h2>
                </div>
                <p class="s-txt" th:text="'등록된 휴대폰(' + ${maskedPhone} + ')으로 인증번호를 보냈습니다.'"></p>
                <p class="error" th:if="${devCode}" th:text="'[테스트용] 인증번호: ' + ${devCode}"></p>
                <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
                <form th:action="@{/login/mfa-verify}" method="post">
                    <div class="login-field-group">
                        <span class="login-field-items">
                            <input type="text" placeholder="인증번호 6자리" name="code" maxlength="6" required autofocus>
                        </span>
                    </div>
                    <div class="login-field-group">
                        <button class="login" type="submit">인증 확인</button>
                    </div>
                </form>
            </div>

            <!-- 탭2: 금융/간편 인증 -->
            <div id="tab-panel-2" style="display:none;">
                <div class="login-title-box">
                    <img th:src="@{/images/icon/cli-icon-bullet.png}" alt="">
                    <h2 class="login-title">금융/간편 <strong>인증</strong></h2>
                </div>
                <div class="auth_wrap pt-0">
                    <form th:action="@{/login/finance-cert}">
                        <div class="simple-login">
                            <div class="financ-login-wrap">
                                <div class="finance-img">
                                    <img th:src="@{/images/icon/financ.png}" alt="금융인증서">
                                </div>
                                <p class="s-txt">
                                    <span>금융기관에 등록된</span>
                                    <span>금융인증서로 본인 인증 하기</span>
                                </p>
                            </div>
                        </div>
                        <div class="login-field-group">
                            <button id="finAuthBtn" class="login logins" type="submit" title="새 창 열림">
                                <span>금융인증서 로그인</span>
                            </button>
                        </div>
                    </form>
                    <form th:action="@{/login/simple-auth}">
                        <div class="simple-login" id="authBtn">
                            <div class="simple-login-wrap">
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/kakao.png}" alt="카카오톡"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/kb.png}" alt="국민인증서"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/payco.png}" alt="페이코"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/pass.png}" alt="통신사PASS"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/samsung.png}" alt="SAMSUNG PASS"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/naver.png}" alt="네이버"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/shinhan.png}" alt="신한인증서"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/toss.png}" alt="토스"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/nh.png}" alt="NH인증서"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/hana.png}" alt="하나인증서"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/dream.png}" alt="드림인증"></span>
                                <span class="sim_auth"><img th:src="@{/images/icon/sim_auth/banks.png}" alt="뱅크샐러드"></span>
                            </div>
                        </div>
                        <div class="login-field-group">
                            <button class="login" type="submit" title="새 창 열림">
                                <span>간편인증 로그인</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

<div th:replace="~{fragments/footer :: site-footer}"></div>

<!-- AS-IS는 Vue data.tabId로 탭을 전환하지만, 이 프로젝트는 순수 JS로 같은 결과를 낸다.
     아이디저장은 AS-IS도 실제로는 로컬 브라우저 저장(로그인 요청 자체는 그대로 서버로 감)이라
     여기서도 동일하게 localStorage만 사용한다. -->
<script th:inline="none">
function loginSetTab(id) {
    document.getElementById('tab-nav-1').classList.toggle('currentB', id === 1);
    document.getElementById('tab-nav-2').classList.toggle('currentB', id === 2);
    document.getElementById('tab-panel-1').style.display = id === 1 ? '' : 'none';
    document.getElementById('tab-panel-2').style.display = id === 2 ? '' : 'none';
}

(function () {
    var idInput = document.getElementById('loginId');
    var saveBox = document.getElementById('id_save');
    var form = document.getElementById('login-general');
    if (!idInput || !saveBox || !form) return;

    var saved = window.localStorage.getItem('ghlove_saved_login_id');
    if (saved) {
        idInput.value = saved;
        saveBox.checked = true;
    }
    form.addEventListener('submit', function () {
        if (saveBox.checked) {
            window.localStorage.setItem('ghlove_saved_login_id', idInput.value);
        } else {
            window.localStorage.removeItem('ghlove_saved_login_id');
        }
    });
})();
</script>
</body>
</html>
