<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - 고향사랑e음</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/change-info.css}">
    <link rel="stylesheet" th:href="@{/css/change-pw.css}">
    <link rel="stylesheet" th:href="@{/css/join-inf2.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS users/modify.html의 "비밀번호 변경" 화면(change-pw.css) 재현. AS-IS와 동일하게
     2단계로 동작한다: (1) "현재 비밀번호 입력" + "인증" 버튼으로 본인의 현재 비밀번호를
     먼저 재확인해야(checkPresentPwd/AS-IS의 confirmPresentPassword API 재현), (2) 그제서야
     "새 비밀번호 입력/확인" 칸이 열린다. 비밀번호 규칙 체크리스트(4가지 + 보안도 표시)는
     signup.html의 checkPwd()/isContinued()와 완전히 동일한 로직이고, 서버
     (MemberService.validatePasswordComplexity)도 최종 제출 시 같은 규칙을 다시 검증한다. -->
<section class="find-idpw center">
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{/}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/profile}">회원정보 수정</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            비밀번호 변경
        </span>
        <h2 class="page-title-txt">비밀번호 변경</h2>
    </div>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/password}" method="post" id="changePwdForm" onsubmit="return beforeSubmit()">
        <input type="hidden" id="loginId" th:value="${loginId}">
        <div class="change-info-area">
            <div class="info-mess">
                <p class="sub-title">인증이 완료 되었습니다. 비밀번호를 초기화 합니다.</p>
                <p class="title"><strong>새로운 비밀번호</strong>를<br>입력해 주세요.</p>
            </div>
            <div class="line"></div>
            <div class="info-field-group">
                <div class="info-field-items newpw">
                    <label for="currentPassword" class="flied-title-custom">현재 비밀번호 입력</label>
                    <input type="password" name="currentPassword" id="currentPassword" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();checkPresentPwd();}">
                    <button type="button" id="verifyCurrentBtn"
                            style="background-color: var(--sub-color1);color:white;border-radius: 4px;width: 18%;height: 40px;margin-right: 3px;"
                            onclick="checkPresentPwd()">인증</button>
                </div>
                <div class="info-field-items newpw" style="justify-content: flex-start;">
                    <label class="flied-title"></label>
                    <p id="presentPwdMsg" class="pointRed" style="font-size: 12px;">현재 사용중인 비밀번호로 인증해주세요.</p>
                </div>
                <div class="info-field-items newpw">
                    <label for="newPassword" class="flied-title">새 비밀번호 입력</label>
                    <input type="password" name="newPassword" id="newPassword" autocomplete="new-password" disabled oninput="checkPwd()">
                </div>
                <div class="info-field-items newpw">
                    <label for="newPasswordConfirm" class="flied-title">새 비밀번호 확인</label>
                    <input type="password" name="newPasswordConfirm" id="newPasswordConfirm" autocomplete="new-password" disabled oninput="checkPwd()">
                </div>
                <div class="info-field-items">
                    <div class="pw-validation-area">
                        <ul>
                            <li><span class="pw-validation"><img id="pwRuleAll" th:src="@{/images/icon/pw-unavailable.png}" alt="사용불가-아래 항목을 모두 만족해야 합니다"></span>
                                <span class="txt_box">
                                    <span class="txt_items">비밀번호 보안도 <strong id="pwStrength" class="pointRed">약함</strong></span>
                                    <span class="txt_items">( 4가지 체크 완료 시 V 표시 )</span>
                                </span>
                            </li>
                            <li><span class="pw-validation"><img id="pwRule1" th:src="@{/images/icon/pw-unavailable.png}" alt="사용불가-숫자, 기호, 영문자 미포함"></span>1. 숫자, 기호, 영문자 포함</li>
                            <li><span class="pw-validation"><img id="pwRule2" th:src="@{/images/icon/pw-unavailable.png}" alt="사용불가-3개 이상 연속 문자/숫자 제외"></span>2. 3개 이상 연속 문자/숫자 제외</li>
                            <li><span class="pw-validation"><img id="pwRule3" th:src="@{/images/icon/pw-unavailable.png}" alt="사용불가-아이디를 포함할 수 없음"></span>3. 아이디를 포함할 수 없음</li>
                            <li><span class="pw-validation"><img id="pwRule4" th:src="@{/images/icon/pw-unavailable.png}" alt="사용불가-최소 9자, 최대 20자"></span>4. 최소 9~20자</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-box">
            <button type="submit" class="blueBtn u-confirm">
                확인<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
            </button>
        </div>
    </form>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>

<script th:inline="none">
var isConfirmed = false;

function checkPresentPwd() {
    var pwd = document.getElementById('currentPassword').value;
    if (!pwd) {
        alert('현재 사용중인 비밀번호를 입력해주세요.');
        return;
    }
    fetch('/password/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'currentPassword=' + encodeURIComponent(pwd)
    }).then(function (res) {
        if (res.ok) {
            isConfirmed = true;
            document.getElementById('currentPassword').readOnly = true;
            document.getElementById('verifyCurrentBtn').disabled = true;
            document.getElementById('newPassword').disabled = false;
            document.getElementById('newPasswordConfirm').disabled = false;
            var msg = document.getElementById('presentPwdMsg');
            msg.textContent = '인증 완료되었습니다.';
            msg.classList.remove('pointRed');
            msg.classList.add('pointblue');
            document.getElementById('newPassword').focus();
        } else {
            alert('현재 사용중인 비밀번호가 아닙니다. 다시 입력해주세요.');
        }
    }).catch(function () {
        alert('인증 중 오류가 발생했습니다. 다시 시도해 주세요.');
    });
}

function checkPwd() {
    var pwd = document.getElementById('newPasswordConfirm').value;
    var loginId = document.getElementById('loginId').value;
    var hasDigit = /[0-9]/.test(pwd);
    var hasLetter = /[a-zA-Z]/.test(pwd);
    var hasSymbol = /[{}\[\]/?.,;:|)*~`!^\-_+<>@#$%&\\=('"]/.test(pwd);
    var rule1 = hasDigit && hasLetter && hasSymbol;
    var rule2 = !isContinued(pwd) && !/(\w)\1\1/.test(pwd);
    var rule3 = loginId === '' || pwd.indexOf(loginId) === -1;
    var rule4 = pwd.length >= 9 && pwd.length <= 20;
    setRuleIcon('pwRule1', rule1);
    setRuleIcon('pwRule2', rule2);
    setRuleIcon('pwRule3', rule3);
    setRuleIcon('pwRule4', rule4);
    var allOk = rule1 && rule2 && rule3 && rule4;
    setRuleIcon('pwRuleAll', allOk);
    document.getElementById('pwStrength').textContent = allOk ? '강함' : '약함';
}
function isContinued(str) {
    for (var i = 0; i < str.length - 2; i++) {
        var a = str.charCodeAt(i), b = str.charCodeAt(i + 1), c = str.charCodeAt(i + 2);
        if ((b - a === 1 && c - b === 1) || (b - a === -1 && c - b === -1)) { return true; }
    }
    return false;
}
function setRuleIcon(id, ok) {
    document.getElementById(id).src = ok ? '/images/icon/pw-available.png' : '/images/icon/pw-unavailable.png';
}
function beforeSubmit() {
    if (!isConfirmed) {
        alert('현재 비밀번호 인증을 먼저 진행해 주세요.');
        return false;
    }
    var newPassword = document.getElementById('newPassword').value;
    var newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
    if (!newPassword) {
        alert('비밀번호를 설정해주세요.');
        return false;
    }
    if (!newPasswordConfirm || newPassword !== newPasswordConfirm) {
        alert('비밀번호를 확인해주세요.');
        return false;
    }
    return true;
}
</script>
</body>
</html>
