<!DOCTYPE html>
<!-- 모의 통과조차 없는(흉내낼 프로토콜 자체가 없는) 연계의 "준비중" 안내화면.
     스타일 인라인/링크 처리 이유는 external-login-mock.html의 주석과 동일하다. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>연계 준비중 - 고향사랑e음 (member service)</title>
    <style>
        body { margin: 0; padding: 40px 16px; background: #f5f6f8;
               font-family: "Malgun Gothic", "맑은 고딕", sans-serif; color: #222; }
        .wrap { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #dfe3e8;
                border-radius: 8px; padding: 32px; }
        h1 { margin: 0 0 20px; font-size: 20px; }
        .badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px;
                 background: #eef2ff; color: #3b5bdb; font-size: 12px; vertical-align: middle; }
        .result-box { margin: 0 0 24px; padding: 16px; background: #f8f9fa; border-radius: 6px;
                      font-size: 14px; line-height: 1.7; }
        code { background: #eceff1; padding: 1px 4px; border-radius: 3px; }
        .links { margin-top: 16px; text-align: center; }
        .links a { color: #1a4fa0; font-size: 14px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1><span th:text="${providerName} + ' 인증'"></span><span class="badge">member</span></h1>
    <p class="result-box">
        <span th:text="${providerName}"></span> 연계는 코드 구현이 완료되었지만, 아직 방화벽/실제 연계 기관 승인이
        열리지 않아 이 환경에서는 비활성화(<code>enabled: false</code>) 상태입니다.<br>
        연계가 열리면 설정값만 채우면 바로 동작합니다.
    </p>
    <div class="links">
        <a th:href="${backUrl} != null ? ${backUrl} : '/login'"
           th:text="${backLabel} != null ? ${backLabel} : '로그인으로 돌아가기'"></a>
    </div>
</div>
</body>
</html>
