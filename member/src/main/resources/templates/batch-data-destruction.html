<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터 파기 배치 - 고향사랑e음 (member service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1>데이터 파기 배치<span class="badge">member</span></h1>
    <p style="font-size:12px; color:#888; margin-bottom:16px; text-align:center;">
        SFR-002 데이터 파기 절차 - 실시간 스케줄러가 없어 운영자가 수동으로 실행하는 화면입니다.
    </p>

    <p class="success" th:if="${resultCount != null}" th:text="${resultCount} + '명의 탈퇴회원 개인정보가 파기(익명화)되었습니다.'"></p>
    <p class="success" th:if="${logResultCount != null}" th:text="${logResultCount} + '건의 로그인 로그가 익명화되었습니다.'"></p>

    <form th:action="@{/batch/data-destruction/withdrawn}" method="post" style="margin-bottom:12px;">
        <p style="font-size:12px; color:#888;">탈퇴 후 보관기간이 지난 회원의 이름/이메일/전화/주소/본인인증정보를 익명화합니다.</p>
        <button type="submit">탈퇴회원 개인정보 파기 실행</button>
    </form>

    <form th:action="@{/batch/data-destruction/logs}" method="post" style="margin-bottom:12px;">
        <p style="font-size:12px; color:#888;">보관기간이 지난 로그인 로그의 접속 IP를 익명화합니다(통계용 성공/실패 건수는 유지).</p>
        <button type="submit">로그인 로그 익명화 실행</button>
    </form>

    <h2 style="font-size:16px; margin-top:24px;">파기 이력</h2>
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
        <tr style="border-bottom:1px solid #ddd;">
            <th style="text-align:left; padding:6px;">회원ID</th>
            <th style="text-align:left; padding:6px;">파기 항목</th>
            <th style="text-align:left; padding:6px;">사유</th>
            <th style="text-align:left; padding:6px;">파기일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${history}" style="border-bottom:1px solid #f0f0f0;">
            <td style="padding:6px;" th:text="${h.userId == 0 ? '(로그 일괄)' : h.userId}"></td>
            <td style="padding:6px;" th:text="${h.destroyedFields}"></td>
            <td style="padding:6px;" th:text="${h.reason}"></td>
            <td style="padding:6px;" th:text="${h.destroyedDate}"></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(history)}" style="font-size:12px; color:#888;">파기 이력이 없습니다.</p>

    <div class="links">
        <a th:href="@{/login}">로그인으로</a>
    </div>
</div>
</body>
</html>
