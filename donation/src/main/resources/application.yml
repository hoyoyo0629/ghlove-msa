server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: donation
  servlet:
    multipart:
      # AS-IS application-production.yml 그대로(50MB). 설정이 없으면 스프링 기본 1MB라
      # 특정사업 이미지·기탁서 첨부가 1MB만 넘어도 413이 된다(admin과 같은 이유).
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:15432/ghlove_core?currentSchema=donation
    username: donation
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # SQL은 아래 logging 의 org.hibernate.SQL 로거로 일원화(System.out 중복 출력 방지)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# 기부확인증 발급 시 성명/생년월일 조회용 (읽기 전용, 쓰기 경로 아님) - order의
# gift-service 조회와 동일한 패턴의 의도적인 동기 호출 예외.
ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  # 지자체 직인 이미지 등 저장시 암호화가 필요한 파일의 AES-256 키(base64, 32바이트).
  # 로컬 개발용으로 고정값을 씀 - 실제 운영에서는 Vault 등 시크릿 관리로 대체해야 한다.
  seal:
    encryption-key-base64: "Le/XczlOUatEN4WBnVKMO4HWeIjI54fhIB0ZYxEiF04="
  member-service:
    base-url: http://localhost:8081
  point-service:
    base-url: http://localhost:8083
  admin-service:
    base-url: http://localhost:8086
  # member의 내부 전용 API(/api/users/walk-in, /api/users/{id})를 호출할 때 싣는 공유 시크릿 -
  # member의 application.yml과 반드시 동일해야 한다(InternalApiAuthInterceptor).
  internal:
    admin-secret: "ghlove-msa-local-dev-internal-admin-secret-do-not-expose!!"

  # 외부 연계시스템 통합 지점 (AS-IS NgDonationRelayServiceImpl 재현). enabled=false인
  # 동안은 LocalTaxClient/NtsClient가 실제 호출 없이 모크 응답을 돌려주고, 방화벽이
  # 열리면 enabled=true + 아래 URL/인증정보만 채우면 된다.
  integrations:
    local-tax:
      enabled: false
      seoul-base-url: https://etax.seoul.go.kr
      contry-base-url: https://wetax.go.kr
      # AS-IS NgDonationRelayServiceImpl 상수 LINK_TRGT_CD(연계대상코드) - 지방세외 차세대
      # 부과요청 전문에 들어간다. enabled=false면 실제 호출 없이 AS-IS LOCAL 분기와 같은
      # 가짜 응답(전자납부번호 "99"+yyyyMMddHHmmssSSS, linkRstCd=000)을 만들고, 요청/응답을
      # 연계로그 표에 남겨 admin 1413·1415 화면에서 확인할 수 있다.
      link-trgt-cd: "GHLOVE"
    nts:
      enabled: false
      login-url: https://api.hometax.go.kr/login
      action-url: https://api.hometax.go.kr/ereceipt
      key: ""
      id: ""
      password: ""

donation:
  upload:
    dir: ./uploads/donation
  seal:
    # 암호화된 직인 파일 저장 위치 - donation.upload.dir(정적 리소스로 공개 서빙됨)과
    # 완전히 분리된 별도 디렉터리. 절대 /uploads/donation/** 매핑 아래 두지 말 것.
    storage-dir: ./secure-storage/donation/seals

# 로컬 개발 전용: P6Spy 가 datasource 를 감싸 파라미터가 인라인된(바로 실행 가능한) SQL 한 줄을
# 로거 'p6spy' 로 찍는다. developmentOnly 의존성이라 운영 bootJar 에는 P6Spy 자체가 없어 무효.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false        # 한 줄로 출력(복붙해서 바로 실행하기 좋게)
      log-format: "%(executionTime)ms | %(sqlSingleLine)"

logging:
  level:
    com.ghlove.donation: DEBUG
    p6spy: DEBUG                           # P6Spy 가 찍는 인라인 SQL
    # 아래 Hibernate 로거는 P6Spy 와 중복이라 꺼둔다(P6Spy 없이 순수 Hibernate 로그만 볼 땐 주석 해제)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
