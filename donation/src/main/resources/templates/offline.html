<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기탁서(오프라인) 기부 등록 - 고향사랑e음 (donation service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1>기탁서(오프라인) 기부 등록<span class="badge">donation</span></h1>
    <p style="font-size:12px; color:#888; margin-bottom:16px; text-align:center;">
        우편·방문 등으로 접수된 기탁서를 운영자가 대신 등록합니다. 온라인 기부와
        동일하게 연간한도 검증을 거치며, 결제완료 처리 시 세외수입/국세청 연계도
        동일하게 진행됩니다.
    </p>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/donations/offline}" method="post">
        <div class="field">
            <label for="userId">회원 ID</label>
            <input type="number" id="userId" name="userId" required>
        </div>
        <div class="field">
            <label for="locgovCode">기부 지자체</label>
            <select id="locgovCode" name="locgovCode" required>
                <option th:each="l : ${locgovs}" th:value="${l.locgovCode}"
                        th:text="(${l.upperLocgovNm} != null ? ${l.upperLocgovNm} + ' ' : '') + ${l.locgovNm}"></option>
            </select>
        </div>
        <div class="field">
            <label for="amount">기부금액 (원)</label>
            <input type="number" id="amount" name="amount" min="1" step="1" required>
        </div>
        <div class="field">
            <label for="rceptBankNm">입금자명/수납은행 메모</label>
            <input type="text" id="rceptBankNm" name="rceptBankNm" placeholder="예: 홍길동 / 국민은행 입금">
        </div>
        <div class="field">
            <label for="rceptBankCode">수납은행 코드 (선택)</label>
            <input type="text" id="rceptBankCode" name="rceptBankCode">
        </div>
        <button type="submit">기탁서 등록</button>
    </form>

    <div class="links">
        <a th:href="@{/}">기부하러 가기</a>
    </div>
</div>
</body>
</html>
