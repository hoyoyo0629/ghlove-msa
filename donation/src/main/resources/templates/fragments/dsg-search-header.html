<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* AS-IS components/layouts/header_dsg_g.vue 재현 - "특정사업에 기부하기" 목록 전용
     2번째 내비게이션 바(메인 KRDS 헤더 바로 아래). 검색창 placeholder "지자체별 특정사업
     보기"와 지자체 선택 버튼의 기본 라벨 "지자체별 검색"은 운영중인 홈페이지 소스 그대로.
     지도 팝업은 order/gift의 "지자체몰 선택하기"(components/ui/lclgv_chc/map.vue)와 같은
     컴포넌트 재현이지만, 여기서는 선택한 지자체로 답례품몰이 아니라 이 목록 자체를
     locgovCode로 필터링한다. AS-IS 이 페이지엔 page-title-box(빵부스러기)가 없다 - 이
     검색바가 그 자리를 대신한다(운영중인 홈페이지 element 확인, 2026-08-19). "전체
     카테고리" 메가메뉴는 답례품몰 전용이라 이 페이지엔 없다. */-->
<nav id="header_g" class="header2" th:fragment="dsg-search-header">
    <style>
    .gnb .goods_search input[type="text"] {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 14px;
        outline: 1px;
    }
    .gnb .goods_search input[type="text"]::placeholder {
        color: #fff;
    }
    </style>
    <div class="gnb">
        <div class="center">
            <div class="gnb_slider_m dsg">
                <form class="goods_search" th:action="@{/designated-donation}" method="get">
                    <input type="hidden" name="status" th:value="${status}">
                    <input type="hidden" name="sort" th:value="${sort}">
                    <input type="hidden" name="bsnsType" th:value="${bsnsType}">
                    <input type="text" name="q" th:value="${q}" placeholder="지자체별 특정사업 보기" title="특정사업에 기부하기 검색">
                    <button type="submit"><img class="icon-img" th:src="@{/images/icon/search-white.png}" alt="검색하기"></button>
                </form>
                <button type="button" class="local_shop" id="locshopBtn" onclick="openDsgLocgovModal()">
                    <span class="shop_select">
                        <span class="local_shop_wrap">
                            <img class="icon-img" th:src="@{/images/goods/local-loc.png}" alt="">
                            <span class="locNameArea"
                                  th:text="${selectedLocgov != null} ? ((${selectedLocgov.upperLocgovNm} != null ? ${selectedLocgov.upperLocgovNm} + ' ' : '') + ${selectedLocgov.locgovNm}) : '지자체별 검색'"></span>
                        </span>
                        <img th:src="@{/images/goods/cli-icon_local-arrow.png}" alt="지자체 선택 팝업 열기">
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div class="black-bg" id="dsgLocgovModal">
        <div class="overlayer">
            <div class="overlayer-header">
                지자체 선택
                <div class="btn-box">
                    <button type="button" class="temp-button hidden_txt" style="top:18px;right:18px;"
                            onclick="closeDsgLocgovModal()">지자체 선택 팝업 닫기</button>
                </div>
            </div>
            <div class="overlayer-body">
                <div class="mapWrap">
                    <div class="area">
                        <div class="image">
                            <img src="/images/lclgv_chc/vtmap.png" id="dsgLocgovMapImg" alt="전국 지도">
                            <div th:each="p : ${mapProvinces}" class="addrName" th:classappend="${p.cssClass}"
                                 th:id="${'dsg-prov-' + p.code}" th:attr="data-code=${p.code},data-img=${p.mapImage}"
                                 onclick="selectDsgLocgovProvince(this)"
                                 th:title="${p.name + ' 시군구 조회하기'}" tabindex="0">
                                <span th:text="${p.mapLabel}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="addr">
                        <div id="dsg-addr-default" class="text_area active">
                            <div class="addrTit">시도를 선택해주세요.</div>
                        </div>
                        <div th:each="p : ${mapProvinces}" class="text_area" th:id="${'dsg-addr-' + p.code}">
                            <div class="addrTit" th:text="${p.name}"></div>
                            <div class="addrBox">
                                <ul class="addrList">
                                    <li th:each="lg : ${locgovsByProvince.get(p.code) ?: {}}">
                                        <a style="cursor:pointer;" th:text="${lg.locgovNm}"
                                           th:attr="data-locgov-code=${lg.locgovCode}"
                                           onclick="location.href='/designated-donation?status=' + encodeURIComponent(document.querySelector('input[name=status]').value) + '&locgovCode=' + this.dataset.locgovCode"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script th:inline="none">
function openDsgLocgovModal() {
    document.getElementById('dsgLocgovModal').style.display = 'block';
}
function closeDsgLocgovModal() {
    document.getElementById('dsgLocgovModal').style.display = 'none';
}
function selectDsgLocgovProvince(btn) {
    var code = btn.getAttribute('data-code');
    var alreadyActive = btn.classList.contains('active');
    document.querySelectorAll('#dsgLocgovModal .addrName').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('#dsgLocgovModal .text_area').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('dsgLocgovMapImg').setAttribute('src', '/images/lclgv_chc/vtmap.png');
    if (alreadyActive) {
        document.getElementById('dsg-addr-default').classList.add('active');
        return;
    }
    btn.classList.add('active');
    document.getElementById('dsg-addr-' + code).classList.add('active');
    document.getElementById('dsgLocgovMapImg').setAttribute('src', '/images/lclgv_chc/' + btn.getAttribute('data-img'));
}
</script>
</nav>
</body>
</html>
