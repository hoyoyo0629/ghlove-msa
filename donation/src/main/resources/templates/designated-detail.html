<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'기부하기 > 특정사업에 기부하기 상세 - ' + ${project.dsgnDntnBizTtl} + ' - 고향사랑e음 (donation service)'"></title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/item.css}">
    <link rel="stylesheet" th:href="@{/css/designation.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
    <!-- item.css는 .nav-tabs의 justify-content/width만 정의하고 기본 flex 레이아웃은
         부트스트랩 base CSS(.nav{display:flex}) 몫으로 가정한다 - 이 프로젝트는 부트스트랩을
         들여오지 않았으므로 탭이 세로로 쌓인다. tab-pane도 마찬가지로 show/hide를 부트스트랩
         JS에 의존하므로 둘 다 이 페이지에서 최소한만 보정한다. -->
    <style>
        .item_tab .nav-tabs{display:flex;list-style:none;padding-left:0;margin-bottom:0;}
        .item_tab .nav-tabs.nav-justified .nav-item{list-style:none;flex:1 1 0;text-align:center;}
        .tab-pane{display:none;} .tab-pane.active{display:block;}
        /* item.css의 .item_tab.sticky는 top:0로 고정되는데, 이 프로젝트의 KRDS 메인헤더도
           position:sticky;top:0(#krds-header, 높이 56px)라서 그 위에 겹친다 - 헤더 밑으로 내림.
           margin-top:40px는 원래 위치 잡을 때만 필요하고, fixed로 붙을 땐 top 기준점에서
           그대로 더해져 버려서 헤더와 탭 사이에 불필요한 간격이 생긴다 - sticky일 땐 0으로. */
        .item_tab.sticky{top:56px !important;margin-top:0 !important;}
    </style>
    <!-- item.css의 공지사항 드롭다운 화살표 아이콘도 default_ali.css의 라디오 아이콘과 같은
         '/static/images/...' 절대경로 버그를 갖고 있다 - 이 페이지 전용으로 보정. -->
    <style>.list_wrap.qna_list .list_top.dropdown .dropdown-toggle::after{background-image:url('/images/icon/list-dropdown.png') !important;}</style>
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS designated-donation/details.html 재현. 운영중인 홈페이지 element 확인 후 보정
     (2026-08-19): 빵부스러기를 page-title-box mall로, 기간 표시를 하이픈 포맷으로, 기부하기
     버튼을 인라인 금액입력 없는 원래 모양으로, 사업소개/응원메시지(기부내역)/공지사항 3탭을
     추가했다. 이미지 갤러리는 AS-IS도 대표 이미지 1장만 있는 경우가 대부분이라(실제 운영
     사이트 예시로 확인) 메인 이미지+썸네일 1장 구조를 그대로 재현한다 - 사업별 여러 장을
     올리는 갤러리 관리 기능은 이번 스코프 밖(사업소개 본문 안에 이미지를 직접 넣는 것으로
     충분히 커버됨). 고정형(sticky) 보조 진행바·카카오/페이스북 공유는 이번 스코프에서 제외. -->
<section class="page-title-box mall center">
    <span class="ali_breadcrumb">
        <a th:href="@{/}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
        <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
        <a href="#">기부하기</a>
        <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
        <a th:href="@{/designated-donation}">특정사업에 기부하기</a>
    </span>
</section>

<section class="center prj_details" id="contents" style="padding-top:0;">
    <div class="goods_view_top prj">
        <div class="prj_img">
            <div class="target_img">
                <img class="item_img" style="width:100%;"
                     th:src="${project.imageUrl != null} ? @{${project.imageUrl}} : @{/images/thumb.png}"
                     th:alt="${project.dsgnDntnBizTtl} + ' 대표 이미지'">
            </div>
            <div class="thumb_box">
                <button type="button" class="swiper-button-prev" disabled>
                    <img th:src="@{/images/goods/thumb_arrow-prev.png}" alt="이전 특정사업에 기부하기 이미지 보기">
                </button>
                <img class="item_img" style="width:64px;height:64px;object-fit:cover;"
                     th:src="${project.imageUrl != null} ? @{${project.imageUrl}} : @{/images/thumb.png}"
                     th:alt="${project.dsgnDntnBizTtl} + ' 사진1 보기'">
                <button type="button" class="swiper-button-next" disabled>
                    <img th:src="@{/images/goods/thumb_arrow-next.png}" alt="다음 특정사업에 기부하기 이미지 보기">
                </button>
            </div>
        </div>

        <div class="goods_info prj_info">
            <div class="info_box">
                <div class="prj_progress">
                    <div class="brand_mall d_area" th:if="${locgov != null}">
                        <img th:src="@{/images/icon/d-area.png}" alt="지역 위치 모양 마커">
                        <span th:text="(${locgov.upperLocgovNm} != null ? ${locgov.upperLocgovNm} + ' ' : '') + ${locgov.locgovNm}"></span>
                    </div>
                    <div class="info_title">
                        <h2 th:text="${project.dsgnDntnBizTtl}"></h2>
                        <p class="s-txt" th:text="${periodText}"></p>
                    </div>
                </div>

                <div class="donation_amount">
                    <span class="txt">기부총액 </span>
                    <span class="pointblue"><strong th:text="${#numbers.formatInteger(raisedAmount, 0, 'COMMA')}"></strong> 원</span>
                </div>

                <div class="prj_progress">
                    <div class="prj_gauge">
                        <div class="gauge_back">
                            <div class="gauge_result" th:style="'width:' + ${rate} + '%'" th:classappend="${gaugeClass}"></div>
                        </div>
                    </div>
                    <div class="inner_wrap">
                        <div class="prj_gaugePer">
                            <img th:src="@{/images/icon/cli-icon_btn-donation2.png}" alt="초과달성" th:if="${overGoal}">
                            <span class="perNum" th:text="${rate}"></span>%
                        </div>
                        <div class="prj_status" th:classappend="${project.dsgnDntnBizSttsCd == 'OPEN'} ? 'on'"
                             th:text="${project.dsgnDntnBizSttsCd == 'OPEN'} ? '진행' : '종료'"></div>
                    </div>
                </div>

                <div class="info_row etc nomargin">
                    <div class="line top-nomargin"></div>
                    <div class="shop_info">
                        <div class="title_col"><p>목표금액</p></div>
                        <div class="para_col"><p class="txt" th:text="${#numbers.formatInteger(project.goalAmt, 0, 'COMMA')} + ' 원'"></p></div>
                    </div>
                    <div class="shop_info">
                        <div class="title_col"><p>기부참여</p></div>
                        <div class="para_col"><p class="txt" th:text="${participantCount} + ' 명'"></p></div>
                    </div>
                    <div class="line bt-nomargin"></div>
                </div>

                <p class="txt">특정사업에 기부하기는 지역이 가진 문제를 해결하기 위해 고향사랑기부제를 프로젝트화하고 그 취지에 공감하는 특정사업을 직접 선택하여 기부할 수 있습니다.</p>

                <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

                <div class="prj_donation-btns" th:if="${project.dsgnDntnBizSttsCd == 'OPEN'}">
                    <button type="button" id="donationBtn" class="formBtn donation"
                            th:attr="data-logged-in=${loggedIn},data-locgov-code=${project.lclgvCd},data-prj-id=${project.dsgnDntnBizId}"
                            onclick="goDonationPage()">
                        <img th:src="@{/images/icon/cli-icon_btn-donation2.png}" alt="하트와 월계수"><span>기부하기</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="item_tab prj_tab" id="item_tab_wrap" style="margin-top:40px;">
        <ul class="nav nav-tabs nav-justified">
            <li class="nav-item">
                <a href="javascript:void(0)" class="nav-link active" data-pane="nav-detail" title="선택됨" onclick="switchTab(this)">
                    <span class="txt">사업소개</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="javascript:void(0)" class="nav-link" data-pane="nav-review" onclick="switchTab(this)">
                    <span class="txt">응원메시지<br>(기부내역)</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="javascript:void(0)" class="nav-link" data-pane="nav-qna" onclick="switchTab(this)">
                    <span class="txt">공지사항</span>
                </a>
            </li>
        </ul>
    </div>
    <div class="center tab_container">
        <div class="tab-content item_view">
            <!-- 사업소개: AS-IS는 리치에디터로 작성한 HTML(이미지 포함)을 그대로 렌더링한다. -->
            <div id="nav-detail" class="tab-pane active">
                <div class="item_detail">
                    <div class="total_top">
                        <h3 class="total">사업 소개<span class="pointblue"></span></h3>
                    </div>
                    <div class="detailContent">
                        <div class="sampleContents" th:utext="${project.dsgnDntnBizCn}"></div>
                    </div>
                </div>
            </div>

            <!-- 응원메시지(기부내역) -->
            <div id="nav-review" class="tab-pane">
                <h3 class="sr-only">응원메시지(기부내역)</h3>
                <div class="item_review">
                    <div class="total-noti-wrap">
                        <div class="noti_wrap">
                            <div class="noti-box">
                                <div class="noti_txt" th:text="'총 ' + ${#lists.size(cheerMessages)} + '건이 기부되었습니다.'"></div>
                            </div>
                        </div>
                    </div>
                    <div class="list_wrap review_list">
                        <ul th:if="${not #lists.isEmpty(cheerMessages)}">
                            <li class="list_area" th:each="c : ${cheerMessages}">
                                <div class="review_open">
                                    <div class="list_top">
                                        <div class="review_para" style="width:70%;">
                                            <p class="prj-tab-list_point-txt">
                                                <strong class="pointRed" th:text="${#numbers.formatInteger(c.cntrAmt, 0, 'COMMA')}"></strong>원 참여
                                            </p>
                                        </div>
                                        <div class="review_para" style="width:100%;">
                                            <p th:if="${c.cheerMsg != null and !c.cheerMsg.isEmpty()}" th:text="${c.cheerMsg}"></p>
                                        </div>
                                        <div class="m-field" style="min-width:30%;">
                                            <div class="review_id"><p th:text="${c.maskedUserName}"></p></div>
                                            <div class="review_id"><p th:text="${c.maskedLoginId}"></p></div>
                                            <div class="review_date"><p th:text="${c.cntrDeFormatted}"></p></div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                        <div class="list-none" th:if="${#lists.isEmpty(cheerMessages)}">
                            <img th:src="@{/images/icon/non-list.png}" alt="기부내역이 없음">
                            기부내역이 없습니다.
                        </div>
                    </div>
                </div>
            </div>

            <!-- 공지사항 -->
            <div id="nav-qna" class="tab-pane">
                <div class="item_qna">
                    <div class="total_top">
                        <h3 class="total">공지사항<span class="pointblue" th:text="${#lists.size(notices)}"></span></h3>
                    </div>
                    <div class="list_wrap qna_list" th:if="${not #lists.isEmpty(notices)}">
                        <ul>
                            <li class="list_top dropdown cursor" th:each="n : ${notices}">
                                <button type="button" class="dropdown-toggle" onclick="toggleNotice(this)">
                                    <div class="header-faq">
                                        <div class="faq_txt" style="white-space:normal;padding-right:70px;" th:text="${n.prjNoticeSubject}"></div>
                                        <div class="col_group" style="right:50px;position:absolute;">
                                            <div th:text="${noticeDates.get(n.prjNoticeId)}"></div>
                                        </div>
                                    </div>
                                </button>
                                <div class="dropdown-menu">
                                    <div class="notice-wrap">
                                        <div class="header-faq">
                                            <div class="faq_txt" style="padding:0 20px;" th:utext="${n.prjNoticeCn}"></div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="list-none" th:if="${#lists.isEmpty(notices)}">
                        <img th:src="@{/images/icon/non-list.png}" alt="">
                        게시글이 없습니다.
                    </div>
                </div>
            </div>
        </div>

        <div class="center" style="margin-top:60px;">
            <div class="btn-box many mb_b60">
                <button type="button" class="blueBtn u-confirm" th:attr="data-url=@{/designated-donation}" onclick="location.href=this.dataset.url">목록 페이지</button>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>

<script th:inline="none">
/** AS-IS components/layouts/prj_tab-ali.vue의 sticky 스크롤 로직 재현 - 탭 영역을 지나쳐
 *  스크롤하면 화면 상단(KRDS 헤더 바로 밑)에 고정시켜 계속 탭을 전환할 수 있게 한다. */
(function setupStickyTabs() {
    var itemTab = document.getElementById('item_tab_wrap');
    var sticky = itemTab.offsetTop;
    function onScroll() {
        if (window.pageYOffset >= sticky) {
            itemTab.classList.add('sticky');
        } else {
            itemTab.classList.remove('sticky');
        }
    }
    window.addEventListener('scroll', onScroll);
    onScroll();
})();

function switchTab(link) {
    document.querySelectorAll('.item_tab .nav-link').forEach(function (a) {
        a.classList.remove('active');
        a.removeAttribute('title');
    });
    link.classList.add('active');
    link.setAttribute('title', '선택됨');
    document.querySelectorAll('.tab-content .tab-pane').forEach(function (p) { p.classList.remove('active'); });
    var pane = document.getElementById(link.dataset.pane);
    pane.classList.add('active');
    pane.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function toggleNotice(btn) {
    var li = btn.closest('.list_top.dropdown');
    var isOpen = li.classList.contains('show');
    document.querySelectorAll('.qna_list .list_top.dropdown.show').forEach(function (el) { el.classList.remove('show'); });
    if (!isOpen) { li.classList.add('show'); }
}

/** AS-IS $s.donation.goDonationPage()와 동일하게 로그인 여부부터 확인한다 - 이 프로젝트는
 *  로그인 상태를 HeaderAuthAdvice가 모든 화면에 loggedIn으로 이미 주입해준다. */
/** AS-IS $s.donation.goDonationPage('?prjId=...&locgovCode=...')와 동일하게 "기부하기"
 *  화면(자치단체에 기부하기 폼)으로 이동한다 - 이 화면에서 금액/거주지 확인 등을 마저
 *  진행한다(이 상세화면 자체에서 바로 제출하지 않는다). */
function goDonationPage() {
    var btn = document.getElementById('donationBtn');
    var loggedIn = btn.dataset.loggedIn === 'true';
    var target = 'http://localhost:8082/?locgovCode=' + encodeURIComponent(btn.dataset.locgovCode)
        + '&prjId=' + encodeURIComponent(btn.dataset.prjId);
    if (!loggedIn) {
        location.href = 'http://localhost:8081/login?target=' + encodeURIComponent(target);
        return;
    }
    location.href = target;
}
</script>
</body>
</html>
