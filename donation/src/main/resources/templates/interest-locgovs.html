<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관심지자체 - 고향사랑e음 (donation service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/favo_info.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS mypage/intrstLocGov.html 재현 (favo_info.css의 실제 클래스 그대로 사용).
     관심지자체 "추가"는 이 화면이 아니라 member의 "회원 정보 수정" 화면에서 크로스오리진으로
     이뤄진다(AS-IS도 동일 - 목록 화면 자체에는 추가 UI가 없다) - 여기는 조회+삭제만 다룬다.
     AS-IS는 개별 삭제 버튼 없이 체크박스로 골라 "선택삭제"만 지원한다. -->
<script th:inline="none">
function toggleAll(master) {
    document.querySelectorAll('.row-check').forEach(function (c) { c.checked = master.checked; });
}
function syncMaster() {
    var boxes = document.querySelectorAll('.row-check');
    var checked = document.querySelectorAll('.row-check:checked');
    document.getElementById('selectAll').checked = boxes.length > 0 && boxes.length === checked.length;
}
function deleteSelected() {
    var checked = document.querySelectorAll('.row-check:checked');
    if (checked.length === 0) {
        alert('선택된 지자체가 없습니다.');
        return;
    }
    if (!confirm('정보를 수정 하시겠습니까?')) { return; }
    document.getElementById('deleteForm').submit();
}
</script>

<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{'http://localhost:8081/mypage'}">마이페이지</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            관심지자체
        </span>
        <h2 class="page-title-txt">관심지자체</h2>
    </div>
</section>

<section id="contents" class="receipt-contents">
    <div class="center">
        <form id="deleteForm" th:action="@{/interest-locgovs/delete}" method="post" th:if="${!#lists.isEmpty(interestLocgovs)}">
            <div class="contents_wrap">
                <div class="s-contents">
                    <div class="cart_top">
                        <div class="chk_box check-level1">
                            <input type="checkbox" id="selectAll" onclick="toggleAll(this)">
                            <label for="selectAll">전체선택</label>
                        </div>
                        <div class="btn_area">
                            <button type="button" class="formBtn del" onclick="deleteSelected()">선택삭제</button>
                        </div>
                    </div>

                    <div class="list_body table-container w3c_v_2410">
                        <div class="list_wrap">
                            <table>
                                <caption class="sr-only">관심지자체 - 기부지자체, 나의 기부현황, 기부하기, 바로가기로 구성</caption>
                                <thead class="list-title">
                                <tr class="items_wrap">
                                    <th class="date-col chk_date" scope="col"><span class="sr-only">선택</span></th>
                                    <th class="date-col index" scope="col">No.</th>
                                    <th class="date-col info_loc" scope="col">기부지자체</th>
                                    <th class="date-col do_status" scope="col">나의 기부현황</th>
                                    <th class="date-col btn_col" scope="col">기부하기</th>
                                    <th class="date-col btn_col" scope="col">바로가기</th>
                                </tr>
                                </thead>
                                <tbody class="item_list-group">
                                <tr class="list-items" th:each="l, iter : ${interestLocgovs}">
                                    <td class="date-col chk_date">
                                        <div class="check_input">
                                            <label th:for="'chk' + ${l.locgovCode}" class="sr-only" th:text="${l.locgovName} + ' 선택'"></label>
                                            <input type="checkbox" class="row-check" name="locgovCodes" th:value="${l.locgovCode}"
                                                   th:id="'chk' + ${l.locgovCode}" onchange="syncMaster()">
                                        </div>
                                    </td>
                                    <td class="date-col index" th:text="${#lists.size(interestLocgovs) - iter.index}"></td>
                                    <td class="date-col info_loc" th:text="${l.locgovName}"></td>
                                    <td class="date-col do_status" th:text="${#numbers.formatInteger(l.myTotal, 0, 'COMMA')}"></td>
                                    <td class="date-col btn_col">
                                        <button type="button" class="formBtn dona"
                                                th:attr="data-url=@{'http://localhost:8082/'(locgovCode=${l.locgovCode})}"
                                                onclick="location.href=this.dataset.url">기부하기</button>
                                    </td>
                                    <td class="date-col btn_col">
                                        <button type="button" class="formBtn"
                                                th:attr="data-url=@{'http://localhost:8084/'(locgovCode=${l.locgovCode})}"
                                                onclick="location.href=this.dataset.url">답례품몰</button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <div class="common_none" th:if="${#lists.isEmpty(interestLocgovs)}">
            <p>관심지자체가 없습니다.</p>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
