<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금영수증 출력 - 고향사랑e음 (donation service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/receipt-print.css}">
</head>
<body>
<!-- AS-IS mypage/receiptPrint.html(OZReport `3.cntr_receipt_new.ozr`) 재현 - 확인증(certificate*)과
     달리 단건 기부에 대한 공식 영수증이다. -->
<div class="page">
    <div class="lineBox official-receipt">
        <div class="title-area">
            <h5>고향사랑 기부금 영수증</h5>
        </div>
        <p class="sub-title">
            「고향사랑 기부금에 관한 법률」에 따라 아래와 같이 기부금을 접수하였음을 증명합니다.
        </p>
        <table>
            <tr><th>접수번호</th><td th:text="${receipt.cntrSn}"></td></tr>
            <tr><th>전자납부번호</th><td th:text="${receipt.elctrnPayNo} ?: '-'"></td></tr>
            <tr><th>기부자 성명</th><td th:text="${receipt.userName}"></td></tr>
            <tr><th>생년월일</th><td th:text="${receipt.birthdayDisplay}"></td></tr>
            <tr><th>기부지자체</th>
                <td th:text="${receipt.locgovDisplay} + (${receipt.bizrno} != null ? ' (사업자번호 : ' + ${receipt.bizrno} + ')' : '')"></td>
            </tr>
            <tr><th>기부금액</th><td th:text="${#numbers.formatInteger(receipt.cntrAmt, 0, 'COMMA')} + '원'"></td></tr>
            <tr><th>기부일자</th><td th:text="${receipt.cntrDeDisplay}"></td></tr>
            <tr><th>발급일자</th><td th:text="${receipt.issueDateDisplay}"></td></tr>
        </table>

        <div class="issue-area">
            <span class="issuer">
                <span th:text="(${receipt.locgovDisplay}) + ' ' + (${receipt.offcsNm} ?: '지자체') + ' 발급'"></span>
                <img th:if="${receipt.sealImageDataUri != null}" class="seal-area"
                     th:src="${receipt.sealImageDataUri}" alt="직인">
            </span>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var cntrSn = /*[[${cntrSn}]]*/ '';
    window.onload = function () {
        fetch('/receipts/official/' + encodeURIComponent(cntrSn) + '/print-log', { method: 'POST', credentials: 'same-origin' })
            .finally(function () { window.print(); });
    };
</script>
</body>
</html>
