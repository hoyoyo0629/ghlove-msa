<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지자체 기부혜택 관리 - 고향사랑e음 (donation service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1>지자체 기부혜택 관리<span class="badge">donation</span></h1>
    <p style="font-size:12px; color:#888; margin-bottom:16px; text-align:center;">
        세액공제는 전국 공통 법정 비율이라 자동 계산되고, 여기서는 지자체가 추가로
        안내하고 싶은 혜택 문구만 관리합니다.
    </p>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/honor/benefit}" method="get">
        <div class="field">
            <label for="locgovCode">지자체</label>
            <select id="locgovCode" name="locgovCode" onchange="this.form.submit()" required>
                <option value="">선택하세요</option>
                <option th:each="l : ${locgovs}" th:value="${l.locgovCode}"
                        th:text="(${l.upperLocgovNm} != null ? ${l.upperLocgovNm} + ' ' : '') + ${l.locgovNm}"
                        th:selected="${l.locgovCode == locgovCode}"></option>
            </select>
        </div>
    </form>

    <form th:if="${locgovCode != null and !locgovCode.isEmpty()}" th:action="@{/honor/benefit}" method="post" style="margin-top:16px;">
        <input type="hidden" name="locgovCode" th:value="${locgovCode}">
        <div class="field">
            <label for="benefitDesc">혜택 안내문구</label>
            <textarea id="benefitDesc" name="benefitDesc" rows="4" th:text="${currentBenefit}"></textarea>
        </div>
        <button type="submit">저장</button>
    </form>

    <div class="links">
        <a th:href="@{/honor/certificates}">기부혜택증으로</a>
    </div>
</div>
</body>
</html>
