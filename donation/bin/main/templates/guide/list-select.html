<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>안내사항 &gt; 기금사업 소개 - 고향사랑e음 (donation service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/donation_liemt.css}">
    <link rel="stylesheet" th:href="@{/css/donation_selmt.css}">
    <link rel="stylesheet" th:href="@{/css/research-box.css}">
    <link rel="stylesheet" th:href="@{/css/goods_card.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
    <!-- 이 프로젝트는 AS-IS의 bootstrap.css를 쓰지 않는데, .tab-pane/.fade/.show/.active는
         원래 그 안에 정의된 규칙이라 최소 규칙만 직접 정의한다. -->
    <style>
        .tab-pane.fade { display: none; }
        .tab-pane.fade.show.active { display: block; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS donation/list-select.html 재현. AS-IS는 Vue SPA라 시·도/시·군·구/탭/페이지네이션을
     클릭해도 전체 페이지가 새로고침되지 않는다 - 진입(딥링크/새로고침)만 서버 전체 렌더링,
     그 이후 모든 상호작용은 fetch로 조각(fragment)만 받아 교체한다(FundProjectController의
     cities()/content()). ".contents-wrap"은 AS-IS 원본에서 #contents의 형제(sibling) 두
     개로 존재하는데, 예전에 하나를 다른 하나 안에 중첩시켜서 .contents-wrap의 display:flex가
     안쪽 것을 찌그러뜨리는 폭 버그가 있었다 - 반드시 형제 구조를 유지해야 한다.
     "기금사업소개" 탭은 별도 스키마 없이 이미 있는 특정사업기부(DesignatedProject) 목록을
     locgovCode로 재사용한다. "지자체공지사항" 탭은 admin 서비스의 OP_NOTICE를 LOCGOV_CODE로
     필터링해 크로스서비스로 조회한다(NoticeClient). 클릭 이동은 th:onclick 대신 이 프로젝트
     관례(data-url + 정적 onclick)를 쓴다(th:onclick은 Number/Boolean만 반환 가능한 제약). -->
<section class="center donation_steps">
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            안내사항
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            기금사업 소개
        </span>
        <h2 class="page-title-txt">기금사업 소개</h2>
    </div>
</section>

<section id="contents">
    <div class="contents-wrap">
        <div class="center">
            <div class="s-contents list-wrapper">
                <div class="list-select-area">
                    <div class="list-select-header">
                        <div class="list-title"><strong>시·도</strong>를 선택해 주세요.</div>
                        <div class="list-select">
                            <label for="selectArea">지역선택</label>
                            <select id="selectArea" onchange="fetchCities(this.value)">
                                <option value="">시·도 선택</option>
                                <option th:each="p : ${provinces}" th:value="${p.code}" th:text="${p.name}"
                                        th:selected="${p.code == upperLocgovCode}"></option>
                            </select>
                        </div>
                    </div>

                    <div id="citiesWrap" th:fragment="citiesFragment">
                        <div class="list-select-body" id="listBody" th:if="${cities != null}">
                            <ul class="list-select-group">
                                <li tabindex="0" class="list-items" th:each="c : ${cities}"
                                    th:classappend="${c.locgovCode == locgovCode} ? 'on'"
                                    th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${c.locgovCode})}"
                                    onclick="fetchContent(this.dataset.url); return false;"
                                    th:text="${c.locgovNm}"></li>
                            </ul>
                        </div>
                        <div class="list-select-body" id="emptyBody" th:if="${cities == null}">
                            <img th:src="@{/images/cli-list-select.png}" alt="시도를 선택해 주세요" style="max-width:72%;margin-top:5rem" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="fundContentWrap" th:fragment="contentFragment">
        <div class="contents-wrap" th:if="${locgov != null}">
            <div class="center">
                <div class="s-contents map-info" id="listContent">
                    <div class="tab-container" id="tabCon">
                        <div class="tab_tit">
                            <ul class="tab-menu">
                                <li>
                                    <a href="#" data-tab="tab1" th:classappend="${tab == 'tab1'} ? 'active'"
                                       onclick="return showFundTab(this);">지자체정보</a>
                                </li>
                                <li>
                                    <a href="#" data-tab="tab2" th:classappend="${tab == 'tab2'} ? 'active'"
                                       onclick="return showFundTab(this);">기금사업 소개</a>
                                </li>
                                <li><a th:href="${giftMallUrl}">답례품</a></li>
                                <li>
                                    <a href="#" data-tab="tab4" th:classappend="${tab == 'tab4'} ? 'active'"
                                       onclick="return showFundTab(this);">지자체공지사항</a>
                                </li>
                            </ul>
                        </div>

                        <div class="tab-content">
                            <div id="tab1" th:classappend="${tab == 'tab1'} ? 'show active'" class="tab-pane fade">
                                <div class="info-wrap">
                                    <div class="city-Info">
                                        <h3 class="seletedLoc" th:text="${locgov.upperLocgovNm} + ' ' + ${locgov.locgovNm}"></h3>
                                        <table>
                                            <caption class="ir_txt">선택 지자체 상세정보</caption>
                                            <tr><th>예산</th><td th:text="${displayBudgetAmt} + ' (단위:백만원)'"></td></tr>
                                            <tr><th>인구수</th><td th:text="${displayPopltnCo} + ' 명'"></td></tr>
                                            <tr><th>기부 담당자</th><td th:text="${locgov.chargerPsitnDept} + '-' + ${locgov.chargerNm} + ' (' + ${locgov.chargerCttpc} + ')'"></td></tr>
                                            <tr><th>홈페이지</th><td th:text="${locgov.locgovHmpg}"></td></tr>
                                            <tr><th>포인트지급률</th><td th:text="${pointRate} + '%'"></td></tr>
                                        </table>
                                    </div>
                                    <div class="city-Info">
                                        <div class="city-Info-title">
                                            <img th:src="@{/images/icon/cli-icon_bullet-c.png}" alt="">
                                            <span>지자체 소개 내용</span>
                                        </div>
                                        <div class="city-Info-txt" th:utext="${locgov.locgovIntrcnCn}"></div>
                                    </div>
                                </div>
                            </div>

                            <div id="tab2" th:classappend="${tab == 'tab2'} ? 'show active'" class="tab-pane fade">
                                <div class="city-notice">
                                    <h3 class="seletedLoc" th:text="${locgov.upperLocgovNm} + ' ' + ${locgov.locgovNm}"></h3>
                                    <table>
                                        <caption>기금사업 소개 – 기금사업, 등록일로 구성</caption>
                                        <thead><tr><th scope="row" class="tb_tit">기금사업</th><th scope="row" class="tb_dat">등록일</th></tr></thead>
                                        <tbody>
                                            <tr class="cursor" tabindex="0" th:each="p : ${projectItems}"
                                                th:attr="data-url=@{/designated-donation/{id}(id=${p.dsgnDntnBizId})}"
                                                onclick="location.href=this.dataset.url">
                                                <td class="tb_tit" th:text="${p.dsgnDntnBizTtl}"></td>
                                                <td class="tb_dat" th:text="${projectDisplayDates.get(p.dsgnDntnBizId)}"></td>
                                            </tr>
                                            <tr class="list-none" th:if="${#lists.isEmpty(projectItems)}">
                                                <td colspan="2">기금사업을 준비중입니다.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div class="pagination_ali" th:if="${projectTotalPages > 1}">
                                        <ul class="pagination-frame">
                                            <li><a class="fist arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab2',projectPage=1)}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-first.png}" alt="처음"></a></li>
                                            <li><a class="prev arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab2',projectPage=${projectCurrentPage > 1 ? projectCurrentPage - 1 : 1})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-prev.png}" alt="이전"></a></li>
                                            <li th:each="p : ${#numbers.sequence(1, projectTotalPages)}" th:classappend="${p == projectCurrentPage} ? 'selected-page'">
                                                <a class="page-text" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab2',projectPage=${p})}" onclick="fetchContent(this.dataset.url); return false;" th:text="${p}"></a>
                                            </li>
                                            <li><a class="next arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab2',projectPage=${projectCurrentPage < projectTotalPages ? projectCurrentPage + 1 : projectTotalPages})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-next.png}" alt="다음"></a></li>
                                            <li><a class="last arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab2',projectPage=${projectTotalPages})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-last.png}" alt="마지막"></a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <div id="tab4" th:classappend="${tab == 'tab4'} ? 'show active'" class="tab-pane fade">
                                <div class="city-notice">
                                    <h3 class="seletedLoc" th:text="${locgov.upperLocgovNm} + ' ' + ${locgov.locgovNm}"></h3>
                                    <table>
                                        <caption>지자체 공지사항 – 지자체 공지사항, 등록일로 구성</caption>
                                        <thead><tr><th scope="row" class="tb_tit">지자체 공지사항</th><th scope="row" class="tb_dat">등록일</th></tr></thead>
                                        <tbody>
                                            <tr class="cursor" tabindex="0" th:each="n : ${noticeItems}"
                                                th:attr="data-url='http://localhost:8086/notices/' + ${n.noticeId}"
                                                onclick="location.href=this.dataset.url">
                                                <td class="tb_tit" th:text="${n.subject}"></td>
                                                <td class="tb_dat" th:text="${n.createdDate}"></td>
                                            </tr>
                                            <tr class="list-none" th:if="${#lists.isEmpty(noticeItems)}">
                                                <td colspan="2">지자체 공지사항을 준비중입니다.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div class="pagination_ali" th:if="${noticeTotalPages > 1}">
                                        <ul class="pagination-frame">
                                            <li><a class="fist arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab4',noticePage=1)}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-first.png}" alt="처음"></a></li>
                                            <li><a class="prev arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab4',noticePage=${noticeCurrentPage > 1 ? noticeCurrentPage - 1 : 1})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-prev.png}" alt="이전"></a></li>
                                            <li th:each="p : ${#numbers.sequence(1, noticeTotalPages)}" th:classappend="${p == noticeCurrentPage} ? 'selected-page'">
                                                <a class="page-text" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab4',noticePage=${p})}" onclick="fetchContent(this.dataset.url); return false;" th:text="${p}"></a>
                                            </li>
                                            <li><a class="next arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab4',noticePage=${noticeCurrentPage < noticeTotalPages ? noticeCurrentPage + 1 : noticeTotalPages})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-next.png}" alt="다음"></a></li>
                                            <li><a class="last arrow_btn" href="#" th:attr="data-url=@{/list-select/content(upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},tab='tab4',noticePage=${noticeTotalPages})}" onclick="fetchContent(this.dataset.url); return false;"><img th:src="@{/images/icon/paging_btn-last.png}" alt="마지막"></a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="btn-box tab-btn">
                        <button type="button" class="formBtn intrst" th:attr="data-locgov-code=${locgovCode}" onclick="addInterestLocgov(this)">
                            <span class="icon_area"></span>
                            <span class="btn_txt"> 관심 지자체 등록</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>

<script th:inline="none">
/* AS-IS는 Vue SPA라 시도/지자체 선택·탭 전환·페이지네이션 어떤 것도 전체 페이지를
   다시 로드하지 않는다 - fetch로 필요한 조각만 받아 교체해 스크롤 위치가 그대로 유지되게
   맞춘다. 탭 전환만은 이미 4개 탭 데이터가 다 로드돼 있어 fetch 없이 보이기/숨기기만 한다. */
function fetchCities(upperLocgovCode) {
    if (!upperLocgovCode) {
        document.getElementById('citiesWrap').innerHTML =
            '<div class="list-select-body" id="emptyBody"><img src="/images/cli-list-select.png" alt="시도를 선택해 주세요" style="max-width:72%;margin-top:5rem" onerror="this.style.display=\'none\'"></div>';
        document.getElementById('fundContentWrap').innerHTML = '';
        history.replaceState(null, '', '/list-select');
        return;
    }
    fetch('/list-select/cities?upperLocgovCode=' + encodeURIComponent(upperLocgovCode))
        .then(function(res) { return res.text(); })
        .then(function(html) {
            document.getElementById('citiesWrap').outerHTML = html;
            document.getElementById('fundContentWrap').innerHTML = '';
            history.replaceState(null, '', '/list-select?upperLocgovCode=' + encodeURIComponent(upperLocgovCode));
        });
}

function fetchContent(url) {
    fetch(url)
        .then(function(res) { return res.text(); })
        .then(function(html) {
            document.getElementById('fundContentWrap').outerHTML = html;
            history.replaceState(null, '', url.replace('/list-select/content', '/list-select'));
        });
    return false;
}

function showFundTab(link) {
    var tabName = link.dataset.tab;
    document.querySelectorAll('.tab-menu > li > a[data-tab]').forEach(function(a) { a.classList.remove('active'); });
    link.classList.add('active');
    document.querySelectorAll('.tab-content > .tab-pane').forEach(function(pane) {
        pane.classList.toggle('show', pane.id === tabName);
        pane.classList.toggle('active', pane.id === tabName);
    });
    return false;
}

function addInterestLocgov(btn) {
    var locgovCode = btn.dataset.locgovCode;
    fetch('/interest-locgovs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'locgovCode=' + encodeURIComponent(locgovCode)
    }).then(function(res) {
        if (res.status === 401) {
            location.href = 'http://localhost:8081/login?target=' + encodeURIComponent(location.href);
            return;
        }
        return res.json().then(function(body) {
            if (res.ok) {
                alert((body.locgovName || '') + ' 이(가) 관심 지자체로 등록되었습니다.');
            } else {
                alert(body.message || '등록 중 오류가 발생했습니다.');
            }
        });
    });
}
</script>
</body>
</html>
