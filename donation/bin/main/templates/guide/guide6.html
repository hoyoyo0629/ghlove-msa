            <img th:src="@{/images/guide/PC_GUIDE6/1.png}" class="dt-info"
                 alt="고향사랑 기부가 불가능한 경우는 본인 거주지 기부는 불가능합니다. 기부자 본인의 주민등록등본 상 거주지에 해당하는 시·도, 시·군·구를 제외하고 기부가 가능합니다, 법인의 기부는 불가능합니다. 고향사랑 기부는 단체가 아닌 개인만 할 수 있습니다. 이해관계자의 기부는 불가능 합니다. 고용, 업부, 계약, 처분 등으로 재산상 권리, 이익 또는 그 밖의 관계가 있는 지방자치단체를 제외하고 기부가 가능합니다. 타인 명의로 기부는 불가능합니다. 기부자 본인의 명의로 고향사랑 기부를 할 수 있습니다. 가명 기부는 불가능 합니다. 기부자 본인을 인증하고 고향사랑 기부를 할 수 있습니다. 누구든지 업무·고용 그 밖의 관계를 이용하여 다른 사람에게 기부 또는 모금을 강요하는 행위는 금지됩니다.">
