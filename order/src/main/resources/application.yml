server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://localhost:15432/ghlove_core?currentSchema=ord
    username: orderdb
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # SQL은 아래 logging 의 org.hibernate.SQL 로거로 일원화(System.out 중복 출력 방지)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read as raw JSON string and parsed manually per-listener (see OrderSagaListener) -
      # order doesn't share Java event classes with gift/point across the service boundary.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Read-only price/stock lookup only (not part of the SAGA write path) - a synchronous
# REST GET here is a deliberate, minimal exception to "avoid sync inter-service calls",
# used only to enrich the order-creation form/request with accurate current pricing.
ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다 (JwtVerifier 참고).
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  # admin 콘솔이 이 서비스의 관리자 전용 API(/api/admin/orders/**, /api/admin/claims/**)와
  # 기존에 무인증이었던 /claims, /orders/{id}/invoice, /orders/{id}/delivery-status를 호출할
  # 때 싣는 공유시크릿 - admin의 application.yml과 반드시 동일해야 한다(내부망 전용 신뢰
  # 근거이자 "외부에서 관리자 헤더를 위조해 직접 호출"을 막는 유일한 방어선이므로 이 값이
  # 없거나 다르면 AdminApiAuthInterceptor가 무조건 401로 막는다). AdminApiAuthInterceptor 참고.
  internal:
    admin-secret: "ghlove-msa-local-dev-internal-admin-secret-do-not-expose!!"
  # 정기배치 실행결과를 admin의 "배치 실행로그 조회"(메뉴 7209)가 읽는 표에 보고할 때 쓴다
  admin-service:
    base-url: http://localhost:8086
  # 쿠폰 기능 마스터 스위치 (2026-09-09부터 OFF). 쿠폰은 AS-IS에서도 현재 사용되지 않아
  # 자동발급·회원화면·회원API를 통째로 껐다. 이 하나로 아래가 전부 좌우된다:
  #   - CouponBatchScheduler        가입/생일/정기발행 자동발급 배치 (빈 미등록)
  #   - CouponMyApiController       /api/my/coupons, /api/coupons** (빈 미등록 → 404)
  #   - CouponMyController          Thymeleaf 회원 쿠폰화면 (빈 미등록 → 404)
  #   - CouponService               체크아웃 쿠폰 노출/할인 적용 차단
  # 코드·DB·admin 관리API(/api/admin/coupons**)는 그대로 살아 있으므로 이 값을 true로
  # 되돌리면 전부 복구된다. 주문확정 구매트리거 발급만 별도로 코드 주석 처리돼 있다
  # (OrderService.issuePurchaseTriggeredCoupons). 경위: docs/cart-review-2026-09-09.md §4-5
  coupon:
    enabled: false
  gift-service:
    base-url: http://localhost:8084
  point-service:
    base-url: http://localhost:8083
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081

# 로컬 개발 전용: P6Spy 가 datasource 를 감싸 파라미터가 인라인된(바로 실행 가능한) SQL 한 줄을
# 로거 'p6spy' 로 찍는다. developmentOnly 의존성이라 운영 bootJar 에는 P6Spy 자체가 없어 무효.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false        # 한 줄로 출력(복붙해서 바로 실행하기 좋게)
      log-format: "%(executionTime)ms | %(sqlSingleLine)"

logging:
  level:
    com.ghlove.order: DEBUG
    p6spy: DEBUG                           # P6Spy 가 찍는 인라인 SQL
    # 아래 Hibernate 로거는 P6Spy 와 중복이라 꺼둔다(P6Spy 없이 순수 Hibernate 로그만 볼 땐 주석 해제)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
