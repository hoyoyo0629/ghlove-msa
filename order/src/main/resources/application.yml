server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://localhost:15432/orderdb
    username: orderdb
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read as raw JSON string and parsed manually per-listener (see OrderSagaListener) -
      # order doesn't share Java event classes with gift/point across the service boundary.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Read-only price/stock lookup only (not part of the SAGA write path) - a synchronous
# REST GET here is a deliberate, minimal exception to "avoid sync inter-service calls",
# used only to enrich the order-creation form/request with accurate current pricing.
ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다 (JwtVerifier 참고).
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  gift-service:
    base-url: http://localhost:8084
  point-service:
    base-url: http://localhost:8083
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081

logging:
  level:
    com.ghlove.order: DEBUG
