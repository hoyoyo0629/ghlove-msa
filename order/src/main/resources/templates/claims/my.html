<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>취소반품교환 - 고향사랑e음 (order service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- 마이페이지 "취소반품교환" - 본인이 신청한 반품/교환 건 목록(승인/거절/처리완료 상태
     조회 전용, 신청 자체는 주문상세 화면에서 한다). SFR-010: 로그인 JWT 쿠키로 회원을
     식별하고, 본인 주문에 딸린 클레임만 보여준다(order/{orderId} → 클레임 역참조). AS-IS
     mypage/orderList.html과 동일한 기간/답례품명 검색 UI(formbtn-box 프리셋 버튼)를 쓴다. -->
<script th:inline="none">
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function toDateInput(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function setSearchRange(unit, amount) {
    var end = new Date();
    var start = new Date();
    if (unit === 'week') { start.setDate(start.getDate() - 7 * amount); }
    else if (unit === 'month') { start.setMonth(start.getMonth() - amount); }
    document.getElementById('searchStartDate').value = toDateInput(start);
    document.getElementById('searchEndDate').value = toDateInput(end);
}
function resetSearch() {
    document.getElementById('searchStartDate').value = '';
    document.getElementById('searchEndDate').value = '';
    document.getElementById('itemName').value = '';
    document.getElementById('searchForm').submit();
}
</script>

<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{'http://localhost:8081/mypage'}">마이페이지</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            취소반품교환
        </span>
        <h2 class="page-title-txt">취소반품교환</h2>
    </div>
</section>

<section id="contents" class="receipt-contents">
    <div class="center">
        <div class="s-contents mypageS">
            <form id="searchForm" th:action="@{/claims/my}" method="get">
                <div class="mypage-top">
                    <label class="card_title" for="searchStartDate">기간</label>
                    <div class="selected-field-line">
                        <div class="selected-item">
                            <label for="searchStartDate" class="sr-only">시작일</label>
                            <input type="date" name="searchStartDate" id="searchStartDate" th:value="${searchStartDate}">
                            <span class="s_txt"> ~ </span>
                            <label for="searchEndDate" class="sr-only">종료일</label>
                            <input type="date" name="searchEndDate" id="searchEndDate" th:value="${searchEndDate}">
                        </div>
                        <div class="formbtn-box">
                            <button class="formBtn" type="button" onclick="setSearchRange('week', 1)">1주일</button>
                            <button class="formBtn" type="button" onclick="setSearchRange('month', 1)">1개월</button>
                            <button class="formBtn" type="button" onclick="setSearchRange('month', 3)">3개월</button>
                            <button class="formBtn" type="button" onclick="setSearchRange('month', 6)">6개월</button>
                        </div>
                    </div>
                </div>
                <div class="line"></div>
                <div class="mypage-top">
                    <label class="card_title" for="itemName">답례품명</label>
                    <div class="selected-item">
                        <input type="text" name="itemName" id="itemName" th:value="${itemName}">
                    </div>
                </div>
                <div class="btn-box many mid">
                    <button type="button" class="blueBtn cancellation" onclick="resetSearch()">
                        초기화<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                    </button>
                    <button type="submit" class="blueBtn u-confirm">
                        조회<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                    </button>
                </div>
            </form>
        </div>

        <div class="contents-wrap">
            <div class="s-contents">
                <div class="list_body table-container w3c_v_2410" th:if="${!#lists.isEmpty(claims)}">
                    <div class="list_wrap">
                        <table>
                            <caption class="sr-only">취소반품교환 - 주문번호, 답례품정보, 유형, 상태, 신청일로 구성</caption>
                            <thead class="list-title">
                            <tr class="items_wrap">
                                <th class="date-col" scope="col">주문번호</th>
                                <th class="date-col g_info_wrap" scope="col">답례품정보</th>
                                <th class="date-col" scope="col">유형</th>
                                <th class="date-col" scope="col">상태</th>
                                <th class="date-col" scope="col">신청일</th>
                            </tr>
                            </thead>
                            <tbody class="item_list-group">
                            <tr class="list-items" th:each="c : ${claims}">
                                <td class="date-col">
                                    <a th:href="@{'/orders/' + ${c.orderId}}" th:text="${c.orderId}"></a>
                                </td>
                                <td class="date-col g_info_wrap">
                                    <div class="g_info__txt">
                                        <div class="info_title" th:text="${ordersById.get(c.orderId)} != null ? ${ordersById.get(c.orderId).itemName} : '-'"></div>
                                    </div>
                                </td>
                                <td class="date-col" th:text="${claimTypeLabels.get(c.claimType)} ?: ${c.claimType}"></td>
                                <td class="date-col" th:text="${claimStatusLabels.get(c.status)} ?: ${c.status}"></td>
                                <td class="date-col" th:text="${#strings.substring(#strings.toString(c.createdDate), 0, 10)}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="common_none" th:if="${#lists.isEmpty(claims)}">
                    <p>취소/반품/교환 신청 내역이 없습니다.</p>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
