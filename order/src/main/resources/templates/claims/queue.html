<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>반품/교환 처리 - 고향사랑e음 (order service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap" style="max-width:700px;">
    <h1>반품/교환 처리<span class="badge">order</span></h1>
    <!-- 실제로는 운영자 권한으로 접근이 제한돼야 하지만, 게이트웨이/RBAC 연동 전이라
         임시로 누구나 접근 가능한 화면입니다. -->

    <div class="section-title">접수 대기</div>
    <table>
        <thead>
        <tr>
            <th>클레임ID</th>
            <th>주문번호</th>
            <th>유형</th>
            <th>사유</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${pending}">
            <td th:text="${c.claimId}"></td>
            <td><a th:href="@{'/orders/' + ${c.orderId}}" th:text="${c.orderId}"></a></td>
            <td th:text="${claimTypeLabels.get(c.claimType)} ?: ${c.claimType}"></td>
            <td th:text="${c.reason}"></td>
            <td>
                <form th:action="@{'/claims/' + ${c.claimId} + '/approve'}" method="post" class="inline-form">
                    <button type="submit">승인</button>
                </form>
                <form th:action="@{'/claims/' + ${c.claimId} + '/reject'}" method="post" class="inline-form">
                    <button type="submit">거절</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(pending)}">접수 대기중인 건이 없습니다.</p>

    <div class="section-title" style="margin-top:28px;">승인됨 (회수/재발송 확인 후 처리완료)</div>
    <table>
        <thead>
        <tr>
            <th>클레임ID</th>
            <th>주문번호</th>
            <th>유형</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${approved}">
            <td th:text="${c.claimId}"></td>
            <td><a th:href="@{'/orders/' + ${c.orderId}}" th:text="${c.orderId}"></a></td>
            <td th:text="${claimTypeLabels.get(c.claimType)} ?: ${c.claimType}"></td>
            <td>
                <form th:action="@{'/claims/' + ${c.claimId} + '/complete'}" method="post" class="inline-form">
                    <button type="submit">처리완료 (재고/포인트 복원)</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(approved)}">승인 후 처리 대기중인 건이 없습니다.</p>
</div>
</body>
</html>
