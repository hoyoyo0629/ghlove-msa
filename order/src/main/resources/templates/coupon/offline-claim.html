<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 코드 입력 - 고향사랑e음 (order service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/coupons}">쿠폰 다운로드</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            코드 입력
        </span>
        <h2 class="page-title-txt">쿠폰 코드 입력</h2>
    </div>
</section>

<section id="contents" class="receipt-contents">
    <div class="center">
        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="text-align:center;"></p>
        <form th:action="@{/coupons/offline/claim}" method="post" style="max-width:420px; margin:0 auto; display:flex; gap:8px;">
            <input type="text" name="code" placeholder="쿠폰 코드를 입력하세요" required style="flex:1;">
            <button type="submit" class="blueBtn u-confirm">쿠폰받기</button>
        </form>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
