<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta th:if="${order.orderStatus == 'PENDING'}" http-equiv="refresh" content="2">
    <title>주문 상세 - 고향사랑e음 (order service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1>주문 상세<span class="badge">order</span></h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div class="status-box"
         th:classappend="${order.orderStatus == 'PENDING'} ? 'pending' : (${order.orderStatus == 'CONFIRMED'} ? 'confirmed' : 'cancelled')">
        <div class="status-label" th:text="${statusLabels.get(order.orderStatus)} ?: ${order.orderStatus}"></div>
        <div class="reason" th:if="${order.orderStatus == 'PENDING'}">재고·포인트 처리 중입니다 (자동 새로고침)...</div>
        <div class="reason" th:if="${order.orderStatus == 'CLAIM_REQUESTED'}">반품/교환 신청이 접수되어 처리 중입니다.</div>
        <div class="reason" th:if="${order.cancelReason}" th:text="${order.cancelReason}"></div>
    </div>

    <div class="order-meta">
        <div>주문번호: <span th:text="${order.orderId}"></span></div>
        <div>답례품: <span th:text="${order.itemName}"></span></div>
        <div>수량: <span th:text="${order.quantity}"></span></div>
        <div>단가: <span th:text="${#numbers.formatInteger(order.unitPrice, 0, 'COMMA')} + '원'"></span></div>
        <div>사용 포인트: <span th:text="${#numbers.formatInteger(order.pointAmount, 0, 'COMMA')} + 'P'"></span></div>
    </div>

    <form th:if="${order.orderStatus == 'CONFIRMED'}" th:action="@{'/orders/' + ${order.orderId} + '/cancel'}" method="post" style="margin-top:16px;">
        <button type="submit">주문 취소</button>
    </form>

    <div th:if="${order.orderStatus == 'CONFIRMED'}" style="margin-top:16px; padding-top:16px; border-top:1px solid #eee;">
        <form th:action="@{'/orders/' + ${order.orderId} + '/claim'}" method="post">
            <div class="field">
                <label for="claimType">반품/교환 신청</label>
                <select id="claimType" name="claimType">
                    <option th:each="t : ${claimTypes}" th:value="${t.key}" th:text="${t.value}"></option>
                </select>
            </div>
            <div class="field">
                <input type="text" name="reason" placeholder="사유 (선택)">
            </div>
            <button type="submit">신청하기</button>
        </form>
    </div>

    <div th:if="${order.orderStatus == 'CONFIRMED'}" style="margin-top:16px; padding-top:16px; border-top:1px solid #eee;">
        <div class="section-title">배송관리</div>

        <div th:if="${order.deliveryStatus == null}">
            <p style="font-size:13px; color:#888;">아직 발송 전입니다. 배송지 변경이나 송장 등록이 가능합니다.</p>
            <form th:action="@{'/orders/' + ${order.orderId} + '/delivery-address'}" method="post" style="margin-bottom:12px;">
                <div class="field">
                    <label>배송지 변경</label>
                    <input type="text" name="address" placeholder="주소" th:value="${order.deliveryAddress}" required>
                </div>
                <div class="field">
                    <input type="text" name="addressDetail" placeholder="상세주소" th:value="${order.deliveryAddressDetail}">
                </div>
                <button type="submit">배송지 저장</button>
            </form>

            <form th:action="@{'/orders/' + ${order.orderId} + '/invoice'}" method="post">
                <div class="field">
                    <label>송장 등록 (제공자/운영자용)</label>
                    <select name="carrierCode" required>
                        <option th:each="c : ${carriers}" th:value="${c.key}" th:text="${c.value}"></option>
                    </select>
                </div>
                <div class="field">
                    <input type="text" name="invoiceNo" placeholder="송장번호" required>
                </div>
                <button type="submit">송장 등록 (발송처리)</button>
            </form>
        </div>

        <div th:if="${order.deliveryStatus != null}">
            <div class="order-meta">
                <div>배송상태: <span th:text="${deliveryStatusLabels.get(order.deliveryStatus)} ?: ${order.deliveryStatus}"></span></div>
                <div>택배사: <span th:text="${carriers.get(order.carrierCode)} ?: ${order.carrierCode}"></span></div>
                <div>송장번호: <span th:text="${order.invoiceNo}"></span></div>
                <div th:if="${order.deliveryAddress}">배송지: <span th:text="${order.deliveryAddress} + ' ' + ${order.deliveryAddressDetail}"></span></div>
            </div>

            <form th:if="${order.deliveryStatus == 'SHIPPED'}" th:action="@{'/orders/' + ${order.orderId} + '/delivery-status'}" method="post" class="inline-form" style="margin-top:10px;">
                <input type="hidden" name="deliveryStatus" value="IN_TRANSIT">
                <button type="submit" class="small-btn">배송중으로 변경 (운영자용)</button>
            </form>
            <form th:if="${order.deliveryStatus == 'SHIPPED' or order.deliveryStatus == 'IN_TRANSIT'}" th:action="@{'/orders/' + ${order.orderId} + '/delivery-status'}" method="post" class="inline-form" style="margin-top:6px;">
                <input type="hidden" name="deliveryStatus" value="DELIVERED">
                <button type="submit" class="small-btn">배송완료로 변경 (운영자용)</button>
            </form>
            <form th:if="${order.deliveryStatus == 'DELIVERED'}" th:action="@{'/orders/' + ${order.orderId} + '/confirm-receipt'}" method="post" style="margin-top:10px;">
                <button type="submit">수취확인 (구매확정)</button>
            </form>
        </div>
    </div>

    <div class="links">
        <a th:href="@{/my}">내 주문내역</a>
    </div>
</div>
</body>
</html>
