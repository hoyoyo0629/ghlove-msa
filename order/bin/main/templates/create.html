<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트로 주문하기 - 고향사랑e음 (order service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>
<div class="wrap">
    <h1>포인트로 주문하기<span class="badge">order</span></h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/orders}" method="post">
        <div class="field">
            <label for="itemId">답례품 ID</label>
            <input type="number" id="itemId" name="itemId" th:value="${itemId}" required>
            <!-- gift 서비스 답례품 상세 화면의 "포인트로 주문하기" 링크로 들어오면
                 자동으로 채워집니다. -->
        </div>
        <div class="field">
            <label for="quantity">수량</label>
            <input type="number" id="quantity" name="quantity" min="1" step="1" value="1" required>
        </div>
        <button type="submit">주문하기</button>
    </form>

    <div class="links">
        <a th:href="@{/my}">내 주문내역</a>
    </div>
</div>
<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
