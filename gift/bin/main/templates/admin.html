<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지자체 승인 대기함 - 고향사랑e음 (gift service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="logo">답례품<span class="badge">gift</span></div>
    <div class="nav-links">
        <a th:href="@{/}">목록으로</a>
    </div>
</nav>

<div class="wrap">
    <h1 style="text-align:left">지자체 승인 대기함</h1>
    <!-- 실제로는 지자체 담당자 권한으로 접근이 제한돼야 하지만, 게이트웨이/RBAC 연동 전이라
         임시로 누구나 접근 가능한 화면입니다. -->

    <table th:if="${gifts != null}">
        <thead>
        <tr>
            <th>답례품명</th>
            <th>제공자 ID</th>
            <th>카테고리</th>
            <th>지자체</th>
            <th>가격</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="g : ${gifts}">
            <td><a th:href="@{'/gifts/' + ${g.itemId}}" th:text="${g.itemName}"></a></td>
            <td th:text="${g.sellerId}"></td>
            <td th:text="${categories.get(g.categoryCode)} ?: ${g.categoryCode}"></td>
            <td th:text="${g.locgovCode}"></td>
            <td th:text="${#numbers.formatInteger(g.salePrice, 0, 'COMMA')} + '원'"></td>
            <td>
                <form th:action="@{'/gifts/' + ${g.itemId} + '/approve'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn">승인</button>
                </form>
                <form th:action="@{'/gifts/' + ${g.itemId} + '/reject'}" method="post" class="inline-form" style="margin-top:4px;">
                    <button type="submit" class="small-btn danger">반려</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(gifts)}">승인 대기중인 답례품이 없습니다.</p>
</div>
</body>
</html>
