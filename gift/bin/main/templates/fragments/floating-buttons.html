<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* AS-IS fixedBtn.vue(ghlove-frontend/components/ui/fixedBtn.vue) 재현.
     이 프로젝트는 Vue 없이 순수 HTML/CSS라서, 접기/열기 토글은 숨김 체크박스 트릭으로 대체했다
     (site.css의 .float-toggle-input:checked 규칙 참고). 카카오채널/챗봇은 AS-IS와 동일하게
     그냥 새창으로 여는 외부 링크(별도 SDK/설정 불필요). TOP 버튼만 최소한의 인라인 스크롤 스크립트를 쓴다. */-->
<div th:fragment="floating-buttons">
    <input type="checkbox" id="float-toggle-input" class="float-toggle-input" hidden>

    <div class="float-area" id="fixedBtn">
        <div class="float__item float__item--toggle">
            <a class="float__btn" title="새 창 열림" href="http://pf.kakao.com/_cxdtlG" target="_blank" rel="noopener">
                <i class="ico_ch"></i>
                <span class="sr-only">카카오채널 추가</span>
            </a>
        </div>
        <div class="float__item float__item--toggle">
            <a class="float__btn" title="새 창 열림" href="http://www.chatbot.go.kr/chatbotPop.ndo?bnrId=2Qe7TBzEHOthcAi"
               target="bnrPopup" onclick="window.open('','bnrPopup','width=600,height=800');">
                <i class="ico_chatbot"></i>
                <span class="sr-only">챗봇상담</span>
            </a>
        </div>
        <div class="float__item">
            <a class="float__btn" href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">
                <i class="ico_top"></i>
                <span class="sr-only">TOP</span>
            </a>
        </div>
        <div class="float__item">
            <label for="float-toggle-input" class="float__btn-toggle float_btn">
                <i class="ico_toggle"></i>
                <span class="sr-only">접기/열기</span>
            </label>
        </div>
    </div>
</div>
</body>
</html>
