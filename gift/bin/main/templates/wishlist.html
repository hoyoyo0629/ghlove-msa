<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관심답례품 - 고향사랑e음 (gift service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/favo_info.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- 마이페이지 "관심답례품" (AS-IS mypage/favorItem.html 재현 - favo_info.css의 실제
     클래스 그대로 사용). SFR-010: 로그인 JWT 쿠키로 회원을 식별한다. AS-IS는 개별 삭제
     버튼이 없고 체크박스로 골라 "선택 삭제"만 지원한다. -->
<script th:inline="none">
function toggleAll(master) {
    document.querySelectorAll('.row-check').forEach(function (c) { c.checked = master.checked; });
}
function syncMaster() {
    var boxes = document.querySelectorAll('.row-check');
    var checked = document.querySelectorAll('.row-check:checked');
    document.getElementById('selectAll').checked = boxes.length > 0 && boxes.length === checked.length;
}
function deleteSelected() {
    var checked = document.querySelectorAll('.row-check:checked');
    if (checked.length === 0) {
        alert('선택된 답례품이 없습니다.');
        return;
    }
    if (!confirm('정보를 수정 하시겠습니까?')) { return; }
    document.getElementById('deleteForm').submit();
}
</script>

<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{'http://localhost:8081/mypage'}">마이페이지</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            관심답례품
        </span>
        <h2 class="page-title-txt">관심답례품</h2>
    </div>
</section>

<section id="contents" class="receipt-contents">
    <div class="center">
        <form id="deleteForm" th:action="@{/wishlist/delete}" method="post" th:if="${!#lists.isEmpty(wishlist)}">
            <div class="contents_wrap">
                <div class="s-contents">
                    <div class="cart_top">
                        <div class="chk_box check-level1">
                            <input type="checkbox" id="selectAll" onclick="toggleAll(this)">
                            <label for="selectAll">전체선택</label>
                        </div>
                        <div class="btn_area">
                            <button type="button" class="formBtn del" id="deleteWishItemsBtn" onclick="deleteSelected()">선택 삭제</button>
                        </div>
                    </div>

                    <div class="list_body table-container w3c_v_2410">
                        <div class="list_wrap">
                            <table>
                                <caption class="sr-only">관심답례품 - 지자체명, 답례품정보, 상태, 바로가기로 구성</caption>
                                <thead class="list-title">
                                <tr class="items_wrap">
                                    <th class="date-col chk_date"><span class="sr-only">선택</span></th>
                                    <th class="date-col info_loc" scope="col">지자체명</th>
                                    <th class="date-col g_info_wrap" scope="col">답례품정보</th>
                                    <th class="date-col sal_status" scope="col">상태</th>
                                    <th class="date-col btn_col" scope="col">바로가기</th>
                                </tr>
                                </thead>
                                <tbody class="item_list-group">
                                <tr class="list-items" th:each="w : ${wishlist}">
                                    <td class="date-col chk_date">
                                        <div class="check_input">
                                            <label th:for="'chk' + ${w.wishlistId}" class="sr-only" th:text="${w.gift.itemName} + ' 선택'"></label>
                                            <input type="checkbox" class="row-check" name="wishlistIds" th:value="${w.wishlistId}"
                                                   th:id="'chk' + ${w.wishlistId}" onchange="syncMaster()">
                                        </div>
                                    </td>
                                    <td class="date-col info_loc" th:text="${locgovNames.get(w.gift.locgovCode)} ?: ${w.gift.locgovCode}"></td>
                                    <td class="date-col g_info_wrap">
                                        <a class="g_info__img" th:href="@{'/gifts/' + ${w.gift.itemId}}">
                                            <img th:if="${thumbnails.get(w.gift.itemId)} != null" th:src="@{'/uploads/' + ${thumbnails.get(w.gift.itemId)}}" alt="답례품이미지">
                                            <img th:if="${thumbnails.get(w.gift.itemId)} == null" th:src="@{/images/icon/non-list.png}" alt="답례품이미지 없음">
                                        </a>
                                        <div class="g_info__txt">
                                            <div class="info_title"><a th:href="@{'/gifts/' + ${w.gift.itemId}}" th:text="${w.gift.itemName}"></a></div>
                                            <div class="g_info__price" th:text="${#numbers.formatInteger(w.gift.salePrice, 0, 'COMMA')} + ' P'"></div>
                                        </div>
                                    </td>
                                    <td class="date-col sal_status" th:if="${w.gift.soldOut == '1'}"><span>품절</span></td>
                                    <td class="date-col sal_status" th:if="${w.gift.soldOut != '1' and w.gift.dataStatusCode == 'APPROVED'}"><span>판매중</span></td>
                                    <td class="date-col sal_status" th:if="${w.gift.soldOut != '1' and w.gift.dataStatusCode != 'APPROVED'}"><span>판매중지</span></td>
                                    <td class="date-col btn_col">
                                        <button type="button" class="formBtn"
                                                th:attr="data-url=@{'/gifts/' + ${w.gift.itemId}}"
                                                onclick="location.href=this.dataset.url">답례품몰</button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <div class="common_none" th:if="${#lists.isEmpty(wishlist)}">
            <p>관심답례품이 없습니다.</p>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
