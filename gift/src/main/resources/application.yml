server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    # ResponseStatusException의 reason이 cross-service 호출자(admin CategoryAdminClient 등)의
    # 에러 응답 "message" 필드로 전달되도록 - 기본값(never)이면 카테고리 삭제 가드 등의
    # 구체적인 실패 사유가 admin 화면에 전혀 안 보이고 fallback 문구로만 뜬다.
    include-message: always

gift:
  upload:
    dir: ./uploads/gift

ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  donation-service:
    base-url: http://localhost:8082
  # 판매자 셀프포털(SellerPortalController)이 "주문현황" 조회를 위해 order 서비스의 관리자
  # 전용 API(/api/admin/orders)를 호출할 때 쓴다 - order의 application.yml과 반드시 동일해야
  # 한다 (order의 AdminApiAuthInterceptor 참고, admin 서비스가 쓰는 것과 같은 시크릿을 재사용).
  internal:
    admin-secret: "ghlove-msa-local-dev-internal-admin-secret-do-not-expose!!"
  order-service:
    base-url: http://localhost:8085

spring:
  application:
    name: gift
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:15432/gift
    username: gift
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # SQL은 아래 logging 의 org.hibernate.SQL 로거로 일원화(System.out 중복 출력 방지)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: gift-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read as raw JSON string and parsed manually (see OrderSagaListener) - gift doesn't
      # share Java event classes with order/point across the service boundary.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 로컬 개발 전용: P6Spy 가 datasource 를 감싸 파라미터가 인라인된(바로 실행 가능한) SQL 한 줄을
# 로거 'p6spy' 로 찍는다. developmentOnly 의존성이라 운영 bootJar 에는 P6Spy 자체가 없어 무효.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false        # 한 줄로 출력(복붙해서 바로 실행하기 좋게)
      log-format: "%(executionTime)ms | %(sqlSingleLine)"

logging:
  level:
    com.ghlove.gift: DEBUG
    p6spy: DEBUG                           # P6Spy 가 찍는 인라인 SQL
    # 아래 Hibernate 로거는 P6Spy 와 중복이라 꺼둔다(P6Spy 없이 순수 Hibernate 로그만 볼 땐 주석 해제)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
