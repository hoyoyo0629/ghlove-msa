<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 등록 - 고향사랑e음 (gift service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap narrow">
    <h1>답례품 등록<span class="badge">gift</span></h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/register}" method="post" enctype="multipart/form-data">
        <!-- 제공자는 로그인한 회원(GH_AUTH JWT)과 연결된 OP_SELLER 레코드로 서버가 정한다.
             예전에는 이 자리에 "제공자 ID" 입력칸이 있어 아무 번호나 넣으면 그 제공자로
             답례품이 등록됐다(무인증 스푸핑). 화면이 값을 주장하지 못하게 칸 자체를 없앴다. -->
        <div class="field">
            <label for="itemName">답례품명</label>
            <input type="text" id="itemName" name="itemName" required>
        </div>
        <div class="field">
            <label for="itemSummary">한줄 소개</label>
            <input type="text" id="itemSummary" name="itemSummary">
        </div>
        <div class="field">
            <label for="detailContent">상세 설명</label>
            <textarea id="detailContent" name="detailContent" rows="4"></textarea>
        </div>
        <div class="field">
            <label for="categoryCode">카테고리</label>
            <select id="categoryCode" name="categoryCode" required>
                <option th:each="c : ${categories}" th:value="${c.key}" th:text="${c.value}"></option>
            </select>
        </div>
        <div class="field">
            <label for="locgovCode">지자체 코드</label>
            <input type="text" id="locgovCode" name="locgovCode" required placeholder="예: 11230">
        </div>
        <div class="field">
            <label for="salePrice">가격 (원)</label>
            <input type="number" id="salePrice" name="salePrice" min="1" step="1" required>
        </div>
        <div class="field">
            <label for="stockQuantity">초기 재고 수량</label>
            <input type="number" id="stockQuantity" name="stockQuantity" min="0" step="1" required>
        </div>
        <div class="field">
            <label for="displayType">노출 유형</label>
            <select id="displayType" name="displayType">
                <option th:each="d : ${displayTypes}" th:value="${d.key}" th:text="${d.value}"></option>
            </select>
        </div>
        <div class="field">
            <label for="displayStartDate">노출 시작일 (한시노출일 때만)</label>
            <input type="date" id="displayStartDate" name="displayStartDate">
        </div>
        <div class="field">
            <label for="displayEndDate">노출 종료일 (한시노출일 때만)</label>
            <input type="date" id="displayEndDate" name="displayEndDate">
        </div>
        <div class="field">
            <label for="minDonationAmount">선택 가능 최소 기부금액 (선택)</label>
            <input type="number" id="minDonationAmount" name="minDonationAmount" min="0" step="1000">
        </div>
        <div class="field">
            <label for="images">상품 이미지 (첫 번째가 썸네일)</label>
            <input type="file" id="images" name="images" accept="image/*" multiple>
        </div>
        <button type="submit">등록 신청</button>
    </form>

    <div class="links">
        <a th:href="@{/}">목록으로</a>
    </div>
</div>
</body>
</html>
