<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매자 대시보드 - 고향사랑e음 (gift service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="logo">답례품<span class="badge">gift</span></div>
    <div class="nav-links">
        <a th:href="@{/}">목록으로</a>
    </div>
</nav>

<div class="wrap">
    <h1 style="text-align:left">판매자 대시보드</h1>

    <div th:if="${seller == null}" class="error">
        <p>로그인한 계정에 연결된 판매자 정보가 없습니다.</p>
        <p style="margin-top:8px; color:#888;">답례품 제공업체로 등록된 계정만 이용할 수 있습니다. 담당 지자체 또는 고향사랑e음 운영사무국으로 문의해 주세요.</p>
    </div>

    <div th:if="${seller != null}">
        <table class="board_write_table" style="margin-bottom:24px;">
            <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">판매자명</td>
                <td th:text="${seller.sellerName}"></td>
                <td class="label">판매자ID</td>
                <td th:text="${seller.sellerId}"></td>
            </tr>
            <tr>
                <td class="label">담당자</td>
                <td th:text="${seller.userName} ?: '-'"></td>
                <td class="label">연락처</td>
                <td th:text="${seller.phoneNumber} ?: '-'"></td>
            </tr>
            </tbody>
        </table>

        <h2 style="text-align:left; font-size:18px; margin-bottom:8px;">내 답례품 (<span th:text="${#lists.size(gifts)}"></span>개)</h2>
        <table th:if="${gifts != null}">
            <thead>
            <tr>
                <th>답례품명</th>
                <th>가격</th>
                <th>재고</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="g : ${gifts}">
                <td><a th:href="@{'/gifts/' + ${g.itemId}}" th:text="${g.itemName}"></a></td>
                <td th:text="${#numbers.formatInteger(g.salePrice, 0, 'COMMA')} + '원'"></td>
                <td th:text="${g.stockQuantity}"></td>
                <td th:text="${statusLabels.get(g.dataStatusCode)} ?: ${g.dataStatusCode}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${gifts != null and #lists.isEmpty(gifts)}">등록한 답례품이 없습니다.</p>

        <h2 style="text-align:left; font-size:18px; margin:24px 0 8px;">최근 주문현황 (최근 20건)</h2>
        <table th:if="${orders != null}">
            <thead>
            <tr>
                <th>주문번호</th>
                <th>답례품명</th>
                <th>수량</th>
                <th>결제포인트</th>
                <th>주문상태</th>
                <th>배송상태</th>
                <th>주문일시</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.orderId()}"></td>
                <td th:text="${o.itemName()}"></td>
                <td th:text="${o.quantity()}"></td>
                <td th:text="${#numbers.formatInteger(o.pointAmount(), 0, 'COMMA')} + 'P'"></td>
                <td th:text="${o.orderStatus() == 'PENDING'} ? '처리중' : (${o.orderStatus() == 'CONFIRMED'} ? '주문확정' : (${o.orderStatus() == 'CLAIM_REQUESTED'} ? '반품/교환신청중' : '취소'))"></td>
                <td th:text="${o.deliveryStatus()} ?: '미발송'"></td>
                <td th:text="${o.createdDate() != null ? #strings.substring(o.createdDate(), 0, 16) : '-'}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${orders != null and #lists.isEmpty(orders)}">주문 내역이 없습니다.</p>
    </div>
</div>
</body>
</html>
