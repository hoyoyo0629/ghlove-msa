<!DOCTYPE html>
<!--
 판매자 공지사항 상세 (AS-IS seller/i18n/sellerNotice/detail.jsp). 제목/등록일시/조회수/내용/
 첨부자료 - 문구는 AS-IS 그대로("조회", "첨부자료"). 조회수 증가는 admin 내부 API에서 처리한다.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${detail.subject()} + ' - 공지사항'">공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="logo">답례품<span class="badge">gift</span></div>
    <div class="nav-links">
        <a th:href="@{/seller/sys-notice/list}">목록</a>
    </div>
</nav>

<div class="wrap">
    <div class="page-title" style="border-top:1px solid #000; padding-top:16px; text-align:left; font-size:20px; font-weight:bold;"
         th:text="${detail.subject()}">제목</div>
    <div style="text-align:left; color:#666; padding:8px 0; border-bottom:1px solid #ddd;">
        <span th:text="${detail.frstCrtDt()}">-</span>
        <span style="margin-left:16px;">조회 <span th:text="${detail.hits()} ?: 0">0</span></span>
    </div>

    <div class="page-contents" style="min-height:300px; padding:24px 4px; text-align:left;"
         th:utext="${detail.content()}">내용</div>

    <div th:if="${detail.files() != null and !#lists.isEmpty(detail.files())}"
         style="border-top:1px solid #ddd; padding-top:12px; text-align:left;">
        <p style="font-weight:bold;">📎 첨부자료</p>
        <ul>
            <li th:each="f : ${detail.files()}">
                <a th:href="@{'/seller/sys-notice/file-download/' + ${f.fileId()}}" th:text="${f.fileName()}">파일</a>
            </li>
        </ul>
    </div>

    <div style="margin-top:24px; text-align:center;">
        <a th:href="@{/seller/sys-notice/list}" class="btn">목록</a>
    </div>
</div>
</body>
</html>
