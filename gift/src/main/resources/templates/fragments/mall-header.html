<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* AS-IS components/layouts/header_g.vue 재현 - 답례품몰 전용 2번째 내비게이션 바.
     AS-IS 장바구니 화면은 이 몰헤더를 KRDS 메인헤더(fragments/header.html) 아래에 겹쳐서
     쓴다. "전체 카테고리" 메가메뉴는 AS-IS 실서비스(GET /api/category, 라이브 DB 데이터라
     로컬 AS-IS 소스에는 없음)를 헤드리스 브라우저로 직접 조회해서 받아온 실제 카테고리
     트리(대분류 6개 + 소분류)를 그대로 옮겼다 - AS-IS의 세부 카테고리 코드(예: code=
     100000000000)는 gift 서비스 도메인에 대응 필드가 없어서, 소분류 클릭도 그 소분류가
     속한 대분류(GIFT_CATEGORY, 예: TOUR)로만 필터링된다 (시각적으로는 AS-IS와 동일하게
     전부 보여주되, 실제 필터링은 gift가 실제로 갖고 있는 대분류 단위까지만).
     "지자체몰 선택하기" 지도 팝업은 AS-IS components/ui/lclgv_chc/map.vue 재현 - 16개
     시/도 라벨을 실제 지도 이미지(static/images/lclgv_chc/vtmap*.png) 위에 CSS로 절대
     배치하고, 클릭 시 해당 시/도가 강조된 지도 이미지로 교체 + 우측에 시/군/구 그리드를
     보여준다. AS-IS는 시/도·시/군/구를 매번 별도 API(GET /api/ngdonation/sidoList,
     sigunguList)로 조회하지만, 여기서는 donation 서비스의 벌크 조회(LocgovClient.
     allLocgovs()) 결과를 CartController가 시/도 코드별로 미리 그룹핑해 한 번에 렌더링한다
     (Vue 컴포넌트가 없는 순수 SSR/vanilla JS 구조라 서버에서 그룹까지 끝내는 편이 맞다).
     "답례품 전체 검색" 입력창의 투명 배경/흰 글자는 AS-IS header_g.vue 자체의 Vue
     scoped 스타일(<style scoped> input[type='text']{background:transparent;...})이라
     공용 CSS 파일(layout.css 등)에는 없다 - Vue scoped는 컴파일시 data-v-* 속성으로
     범위를 좁히는데, 여기 SSR 구조에는 그 메커니즘이 없어 이 프래그먼트 자체에
     동일한 내용의 <style>을 그대로 옮겨서 넣는다(원본과 동일하게 컴포넌트에 스타일을
     동봉 - .gnb .goods_search로 범위를 좁혀 페이지의 다른 텍스트 입력칸에는 영향 없음). */-->
<nav id="header_g" class="header2" th:fragment="mall-header">
    <!-- th:replace는 th:fragment가 걸린 엘리먼트 안쪽만 가져온다 - 이 <style>이 <nav> 밖에
         있으면 조용히 누락된다(실제로 한 번 이렇게 빠뜨렸었음), 그래서 <nav> 안쪽 첫
         자식으로 넣는다. -->
    <style>
    .gnb .goods_search input[type="text"] {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 14px;
        outline: 1px;
    }
    .gnb .goods_search input[type="text"]::placeholder {
        color: #fff;
    }
    </style>
    <div class="gnb">
        <div class="center">
            <div class="gnb_slider_m">
                <button type="button" class="total_menu" id="totalMenuBtn" onclick="toggleAllMenu()">
                    <span class="total_menu_h" id="totalMenuIcon">
                        <span class="total_menu_h-line"></span>
                        <span class="total_menu_h-line"></span>
                        <span class="total_menu_h-line"></span>
                    </span>
                    <span>전체 카테고리</span>
                </button>
                <span class="v-line"></span>
                <ul class="top_menu">
                    <li><a th:href="@{'http://localhost:8084/seasonal'}">제철식품관</a></li>
                    <li><a th:href="@{'http://localhost:8084/community-business'}">마을기업관</a></li>
                </ul>
                <form class="goods_search" th:action="@{'http://localhost:8084/'}" method="get">
                    <input type="text" name="q" placeholder="답례품 전체 검색" title="답례품 전체 검색">
                    <button type="submit"><img class="icon-img" th:src="@{/images/icon/search-white.png}" alt="검색하기"></button>
                </form>
                <button type="button" class="local_shop" id="locshopBtn" onclick="openLocgovModal()">
                    <span class="shop_select">
                        <span class="local_shop_wrap">
                            <img class="icon-img" th:src="@{/images/goods/local-loc.png}" alt="">
                            <span class="locNameArea">지자체몰 선택하기</span>
                        </span>
                        <img th:src="@{/images/goods/cli-icon_local-arrow.png}" alt="지자체 선택 팝업 열기">
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- "지자체몰 선택하기" 지도 팝업 (AS-IS components/ui/lclgv_chc/map.vue) -->
    <div class="black-bg" id="locgovModal">
        <div class="overlayer">
            <div class="overlayer-header">
                지자체 선택
                <div class="btn-box">
                    <button type="button" class="temp-button hidden_txt" style="top:18px;right:18px;"
                            onclick="closeLocgovModal()">지자체 선택 팝업 닫기</button>
                </div>
            </div>
            <div class="overlayer-body">
                <div class="mapWrap">
                    <div class="area">
                        <div class="image">
                            <img src="/images/lclgv_chc/vtmap.png" id="locgovMapImg" alt="전국 지도">
                            <div th:each="p : ${mapProvinces}" class="addrName" th:classappend="${p.cssClass}"
                                 th:id="${'prov-' + p.code}" th:attr="data-code=${p.code},data-img=${p.mapImage}"
                                 onclick="selectLocgovProvince(this)"
                                 th:title="${p.name + ' 시군구 조회하기'}" tabindex="0">
                                <span th:text="${p.mapLabel}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="addr">
                        <div id="addr-default" class="text_area active">
                            <div class="addrTit">시도를 선택해주세요.</div>
                        </div>
                        <div th:each="p : ${mapProvinces}" class="text_area" th:id="${'addr-' + p.code}">
                            <div class="addrTit" th:text="${p.name}"></div>
                            <div class="addrBox">
                                <ul class="addrList">
                                    <li th:each="lg : ${locgovsByProvince.get(p.code) ?: {}}">
                                        <a style="cursor:pointer;" th:text="${lg.locgovNm()}"
                                           th:attr="data-locgov-code=${lg.locgovCode()}"
                                           onclick="location.href='http://localhost:8084/?locgovCode=' + this.dataset.locgovCode"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- "전체 카테고리" 메가메뉴 (AS-IS main_lnb, components/layouts/header_g.vue 재현).
         실제 운영 사이트 GET /api/category 응답을 그대로 옮긴 데이터(gift 서비스
         CategoryService, classpath:categories.json) - 대분류(top_category, 왼쪽 회색열)
         하나를 hover하면 그 대분류에 속한 중분류(middle_category)들이 오른쪽에 6칼럼
         그리드로 나열되고, 각 중분류 아래 개별품목(detail_category)이 나온다. AS-IS는
         Vue 반응형으로 hover된 대분류의 중분류만 그때그때 새로 그리지만, 여기서는 SSR이라
         전체 그룹의 칼럼을 미리 다 그려두고 data-group으로 표시/숨김만 전환한다(.detail_cate
         > .middle_category 직계 자식 CSS 선택자를 깨지 않도록 th:block으로 감싼다 -
         감싸는 실제 엘리먼트를 넣으면 CSS의 16.667% 6칼럼 그리드가 깨짐). 개별
         중분류/품목 코드는 gift 도메인이 그 세밀도까지 갖고 있지 않아 클릭하면 전부
         그 항목이 속한 대분류(GIFT_CATEGORY)로만 필터링된다. -->
    <nav class="main_lnb" id="allMenu">
        <div class="center">
            <ul class="top_category">
                <li th:each="g, gStat : ${categoryGroups}">
                    <button type="button" th:id="${'cate' + gStat.index}"
                            th:attr="data-index=${gStat.index},data-code=${g.code}"
                            onmouseover="showCategoryGroup(this.dataset.index)"
                            onclick="location.href='http://localhost:8084/?categoryCode=' + this.dataset.code"
                            th:text="${g.name}"></button>
                </li>
            </ul>
            <div class="detail_cate">
                <th:block th:each="g, gStat : ${categoryGroups}">
                    <ul class="middle_category" th:each="c : ${g.categories}"
                        th:attr="data-group=${gStat.index}"
                        th:style="${gStat.index == 0} ? '' : 'display:none;'">
                        <li>
                            <button type="button" th:attr="data-url=@{'http://localhost:8084/'(categoryCode=${g.code})}"
                                    onclick="location.href=this.dataset.url" th:text="${c.name}"></button>
                            <ul class="detail_category" th:if="${!#lists.isEmpty(c.children)}">
                                <li th:each="child : ${c.children}">
                                    <button type="button" th:attr="data-url=@{'http://localhost:8084/'(categoryCode=${g.code})}"
                                            onclick="location.href=this.dataset.url" th:text="${child}"></button>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </th:block>
            </div>
        </div>
    </nav>

<script th:inline="none">
function toggleAllMenu() {
    var menu = document.getElementById('allMenu');
    var icon = document.getElementById('totalMenuIcon');
    var open = menu.style.display === 'block';
    menu.style.display = open ? 'none' : 'block';
    icon.classList.toggle('is-open', !open);
}
function showCategoryGroup(index) {
    document.querySelectorAll('.main_lnb .detail_cate .middle_category').forEach(function (el) {
        el.style.display = (el.dataset.group === String(index)) ? '' : 'none';
    });
    document.querySelectorAll('.main_lnb .top_category button').forEach(function (btn) {
        btn.classList.remove('active');
    });
    var btn = document.getElementById('cate' + index);
    if (btn) { btn.classList.add('active'); }
}
document.addEventListener('click', function (e) {
    var menu = document.getElementById('allMenu');
    if (menu && menu.style.display === 'block'
        && !e.target.closest('#allMenu') && !e.target.closest('#totalMenuBtn')) {
        menu.style.display = 'none';
        document.getElementById('totalMenuIcon').classList.remove('is-open');
    }
});
function openLocgovModal() {
    document.getElementById('locgovModal').style.display = 'block';
}
function closeLocgovModal() {
    document.getElementById('locgovModal').style.display = 'none';
}
function selectLocgovProvince(btn) {
    var code = btn.getAttribute('data-code');
    var alreadyActive = btn.classList.contains('active');
    document.querySelectorAll('#locgovModal .addrName').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('#locgovModal .text_area').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('locgovMapImg').setAttribute('src', '/images/lclgv_chc/vtmap.png');
    if (alreadyActive) {
        document.getElementById('addr-default').classList.add('active');
        return;
    }
    btn.classList.add('active');
    document.getElementById('addr-' + code).classList.add('active');
    document.getElementById('locgovMapImg').setAttribute('src', '/images/lclgv_chc/' + btn.getAttribute('data-img'));
}
</script>
</nav>
</body>
</html>
