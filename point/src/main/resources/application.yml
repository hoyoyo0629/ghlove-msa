server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: point
  datasource:
    url: jdbc:postgresql://localhost:15432/ghlove_core?currentSchema=point
    username: point
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # SQL은 아래 logging 의 org.hibernate.SQL 로거로 일원화(System.out 중복 출력 방지)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: point-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Value is consumed as a raw JSON string and parsed manually per-listener with
      # ObjectMapper (see DonationEventListener) rather than JsonDeserializer, because
      # the producer (donation service) and this consumer don't share Java event
      # classes - donation's events live in com.ghlove.donation.event, point's local
      # copies in com.ghlove.point.event, so type-header-based deserialization can't
      # resolve the class name across services anyway.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

ghlove:
  # AS-IS에 없는 "포인트 사용(테스트)" 수동 차감 화면/엔드포인트 노출 스위치.
  # 주문 외 임의 차감이라 운영에서는 반드시 false여야 한다(기본값도 false).
  dev:
    manual-point-use: true
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081
  # 정기배치 실행결과를 admin의 "배치 실행로그 조회"(메뉴 7209)가 읽는 표에 보고할 때 쓴다
  admin-service:
    base-url: http://localhost:8086
  # member의 내부 전용 API(/api/users/{id})를 호출할 때 싣는 공유 시크릿 - member의
  # application.yml과 반드시 동일해야 한다(InternalApiAuthInterceptor).
  internal:
    admin-secret: "ghlove-msa-local-dev-internal-admin-secret-do-not-expose!!"

# 로컬 개발 전용: P6Spy 가 datasource 를 감싸 파라미터가 인라인된(바로 실행 가능한) SQL 한 줄을
# 로거 'p6spy' 로 찍는다. developmentOnly 의존성이라 운영 bootJar 에는 P6Spy 자체가 없어 무효.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false        # 한 줄로 출력(복붙해서 바로 실행하기 좋게)
      log-format: "%(executionTime)ms | %(sqlSingleLine)"

logging:
  level:
    com.ghlove.point: DEBUG
    p6spy: DEBUG                           # P6Spy 가 찍는 인라인 SQL
    # 아래 Hibernate 로거는 P6Spy 와 중복이라 꺼둔다(P6Spy 없이 순수 Hibernate 로그만 볼 땐 주석 해제)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
