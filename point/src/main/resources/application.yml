server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: point
  datasource:
    url: jdbc:postgresql://localhost:15432/point
    username: point
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: point-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Value is consumed as a raw JSON string and parsed manually per-listener with
      # ObjectMapper (see DonationEventListener) rather than JsonDeserializer, because
      # the producer (donation service) and this consumer don't share Java event
      # classes - donation's events live in com.ghlove.donation.event, point's local
      # copies in com.ghlove.point.event, so type-header-based deserialization can't
      # resolve the class name across services anyway.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081

logging:
  level:
    com.ghlove.point: DEBUG
