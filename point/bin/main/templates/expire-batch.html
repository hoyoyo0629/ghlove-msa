<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 소멸 배치 - 고향사랑e음 (point service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <h1>포인트 소멸 배치<span class="badge">point</span></h1>
    <!-- 실시간 스케줄러(SFR-013 배치 스케줄 관리)가 아직 없어, 운영자가 수동으로
         실행하는 화면입니다. 유효기간(기본 1825일)이 지난 미사용 적립분만
         FIFO 기준으로 정확히 소멸시킵니다. -->

    <p class="success" th:if="${resultCount != null}" th:text="${resultCount} + '건의 포인트 lot이 소멸 처리되었습니다.'"></p>

    <form th:action="@{/batch/expire}" method="post">
        <button type="submit">소멸 배치 실행</button>
    </form>

    <div class="links">
        <a th:href="@{/}">내 포인트로</a>
    </div>
</div>
</body>
</html>
