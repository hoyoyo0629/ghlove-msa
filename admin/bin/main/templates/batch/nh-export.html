<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NH농협 데이터 연계 배치 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>NH농협 데이터 연계 배치</h3>
    <p style="font-size:13px; color:#777; margin-bottom:16px;">
        실시간 스케줄러 없이 운영자가 수동으로 실행하는 화면입니다. STAT_DONATION_LEDGER의
        완료(COMPLETED) 기부 중 아직 반출하지 않은 건만 NH농협 측 데이터베이스로 내보냅니다.
    </p>

    <p class="success" th:if="${resultCount != null}" th:text="${resultCount} + '건이 반출 처리되었습니다.'"></p>

    <form th:action="@{/batch/nh-export}" method="post" style="margin-bottom:20px;">
        <button type="submit">배치 실행</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>기부번호</th>
            <th>회원 ID</th>
            <th>지자체</th>
            <th>금액</th>
            <th>반출상태</th>
            <th>반출일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${history}">
            <td th:text="${h.cntrSn}"></td>
            <td th:text="${h.userId}"></td>
            <td th:text="${h.locgovCode}"></td>
            <td th:text="${#numbers.formatInteger(h.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${h.exportStatus}"></td>
            <td th:text="${#temporals.format(h.exportedDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(history)}">반출 이력이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
