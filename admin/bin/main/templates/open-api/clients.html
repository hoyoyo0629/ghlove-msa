<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오픈API 클라이언트 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- SFR-010 "민간개방 API 기능(민간 이용업체 데이터 통합관리)" - 이 프로젝트 신규 화면(AS-IS
     대응 없음, access/RBAC 화면들과 같은 성격). 발급한 API 키는 Kong 게이트웨이(key-auth
     컨슈머)로 실시간 등록/회수되고, 실제 데이터는 gift 서비스의 GET /open-api/gifts로
     제공된다. -->
<div class="contents contents_inner">
    <h3><span>오픈API 클라이언트 관리</span></h3>
    <p style="color:#666; margin-bottom:16px;">
        외부 이용업체에게 발급하는 민간개방 API(<code>GET /open-api/gifts?apikey=...</code>) 접근 키를 관리합니다.
        발급/회수는 즉시 API 게이트웨이(Kong)에 반영됩니다.
    </p>
    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form th:action="@{/open-api/clients}" method="post">
        <div class="board_write">
            <table class="board_write_table" summary="오픈API 클라이언트 발급">
                <colgroup><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">이용업체명</td>
                    <td>
                        <input type="text" name="clientName" required style="width:300px;" placeholder="예: OO관광협회">
                        <button type="submit" class="btn btn-dark-gray btn-small">API 키 발급</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${#lists.size(clients)}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="오픈API 클라이언트 목록">
        <caption>오픈API 클라이언트 목록</caption>
        <thead>
        <tr>
            <th scope="col">No.</th>
            <th scope="col">이용업체명</th>
            <th scope="col">API 키</th>
            <th scope="col">상태</th>
            <th scope="col">발급일</th>
            <th scope="col">처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c, i : ${clients}">
            <td th:text="${i.index + 1}"></td>
            <td th:text="${c.clientName}"></td>
            <td><code th:text="${c.apiKey}"></code></td>
            <td th:text="${c.statusCode == 'ACTIVE' ? '사용중' : '회수됨'}"></td>
            <td th:text="${#temporals.format(c.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:if="${c.statusCode == 'ACTIVE'}" th:action="@{'/open-api/clients/' + ${c.clientId} + '/suspend'}"
                      method="post" class="inline-form" onsubmit="return confirm('이 API 키를 회수하시겠습니까? 즉시 호출이 차단됩니다.')">
                    <button type="submit" class="small-btn danger">회수</button>
                </form>
                <form th:if="${c.statusCode != 'ACTIVE'}" th:action="@{'/open-api/clients/' + ${c.clientId} + '/reactivate'}"
                      method="post" class="inline-form">
                    <button type="submit" class="small-btn">재발급(동일 키)</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(clients)}">발급된 오픈API 클라이언트가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
