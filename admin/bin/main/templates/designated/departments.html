<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지정기부 담당부서 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/designated-donation/part/list.jsp 재현 - 지자체 소속 부서 등록,
     사업 등록 시 담당부서로 지정할 수 있다(G_DSGN_DNTN_BIZ_DEPT_MNG). -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/designated-projects}">지정기부 관리</a></div>
    <h3><span>지정기부 담당부서 관리</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <table class="board_list_table" style="margin-bottom:28px;">
        <thead><tr><th scope="col">부서명</th><th scope="col">지자체</th><th scope="col">사용여부</th><th scope="col">관리</th></tr></thead>
        <tbody>
        <tr th:each="d : ${departments}">
            <td th:text="${d.deptNm}"></td>
            <td th:text="${d.locgovCode}"></td>
            <td th:text="${d.useYn == 'Y'} ? '사용' : '미사용'"></td>
            <td>
                <form th:action="@{/designated-projects/departments/{id}/toggle(id=${d.deptId})}" method="post" style="display:inline;">
                    <button type="submit" class="small-btn" th:text="${d.useYn == 'Y'} ? '미사용으로 전환' : '사용으로 전환'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(departments)}">등록된 부서가 없습니다.</p>

    <h4>부서 등록</h4>
    <div class="board_write">
        <table class="board_write_table" summary="부서 등록">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">부서명</td><td><input type="text" id="deptNm" name="deptNm" required maxlength="255" form="deptForm"></td></tr>
            <tr>
                <td class="label">지자체</td>
                <td>
                    <div class="flex_box gap-08">
                        <select id="upperLocgovCode" onchange="filterLocgov()">
                            <option value="">시·도 선택</option>
                            <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                        </select>
                        <select id="locgovCode" name="locgovCode" required form="deptForm">
                            <option value="">시·군·구 선택</option>
                            <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                    th:attr="data-upper=${l.upperLocgovCode}"></option>
                        </select>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="deptForm" th:action="@{/designated-projects/departments}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="deptForm" class="btn btn-dark-gray btn-small">등록</button>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
filterLocgov();
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
