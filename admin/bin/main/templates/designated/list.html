<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지정기부 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/designated-donation/list.jsp 재현 - 지정기부사업 CRUD. 갤러리
     이미지/미리보기/엑셀은 스코프 밖(designated-detail.html 주석, 공개 상세화면 자체가
     대표이미지 1장 구조). 승인 워크플로우는 AS-IS의 "담당자는 자기승인 불가" 규칙만
     ROLE_ADMIN/ROLE_OPERATOR 2단계로 재현(DesignatedProjectAdminController 참고). -->
<div class="contents contents_inner">
    <h3><span>지정기부 관리</span></h3>
    <div class="btn_all btn_right" style="margin-bottom:16px;">
        <div class="flex_box gap-08">
            <a th:href="@{/designated-projects/departments}" class="btn btn-dark-default btn-small">담당부서 관리</a>
            <a th:href="@{/designated-projects/banners}" class="btn btn-dark-default btn-small">대표배너 관리</a>
            <a th:href="@{/designated-projects/analysis}" class="btn btn-dark-default btn-small">모금분석</a>
            <a th:href="@{/designated-projects/new}" class="btn btn-dark-gray btn-small">사업 등록</a>
        </div>
    </div>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${#lists.size(projects)}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="지정기부관리">
        <caption>지정기부관리현황</caption>
        <thead>
        <tr>
            <th scope="col">No.</th>
            <th scope="col">사업명</th>
            <th scope="col">지자체</th>
            <th scope="col">사업구분</th>
            <th scope="col">모금기간</th>
            <th scope="col">목표금액</th>
            <th scope="col">상태</th>
            <th scope="col">공개여부</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p, i : ${projects}">
            <td th:text="${#lists.size(projects) - i.index}"></td>
            <td class="tleft"><a th:href="@{/designated-projects/{id}(id=${p.dsgnDntnBizId})}" th:text="${p.dsgnDntnBizTtl}"></a></td>
            <td th:text="${p.lclgvCd}"></td>
            <td th:text="${bsnsTypes.get(p.dsgnDntnBizSeCd)} ?: ${p.dsgnDntnBizSeCd}"></td>
            <td th:text="${p.dsgnDntnBizBgngYmd} + ' ~ ' + ${p.dsgnDntnBizEndYmd}"></td>
            <td th:text="${#numbers.formatInteger(p.goalAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${statusLabels.get(p.dsgnDntnBizSttsCd)} ?: ${p.dsgnDntnBizSttsCd}"></td>
            <td th:text="${p.rlsYn == 'Y'} ? '공개' : '비공개'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(projects)}">등록된 지정기부사업이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
