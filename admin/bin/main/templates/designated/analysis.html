<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지정기부 모금분석 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/designated-donation/analysis/locgov.jsp + analysis/month.jsp를 하나로
     통합했다(give-statistics 라운드와 동일한 이유 - 같은 지정기부 데이터를 지자체/월별로
     쪼갠 것뿐). month_temp2025.jsp는 날짜 이름부터 일회성 패치 화면이라 제외. -->
<div class="contents contents_inner">
    <p><a th:href="@{/designated-projects}">&larr; 지정기부 관리</a></p>
    <h3>지정기부 모금분석</h3>

    <form th:action="@{/designated-projects/analysis}" method="get" style="margin-bottom:28px;">
        <div class="field" style="display:inline-block; margin-right:10px;">
            <label for="year">년도</label>
            <select id="year" name="year" onchange="this.form.submit()">
                <option value="">전체</option>
                <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == year}"></option>
            </select>
        </div>
    </form>

    <h4>지자체별 모금현황</h4>
    <table class="board_list_table" style="margin-bottom:32px;">
        <thead><tr><th>지자체</th><th>모금액</th><th>건수</th><th>참여인원</th></tr></thead>
        <tbody>
        <tr th:each="r : ${locgovRows}">
            <td th:text="${locgovNames.get(r.locgovCode)} ?: ${r.locgovCode}"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.donationCount, 0, 'COMMA')} + '건'"></td>
            <td th:text="${#numbers.formatInteger(r.donorCount, 0, 'COMMA')} + '명'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(locgovRows)}">조회된 지정기부 실적이 없습니다.</p>

    <h4>월별 추이</h4>
    <table class="board_list_table">
        <thead><tr><th>월</th><th>모금액</th><th>건수</th></tr></thead>
        <tbody>
        <tr th:each="r : ${monthRows}">
            <td th:text="${r.month} + '월'"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.donationCount, 0, 'COMMA')} + '건'"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
