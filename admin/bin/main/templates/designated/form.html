<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지정기부사업 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/designated-donation/form.jsp 재현 - 사업 등록/수정을 한 화면에서
     처리한다(AS-IS도 같은 form.jsp를 재사용). 담당자(ROLE_OPERATOR)가 상태를 "진행중"으로
     직접 설정하면 서버가 자동으로 "대기"로 되돌린다(자기승인 금지 - DesignatedAdminService
     참고). -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/designated-projects}">지정기부 관리</a></div>
    <h3><span th:text="${projectId != null} ? '지정기부사업 수정' : '지정기부사업 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="지정기부사업 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>사업명</td>
                <td><input type="text" id="dsgnDntnBizTtl" name="dsgnDntnBizTtl" required maxlength="255"
                           th:value="${project != null} ? ${project.dsgnDntnBizTtl} : ''" form="projectForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>지자체</td>
                <td>
                    <div class="flex_box gap-08">
                        <select id="upperLocgovCode" onchange="filterLocgov()">
                            <option value="">시·도 선택</option>
                            <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"
                                    th:attr="data-code=${p.key}"></option>
                        </select>
                        <select id="lclgvCd" name="lclgvCd" required form="projectForm">
                            <option value="">시·군·구 선택</option>
                            <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                    th:attr="data-upper=${l.upperLocgovCode}"
                                    th:selected="${project != null and project.lclgvCd == l.locgovCode}"></option>
                        </select>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">담당부서</td>
                <td>
                    <select id="deptId" name="deptId" form="projectForm">
                        <option value="">선택안함</option>
                        <option th:each="d : ${departments}" th:value="${d.deptId}" th:text="${d.deptNm} + ' (' + ${d.locgovCode} + ')'"
                                th:selected="${project != null and project.deptId == d.deptId}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>사업구분</td>
                <td>
                    <select id="dsgnDntnBizSeCd" name="dsgnDntnBizSeCd" required form="projectForm">
                        <option value="">선택</option>
                        <option th:each="c : ${bsnsTypes}" th:value="${c.key}" th:text="${c.value}"
                                th:selected="${project != null and project.dsgnDntnBizSeCd == c.key}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">사업 세부구분</td>
                <td><input type="text" id="bsnsSubType" name="bsnsSubType" maxlength="50"
                           th:value="${project != null} ? ${project.bsnsSubType} : ''" form="projectForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>모금 기간</td>
                <td>
                    <div class="flex_box gap-08">
                        <input type="date" id="dsgnDntnBizBgngYmd" name="dsgnDntnBizBgngYmd" required form="projectForm"
                               th:value="${project != null and project.dsgnDntnBizBgngYmd != null and #strings.length(project.dsgnDntnBizBgngYmd) == 8}
                                          ? (${#strings.substring(project.dsgnDntnBizBgngYmd,0,4)} + '-' + ${#strings.substring(project.dsgnDntnBizBgngYmd,4,6)} + '-' + ${#strings.substring(project.dsgnDntnBizBgngYmd,6,8)}) : ''">
                        <span class="wave">~</span>
                        <input type="date" id="dsgnDntnBizEndYmd" name="dsgnDntnBizEndYmd" required form="projectForm"
                               th:value="${project != null and project.dsgnDntnBizEndYmd != null and #strings.length(project.dsgnDntnBizEndYmd) == 8}
                                          ? (${#strings.substring(project.dsgnDntnBizEndYmd,0,4)} + '-' + ${#strings.substring(project.dsgnDntnBizEndYmd,4,6)} + '-' + ${#strings.substring(project.dsgnDntnBizEndYmd,6,8)}) : ''">
                    </div>
                    <p style="font-size:12px; color:#666; margin-top:4px;">※ 모금 기간은 최대 3년까지 가능합니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>목표금액</td>
                <td><input type="number" id="goalAmt" name="goalAmt" required min="1" max="999999999999"
                           th:value="${project != null} ? ${project.goalAmt} : ''" form="projectForm"> 원</td>
            </tr>
            <tr>
                <td class="label">진행상태</td>
                <td>
                    <select id="dsgnDntnBizSttsCd" name="dsgnDntnBizSttsCd" form="projectForm">
                        <option th:each="s : ${statusLabels}" th:value="${s.key}" th:text="${s.value}"
                                th:selected="${project != null and project.dsgnDntnBizSttsCd == s.key}"></option>
                    </select>
                    <p style="font-size:12px; color:#666; margin-top:4px;">※ 담당자(운영자) 계정은 "진행중"으로 직접 전환할 수 없습니다 - 관리자 승인이 필요합니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label">공개여부</td>
                <td>
                    <select id="rlsYn" name="rlsYn" form="projectForm">
                        <option value="Y" th:selected="${project == null or project.rlsYn == 'Y'}">공개</option>
                        <option value="N" th:selected="${project != null and project.rlsYn == 'N'}">비공개</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">대표이미지</td>
                <td>
                    <input type="file" id="image" name="image" accept="image/*" form="projectForm">
                    <div th:if="${project != null and project.imageUrl != null}" style="margin-top:8px;">
                        <img th:src="@{${project.imageUrl}}" style="max-width:200px; border-radius:8px;">
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">사업소개 (HTML)</td>
                <td><textarea id="dsgnDntnBizCn" name="dsgnDntnBizCn" rows="10" form="projectForm"
                              th:text="${project != null} ? ${project.dsgnDntnBizCn} : ''"></textarea></td>
            </tr>
            <tr>
                <td class="label">기타사항</td>
                <td><textarea id="contentEtc" name="contentEtc" rows="4" form="projectForm"
                              th:text="${project != null} ? ${project.contentEtc} : ''"></textarea></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="projectForm" th:action="${projectId != null} ? @{/designated-projects/{id}(id=${projectId})} : @{/designated-projects}"
          method="post" enctype="multipart/form-data"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="projectForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>

    <div th:if="${projectId != null}">
        <h4 style="margin-top:36px;">공지사항</h4>
        <table class="board_list_table" style="margin-bottom:16px;">
            <thead><tr><th>제목</th><th>등록일</th><th>관리</th></tr></thead>
            <tbody>
            <tr th:each="n : ${notices}">
                <td th:text="${n.prjNoticeSubject}"></td>
                <td th:text="${n.frstRegistPnttm != null and #strings.length(n.frstRegistPnttm) >= 8} ? ${#strings.substring(n.frstRegistPnttm,0,8)} : ''"></td>
                <td>
                    <button type="button" class="edit-notice-btn small-btn"
                            th:data-notice-id="${n.prjNoticeId}" th:data-subject="${n.prjNoticeSubject}"
                            th:data-content="${n.prjNoticeCn}" onclick="editNotice(this)">수정</button>
                    <form th:action="@{/designated-projects/{id}/notices/{nid}/delete(id=${projectId},nid=${n.prjNoticeId})}" method="post" style="display:inline;" onsubmit="return confirm('삭제하시겠습니까?');">
                        <button type="submit" class="small-btn ghost">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(notices)}">등록된 공지사항이 없습니다.</p>

        <h4 id="noticeFormTitle" style="margin-top:36px;">공지사항 등록</h4>
        <div class="board_write">
            <table class="board_write_table" summary="공지사항 등록/수정">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr><td class="label">제목</td><td><input type="text" id="noticeSubject" name="subject" required maxlength="255" form="noticeForm"></td></tr>
                <tr><td class="label">내용</td><td><textarea id="noticeContent" name="content" rows="4" required form="noticeForm"></textarea></td></tr>
                </tbody>
            </table>
        </div>
        <form id="noticeForm" th:action="@{/designated-projects/{id}/notices(id=${projectId})}" method="post"></form>
        <div class="btn_all btn_center">
            <div class="flex_box gap-08">
                <button type="submit" form="noticeForm" class="btn btn-dark-gray btn-small">저장</button>
                <button type="button" class="btn btn-dark-default btn-small" onclick="resetNoticeForm()">취소</button>
            </div>
        </div>

        <h4 style="margin-top:36px;">상태변경 이력</h4>
        <table class="board_list_table">
            <thead><tr><th>변경일시</th><th>이전상태</th><th>변경상태</th><th>처리자ID</th></tr></thead>
            <tbody>
            <tr th:each="l : ${approvalLog}">
                <td th:text="${l.frstRegistPnttm}"></td>
                <td th:text="${statusLabels.get(l.beforeStatusCode)} ?: '-'"></td>
                <td th:text="${statusLabels.get(l.afterStatusCode)} ?: l.afterStatusCode"></td>
                <td th:text="${l.frstRgtrId}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(approvalLog)}">변경 이력이 없습니다.</p>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('lclgvCd');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
(function preselectProvince() {
    var citySelect = document.getElementById('lclgvCd');
    var selected = citySelect.options[citySelect.selectedIndex];
    if (selected && selected.dataset.upper) {
        document.getElementById('upperLocgovCode').value = selected.dataset.upper;
    }
})();
filterLocgov();

var noticeCreateAction = document.getElementById('noticeForm') ? document.getElementById('noticeForm').action : null;
function editNotice(btn) {
    document.getElementById('noticeFormTitle').textContent = '공지사항 수정';
    document.getElementById('noticeSubject').value = btn.dataset.subject;
    document.getElementById('noticeContent').value = btn.dataset.content;
    document.getElementById('noticeForm').action = noticeCreateAction + '/' + btn.dataset.noticeId + '/update';
    document.getElementById('noticeFormTitle').scrollIntoView({behavior: 'smooth'});
}
function resetNoticeForm() {
    document.getElementById('noticeFormTitle').textContent = '공지사항 등록';
    document.getElementById('noticeForm').reset();
    document.getElementById('noticeForm').action = noticeCreateAction;
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
