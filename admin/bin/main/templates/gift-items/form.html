<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 등록/수정(관리자) - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/gift-items}">답례품 상품관리(관리자)</a></div>
    <h3><span th:text="${item.itemId()} != null ? '답례품 수정' : '답례품 직접 등록'"></span></h3>
    <p style="color:#c00;" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="답례품 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>판매자(셀러)</td>
                <td>
                    <select name="sellerId" required form="itemForm">
                        <option value="">선택하세요</option>
                        <option th:each="s : ${sellers}" th:value="${s.sellerId()}" th:text="${s.sellerName()} + ' (' + ${s.companyName()} + ')'"
                                th:selected="${s.sellerId()} == ${item.sellerId()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>답례품명</td>
                <td><input type="text" name="itemName" th:value="${item.itemName()}" required form="itemForm" style="width:400px;"></td>
            </tr>
            <tr>
                <td class="label">요약설명</td>
                <td><input type="text" name="itemSummary" th:value="${item.itemSummary()}" style="width:400px;" form="itemForm"></td>
            </tr>
            <tr>
                <td class="label">상세설명</td>
                <td><textarea name="detailContent" rows="8" style="width:500px;" th:text="${item.detailContent()}" form="itemForm"></textarea></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>카테고리</td>
                <td>
                    <select name="categoryCode" required form="itemForm">
                        <option value="">선택하세요</option>
                        <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.label()}"
                                th:selected="${c.id()} == ${item.categoryCode()}"></option>
                    </select>
                </td>
            </tr>
            <tr th:if="${item.itemId()} == null">
                <td class="label">지자체코드</td>
                <td>
                    <select name="locgovCode" form="itemForm">
                        <option value="">선택 안 함</option>
                        <option th:each="l : ${locgovs}" th:value="${l.locgovCode()}" th:text="${l.locgovNm()} + ' (' + ${l.locgovCode()} + ')'"
                                th:selected="${l.locgovCode()} == ${item.locgovCode()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">브랜드</td>
                <td>
                    <select name="brandId" form="itemForm">
                        <option value="">선택 안 함(자사제품)</option>
                        <option th:each="b : ${brands}" th:value="${b.brandId()}" th:text="${b.brandName()}"
                                th:selected="${b.brandId()} == ${item.brandId()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>판매가격</td>
                <td><input type="number" name="salePrice" th:value="${item.salePrice()}" min="1" required form="itemForm" style="width:150px;"> 원</td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>재고수량</td>
                <td><input type="number" name="stockQuantity" th:value="${item.stockQuantity()}" min="0" required form="itemForm" style="width:150px;"></td>
            </tr>
            <tr>
                <td class="label">최소 기부금액</td>
                <td><input type="number" name="minDonationAmount" th:value="${item.minDonationAmount()}" min="0" form="itemForm" style="width:150px;"> 원</td>
            </tr>
            <tr>
                <td class="label">노출유형</td>
                <td>
                    <select name="displayType" form="itemForm">
                        <option value="ALWAYS" th:selected="${item.displayType()} == null or ${item.displayType()} == 'ALWAYS'">상시노출</option>
                        <option value="LIMITED" th:selected="${item.displayType()} == 'LIMITED'">한시노출</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">노출 시작일</td>
                <td><input type="date" name="displayStartDate" th:value="${item.displayStartDate()}" form="itemForm"></td>
            </tr>
            <tr>
                <td class="label">노출 종료일</td>
                <td><input type="date" name="displayEndDate" th:value="${item.displayEndDate()}" form="itemForm"></td>
            </tr>
            <tr th:if="${item.itemId()} == null">
                <td class="label">이미지</td>
                <td><input type="file" name="images" multiple accept="image/*" form="itemForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="itemForm"
          th:action="${item.itemId()} != null ? @{/admin/gift-items/{id}(id=${item.itemId()})} : @{/admin/gift-items}"
          method="post" enctype="multipart/form-data"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="itemForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
