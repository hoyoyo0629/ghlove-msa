<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>운영유지관리 SR 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/maintenance}">운영유지관리 게시판</a></div>
    <h3><span th:text="${row.bbsId} != null ? 'SR 상세/수정' : 'SR 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="SR 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" name="bbsTtl" th:value="${row.bbsTtl}" required form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">접수일(yyyyMMdd)</td>
                <td><input type="text" name="reqCrtDate" th:value="${row.reqCrtDate}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">KI구분</td>
                <td>
                    <select name="kiType" form="rowForm">
                        <option value="">선택</option>
                        <option value="1" th:selected="${row.kiType == '1'}">홈페이지</option>
                        <option value="2" th:selected="${row.kiType == '2'}">관리자시스템</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">요청경로</td>
                <td>
                    <select name="reqChannel" form="rowForm">
                        <option value="">선택</option>
                        <option th:each="c : ${ {'소통방','회의','이메일','SR게시판','내부메신저','SNS','전화','KLID','사업장','기타'} }"
                                th:value="${c}" th:text="${c}" th:selected="${row.reqChannel == c}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">업무구분</td>
                <td>
                    <select name="processType" form="rowForm">
                        <option value="">선택</option>
                        <option th:each="c : ${ {'기부','답례품','기타'} }"
                                th:value="${c}" th:text="${c}" th:selected="${row.processType == c}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">요청유형</td>
                <td><input type="text" name="reqType" th:value="${row.reqType}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">요청자 연락처</td>
                <td><input type="text" name="reqUserPhoneNumber" th:value="${row.reqUserPhoneNumber}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">요청자 정보</td>
                <td><input type="text" name="reqUserInfo" th:value="${row.reqUserInfo}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">요청출처</td>
                <td><input type="text" name="reqSource" th:value="${row.reqSource}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">긴급여부</td>
                <td><input type="checkbox" name="urgentYn" th:checked="${row.urgentYn == 'Y'}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">요청 내용</td>
                <td><textarea name="bbsCn" rows="8" th:text="${row.bbsCn}" form="rowForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">완료구분</td>
                <td>
                    <select name="processState" form="rowForm">
                        <option value="">선택</option>
                        <option value="접수" th:selected="${row.processState == '접수'}">접수</option>
                        <option value="처리중" th:selected="${row.processState == '처리중'}">처리중</option>
                        <option value="처리완료" th:selected="${row.processState == '처리완료'}">처리완료</option>
                        <option value="제외" th:selected="${row.processState == '제외'}">제외</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">담당자명</td>
                <td><input type="text" name="processManagerNm" th:value="${row.processManagerNm}" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">접수일(처리)</td>
                <td><input type="text" name="processReceiptDate" th:value="${row.processReceiptDate}" placeholder="yyyyMMdd" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">목표완료일</td>
                <td><input type="text" name="processTargetEndDate" th:value="${row.processTargetEndDate}" placeholder="yyyyMMdd" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">처리시작일</td>
                <td><input type="text" name="processStartDate" th:value="${row.processStartDate}" placeholder="yyyyMMdd" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">처리완료일</td>
                <td><input type="text" name="processEndDate" th:value="${row.processEndDate}" placeholder="yyyyMMdd" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">배포일</td>
                <td><input type="text" name="deployDate" th:value="${row.deployDate}" placeholder="yyyyMMdd" form="rowForm"></td>
            </tr>
            <tr>
                <td class="label">처리내용</td>
                <td><textarea name="processCn" rows="6" th:text="${row.processCn}" form="rowForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">비고</td>
                <td><textarea name="rm" rows="3" th:text="${row.rm}" form="rowForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">첨부파일 추가</td>
                <td><input type="file" name="file" form="rowForm"></td>
            </tr>
            <tr th:if="${row.bbsId} != null">
                <td class="label">기존 첨부파일</td>
                <td>
                    <ul>
                        <li th:each="f : ${files}">
                            <a th:href="@{'/admin/maintenance/files/' + ${f.fileId} + '/download'}" th:text="${f.orgnlAtchFileNm}"></a>
                            <form th:action="@{'/admin/maintenance/' + ${row.bbsId} + '/files/' + ${f.fileId} + '/delete'}"
                                  method="post" class="inline-form" onsubmit="return confirm('첨부파일을 삭제하시겠습니까?')">
                                <button type="submit" class="small-btn danger">삭제</button>
                            </form>
                        </li>
                    </ul>
                    <p th:if="${#lists.isEmpty(files)}">첨부파일 없음</p>
                </td>
            </tr>
            <tr th:if="${row.bbsId} != null">
                <td class="label">조회수</td>
                <td th:text="${row.inqCnt}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="rowForm" enctype="multipart/form-data"
          th:action="${row.bbsId} != null ? @{'/admin/maintenance/' + ${row.bbsId}} : @{/admin/maintenance}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="rowForm" class="btn btn-dark-gray btn-small">저장</button>
        <form th:if="${row.bbsId} != null" th:action="@{'/admin/maintenance/' + ${row.bbsId} + '/delete'}"
              method="post" class="inline-form" onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
            <button type="submit" class="btn btn-small">삭제</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
