<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사이트 설정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner" th:object="${config}">
    <h3><span>사이트 설정</span></h3>
    <p class="success" th:if="${param.message}" th:text="${param.message}"></p>

    <h4>기본 정보</h4>
    <div class="board_write">
        <table class="board_write_table" summary="기본 정보">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">상점명</td><td><input type="text" id="shopName" th:field="*{shopName}" form="siteConfigForm"></td></tr>
            <tr><td class="label">회사명</td><td><input type="text" id="companyName" th:field="*{companyName}" form="siteConfigForm"></td></tr>
            <tr><td class="label">대표자명</td><td><input type="text" id="bossName" th:field="*{bossName}" form="siteConfigForm"></td></tr>
            <tr><td class="label">사업자등록번호</td><td><input type="text" id="companyNumber" th:field="*{companyNumber}" form="siteConfigForm"></td></tr>
            <tr><td class="label">전화번호</td><td><input type="text" id="telNumber" th:field="*{telNumber}" form="siteConfigForm"></td></tr>
            <tr><td class="label">주소</td><td><input type="text" id="address" th:field="*{address}" form="siteConfigForm"></td></tr>
            <tr><td class="label">상세주소</td><td><input type="text" id="addressDetail" th:field="*{addressDetail}" form="siteConfigForm"></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">관리자 연락처</h4>
    <div class="board_write">
        <table class="board_write_table" summary="관리자 연락처">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">개인정보관리자명</td><td><input type="text" id="adminName" th:field="*{adminName}" form="siteConfigForm"></td></tr>
            <tr><td class="label">관리자 이메일</td><td><input type="text" id="adminEmail" th:field="*{adminEmail}" form="siteConfigForm"></td></tr>
            <tr><td class="label">관리자 전화</td><td><input type="text" id="adminTelNumber" th:field="*{adminTelNumber}" form="siteConfigForm"></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">SEO</h4>
    <div class="board_write">
        <table class="board_write_table" summary="SEO">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">사이트 타이틀</td><td><input type="text" id="seoTitle" th:field="*{seoTitle}" form="siteConfigForm"></td></tr>
            <tr><td class="label">메타 키워드</td><td><input type="text" id="seoKeywords" th:field="*{seoKeywords}" form="siteConfigForm"></td></tr>
            <tr><td class="label">메타 설명</td><td><input type="text" id="seoDescription" th:field="*{seoDescription}" form="siteConfigForm"></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">가입/게시 제한</h4>
    <div class="board_write">
        <table class="board_write_table" summary="가입/게시 제한">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">가입 불가 아이디</td><td><textarea id="deniedId" th:field="*{deniedId}" rows="2" form="siteConfigForm"></textarea> <span style="font-size:12px;color:#666;">콤마로 구분</span></td></tr>
            <tr><td class="label">금지어</td><td><textarea id="banWord" th:field="*{banWord}" rows="2" form="siteConfigForm"></textarea> <span style="font-size:12px;color:#666;">콤마로 구분</span></td></tr>
            </tbody>
        </table>
    </div>

    <form id="siteConfigForm" th:action="@{/site-config}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="siteConfigForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
