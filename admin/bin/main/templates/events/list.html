<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부하기 &gt; 지역 이벤트 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/event.css}">
    <link rel="stylesheet" th:href="@{/css/evt_card.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS featured/eventList.html 재현(event.css/evt_card.css 실클래스). 시도/시군구
     캐스케이드는 /events/cities JSON을 fetch해 시군구 옵션을 다시 채운다. -->
<section class="loc_evt page-title-box">
    <div class="page-title-box" style="margin-bottom:0">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            기부하기
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            지역 이벤트
        </span>
        <h2 class="page-title-txt" style="padding-top:15px">지역 이벤트</h2>
    </div>

    <div class="center" style="padding-top:15px">
        <p>지자체별 이벤트진행 현황을 확인하실 수 있습니다.</p>
        <form id="filterForm" th:action="@{/events}" method="get">
            <input type="hidden" name="ing" th:value="${ing}">
            <div class="loc_select_area">
                <label for="upperLocgovCode" class="sr-only">시·도 선택</label>
                <select title="시·도 선택" name="upperLocgovCode" id="upperLocgovCode" onchange="onProvinceChange()">
                    <option value="">시·도 선택</option>
                    <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"
                            th:selected="${p.key == upperLocgovCode}"></option>
                </select>
                <label for="locgovCode" class="sr-only">시·군·구 선택</label>
                <select title="시·군·구 선택" name="locgovCode" id="locgovCode">
                    <option value="">시·군·구 선택</option>
                    <option th:each="c : ${cities}" th:value="${c.key}" th:text="${c.value}"
                            th:selected="${c.key == locgovCode}"></option>
                </select>
                <div class="submit_btns">
                    <button type="submit" class="formBtn" id="eventSearchBtn">검색</button>
                    <button type="button" class="formBtn reset_img" onclick="location.href='/events?ing=' + document.getElementById('ing-cond').value">
                        <img th:src="@{/images/icon/loc_reset.png}" alt="초기화" class="icon-img">
                    </button>
                </div>
            </div>
        </form>
        <input type="hidden" id="ing-cond" th:value="${ing}">

        <div class="btn-box many mid" style="margin:40px 0 0 0">
            <button type="button" th:classappend="${ing == 'Y'} ? 'u-confirm' : 'cancellation'" class="blueBtn"
                    onclick="location.href=this.dataset.url" th:attr="data-url=@{/events(ing='Y',upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode})}">
                진행중인 이벤트<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                <span th:if="${ing == 'Y'}" class="sr-only">선택됨</span>
            </button>
            <button type="button" th:classappend="${ing == 'N'} ? 'u-confirm' : 'cancellation'" class="blueBtn"
                    onclick="location.href=this.dataset.url" th:attr="data-url=@{/events(ing='N',upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode})}">
                종료된 이벤트<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                <span th:if="${ing == 'N'}" class="sr-only">선택됨</span>
            </button>
        </div>
    </div>
</section>

<section class="contents new_contents">
    <h3 class="sr-only" th:text="${ing == 'Y'} ? '진행중인 이벤트' : '종료된 이벤트'"></h3>
    <div class="container">
        <div class="section all_evt">
            <div class="main_con_top" th:if="${not #lists.isEmpty(events)}">
                <div class="amount_goods" th:text="'전체 ' + ${totalCount} + '건'"></div>
            </div>

            <ul class="goods-evt-group" th:if="${not #lists.isEmpty(events)}">
                <li class="evt-list-items" th:each="e : ${events}">
                    <div class="list_inner">
                        <span class="img_frame">
                            <a th:href="@{/events/{id}(id=${e.eventId})}" class="img_cover_link" th:title="${e.title} + ' 이벤트 상세정보 페이지 이동'">
                                <img class="item_img" th:src="@{'/images/events/' + ${e.listImage}}" th:if="${e.listImage != null and e.listImage != ''}" alt="">
                                <img th:src="@{/images/new/ico_end.svg}" alt="종료된 이벤트" th:if="${ing == 'N'}">
                            </a>
                        </span>
                        <span class="cardTxt card_evt-du" th:text="${displayDates.get(e.eventId)}"></span>
                        <a th:href="@{/events/{id}(id=${e.eventId})}"><span class="cardTxt card_title" th:text="${e.title}"></span></a>
                        <span class="cardTxt pointGray" th:text="${e.hostName}"></span>
                        <span class="cardTxt pointGray" th:if="${e.phone != null and e.phone != ''}" th:text="${e.phone}"></span>
                    </div>
                </li>
            </ul>
            <div class="list-none" th:if="${#lists.isEmpty(events)}">
                <img th:src="@{/images/icon/cli-icon_no-location.png}" alt="이벤트가 없습니다">
            </div>

            <div class="card-pagination" th:if="${totalPages > 1}">
                <div class="pagination_ali">
                    <ul class="pagination-frame">
                        <li><a class="fist arrow_btn" th:href="@{/events(ing=${ing},upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},size=${size},page=1)}"><img th:src="@{/images/icon/paging_btn-first.png}" alt="처음"></a></li>
                        <li><a class="prev arrow_btn" th:href="@{/events(ing=${ing},upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},size=${size},page=${currentPage > 1 ? currentPage - 1 : 1})}"><img th:src="@{/images/icon/paging_btn-prev.png}" alt="이전"></a></li>
                        <li th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == currentPage} ? 'selected-page'">
                            <a class="page-text" th:href="@{/events(ing=${ing},upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},size=${size},page=${p})}" th:text="${p}"></a>
                        </li>
                        <li><a class="next arrow_btn" th:href="@{/events(ing=${ing},upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},size=${size},page=${currentPage < totalPages ? currentPage + 1 : totalPages})}"><img th:src="@{/images/icon/paging_btn-next.png}" alt="다음"></a></li>
                        <li><a class="last arrow_btn" th:href="@{/events(ing=${ing},upperLocgovCode=${upperLocgovCode},locgovCode=${locgovCode},size=${size},page=${totalPages})}"><img th:src="@{/images/icon/paging_btn-last.png}" alt="마지막"></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>

<script th:inline="none">
function onProvinceChange() {
    var code = document.getElementById('upperLocgovCode').value;
    var citySelect = document.getElementById('locgovCode');
    citySelect.innerHTML = '<option value="">시·군·구 선택</option>';
    if (!code) { return; }
    fetch('/events/cities?upperLocgovCode=' + encodeURIComponent(code))
        .then(function(res) { return res.json(); })
        .then(function(cities) {
            Object.keys(cities).forEach(function(key) {
                var opt = document.createElement('option');
                opt.value = key;
                opt.textContent = cities[key];
                citySelect.appendChild(opt);
            });
        });
}
</script>
</body>
</html>
