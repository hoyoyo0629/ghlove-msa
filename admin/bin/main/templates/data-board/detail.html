<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.subject} + ' - 자료실 - 고향사랑e음 (admin service)'">자료실 보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/data_v.css}">
    <link rel="stylesheet" th:href="@{/css/ct_nov.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS data-board/detail.html 재현. 첨부파일은 서버 스트리밍 다운로드
     (Content-Disposition: attachment)로 구현해 AS-IS의 blob 다운로드와 동일하게 동작한다. -->
<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            고객센터
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/data-board}">자료실</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            자료실 보기
        </span>
        <h2 class="page-title-txt">자료실 보기</h2>
    </div>
</section>

<div th:replace="~{fragments/customer-lnb :: customer-lnb('data-board')}"></div>

<div class="contents-wrap" id="contents">
    <div class="center">
        <div class="s-contents list-page-wrapper">
            <div class="list-page-area">
                <div class="list-page-body">
                    <div class="page-title" th:text="${board.subject}"></div>
                    <div class="page-info">
                        <div class="page-info-list">
                            <div class="writer">관리자</div>
                            <div class="date-created" th:text="${displayDate}"></div>
                            <div class="views" th:text="'조회 ' + ${board.hits}"></div>
                        </div>
                    </div>
                    <div class="page-contents" th:utext="${board.content}"></div>
                    <div class="page-file-list" th:if="${not #lists.isEmpty(files)}">
                        <div class="file-list-label">
                            <img th:src="@{/images/icon/cli-icon_file-list.png}" alt="첨부자료"> 첨부자료
                        </div>
                        <div class="file-list-title">
                            <span th:each="f : ${files}">
                                <a th:href="@{/data-board/file-download/{id}(id=${f.dataFileId})}" class="downloadFn" th:text="${f.orgFileName}"></a><br>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="btn-box">
                <button type="button" class="blueBtn u-confirm" onclick="location.href=this.dataset.url" th:attr="data-url=@{/data-board}">
                    목록<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
