<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접속IP 등록 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/access}">접속IP허용목록</a></div>
    <h3><span>접속IP 등록</span></h3>

    <p class="error" th:if="${param.errorMessage}" th:text="${param.errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="접속IP 등록">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">접근 타입</td>
                <td>
                    <label><input type="radio" name="accessType" value="1" checked form="accessForm"> 관리자</label>
                    <label><input type="radio" name="accessType" value="2" form="accessForm"> 판매관리자</label>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>IP 주소</td>
                <td><input type="text" id="remoteAddr" name="remoteAddr" required placeholder="예: 192.168.0.1" form="accessForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="accessForm" th:action="@{/access}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="accessForm" class="btn btn-dark-gray btn-small">등록</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
