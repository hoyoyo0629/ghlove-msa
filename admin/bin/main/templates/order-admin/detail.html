<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문상세 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3><span>주문상세</span></h3>
    <p><a th:href="@{/admin/orders}">&larr; 목록으로</a></p>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <table class="board_write_table" summary="주문 상세정보">
        <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
        <tbody>
        <tr>
            <td class="label">주문번호</td>
            <td th:text="${order.orderId()}"></td>
            <td class="label">주문상태</td>
            <td th:text="${order.orderStatus() == 'PENDING'} ? '처리중' : (${order.orderStatus() == 'CONFIRMED'} ? '주문확정' : (${order.orderStatus() == 'CLAIM_REQUESTED'} ? '반품/교환신청중' : '취소'))"></td>
        </tr>
        <tr>
            <td class="label">주문자ID</td>
            <td th:text="${order.userId()}"></td>
            <td class="label">지자체코드</td>
            <td th:text="${order.locgovCode()}"></td>
        </tr>
        <tr>
            <td class="label">답례품명</td>
            <td th:text="${order.itemName()}"></td>
            <td class="label">판매자ID</td>
            <td th:text="${order.sellerId()}"></td>
        </tr>
        <tr>
            <td class="label">수량</td>
            <td th:text="${order.quantity()}"></td>
            <td class="label">단가</td>
            <td th:text="${#numbers.formatInteger(order.unitPrice(), 0, 'COMMA')} + '원'"></td>
        </tr>
        <tr>
            <td class="label">결제포인트</td>
            <td th:text="${#numbers.formatInteger(order.pointAmount(), 0, 'COMMA')} + 'P'"></td>
            <td class="label">취소사유</td>
            <td th:text="${order.cancelReason() ?: '-'}"></td>
        </tr>
        <tr>
            <td class="label">수취인</td>
            <td th:text="${order.receiverName() ?: '-'}"></td>
            <td class="label">연락처</td>
            <td th:text="${order.receiverPhone() ?: '-'}"></td>
        </tr>
        <tr>
            <td class="label">배송지</td>
            <td colspan="3" th:text="${(order.deliveryAddress() ?: '') + ' ' + (order.deliveryAddressDetail() ?: '')}"></td>
        </tr>
        <tr>
            <td class="label">요청사항</td>
            <td colspan="3" th:text="${order.requestNote() ?: '-'}"></td>
        </tr>
        <tr>
            <td class="label">주문일시</td>
            <td th:text="${order.createdDate() != null ? #strings.substring(order.createdDate(), 0, 19) : '-'}"></td>
            <td class="label">수정일시</td>
            <td th:text="${order.updatedDate() != null ? #strings.substring(order.updatedDate(), 0, 19) : '-'}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 배송관리: 확정된 주문이고 아직 송장이 없으면 송장등록(=발송처리), 있으면
         배송중/배송완료로 상태 전진만 허용한다(OrderService.registerInvoice/updateDeliveryStatus
         상태머신 그대로 재사용). -->
    <div class="board_write" style="margin-top:24px;">
        <h4>배송관리</h4>
        <p>현재 배송상태:
            <strong th:text="${order.deliveryStatus() == null} ? '미발송' : (${order.deliveryStatus() == 'SHIPPED'} ? '발송완료' : (${order.deliveryStatus() == 'IN_TRANSIT'} ? '배송중' : (${order.deliveryStatus() == 'DELIVERED'} ? '배송완료' : '구매확정')))"></strong>
            <span th:if="${order.carrierCode() != null}" th:text="'(' + ${order.carrierCode()} + ' ' + ${order.invoiceNo()} + ')'"></span>
        </p>

        <form th:if="${order.orderStatus() == 'CONFIRMED' and order.deliveryStatus() == null}"
              th:action="@{'/admin/orders/' + ${order.orderId()} + '/invoice'}" method="post" class="flex_box gap-08">
            <select name="carrierCode">
                <option value="CJ">CJ대한통운</option>
                <option value="POST">우체국택배</option>
                <option value="HANJIN">한진택배</option>
                <option value="LOTTE">롯데택배</option>
            </select>
            <input type="text" name="invoiceNo" placeholder="송장번호" required>
            <button type="submit" class="small-btn">송장등록(발송처리)</button>
        </form>

        <form th:if="${order.deliveryStatus() == 'SHIPPED' or order.deliveryStatus() == 'IN_TRANSIT'}"
              th:action="@{'/admin/orders/' + ${order.orderId()} + '/delivery-status'}" method="post" class="flex_box gap-08">
            <select name="deliveryStatus">
                <option value="IN_TRANSIT" th:selected="${order.deliveryStatus() == 'SHIPPED'}">배송중</option>
                <option value="DELIVERED">배송완료</option>
            </select>
            <button type="submit" class="small-btn">배송상태 변경</button>
        </form>
    </div>

    <!-- 관리자 메모 - 고객에게 노출되지 않는 내부 처리 메모 (OD_ORDER.ADMIN_MEMO). -->
    <div class="board_write" style="margin-top:24px;">
        <h4>관리자 메모</h4>
        <form th:action="@{'/admin/orders/' + ${order.orderId()} + '/memo'}" method="post">
            <textarea name="memo" rows="4" style="width:100%;" th:text="${order.adminMemo()}"></textarea>
            <div class="btn_all btn_right" style="margin-top:8px;">
                <button type="submit" class="btn btn-dark-gray btn-small">메모 저장</button>
            </div>
        </form>
    </div>

    <!-- 클레임(반품/교환) 이력 - 처리는 클레임 처리 큐(/admin/claims)에서. -->
    <div class="board_write" style="margin-top:24px;">
        <h4>반품/교환 이력</h4>
        <table class="board_list_table">
            <thead><tr><th>클레임ID</th><th>구분</th><th>사유</th><th>상태</th><th>신청일시</th><th>처리일시</th></tr></thead>
            <tbody>
            <tr th:each="c : ${claims}">
                <td th:text="${c.claimId()}"></td>
                <td th:text="${c.claimType() == 'RETURN'} ? '반품' : '교환'"></td>
                <td class="tleft" th:text="${c.reason() ?: '-'}"></td>
                <td th:text="${c.status() == 'REQUESTED'} ? '접수' : (${c.status() == 'APPROVED'} ? '승인' : (${c.status() == 'REJECTED'} ? '거절' : '처리완료'))"></td>
                <td th:text="${c.createdDate() != null ? #strings.substring(c.createdDate(), 0, 16) : '-'}"></td>
                <td th:text="${c.processedDate() != null ? #strings.substring(c.processedDate(), 0, 16) : '-'}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(claims)}">반품/교환 이력이 없습니다.</p>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
