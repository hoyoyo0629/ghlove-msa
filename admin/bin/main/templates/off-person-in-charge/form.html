<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프라인담당자 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/off-person-in-charge}">오프라인담당자 관리</a></div>
    <h3><span th:text="${manager.userId} != null ? '오프라인담당자 수정' : '오프라인담당자 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="오프라인담당자 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>아이디</td>
                <td>
                    <input type="text" name="loginId" id="loginId" th:value="${manager.loginId}" required form="mgrForm"
                           th:readonly="${manager.userId} != null" autocomplete="off">
                    <button type="button" class="small-btn" th:unless="${manager.userId} != null" onclick="checkLoginId()">중복확인</button>
                    <span id="loginIdCheckResult"></span>
                </td>
            </tr>
            <tr>
                <td class="label">이름</td>
                <td><input type="text" name="userName" th:value="${manager.userName}" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label">이메일</td>
                <td><input type="email" name="email" th:value="${manager.email}" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>권한</td>
                <td>
                    <select name="authority" required form="mgrForm">
                        <option value="ROLE_ADMIN_7" th:selected="${manager.authority == 'ROLE_ADMIN_7'}">오프라인주담당자</option>
                        <option value="ROLE_ADMIN_8" th:selected="${manager.authority == 'ROLE_ADMIN_8'}">오프라인부담당자</option>
                    </select>
                    <p class="hint" style="color:#888;margin-top:4px;">오프라인 주담당자는 지자체당 최대 2명까지 지정할 수 있습니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>소속 지자체</td>
                <td>
                    <select id="upperLocgovCode" onchange="filterLocgov()">
                        <option value="">시·도</option>
                        <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                    </select>
                    <select name="locgovCode" id="locgovCode" required form="mgrForm">
                        <option value="">시·군·구</option>
                        <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                th:attr="data-upper=${l.upperLocgovCode}" th:selected="${l.locgovCode == manager.locgovCode}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">사번</td>
                <td><input type="text" name="empId" th:value="${manager.empId}" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label">직위</td>
                <td><input type="text" name="psitnNm" th:value="${manager.psitnNm}" placeholder="예: 팀장" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label">소속부서</td>
                <td><input type="text" name="psitnDeptNm" th:value="${manager.psitnDeptNm}" placeholder="예: 재정담당관" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label">직책</td>
                <td><input type="text" name="ofcpsNm" th:value="${manager.ofcpsNm}" placeholder="예: 주무관" form="mgrForm"></td>
            </tr>
            <tr>
                <td class="label">정산계좌코드</td>
                <td><input type="text" name="bankCode" th:value="${manager.bankCode}" form="mgrForm"></td>
            </tr>
            <tr th:if="${manager.userId} != null">
                <td class="label">상태</td>
                <td>
                    <select name="statusCode" form="mgrForm">
                        <option value="ACTIVE" th:selected="${manager.statusCode == 'ACTIVE'}">정상</option>
                        <option value="LOCKED" th:selected="${manager.statusCode == 'LOCKED'}">잠금</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="mgrForm"
          th:action="${manager.userId} != null ? @{'/admin/off-person-in-charge/' + ${manager.userId}} : @{/admin/off-person-in-charge}"
          method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="mgrForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
function checkLoginId() {
    var loginId = document.getElementById('loginId').value;
    var result = document.getElementById('loginIdCheckResult');
    if (!loginId) { result.textContent = '아이디를 입력해 주세요.'; return; }
    fetch('/admin/off-person-in-charge/check-login-id?loginId=' + encodeURIComponent(loginId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
            result.textContent = data.available ? '사용 가능한 아이디입니다.' : '이미 사용 중인 아이디입니다.';
            result.style.color = data.available ? '#1a73e8' : '#c0392b';
        });
}
(function init() {
    var locgovSelect = document.getElementById('locgovCode');
    var selected = locgovSelect.options[locgovSelect.selectedIndex];
    if (selected && selected.dataset.upper) {
        document.getElementById('upperLocgovCode').value = selected.dataset.upper;
    }
    filterLocgov();
})();
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
