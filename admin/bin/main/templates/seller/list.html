<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>입점업체관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>입점업체관리</h3>
    <p style="color:#666; margin-bottom:16px;">답례품을 제공하는 업체(마을기업 등)를 등록/승인/관리합니다.</p>
    <p><a class="btn" th:href="@{/seller/new}">+ 업체 등록</a></p>

    <table class="board_list_table">
        <thead>
        <tr><th>ID</th><th>업체명</th><th>상호</th><th>담당자</th><th>연락처</th><th>승인상태</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sellers}">
            <td th:text="${s.sellerId()}"></td>
            <td><a th:href="@{'/seller/' + ${s.sellerId()} + '/edit'}" th:text="${s.sellerName()}"></a></td>
            <td th:text="${s.companyName()}"></td>
            <td th:text="${s.userName()}"></td>
            <td th:text="${s.phoneNumber()}"></td>
            <td>
                <span class="pill" th:classappend="${s.statusCode() == '1'} ? 'on' : 'off'"
                      th:text="${s.statusCode() == '1' ? '승인' : (s.statusCode() == '2' ? '반려' : (s.statusCode() == '3' ? '중지' : '승인대기'))}"></span>
            </td>
            <td>
                <a class="small-btn" th:href="@{'/seller/' + ${s.sellerId()} + '/edit'}">수정</a>
                <form th:if="${s.statusCode() != '1'}" th:action="@{'/seller/' + ${s.sellerId()} + '/status'}" method="post" class="inline-form">
                    <input type="hidden" name="statusCode" value="1">
                    <button type="submit" class="small-btn">승인</button>
                </form>
                <form th:if="${s.statusCode() == '1'}" th:action="@{'/seller/' + ${s.sellerId()} + '/status'}" method="post" class="inline-form"
                      onsubmit="return confirm('중지하시겠습니까?')">
                    <input type="hidden" name="statusCode" value="3">
                    <button type="submit" class="small-btn ghost">중지</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(sellers)}">등록된 업체가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
