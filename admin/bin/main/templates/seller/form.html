<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>입점업체 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/seller}">입점업체관리</a></div>
    <h3><span th:text="${seller.sellerId()} != null ? '입점업체 수정' : '입점업체 등록'"></span></h3>

    <h4>업체 정보</h4>
    <div class="board_write">
        <table class="board_write_table" summary="업체 정보">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label"><span class="required_mark">*</span>업체명</td><td><input type="text" id="sellerName" name="sellerName" th:value="${seller.sellerName()}" required form="sellerForm"></td></tr>
            <tr><td class="label">상호</td><td><input type="text" id="companyName" name="companyName" th:value="${seller.companyName()}" form="sellerForm"></td></tr>
            <tr><td class="label">대표자명</td><td><input type="text" id="representativeName" name="representativeName" th:value="${seller.representativeName()}" form="sellerForm"></td></tr>
            <tr><td class="label">사업자번호</td><td><input type="text" id="businessNumber" name="businessNumber" th:value="${seller.businessNumber()}" form="sellerForm"></td></tr>
            <tr><td class="label">사업장소재지</td><td><input type="text" id="businessLocation" name="businessLocation" th:value="${seller.businessLocation()}" form="sellerForm"></td></tr>
            <tr><td class="label">마을기업</td><td><input type="checkbox" name="communityBusinessYn" value="Y" th:checked="${seller.communityBusinessYn() == 'Y'}" form="sellerForm"></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">담당자 정보</h4>
    <div class="board_write">
        <table class="board_write_table" summary="담당자 정보">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">담당자명</td><td><input type="text" id="userName" name="userName" th:value="${seller.userName()}" form="sellerForm"></td></tr>
            <tr><td class="label">전화번호</td><td><input type="text" id="telephoneNumber" name="telephoneNumber" th:value="${seller.telephoneNumber()}" form="sellerForm"></td></tr>
            <tr><td class="label">휴대폰번호</td><td><input type="text" id="phoneNumber" name="phoneNumber" th:value="${seller.phoneNumber()}" form="sellerForm"></td></tr>
            <tr><td class="label">이메일</td><td><input type="text" id="email" name="email" th:value="${seller.email()}" form="sellerForm"></td></tr>
            <tr><td class="label">주소</td><td><input type="text" id="address" name="address" th:value="${seller.address()}" form="sellerForm"></td></tr>
            <tr><td class="label">상세주소</td><td><input type="text" id="addressDetail" name="addressDetail" th:value="${seller.addressDetail()}" form="sellerForm"></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">계정/정산 정보</h4>
    <div class="board_write">
        <table class="board_write_table" summary="계정/정산 정보">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">로그인 아이디</td><td><input type="text" id="loginId" name="loginId" th:value="${seller.loginId()}" form="sellerForm"></td></tr>
            <tr><td class="label">입금은행</td><td><input type="text" id="bankName" name="bankName" th:value="${seller.bankName()}" form="sellerForm"></td></tr>
            <tr><td class="label">예금주</td><td><input type="text" id="bankInName" name="bankInName" th:value="${seller.bankInName()}" form="sellerForm"></td></tr>
            <tr><td class="label">계좌번호</td><td><input type="text" id="bankAccountNumber" name="bankAccountNumber" th:value="${seller.bankAccountNumber()}" form="sellerForm"></td></tr>
            <tr>
                <td class="label">정산주기</td>
                <td>
                    <select id="remittanceType" name="remittanceType" form="sellerForm">
                        <option value="1" th:selected="${seller.remittanceType() == '1'}">일정산</option>
                        <option value="2" th:selected="${seller.remittanceType() == '2'}">주정산</option>
                        <option value="3" th:selected="${seller.remittanceType() == '3'}">15일정산</option>
                        <option value="4" th:selected="${seller.remittanceType() == '4'}">월정산</option>
                    </select>
                </td>
            </tr>
            <tr><td class="label">수수료율(%)</td><td><input type="number" step="0.1" id="commissionRate" name="commissionRate" th:value="${seller.commissionRate()}" form="sellerForm"></td></tr>
            </tbody>
        </table>
    </div>
    <form id="sellerForm" th:action="${seller.sellerId()} != null ? @{'/seller/' + ${seller.sellerId()}} : @{/seller}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="sellerForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
