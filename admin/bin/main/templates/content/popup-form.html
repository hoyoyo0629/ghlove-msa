<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팝업 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/popups}">팝업 관리</a></div>
    <h3><span th:text="${popup} != null ? '팝업 수정' : '팝업 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="팝업 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">유형</td>
                <td>
                    <select id="popupType" name="popupType" form="popupForm">
                        <option th:each="t : ${types}" th:value="${t.key}" th:text="${t.value}"
                                th:selected="${popup} != null and ${popup.popupType} == ${t.key}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">스타일</td>
                <td>
                    <select id="popupStyle" name="popupStyle" form="popupForm">
                        <option value="1" th:selected="${popup} == null or ${popup.popupStyle} == '1'">텍스트</option>
                        <option value="2" th:selected="${popup} != null and ${popup.popupStyle} == '2'">텍스트(테두리없음)</option>
                        <option value="3" th:selected="${popup} != null and ${popup.popupStyle} == '3'">이미지</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="subject" name="subject" th:value="${popup} != null ? ${popup.subject} : ''" required form="popupForm"></td>
            </tr>
            <tr>
                <td class="label">내용</td>
                <td><textarea id="content" name="content" rows="3" th:text="${popup} != null ? ${popup.content} : ''" form="popupForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">시작일</td>
                <td><input type="text" id="startDate" name="startDate" placeholder="20260101" th:value="${popup} != null ? ${popup.startDate} : ''" form="popupForm"></td>
            </tr>
            <tr>
                <td class="label">종료일</td>
                <td><input type="text" id="endDate" name="endDate" placeholder="20261231" th:value="${popup} != null ? ${popup.endDate} : ''" form="popupForm"></td>
            </tr>
            <tr>
                <td class="label">닫기버튼(오늘 하루 보지않기) 노출</td>
                <td><input type="checkbox" name="popupClose" th:checked="${popup} == null or ${popup.popupClose} == 'Y'" form="popupForm"></td>
            </tr>
            <tr>
                <td class="label">이미지(스타일=이미지일 때)</td>
                <td>
                    <input type="file" name="image" form="popupForm">
                    <div th:if="${popup} != null and ${popup.popupImage} != null">
                        <img th:src="${popup.popupImage}" style="max-width:200px; margin-top:8px;" alt="현재 팝업 이미지">
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="popupForm" enctype="multipart/form-data"
          th:action="${popup} != null ? @{'/popups/' + ${popup.popupId}} : @{/popups}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="popupForm" class="btn btn-dark-gray btn-small">저장</button>
            <a th:href="@{/popups}" class="btn btn-dark-default btn-small">목록으로</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
