<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배너 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>배너 관리</h3>
    <p><a class="btn" th:href="@{/banners/new}">+ 배너 등록</a></p>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>ID</th>
            <th>이미지</th>
            <th>제목</th>
            <th>링크</th>
            <th>순서</th>
            <th>상태</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${banners}">
            <td th:text="${b.bannerId}"></td>
            <td><img th:if="${b.imageUrl}" th:src="${b.imageUrl}" alt="" style="height:32px;"></td>
            <td th:text="${b.title}"></td>
            <td th:text="${b.linkUrl}"></td>
            <td th:text="${b.displayOrder}"></td>
            <td>
                <span class="pill" th:classappend="${b.displayFlag == 'Y'} ? 'on' : 'off'"
                      th:text="${b.displayFlag == 'Y'} ? '노출중' : '중지'"></span>
            </td>
            <td>
                <a th:href="@{'/banners/' + ${b.bannerId} + '/edit'}" class="small-btn">수정</a>
                <form th:action="@{'/banners/' + ${b.bannerId} + '/toggle'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn ghost" th:text="${b.displayFlag == 'Y'} ? '중지' : '노출'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(banners)}">등록된 배너가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
