<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${banner != null} ? '배너 수정 - 고향사랑e음 (admin service)' : '배너 등록 - 고향사랑e음 (admin service)'"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- 배너목록(content/banner-list.html)에서 넘어올 때 사이드바가 사라지던 버그 수정 -
     이 파일만 admin-nav 포함이 빠져있었다. 다른 *-form.html과 동일하게 board_write_table로. -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/banners}">배너 관리</a></div>
    <h3><span th:text="${banner != null} ? '배너 수정' : '배너 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="배너 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="title" name="title" th:value="${banner != null} ? ${banner.title} : ''" required form="bannerForm"></td>
            </tr>
            <tr>
                <td class="label">내용 (선택)</td>
                <td><textarea id="contents" name="contents" rows="3" th:text="${banner != null} ? ${banner.contents} : ''" form="bannerForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">링크 URL (선택)</td>
                <td><input type="text" id="linkUrl" name="linkUrl" th:value="${banner != null} ? ${banner.linkUrl} : ''" form="bannerForm"></td>
            </tr>
            <tr>
                <td class="label">이미지 경로 (선택)</td>
                <td>
                    <input type="text" id="imageUrl" name="imageUrl" th:value="${banner != null} ? ${banner.imageUrl} : ''"
                           placeholder="예: /images/new/banner_main_02_pc.png" form="bannerForm">
                    <!-- 이미지 업로드는 이번 범위에 포함되지 않고, 이미 static 리소스로 배포된
                         경로를 직접 입력받습니다. -->
                    <img th:if="${banner != null and banner.imageUrl != null}" th:src="${banner.imageUrl}" alt="" style="height:60px; margin-top:8px; display:block;">
                </td>
            </tr>
            <tr>
                <td class="label">노출 순서 (선택)</td>
                <td>
                    <input type="number" id="displayOrder" name="displayOrder" step="1"
                           th:value="${banner != null} ? ${banner.displayOrder} : 0" form="bannerForm">
                    <p style="font-size:12px; color:#666; margin-top:4px;">캐러셀은 최대 6개까지만 노출됩니다.</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="bannerForm" th:action="${banner != null} ? @{'/banners/' + ${banner.bannerId}} : @{/banners}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="bannerForm" class="btn btn-dark-gray btn-small" th:text="${banner != null} ? '수정' : '등록'"></button>
            <a th:href="@{/banners}" class="btn btn-dark-default btn-small">목록으로</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
