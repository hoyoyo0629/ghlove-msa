<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${notice != null} ? '공지사항 수정 - 고향사랑e음 (admin service)' : '공지사항 등록 - 고향사랑e음 (admin service)'"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-notice(기금사업소개 > 지자체공지사항)와 일반 공지사항관리를
     하나의 폼으로 합쳤다 - 둘 다 같은 OP_NOTICE를 쓰고 차이는 LOCGOV_CODE 유무뿐이다.
     지자체를 선택하면 그 지자체 전용 공지(list-select.html의 "지자체공지사항" 탭에 노출),
     선택하지 않으면(전체) 전역 공지사항(/notices)이 된다. -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/notices}">공지사항 관리</a></div>
    <h3><span th:text="${notice != null} ? '공지사항 수정' : '공지사항 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="공지사항 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">분류</td>
                <td>
                    <select id="categoryCode" name="categoryCode" form="noticeForm">
                        <option th:each="c : ${categories}" th:value="${c.key}" th:text="${c.value}"
                                th:selected="${notice != null and notice.categoryCode == c.key}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="subject" name="subject" required th:value="${notice != null} ? ${notice.subject} : ''" form="noticeForm"></td>
            </tr>
            <tr>
                <td class="label">내용</td>
                <td><textarea id="content" name="content" rows="5" th:text="${notice != null} ? ${notice.content} : ''" form="noticeForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">지자체공지사항</td>
                <td>
                    <div class="flex_box gap-08">
                        <select id="upperLocgovCode" onchange="filterLocgov()">
                            <option value="">시·도 선택 안함</option>
                            <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                        </select>
                        <select id="locgovCode" name="locgovCode" form="noticeForm">
                            <option value="">시·군·구 선택 안함</option>
                            <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                    th:attr="data-upper=${l.upperLocgovCode}"
                                    th:selected="${notice != null and notice.locgovCode == l.locgovCode}"></option>
                        </select>
                    </div>
                    <p style="font-size:12px; color:#666; margin-top:4px;">선택 시 해당 지자체 전용, 미선택 시 전체 공지로 등록됩니다.</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="noticeForm" th:action="${notice != null} ? @{'/admin/notices/' + ${notice.noticeId} + '/edit'} : @{/admin/notices}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="noticeForm" class="btn btn-dark-gray btn-small" th:text="${notice != null} ? '수정' : '등록'"></button>
            <a th:href="@{/admin/notices}" class="btn btn-dark-default btn-small">목록으로</a>
        </div>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}

(function initUpperFromSelectedLocgov() {
    var selected = document.querySelector('#locgovCode option:checked');
    if (selected && selected.value) {
        document.getElementById('upperLocgovCode').value = selected.dataset.upper;
    }
    filterLocgov();
})();
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
