<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배송 SLA 통계 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- SFR-006 "통계 및 SLA 관리를 위한 ReadModel 제공(제공자·지자체별 SLA 지표)" - order
     서비스가 송장등록/배송상태갱신/구매확정 시점마다 발행하는 order.saga(ORDER_DELIVERY_UPDATED)
     이벤트를 admin의 STAT_ORDER_LEDGER 사본에 반영해 조회 시점에 집계한다. 취소된 주문은
     제외한다(리드타임 자체가 의미 없음). -->
<div class="contents contents_inner">
    <h3><span>배송 SLA 통계</span></h3>
    <p style="color:#666; margin-bottom:16px;">
        각 구간의 시작/끝 시각이 모두 있는 주문만 평균에 포함됩니다(예: 아직 미발송인 주문은
        "발송→배송완료" 평균에서 제외).
    </p>

    <h4>제공자별</h4>
    <table class="board_list_table" summary="제공자별 배송 SLA">
        <caption>제공자별 배송 SLA</caption>
        <thead>
        <tr>
            <th scope="col">제공자ID</th>
            <th scope="col">주문건수</th>
            <th scope="col">확정→발송(평균, 시간)</th>
            <th scope="col">발송→배송완료(평균, 시간)</th>
            <th scope="col">배송완료→구매확정(평균, 시간)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${bySeller}">
            <td th:text="${m.groupKey}"></td>
            <td th:text="${m.orderCount}"></td>
            <td th:text="${m.avgConfirmToShipHours ?: '-'}"></td>
            <td th:text="${m.avgShipToDeliverHours ?: '-'}"></td>
            <td th:text="${m.avgDeliverToConfirmHours ?: '-'}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(bySeller)}">집계할 주문이 없습니다.</p>

    <h4 class="mt-40">지자체별</h4>
    <table class="board_list_table" summary="지자체별 배송 SLA">
        <caption>지자체별 배송 SLA</caption>
        <thead>
        <tr>
            <th scope="col">지자체코드</th>
            <th scope="col">주문건수</th>
            <th scope="col">확정→발송(평균, 시간)</th>
            <th scope="col">발송→배송완료(평균, 시간)</th>
            <th scope="col">배송완료→구매확정(평균, 시간)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${byLocgov}">
            <td th:text="${m.groupKey}"></td>
            <td th:text="${m.orderCount}"></td>
            <td th:text="${m.avgConfirmToShipHours ?: '-'}"></td>
            <td th:text="${m.avgShipToDeliverHours ?: '-'}"></td>
            <td th:text="${m.avgDeliverToConfirmHours ?: '-'}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(byLocgov)}">집계할 주문이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
