<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정기발행쿠폰 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/coupon-regular}">정기발행쿠폰 관리</a></div>
    <h3><span th:text="${coupon.couponId()} != null ? '정기발행쿠폰 수정' : '정기발행쿠폰 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="정기발행쿠폰 기본정보">
            <colgroup><col style="width:260px;"><col></colgroup>
            <tbody>
            <tr><td class="label"><span class="required_mark">*</span>쿠폰명</td><td><input type="text" id="couponName" name="couponName" th:value="${coupon.couponName()}" required form="regularForm"></td></tr>
            <tr><td class="label">쿠폰설명</td><td><textarea id="couponComment" name="couponComment" rows="3" th:text="${coupon.couponComment()}" form="regularForm"></textarea></td></tr>
            <tr>
                <td class="label">할인 유형</td>
                <td>
                    <select id="payType" name="payType" form="regularForm">
                        <option value="1" th:selected="${coupon.payType() == '1'}">정액(원)</option>
                        <option value="2" th:selected="${coupon.payType() == '2'}">정률(%)</option>
                    </select>
                </td>
            </tr>
            <tr><td class="label"><span class="required_mark">*</span>할인 값</td><td><input type="number" id="pay" name="pay" th:value="${coupon.pay()}" required form="regularForm"></td></tr>
            <tr><td class="label">%할인 최대 할인금액</td><td><input type="number" id="discountLimitPrice" name="discountLimitPrice" th:value="${coupon.discountLimitPrice()}" form="regularForm"> <span style="font-size:12px;color:#666;">-1=무제한</span></td></tr>
            <tr><td class="label">최소 구매금액 조건</td><td><input type="number" id="payRestriction" name="payRestriction" th:value="${coupon.payRestriction()}" form="regularForm"> <span style="font-size:12px;color:#666;">-1=무제한</span></td></tr>
            <tr>
                <td class="label">발급대상 회원</td>
                <td>
                    <select id="targetUserType" name="targetUserType" form="regularForm">
                        <option value="1" th:selected="${coupon.targetUserType() == '1'}">전체 회원</option>
                        <option value="2" th:selected="${coupon.targetUserType() == '2'}">선택 회원</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">적용 상품</td>
                <td>
                    <select id="targetItemType" name="targetItemType" form="regularForm">
                        <option value="1" th:selected="${coupon.targetItemType() == '1'}">전체 상품</option>
                        <option value="2" th:selected="${coupon.targetItemType() == '2'}">특정 상품</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">발행기간</h4>
    <div class="board_write">
        <table class="board_write_table" summary="발행기간">
            <colgroup><col style="width:260px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">제한 여부</td>
                <td>
                    <select id="issueType" name="issueType" form="regularForm">
                        <option value="0" th:selected="${coupon.issueType() == '0'}">제한 없음(항상 운영)</option>
                        <option value="1" th:selected="${coupon.issueType() == '1'}">기간 지정</option>
                    </select>
                </td>
            </tr>
            <tr><td class="label">시작일</td><td><input type="text" id="issueStartDate" name="issueStartDate" th:value="${coupon.issueStartDate()}" placeholder="yyyyMMdd" form="regularForm"></td></tr>
            <tr><td class="label">종료일</td><td><input type="text" id="issueEndDate" name="issueEndDate" th:value="${coupon.issueEndDate()}" placeholder="yyyyMMdd" form="regularForm"></td></tr>
            <tr><td class="label">일일 발행 시 총 수량제한</td><td><input type="number" id="downloadLimit" name="downloadLimit" th:value="${coupon.downloadLimit()}" form="regularForm"> <span style="font-size:12px;color:#666;">-1=무제한</span></td></tr>
            <tr><td class="label">운영중</td><td><input type="checkbox" name="couponFlag" value="Y" th:checked="${coupon.couponFlag() == null or coupon.couponFlag() == 'Y'}" form="regularForm"> 매일 배치 발행 대상</td></tr>
            </tbody>
        </table>
    </div>

    <form id="regularForm" th:action="${coupon.couponId()} != null ? @{'/coupon-regular/' + ${coupon.couponId()}} : @{/coupon-regular}" method="post">
        <input type="hidden" name="concurrently" value="1">
        <input type="hidden" name="multipleDownloadFlag" value="N">
        <input type="hidden" name="downloadUserLimit" value="-1">
        <input type="hidden" name="dataStatusCode" value="1">
    </form>
    <div class="btn_all btn_center">
        <button type="submit" form="regularForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
