<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 오프라인 코드 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <p><a th:href="@{/coupon}">&larr; 쿠폰관리</a></p>
    <h3 th:text="${coupon.couponName()} + ' - 오프라인 코드'"></h3>

    <form th:action="@{'/coupon/' + ${coupon.couponId()} + '/offline-codes'}" method="post" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="number" name="count" value="10" min="1" max="1000" style="width:100px;">
        <button type="submit" class="btn">코드 발급</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>ID</th><th>코드</th><th>사용여부</th><th>사용회원</th><th>발행일</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${codes}">
            <td th:text="${c.couponOfflineId()}"></td>
            <td th:text="${c.offlineCode()}"></td>
            <td th:text="${c.usedFlag() == 'Y' ? '사용됨' : '미사용'}"></td>
            <td th:text="${c.userId() != null and c.userId() > 0 ? c.userId() : '-'}"></td>
            <td th:text="${c.publishedDate()}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(codes)}">발급된 코드가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
