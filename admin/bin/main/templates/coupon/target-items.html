<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 특정상품 지정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <p><a th:href="@{/coupon}">&larr; 쿠폰관리</a></p>
    <h3 th:text="${coupon.couponName()} + ' - 특정상품 지정'"></h3>

    <form th:action="@{'/coupon/' + ${coupon.couponId()} + '/target-items'}" method="post" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="number" name="itemId" placeholder="상품ID" required>
        <button type="submit" class="btn">추가</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>상품ID</th><th>등록일</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${items}">
            <td th:text="${t.itemId()}"></td>
            <td th:text="${t.createdDate()}"></td>
            <td>
                <form th:action="@{'/coupon/' + ${coupon.couponId()} + '/target-items/' + ${t.itemId()} + '/delete'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn danger">제외</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(items)}">지정된 상품이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
