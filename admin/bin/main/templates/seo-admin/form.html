<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SEO 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/seo}">SEO 관리</a></div>
    <h3><span th:text="${seo} != null ? 'SEO 수정' : 'SEO 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="SEO 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>URL 패턴</td>
                <td><input type="text" id="seoUrl" name="seoUrl" placeholder="/gifts" th:value="${seo} != null ? ${seo.seoUrl} : ''" required form="seoForm"></td>
            </tr>
            <tr>
                <td class="label">title</td>
                <td><input type="text" id="title" name="title" th:value="${seo} != null ? ${seo.title} : ''" form="seoForm"></td>
            </tr>
            <tr>
                <td class="label">keywords</td>
                <td><input type="text" id="keywords" name="keywords" th:value="${seo} != null ? ${seo.keywords} : ''" form="seoForm"></td>
            </tr>
            <tr>
                <td class="label">description</td>
                <td><textarea id="description" name="description" rows="3" th:text="${seo} != null ? ${seo.description} : ''" form="seoForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">테마어 title</td>
                <td><input type="text" id="themawordTitle" name="themawordTitle" th:value="${seo} != null ? ${seo.themawordTitle} : ''" form="seoForm"></td>
            </tr>
            <tr>
                <td class="label">테마어 설명</td>
                <td><textarea id="themawordDescription" name="themawordDescription" rows="3" th:text="${seo} != null ? ${seo.themawordDescription} : ''" form="seoForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">검색엔진 색인 허용</td>
                <td><input type="checkbox" name="indexFlag" th:checked="${seo} == null or ${seo.indexFlag} == 'Y'" form="seoForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="seoForm" th:action="${seo} != null ? @{'/admin/seo/' + ${seo.seoId}} : @{/admin/seo}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="seoForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
