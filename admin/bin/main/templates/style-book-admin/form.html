<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스타일북 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/style-books}">스타일북 관리</a></div>
    <h3><span th:text="${styleBook} != null ? '스타일북 수정' : '스타일북 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="스타일북 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="title" name="title" th:value="${styleBook} != null ? ${styleBook.title} : ''" required form="styleBookForm"></td>
            </tr>
            <tr>
                <td class="label">내용</td>
                <td><textarea id="content" name="content" rows="4" th:text="${styleBook} != null ? ${styleBook.content} : ''" form="styleBookForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">대표이미지 URL</td>
                <td><input type="text" id="image" name="image" th:value="${styleBook} != null ? ${styleBook.image} : ''" form="styleBookForm"></td>
            </tr>
            <tr>
                <td class="label">노출순서</td>
                <td><input type="number" id="ordering" name="ordering" th:value="${styleBook} != null ? ${styleBook.ordering} : 0" form="styleBookForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="styleBookForm" th:action="${styleBook} != null ? @{'/admin/style-books/' + ${styleBook.id}} : @{/admin/style-books}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="styleBookForm" class="btn btn-dark-gray btn-small">저장</button>
        <form th:if="${styleBook} != null" th:action="@{'/admin/style-books/' + ${styleBook.id} + '/delete'}" method="post" style="display:inline;"
              onsubmit="return confirm('삭제하시겠습니까?')">
            <button type="submit" class="btn btn-small">삭제</button>
        </form>
    </div>

    <div th:if="${styleBook} != null" style="margin-top:32px;">
        <h4>소속 답례품</h4>
        <form th:action="@{'/admin/style-books/' + ${styleBook.id} + '/items'}" method="post" style="margin-bottom:12px;">
            <input type="number" name="itemId" placeholder="답례품 ID" required>
            <button type="submit" class="small-btn">추가</button>
        </form>
        <table class="board_list_table">
            <thead><tr><th>순서</th><th>답례품ID</th><th>답례품명</th><th>처리</th></tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.ordering}"></td>
                <td th:text="${i.itemId}"></td>
                <td th:text="${i.itemName}"></td>
                <td>
                    <form th:action="@{'/admin/style-books/' + ${styleBook.id} + '/items/' + ${i.itemId} + '/delete'}" method="post" class="inline-form">
                        <button type="submit" class="small-btn danger">제외</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(items)}">소속된 답례품이 없습니다.</p>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
