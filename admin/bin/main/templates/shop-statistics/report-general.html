<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>총괄 현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>총괄 현황</h3>
    <form method="get" style="margin-bottom:16px;">
        <label>연도 <input type="number" name="year" th:value="${year}" style="width:90px;"></label>
        <button type="submit" class="small-btn">조회</button>
    </form>

    <h4 style="font-size:16px;">회원 수 현황 (월별 신규가입)</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>월</th><th th:text="${year} + '년'"></th><th>전년 동월</th></tr></thead>
        <tbody>
        <tr th:each="row : ${memberCounts}">
            <td th:text="${row.month()} + '월'"></td>
            <td th:text="${row.currentYear()} + '명'"></td>
            <td th:text="${row.priorYear()} + '명'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="font-size:16px;">기부건수 현황</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>월</th><th th:text="${year} + '년'"></th><th>전년 동월</th></tr></thead>
        <tbody>
        <tr th:each="row : ${donationCounts}">
            <td th:text="${row.month()} + '월'"></td>
            <td th:text="${row.currentYear()} + '건'"></td>
            <td th:text="${row.priorYear()} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="font-size:16px;">기부건수(2,000만원 한도내) 현황</h4>
    <!-- 고향사랑기부금법상 연간 개인 기부한도(2천만원)를 인정한 건수만 - SYSTEM_CONFIG.ANNUAL_TOTAL_LIMIT -->
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>월</th><th th:text="${year} + '년'"></th><th>전년 동월</th></tr></thead>
        <tbody>
        <tr th:each="row : ${donationCountsCapped}">
            <td th:text="${row.month()} + '월'"></td>
            <td th:text="${row.currentYear()} + '건'"></td>
            <td th:text="${row.priorYear()} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="font-size:16px;">답례품건수 현황</h4>
    <table class="board_list_table">
        <thead><tr><th>월</th><th th:text="${year} + '년'"></th><th>전년 동월</th></tr></thead>
        <tbody>
        <tr th:each="row : ${giftCounts}">
            <td th:text="${row.month()} + '월'"></td>
            <td th:text="${row.currentYear()} + '건'"></td>
            <td th:text="${row.priorYear()} + '건'"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
