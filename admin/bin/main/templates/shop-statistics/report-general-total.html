<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>총괄 누계 현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>총괄 누계 현황</h3>

    <h4 style="font-size:16px;">기부방법별 기부 현황(누계)</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>기부방법</th><th>건수</th><th>금액</th></tr></thead>
        <tbody>
        <tr th:each="row : ${byPathCode}">
            <td th:text="${row.label()}"></td>
            <td th:text="${row.count()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.amount(), 0, 'COMMA')} + '원'"></td>
        </tr>
        </tbody>
        <tr th:if="${#lists.isEmpty(byPathCode)}"><td colspan="3" class="empty">데이터가 없습니다.</td></tr>
    </table>

    <h4 style="font-size:16px;">금액별 기부건수 현황(누계)</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>금액 구간</th><th>건수</th><th>금액</th></tr></thead>
        <tbody>
        <tr th:each="row : ${byAmountBracket}">
            <td th:text="${row.label()}"></td>
            <td th:text="${row.count()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.amount(), 0, 'COMMA')} + '원'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="font-size:16px;">연령별 기부건수 현황(누계)</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead><tr><th>연령대</th><th>건수</th><th>금액</th></tr></thead>
        <tbody>
        <tr th:each="row : ${byAgeBracket}">
            <td th:text="${row.label()}"></td>
            <td th:text="${row.count()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.amount(), 0, 'COMMA')} + '원'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="font-size:16px;">거주지역→기부지역 건수 현황(누계)</h4>
    <!-- 고향사랑기부금법상 본인 주소지 지자체에는 기부할 수 없어(psitnLocgovCode != cntrLocgovCode 항상 성립) -->
    <table class="board_list_table">
        <thead><tr><th>거주지역(광역)</th><th>기부지역(광역)</th><th>건수</th></tr></thead>
        <tbody>
        <tr th:each="row : ${residenceToDonation}">
            <td th:text="${row.fromMctpv()}"></td>
            <td th:text="${row.toMctpv()}"></td>
            <td th:text="${row.count()} + '건'"></td>
        </tr>
        </tbody>
        <tr th:if="${#lists.isEmpty(residenceToDonation)}"><td colspan="3" class="empty">데이터가 없습니다.</td></tr>
    </table>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
