<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>월별 지자체별 답례품 현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>월별 지자체별 답례품 현황</h3>
    <p style="color:#666; margin-bottom:16px;">지자체별 당월 판매 TOP3 상품입니다.</p>

    <form method="get" th:action="@{/shop-statistics/sales/month-locgov}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="number" name="year" th:value="${year}" style="width:100px;">
        <input type="number" name="month" th:value="${month}" min="1" max="12" style="width:80px;">
        <button type="submit" class="btn">조회</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>지자체</th><th>주문건수</th><th>주문포인트</th><th>1위</th><th>2위</th><th>3위</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.locgovName()}"></td>
            <td th:text="${row.orderCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.orderAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${row.top1()}"></td>
            <td th:text="${row.top2()}"></td>
            <td th:text="${row.top3()}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">해당 월 데이터가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
