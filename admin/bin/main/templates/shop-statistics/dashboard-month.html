<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>월별 현황 보고 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>월별 현황 보고</h3>

    <form method="get" th:action="@{/shop-statistics/dashboard/month}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="text" name="yearMonth" th:value="${dashboard.yearMonth()}" placeholder="yyyyMM">
        <button type="submit" class="btn">조회</button>
    </form>

    <h4 th:text="${dashboard.yearMonth()} + ' 합계'"></h4>
    <p>
        결제건수 <strong th:text="${dashboard.totalPayCount()} + '건'"></strong> /
        결제포인트 <strong th:text="${#numbers.formatInteger(dashboard.totalPayAmount(), 0, 'COMMA')} + 'P'"></strong>
    </p>

    <table class="board_list_table">
        <thead>
        <tr><th>일자</th><th>결제건수</th><th>결제포인트</th><th>취소건수</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${dashboard.dailyBreakdown()}">
            <td th:text="${row.period()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${row.cancelCount()} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h4 style="margin-top:20px;">행안부 보고용 텍스트</h4>
    <p>
        <button type="button" class="btn" id="loadReportBtn">텍스트 생성</button>
        <button type="button" class="btn" id="copyReportBtn" disabled>클립보드 복사</button>
        <span id="copyStatus" style="color:#1a6b3c; margin-left:8px;"></span>
    </p>
    <textarea id="reportText" rows="12" style="width:100%; max-width:600px;" readonly></textarea>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var reportUrl = /*[[@{/shop-statistics/dashboard/month/report(yearMonth=${dashboard.yearMonth()})}]]*/ '';
        document.getElementById('loadReportBtn').addEventListener('click', function () {
            fetch(reportUrl).then(function (res) { return res.text(); }).then(function (text) {
                document.getElementById('reportText').value = text;
                document.getElementById('copyReportBtn').disabled = false;
                document.getElementById('copyStatus').textContent = '';
            });
        });
        document.getElementById('copyReportBtn').addEventListener('click', function () {
            var el = document.getElementById('reportText');
            el.select();
            navigator.clipboard.writeText(el.value).then(function () {
                document.getElementById('copyStatus').textContent = '복사되었습니다.';
            });
        });
        /*]]>*/
    </script>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
