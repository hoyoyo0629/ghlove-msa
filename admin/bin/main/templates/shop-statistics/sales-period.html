<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${type == 'day' ? '일별 매출 통계 - 고향사랑e음 (admin service)' : (type == 'month' ? '월별 매출 통계 - 고향사랑e음 (admin service)' : '년별 매출 통계 - 고향사랑e음 (admin service)')}"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3 th:text="${type == 'day' ? '일별 매출 통계' : (type == 'month' ? '월별 매출 통계' : '년별 매출 통계')}"></h3>
    <p style="color:#666; margin-bottom:16px;">전액 포인트결제 기준. 미지정 시 최근 30일.</p>

    <form method="get" th:action="@{'/shop-statistics/sales/' + ${type}}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd">
        <span>~</span>
        <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd">
        <button type="submit" class="btn">조회</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>기간</th><th>결제건수</th><th>결제포인트</th><th>취소건수</th><th>취소포인트</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.period()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${row.cancelCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.cancelAmount(), 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">조회된 데이터가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
