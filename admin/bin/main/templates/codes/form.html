<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 등록 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- codes/list.html에서 넘어올 때 사이드바가 사라지던 버그 수정(content/banner-form.html과
     같은 패턴). board_write_table로 재작성. -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/codes}">공통코드 관리</a></div>
    <h3><span>코드 등록</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="코드 등록">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>코드유형</td>
                <td><input type="text" id="codeType" name="codeType" th:value="${codeType}" required placeholder="예: NOTICE_CATEGORY" form="codeForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>코드 ID</td>
                <td><input type="text" id="id" name="id" required placeholder="예: GENERAL" form="codeForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>라벨</td>
                <td><input type="text" id="label" name="label" required placeholder="예: 공지" form="codeForm"></td>
            </tr>
            <tr>
                <td class="label">설명 (선택)</td>
                <td><textarea id="detail" name="detail" rows="2" form="codeForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">정렬순서 (선택)</td>
                <td><input type="number" id="ordering" name="ordering" step="1" form="codeForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="codeForm" th:action="@{/codes}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="codeForm" class="btn btn-dark-gray btn-small">등록</button>
            <a th:href="@{/codes}" class="btn btn-dark-default btn-small">목록으로</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
