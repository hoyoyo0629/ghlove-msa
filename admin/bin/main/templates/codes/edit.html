<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/codes}">공통코드 관리</a></div>
    <h3><span>코드 수정</span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="코드 수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">코드유형</td><td><input type="text" th:value="${code.codeType}" disabled form="codeEditForm"></td></tr>
            <tr><td class="label">코드 ID</td><td><input type="text" th:value="${code.id}" disabled form="codeEditForm"></td></tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>라벨</td>
                <td><input type="text" id="label" name="label" th:value="${code.label}" required form="codeEditForm"></td>
            </tr>
            <tr>
                <td class="label">설명 (선택)</td>
                <td><textarea id="detail" name="detail" rows="2" th:text="${code.detail}" form="codeEditForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">정렬순서 (선택)</td>
                <td><input type="number" id="ordering" name="ordering" step="1" th:value="${code.ordering}" form="codeEditForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="codeEditForm" th:action="@{'/codes/' + ${code.codeType} + '/' + ${code.id}}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="codeEditForm" class="btn btn-dark-gray btn-small">저장</button>
            <a th:href="@{'/codes/' + ${code.codeType}}" class="btn btn-dark-default btn-small">목록으로</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
