<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금 변경신청 등록 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-reqmng/req_form.jsp 재현 - 요청분류 100(기부금 취소/과오납)은
     세외수입시스템 결의일자+관련문서 3항목이 증빙으로 필수, 200(포인트생성)은 사유만
     필요하다(evidence 필드는 JS로 토글). 사유는 10자 이상.

     board_write_table(td.label) 레이아웃과 실제 필드 라벨로 맞췄다. 기부자명/기부자ID는
     donation 서비스가 MemberClient로 조회해 DonationInfoDto에 새로 실어준다(CntrReqmngService.submit()이
     이미 쓰던 것과 동일한 조회 경로 재사용 - /api/cntr-reqmng/donation/{cntrSn} 확장).
     "전자납부번호"/"영수증상태"는 Donation 엔티티 자체에 대응 컬럼이 없어(AS-IS 세외수입시스템
     연계 개념 자체가 이 프로젝트엔 없음) 계속 생략한다 - 값 조회가 아니라 새 필드 추적이
     필요한 스키마 확장이라 [[admin-console-asis-design-round]]의 RELAY_TYPE류와 같은 판단. -->
<div class="contents contents_inner">
    <div class="location">
        <a th:href="@{/}">&nbsp;</a> &gt; <a th:href="@{/give-reqmng}">기부금 변경신청 관리</a> &gt; <a class="on">등록</a>
    </div>
    <h3><span>기부금 변경 등록</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write" th:if="${donation != null}">
        <table class="board_write_table" summary="기부금 변경신청 등록">
            <colgroup>
                <col style="width:220px;">
                <col>
            </colgroup>
            <tbody>
            <tr th:if="${!donation.pointsUsed}">
                <td class="label">요청분류</td>
                <td>
                    <select id="cntrReqmngCode" name="cntrReqmngCode" onchange="toggleEvidence(this.value)" form="reqmngForm">
                        <option value="100">기부금 취소(과오납)</option>
                        <option value="200">포인트 생성</option>
                    </select>
                </td>
            </tr>
            <tr><td class="label">지자체명</td><td th:text="${donation.locgovCode}"></td></tr>
            <tr><td class="label">기부자명</td><td th:text="${donation.userName} ?: '-'"></td></tr>
            <tr><td class="label">기부자ID</td><td th:text="${donation.loginId} ?: '-'"></td></tr>
            <tr><td class="label">기부일자</td><td th:text="${donation.cntrDe}"></td></tr>
            <tr><td class="label">기부번호</td><td th:text="${donation.cntrSn}"></td></tr>
            <tr><td class="label">기부액</td><td th:text="${#numbers.formatInteger(donation.cntrAmt, 0, 'COMMA')} + '원'"></td></tr>
            <tr><td class="label">기부상태</td><td th:text="${donation.cntrSttusCode}"></td></tr>
            <tr><td class="label">포인트 사용이력</td><td th:text="${donation.pointsUsed} ? '있음 (변경신청 불가)' : '없음'"></td></tr>
            <tr class="evidence"><td class="label">세외수입시스템 과오납 결의일자</td><td><input type="date" id="taxSysCancelDe" name="taxSysCancelDe" form="reqmngForm"></td></tr>
            <tr class="evidence"><td class="label">관련문서 생산부서명</td><td><input type="text" id="relatedDocDptNm" name="relatedDocDptNm" form="reqmngForm"></td></tr>
            <tr class="evidence"><td class="label">관련문서 문서번호</td><td><input type="text" id="relatedDocNum" name="relatedDocNum" form="reqmngForm"></td></tr>
            <tr class="evidence"><td class="label">관련문서 시행일</td><td><input type="date" id="relatedDocDe" name="relatedDocDe" form="reqmngForm"></td></tr>
            <tr th:if="${!donation.pointsUsed}">
                <td class="label">사유 (최소 10자 이상)</td>
                <td><textarea id="discription" name="discription" required minlength="10" rows="4" form="reqmngForm"></textarea></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${donation != null and !donation.pointsUsed}">
        <ul class="list-bullet point" style="font-size:13px; color:#666; margin:16px 0;">
            <li>※ 포인트 생성은 포인트 체계를 사용하는 민간플랫폼에 한해 적용 가능합니다.</li>
            <li>※ 답례품이 신청된 건은 시스템으로 변경이 불가능합니다.</li>
            <li>※ 세액공제를 받았을 경우 반드시 홈택스에서 경정청구를 하도록 기부자에게 안내해야 합니다.</li>
        </ul>
        <form id="reqmngForm" th:action="@{/give-reqmng}" method="post">
            <input type="hidden" name="cntrSn" th:value="${cntrSn}">
            <div class="btn_all btn_center">
                <div class="flex_box gap-08">
                    <button type="submit" class="btn btn-dark-gray btn-small">변경신청 등록</button>
                    <a th:href="@{/give-reqmng}" class="btn btn-dark-default btn-small">취소</a>
                </div>
            </div>
        </form>
    </div>

    <script th:inline="none">
    function toggleEvidence(code) {
        document.querySelectorAll('tr.evidence').forEach(function (tr) {
            tr.style.display = code === '100' ? '' : 'none';
        });
    }
    toggleEvidence(document.getElementById('cntrReqmngCode') ? document.getElementById('cntrReqmngCode').value : '100');
    </script>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
