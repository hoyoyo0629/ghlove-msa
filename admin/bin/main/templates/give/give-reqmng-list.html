<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금 변경신청 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-reqmng/list.jsp 재현 - 기부금 취소(과오납)/포인트생성 변경신청
     승인 큐. 요청은 give-state 상세화면(기부번호별 "변경신청" 링크)에서 들어온다. 승인 시
     실제 도메인효과(기부취소=DonationService.cancelDonation, 포인트생성=PointClient.creditForDonation)는
     donation 서비스가 그대로 수행한다.

     컬럼셋은 실제 JSP(No./요청분류/관리자ID/기부지자체/기부자명/기부자ID/기부일자/기부액/
     비고/요청일시/승인일시/취소일시)를 그대로 맞췄다 - "전자납부번호"/"민간연계기관"은 이
     프로젝트 도메인(CntrReqmngClient.Row)에 대응 필드 자체가 없어 생략했다(값 매핑이 아니라
     새 필드 추적이 필요한 로직 재설계라 [[admin-console-asis-design-round]]의 RELAY_TYPE류와
     같은 판단). 검색조건(지자체/요청분류/승인여부/기간)+페이지네이션은 donation 서비스의
     CntrReqmngRepository.search()(JPQL, nullable 파라미터)로 실제 구현했다. -->
<div class="contents contents_inner">
    <h3><span>기부금 변경신청 관리</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <form th:action="@{/give-reqmng}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="기부금 변경신청 검색조건">
                <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">기부 지자체</td>
                    <td colspan="3">
                        <div class="flex_box gap-08">
                            <select id="upperLocgovCode" onchange="filterLocgov()" th:disabled="${locgovScoped}">
                                <option value="">시·도 전체</option>
                                <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                            </select>
                            <select id="locgovCode" name="locgovCode" th:disabled="${locgovScoped}">
                                <option value="">시·군·구 전체</option>
                                <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                        th:attr="data-upper=${l.upperLocgovCode}" th:selected="${l.locgovCode == locgovCode}"></option>
                            </select>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">요청분류</td>
                    <td>
                        <select name="cntrReqmngCode">
                            <option value="">전체</option>
                            <option value="100" th:selected="${cntrReqmngCode == '100'}">기부금 취소(과오납)</option>
                            <option value="200" th:selected="${cntrReqmngCode == '200'}">포인트 생성</option>
                        </select>
                    </td>
                    <td class="label">승인여부</td>
                    <td>
                        <select name="reqStatusCode">
                            <option value="">전체</option>
                            <option value="100" th:selected="${reqStatusCode == '100'}">대기중</option>
                            <option value="999" th:selected="${reqStatusCode == '999'}">승인 완료</option>
                            <option value="200" th:selected="${reqStatusCode == '200'}">요청취소됨</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">변경신청일자</td>
                    <td colspan="3">
                        <div class="flex_box gap-08">
                            <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd" class="datepicker" style="width:120px;">
                            <span class="wave">~</span>
                            <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd" class="datepicker" style="width:120px;">
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-small" onclick="searchClear()">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="기부금변경신청관리">
        <caption>기부금변경신청관리현황</caption>
        <thead>
        <tr>
            <th scope="col">No.</th>
            <th scope="col">요청분류</th>
            <th scope="col">관리자ID</th>
            <th scope="col">기부지자체</th>
            <th scope="col">기부자명</th>
            <th scope="col">기부자ID</th>
            <th scope="col">기부일자</th>
            <th scope="col">기부번호</th>
            <th scope="col">기부액</th>
            <th scope="col">비고</th>
            <th scope="col">요청일시</th>
            <th scope="col">승인일시</th>
            <th scope="col">취소일시</th>
            <th scope="col">처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r, i : ${list}">
            <td th:text="${totalCount - (currentPage * size + i.index)}"></td>
            <td th:text="${r.cntrReqmngCode == '100'} ? '기부금 취소(과오납)' : '포인트 생성'"></td>
            <td th:text="${r.frstRegisterId}"></td>
            <td th:text="${r.locgovCode}"></td>
            <td th:text="${r.userName}"></td>
            <td th:text="${r.loginId}"></td>
            <td th:text="${r.sttemntPayDe != null and #strings.length(r.sttemntPayDe) == 8 ? #strings.substring(r.sttemntPayDe,0,4) + '-' + #strings.substring(r.sttemntPayDe,4,6) + '-' + #strings.substring(r.sttemntPayDe,6,8) : (r.sttemntPayDe ?: '-')}"></td>
            <td th:text="${r.cntrSn}"></td>
            <td th:text="${#numbers.formatInteger(r.cntrAmt, 0, 'COMMA')} + '원'"></td>
            <td class="tleft" th:text="${r.discription}"></td>
            <td th:text="${r.frstRegistPnttm != null ? #strings.substring(r.frstRegistPnttm, 0, 16) : '-'}"></td>
            <td th:text="${r.apprDt != null ? #strings.substring(r.apprDt, 0, 16) : '-'}"></td>
            <td th:text="${r.cancleDt != null ? #strings.substring(r.cancleDt, 0, 16) : '-'}"></td>
            <td th:if="${r.reqStatusCode == '100'}">
                <form th:action="@{/give-reqmng/{id}/approve(id=${r.reqId})}" method="post" style="display:inline;" onsubmit="return confirm('변경신청을 승인하시겠습니까?');">
                    <button type="submit" class="small-btn">요청승인</button>
                </form>
                <form th:action="@{/give-reqmng/{id}/cancel(id=${r.reqId})}" method="post" style="display:inline;" onsubmit="return confirm('변경신청을 취소하시겠습니까?');">
                    <button type="submit" class="small-btn ghost">요청취소</button>
                </form>
            </td>
            <td th:unless="${r.reqStatusCode == '100'}"
                th:text="${r.reqStatusCode == '999'} ? '승인 완료' : '요청취소됨'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">등록된 변경신청이 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/give-reqmng(locgovCode=${locgovCode},cntrReqmngCode=${cntrReqmngCode},reqStatusCode=${reqStatusCode},startDate=${startDate},endDate=${endDate},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/give-reqmng(locgovCode=${locgovCode},cntrReqmngCode=${cntrReqmngCode},reqStatusCode=${reqStatusCode},startDate=${startDate},endDate=${endDate},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/give-reqmng(locgovCode=${locgovCode},cntrReqmngCode=${cntrReqmngCode},reqStatusCode=${reqStatusCode},startDate=${startDate},endDate=${endDate},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
(function preselectProvince() {
    var citySelect = document.getElementById('locgovCode');
    var selected = citySelect.options[citySelect.selectedIndex];
    if (selected && selected.dataset.upper) {
        document.getElementById('upperLocgovCode').value = selected.dataset.upper;
    }
})();
filterLocgov();
function searchClear() {
    location.href = /*[[@{/give-reqmng}]]*/ '/give-reqmng';
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
