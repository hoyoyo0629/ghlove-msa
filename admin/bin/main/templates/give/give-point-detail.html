<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부포인트 상세현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-point/form.jsp 재현 - 건별(납부번호=CNTR_SN) 발생/사용/
     잔액 포인트. 사용/잔액은 point 서비스의 FIFO lot(REMAINING_AMOUNT)을 그대로 읽어
     계산한다(PointClient) - 포인트 소비 자체는 지자체 단위로 이뤄지지만 lot은 어느
     기부에서 났는지 추적되므로 "이 기부로 생긴 포인트 중 남은 양"은 정확히 구해진다. -->
<div class="contents contents_inner">
    <p><a th:href="@{/give-point}">&larr; 기부포인트 현황</a></p>
    <h3 th:text="${locgovFullNm} + ' 기부포인트 상세현황'"></h3>

    <form th:action="@{/give-point/detail}" method="get" style="margin-bottom:20px;">
        <input type="hidden" name="upperLocgovCode" th:value="${upperLocgovCode}">
        <input type="hidden" name="locgovCode" th:value="${locgovCode}">
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="field" style="margin-bottom:0;">
                <label for="cntrYear">기부년도</label>
                <select id="cntrYear" name="cntrYear">
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == cntrYear}"></option>
                </select>
            </div>
            <div class="field" style="margin-bottom:0;">
                <label for="shUserName">기부자명</label>
                <input type="text" id="shUserName" name="shUserName" th:value="${shUserName}">
            </div>
            <button type="submit">검색</button>
        </div>
    </form>

    <div class="card-grid" style="margin-bottom:12px;">
        <div class="card">
            <div class="type">총 발생포인트</div>
            <div class="count" th:text="${#numbers.formatInteger(totalEarned, 0, 'COMMA')} + 'P'"></div>
        </div>
        <div class="card">
            <div class="type">총 사용포인트</div>
            <div class="count" th:text="${#numbers.formatInteger(totalUsed, 0, 'COMMA')} + 'P'"></div>
        </div>
        <div class="card">
            <div class="type">총 포인트잔액</div>
            <div class="count" th:text="${#numbers.formatInteger(totalBalance, 0, 'COMMA')} + 'P'"></div>
        </div>
    </div>
    <div class="card-grid" style="margin-bottom:28px;">
        <div class="card">
            <div class="type" th:text="${cntrYear} + '년 발생포인트'"></div>
            <div class="count" th:text="${#numbers.formatInteger(yearEarned, 0, 'COMMA')} + 'P'"></div>
        </div>
        <div class="card">
            <div class="type" th:text="${cntrYear} + '년 사용포인트'"></div>
            <div class="count" th:text="${#numbers.formatInteger(yearUsed, 0, 'COMMA')} + 'P'"></div>
        </div>
        <div class="card">
            <div class="type" th:text="${cntrYear} + '년 포인트잔액'"></div>
            <div class="count" th:text="${#numbers.formatInteger(yearBalance, 0, 'COMMA')} + 'P'"></div>
        </div>
    </div>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>납부일자</th>
            <th>납부번호</th>
            <th>기부자명</th>
            <th>아이디</th>
            <th>기부금액</th>
            <th>발생포인트</th>
            <th>사용포인트</th>
            <th>포인트잔액</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${list}">
            <td th:text="${#strings.substring(r.eventDate, 0, 8)}"></td>
            <td th:text="${r.cntrSn}"></td>
            <td th:text="${r.userName}"></td>
            <td th:text="${r.loginId}"></td>
            <td th:text="${#numbers.formatInteger(r.cntrAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.earnedPoint, 0, 'COMMA')} + 'P'"></td>
            <td th:text="${#numbers.formatInteger(r.usedPoint, 0, 'COMMA')} + 'P'"></td>
            <td th:text="${#numbers.formatInteger(r.blcePoint, 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">조회된 기부포인트 상세현황이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
