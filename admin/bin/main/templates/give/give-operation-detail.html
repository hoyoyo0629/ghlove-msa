<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금 지출내역 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-operation/list/{locgovCode}.jsp + popup/form.jsp를 한
     화면으로 합쳤다(팝업 대신 인라인 폼 - 이 프로젝트의 기존 서버렌더 폼 관행). "수정"을
     누르면 JS로 폼에 기존값을 채우고 action을 수정 URL로 바꾼다(파일은 보안상 재선택
     필요 - 기존 첨부는 별도 목록에서 개별 삭제). -->
<div class="contents contents_inner">
    <p><a th:href="@{/give-operation}">&larr; 기부금 운용정보 목록</a></p>
    <h3 th:text="${locgovFullNm} + ' 지출내역'"></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <table class="board_list_table" style="margin-bottom:28px;">
        <thead>
        <tr>
            <th scope="col">지출일자</th>
            <th scope="col">사업목적</th>
            <th scope="col">사업명</th>
            <th scope="col">사용금액</th>
            <th scope="col">사용내용</th>
            <th scope="col">증빙서류</th>
            <th scope="col">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${list}">
            <td th:text="${r.expndtrDe}"></td>
            <td th:text="${bsnsPurpsCodeList.get(r.bsnsPurpsCode)}"></td>
            <td th:text="${r.bsnsNm}"></td>
            <td th:text="${#numbers.formatInteger(r.expndtrAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${r.bsnsCn}"></td>
            <td>
                <span th:each="f : ${r.files}" style="display:block;">
                    <a th:href="@{http://localhost:8082/ctbny-opratn/file-download/{id}(id=${f.registFileId})}" th:text="${f.orginlFileNm}" target="_blank"></a>
                    <form th:action="@{/give-operation/{code}/files/{fid}/delete(code=${locgovCode},fid=${f.registFileId})}" method="post" style="display:inline;" onsubmit="return confirm('첨부파일을 삭제하시겠습니까?');">
                        <button type="submit" style="border:none;background:none;color:#c0392b;cursor:pointer;">삭제</button>
                    </form>
                </span>
            </td>
            <td>
                <button type="button" class="edit-row-btn"
                        th:data-regist-sn="${r.registSn}"
                        th:data-bsns-purps-code="${r.bsnsPurpsCode}"
                        th:data-bsns-nm="${r.bsnsNm}"
                        th:data-bsns-cn="${r.bsnsCn}"
                        th:data-expndtr-de="${r.expndtrDe}"
                        th:data-expndtr-amt="${#numbers.formatDecimal(r.expndtrAmt, 1, 'NONE', 0, 'NONE')}"
                        th:data-rm="${r.rm}"
                        onclick="editRow(this)">수정</button>
                <form th:action="@{/give-operation/{code}/{sn}/delete(code=${locgovCode},sn=${r.registSn})}" method="post" style="display:inline;" onsubmit="return confirm('지출내역을 삭제하시겠습니까?');">
                    <button type="submit">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">등록된 지출내역이 없습니다.</p>

    <h4 id="formTitle">지출내역 등록</h4>
    <div class="board_write">
        <table class="board_write_table" summary="지출내역 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">사업목적</td>
                <td>
                    <select id="bsnsPurpsCode" name="bsnsPurpsCode" form="opratnForm">
                        <option value="">선택안함</option>
                        <option th:each="c : ${bsnsPurpsCodeList}" th:value="${c.key}" th:text="${c.value}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">사업명 <span style="color:#c0392b;">*</span></td>
                <td><input type="text" id="bsnsNm" name="bsnsNm" required maxlength="200" form="opratnForm"></td>
            </tr>
            <tr>
                <td class="label">지출일자 <span style="color:#c0392b;">*</span></td>
                <td><input type="date" id="expndtrDe" name="expndtrDe" required form="opratnForm"></td>
            </tr>
            <tr>
                <td class="label">사용금액(원) <span style="color:#c0392b;">*</span></td>
                <td><input type="number" id="expndtrAmt" name="expndtrAmt" required min="0" max="2100000000" form="opratnForm"></td>
            </tr>
            <tr>
                <td class="label">사용내용 <span style="color:#c0392b;">*</span></td>
                <td><textarea id="bsnsCn" name="bsnsCn" required rows="4" form="opratnForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">비고</td>
                <td><textarea id="rm" name="rm" rows="2" form="opratnForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">증빙서류 첨부</td>
                <td><input type="file" id="files" name="files" multiple form="opratnForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="opratnForm" th:action="@{/give-operation/{code}(code=${locgovCode})}" method="post" enctype="multipart/form-data"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="opratnForm" class="btn btn-dark-gray btn-small">저장</button>
            <button type="button" class="btn btn-dark-default btn-small" onclick="resetForm()">취소</button>
        </div>
    </div>
</div>

<script th:inline="none">
var createAction = document.getElementById('opratnForm').action;
function editRow(btn) {
    document.getElementById('formTitle').textContent = '지출내역 수정';
    document.getElementById('bsnsPurpsCode').value = btn.dataset.bsnsPurpsCode || '';
    document.getElementById('bsnsNm').value = btn.dataset.bsnsNm;
    document.getElementById('bsnsCn').value = btn.dataset.bsnsCn;
    document.getElementById('expndtrDe').value = btn.dataset.expndtrDe;
    document.getElementById('expndtrAmt').value = btn.dataset.expndtrAmt;
    document.getElementById('rm').value = btn.dataset.rm || '';
    document.getElementById('opratnForm').action = createAction + '/' + btn.dataset.registSn + '/edit';
    document.getElementById('formTitle').scrollIntoView({behavior: 'smooth'});
}
function resetForm() {
    document.getElementById('formTitle').textContent = '지출내역 등록';
    document.getElementById('opratnForm').reset();
    document.getElementById('opratnForm').action = createAction;
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
