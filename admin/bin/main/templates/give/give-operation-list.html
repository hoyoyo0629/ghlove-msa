<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금 운용정보 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-operation/list.jsp 재현 - 지자체별 기부금액/사용금액/잔액
     집계. 고향사랑기부금법상 지자체는 모금한 기부금의 사용내역(지출)을 공시해야 하며,
     이 화면은 그 지출 등록·조회의 입구다. 실제 지출 데이터는 donation 서비스
     (G_CTBNY_OPRATN)에 있고 admin은 CtbnyOpratnClient로 cross-service 호출한다. -->
<div class="contents contents_inner">
    <h3>기부금 운용정보</h3>
    <p style="color:#666; margin-bottom:20px;">지자체별 기부금 모금액과 지출(사용)내역을 조회하고, 지출내역을 등록·관리합니다.</p>

    <div class="card-grid" style="margin-bottom:28px;">
        <div class="card">
            <div class="type">기부금액 합계</div>
            <div class="count" th:text="${#numbers.formatInteger(totalDonated, 0, 'COMMA')} + '원'"></div>
        </div>
        <div class="card">
            <div class="type">사용금액 합계</div>
            <div class="count" th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA')} + '원'"></div>
        </div>
        <div class="card">
            <div class="type">잔액 합계</div>
            <div class="count" th:text="${#numbers.formatInteger(totalBalance, 0, 'COMMA')} + '원'"></div>
        </div>
    </div>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>광역지자체</th>
            <th>기부지자체</th>
            <th>기부금액</th>
            <th>사용금액</th>
            <th>잔액</th>
            <th>지출내역</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.upperLocgovNm}"></td>
            <td th:text="${r.locgovNm}"></td>
            <td th:text="${#numbers.formatInteger(r.donated, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.spent, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.balance, 0, 'COMMA')} + '원'"></td>
            <td><a th:href="@{/give-operation/{code}(code=${r.locgovCode})}">조회/등록</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">조회된 기부금 모금현황이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
