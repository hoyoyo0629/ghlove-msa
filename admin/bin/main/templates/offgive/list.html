<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프라인기부 접수 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/offgive/list.jsp 재현 - 은행창구/행정복지센터 등에서 현장 접수한
     기부 목록(CNTR_PATH_CODE=OFFLINE). 실제 JSP 컬럼 중 "전자납부번호"/"특정사업에
     기부하기 사업명"은 이 프로젝트 도메인에 대응 필드가 없어 생략(give-reqmng-list.html과
     같은 판단 - donation 서비스 스키마 확장이 필요한 진짜 기능갭). 검색조건(지자체/기간/
     이름)+페이지네이션은 donation의 DonationRepository.searchOffline()(지자체/기간, DB레벨)
     + 이름은 회원명이 Donation 엔티티에 없어 admin에서 조회된 membersById로 인메모리
     필터+페이지네이션(FaqController 등 이 프로젝트가 이미 쓰는 관례와 동일)으로 실제 구현했다. -->
<div class="contents contents_inner">
    <h3><span>오프라인기부 접수 관리</span></h3>
    <div class="btn_all btn_right" style="margin-bottom:16px;">
        <a th:href="@{/offgive/new}" class="btn btn-dark-gray btn-small">현장접수 등록</a>
    </div>

    <form th:action="@{/offgive}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="오프라인기부 검색조건">
                <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">기부 지자체</td>
                    <td colspan="3">
                        <div class="flex_box gap-08">
                            <select id="upperLocgovCode" onchange="filterLocgov()" th:disabled="${locgovScoped}">
                                <option value="">시·도 전체</option>
                                <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                            </select>
                            <select id="locgovCode" name="locgovCode" th:disabled="${locgovScoped}">
                                <option value="">시·군·구 전체</option>
                                <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                        th:attr="data-upper=${l.upperLocgovCode}" th:selected="${l.locgovCode == locgovCode}"></option>
                            </select>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">이름</td>
                    <td><input type="text" name="walkInName" th:value="${walkInName}"></td>
                    <td class="label">접수일자</td>
                    <td>
                        <div class="flex_box gap-08">
                            <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd" style="width:120px;">
                            <span class="wave">~</span>
                            <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd" style="width:120px;">
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-small" onclick="searchClear()">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="오프라인기부접수관리">
        <caption>오프라인기부접수관리현황</caption>
        <thead>
        <tr>
            <th scope="col">No.</th>
            <th scope="col">기부번호</th>
            <th scope="col">기부상태</th>
            <th scope="col">수납일</th>
            <th scope="col">기부 지자체</th>
            <th scope="col">이름</th>
            <th scope="col">아이디</th>
            <th scope="col">기부 금액</th>
            <th scope="col">지점/센터명</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d, i : ${list}">
            <td th:text="${totalCount - ((currentPage - 1) * size + i.index)}"></td>
            <td><a th:href="@{/offgive/{sn}(sn=${d.cntrSn})}" th:text="${d.cntrSn}"></a></td>
            <td th:text="${d.cntrSttusCode}"></td>
            <td th:text="${d.cntrDe}"></td>
            <td th:text="${d.cntrLocgovCode}"></td>
            <td th:text="${membersById.get(d.userId) != null ? membersById.get(d.userId).userName() : '-'}"></td>
            <td th:text="${membersById.get(d.userId) != null ? membersById.get(d.userId).loginId() : '-'}"></td>
            <td th:text="${#numbers.formatInteger(d.cntrAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${d.rceptBankNm}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">접수된 오프라인기부가 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 1}" class="prev"
               th:href="@{/offgive(locgovCode=${locgovCode},walkInName=${walkInName},startDate=${startDate},endDate=${endDate},page=${currentPage - 1})}">이전</a>
            <span th:each="p : ${#numbers.sequence(1, totalPages)}">
                <strong th:if="${p == currentPage}" th:text="${p}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/offgive(locgovCode=${locgovCode},walkInName=${walkInName},startDate=${startDate},endDate=${endDate},page=${p})}"
                   th:text="${p}"></a>
            </span>
            <a th:if="${currentPage < totalPages}" class="next"
               th:href="@{/offgive(locgovCode=${locgovCode},walkInName=${walkInName},startDate=${startDate},endDate=${endDate},page=${currentPage + 1})}">다음</a>
        </div>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
(function preselectProvince() {
    var citySelect = document.getElementById('locgovCode');
    var selected = citySelect.options[citySelect.selectedIndex];
    if (selected && selected.dataset.upper) {
        document.getElementById('upperLocgovCode').value = selected.dataset.upper;
    }
})();
filterLocgov();
function searchClear() {
    location.href = /*[[@{/offgive}]]*/ '/offgive';
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
