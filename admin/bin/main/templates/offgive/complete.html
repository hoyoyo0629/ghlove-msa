<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프라인기부 접수 완료 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3><span>오프라인기부 접수 완료</span></h3>

    <div class="card" style="margin-bottom:20px; max-width:420px;">
        <div>기부번호: <strong th:text="${result.donation().cntrSn()}"></strong></div>
        <div>지자체: <span th:text="${result.donation().cntrLocgovCode()}"></span></div>
        <div>기부금액: <span th:text="${#numbers.formatInteger(result.donation().cntrAmt(), 0, 'COMMA')} + '원'"></span></div>
        <div>상태: <span th:text="${result.donation().cntrSttusCode()}"></span></div>
    </div>

    <p th:if="${result.walkIn() != null}" class="dev-code" style="background:#eef4ff;color:#1a73e8;padding:10px;border-radius:4px; max-width:420px;">
        새 회원계정이 발급되었습니다.<br>
        아이디: <strong th:text="${result.walkIn().loginId()}"></strong><br>
        임시 비밀번호: <strong th:text="${result.walkIn().tempPassword()}"></strong><br>
        (기부자에게 별도로 안내해 주세요 - 다시 확인할 수 없습니다)
    </p>

    <div class="btn_all btn_left" style="margin-top:20px;">
        <div class="flex_box gap-08">
            <a th:href="@{/offgive/{sn}(sn=${result.donation().cntrSn()})}" class="btn btn-dark-gray btn-small">접수 상세보기</a>
            <a th:href="@{/offgive}" class="btn btn-dark-default btn-small">목록으로</a>
            <a th:href="@{/offgive/new}" class="btn btn-dark-default btn-small">추가 접수</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
