<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프라인기부 현장접수 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/offgive/form.jsp("기탁서 등록") 재현 - 은행창구/행정복지센터 접수
     담당자가 현장에서 기부를 등록한다. 기존회원 아이디를 입력하면 그 계정으로, 비워두면
     방문 시민을 즉석가입시킨다(OffgiveService.register 참고, AS-IS의 "계좌 없으면 즉석생성"
     로직). 실명인증은 담당자가 신분증을 직접 확인하는 것으로 대체(원격 SMS 인증이 필요없는
     대면 접수라 의도적으로 단순화 - 온라인 실명인증 모듈은 이번 스코프 밖). 주민등록번호/
     답례품 선택+배송정보/약관동의는 이 프로젝트 도메인에 없어 생략(답례품은 기부와 분리된
     별도 order/gift 흐름). board_write_table(td.label) 레이아웃으로 재현. -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/offgive}">오프라인기부 접수 관리</a></div>
    <h3><span>기탁서 등록</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="기탁서 등록">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">기존 회원번호</td>
                <td>
                    <input type="number" id="userId" name="userId" form="offgiveForm">
                    <p style="font-size:12px; color:#666; margin-top:4px;">있으면 입력, 없으면 비워두고 아래 방문자 정보를 입력하세요.</p>
                </td>
            </tr>
            <tr><td class="label">이름</td><td><input type="text" id="walkInName" name="walkInName" maxlength="50" form="offgiveForm"></td></tr>
            <tr><td class="label">휴대폰</td><td><input type="text" id="walkInPhone" name="walkInPhone" maxlength="20" placeholder="01012345678" form="offgiveForm"></td></tr>
            <tr><td class="label">생년월일</td><td><input type="date" id="walkInBirthday" name="walkInBirthday" form="offgiveForm"></td></tr>
            <tr>
                <td class="label">주소</td>
                <td>
                    <input type="text" id="walkInAddress" name="walkInAddress" maxlength="255" form="offgiveForm">
                    <p style="font-size:12px; color:#666; margin-top:4px;">※ 신분증을 확인해 본인 여부를 직접 확인해 주세요. 회원번호가 없으면 위 정보로 계정이 즉시 발급됩니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>기부 지자체</td>
                <td>
                    <div class="flex_box gap-08">
                        <select id="upperLocgovCode" onchange="filterLocgov()">
                            <option value="">시·도 선택</option>
                            <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                        </select>
                        <select id="locgovCode" name="locgovCode" required form="offgiveForm">
                            <option value="">시·군·구 선택</option>
                            <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                    th:attr="data-upper=${l.upperLocgovCode}"></option>
                        </select>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>기부금액</td>
                <td><input type="number" id="amount" name="amount" required min="1" form="offgiveForm"> 원</td>
            </tr>
            <tr><td class="label">접수은행/지점</td><td><input type="text" id="rceptBankNm" name="rceptBankNm" maxlength="100" placeholder="예: 농협은행 순천지점" form="offgiveForm"></td></tr>
            </tbody>
        </table>
    </div>
    <form id="offgiveForm" th:action="@{/offgive}" method="post"></form>
    <div class="btn_all btn_center">
        <div class="flex_box gap-08">
            <button type="submit" form="offgiveForm" class="btn btn-dark-gray btn-small">현장접수 등록</button>
            <a th:href="@{/offgive}" class="btn btn-dark-default btn-small">취소</a>
        </div>
    </div>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
filterLocgov();
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
