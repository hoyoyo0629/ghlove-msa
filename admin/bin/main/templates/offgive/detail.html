<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프라인기부 접수 상세 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/offgive/detail.jsp("기탁서") 재현. 취소/변경신청은 이미 있는
     give-reqmng으로 그대로 연결한다(offgive 전용 취소 로직을 새로 만들지 않음 - 포인트
     사용이력 체크 등 기존 워크플로가 이미 완전히 검증되어 있음). 생년월일/연락처/주소는
     admin의 MemberClient.MemberInfo에 이미 있던 필드라 템플릿만 고치면 됐다("답례품 선택"/
     "배송지주소"는 이 프로젝트에서 답례품이 별도 order/gift 서비스 흐름이라 접수 시점엔
     해당 없음, "약관동의"/"전자납부번호"/"금년도 누적 기부액"은 대응 데이터 자체가 없어 생략). -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/offgive}">오프라인기부 접수 관리</a></div>
    <h3><span>기탁서</span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write" th:if="${donation != null}">
        <table class="board_write_table" summary="기탁서">
            <colgroup><col style="width:180px;"><col></colgroup>
            <tbody>
            <tr><td class="label">접수번호</td><td th:text="${donation.cntrSn()}"></td></tr>
            <tr><td class="label">신청일</td><td th:text="${donation.cntrDe()}"></td></tr>
            <tr><td class="label">아이디</td><td th:text="${member != null ? member.loginId() : '-'}"></td></tr>
            <tr><td class="label">기부자명</td><td th:text="${member != null ? member.userName() : '-'}"></td></tr>
            <tr><td class="label">생년월일</td><td th:text="${member != null ? member.birthday() : '-'}"></td></tr>
            <tr><td class="label">연락처</td><td th:text="${member != null ? member.phoneNumber() : '-'}"></td></tr>
            <tr><td class="label">주소</td><td th:text="${member != null ? member.address() : '-'}"></td></tr>
            <tr><td class="label">기부 지자체</td><td th:text="${donation.cntrLocgovCode()}"></td></tr>
            <tr><td class="label">기부금액</td><td th:text="${#numbers.formatInteger(donation.cntrAmt(), 0, 'COMMA')} + '원'"></td></tr>
            <tr><td class="label">접수은행</td><td th:text="${donation.rceptBankNm()}"></td></tr>
            <tr><td class="label">상태</td><td th:text="${donation.cntrSttusCode()}"></td></tr>
            <tr><td class="label">접수경로</td><td th:text="${donation.cntrPathCode() == '100' ? '온라인' : (donation.cntrPathCode() == '200' ? '오프라인' : donation.cntrPathCode())}"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="btn_all btn_center" style="margin-top:20px;" th:if="${donation != null}">
        <a th:href="@{/give-reqmng/new(cntrSn=${donation.cntrSn()})}" class="btn btn-dark-gray btn-small">변경신청(취소/포인트생성)</a>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
