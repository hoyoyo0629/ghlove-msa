<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 판매 랭킹 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <style>
        .rank-thumb { width:40px; height:40px; object-fit:cover; border-radius:4px; background:#f0f0f0; vertical-align:middle; margin-right:6px; }
        .error-box { color:#c00; background:#fdecec; border:1px solid #f5b5b5; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
        .search-box { border:1px solid #ddd; border-radius:6px; padding:12px; margin:12px 0; background:#f9f9f9; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>답례품 판매 랭킹 관리</h3>
    <p style="color:#666; margin-bottom:12px;">
        카테고리(그룹)코드별로 노출할 답례품 순서를 관리자가 직접 큐레이션합니다.
        공개 페이지는 <code>GET /api/ranking/{그룹코드}</code>에서 이 순서 그대로 노출됩니다.
    </p>
    <div class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form method="get" th:action="@{/admin/ranking}" class="field" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <input list="group-list" name="categoryUrl" th:value="${categoryUrl}" placeholder="그룹코드 (예: ALL, GIFT01)" style="width:220px;">
        <datalist id="group-list">
            <option th:each="g : ${groups}" th:value="${g}"></option>
        </datalist>
        <button type="submit" class="btn">조회</button>
    </form>

    <div th:if="${categoryUrl != null and !categoryUrl.isBlank()}">
        <h4 th:text="'그룹: ' + ${categoryUrl}"></h4>

        <table class="board_list_table">
            <thead>
            <tr><th>순서</th><th>상품</th><th>지자체</th><th>판매가</th><th>처리</th></tr>
            </thead>
            <tbody>
            <tr th:each="r,rStat : ${rows}">
                <td th:text="${rStat.count}"></td>
                <td>
                    <img th:if="${r.thumbnailUrl()}" class="rank-thumb" th:src="${r.thumbnailUrl()}" alt="">
                    <span th:text="${r.itemName()} + ' (#' + ${r.itemId()} + ')'"></span>
                </td>
                <td th:text="${r.locgovCode()}"></td>
                <td th:text="${r.salePrice() != null ? #numbers.formatInteger(r.salePrice(), 0, 'COMMA') + '원' : '-'}"></td>
                <td>
                    <form th:action="@{/admin/ranking/{id}/move(id=${r.rankingId()},direction='up',categoryUrl=${categoryUrl})}" method="post" style="display:inline;">
                        <button type="submit" class="small-btn" th:disabled="${rStat.first}">▲</button>
                    </form>
                    <form th:action="@{/admin/ranking/{id}/move(id=${r.rankingId()},direction='down',categoryUrl=${categoryUrl})}" method="post" style="display:inline;">
                        <button type="submit" class="small-btn" th:disabled="${rStat.last}">▼</button>
                    </form>
                    <form th:action="@{/admin/ranking/{id}/delete(id=${r.rankingId()},categoryUrl=${categoryUrl})}" method="post" style="display:inline;"
                          onsubmit="return confirm('랭킹에서 제외하시겠습니까?')">
                        <button type="submit" class="small-btn danger">제외</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(rows)}">이 그룹에 등록된 랭킹이 없습니다.</p>

        <div class="search-box">
            <h4>상품 추가</h4>
            <form method="get" th:action="@{/admin/ranking}" style="display:flex; gap:8px; align-items:center;">
                <input type="hidden" name="categoryUrl" th:value="${categoryUrl}">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명 검색">
                <button type="submit" class="btn">검색</button>
            </form>
            <table class="board_list_table" th:if="${keyword != null and !keyword.isBlank()}" style="margin-top:10px;">
                <thead>
                <tr><th>상품ID</th><th>상품명</th><th>지자체</th><th>판매가</th><th>추가</th></tr>
                </thead>
                <tbody>
                <tr th:each="it : ${searchResults}">
                    <td th:text="${it.itemId()}"></td>
                    <td th:text="${it.itemName()}"></td>
                    <td th:text="${it.locgovCode()}"></td>
                    <td th:text="${it.salePrice() != null ? #numbers.formatInteger(it.salePrice(), 0, 'COMMA') + '원' : '-'}"></td>
                    <td>
                        <form th:action="@{/admin/ranking/add}" method="post" style="display:inline;">
                            <input type="hidden" name="categoryUrl" th:value="${categoryUrl}">
                            <input type="hidden" name="itemId" th:value="${it.itemId()}">
                            <button type="submit" class="small-btn">+ 추가</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="empty" th:if="${keyword != null and !keyword.isBlank() and #lists.isEmpty(searchResults)}">검색 결과가 없습니다.</p>
        </div>
    </div>
    <p class="empty" th:if="${categoryUrl == null or categoryUrl.isBlank()}">그룹코드를 입력해 조회하세요. (예: 사이트 전체 랭킹은 "ALL")</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
