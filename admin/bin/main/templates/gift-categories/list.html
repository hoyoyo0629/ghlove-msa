<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 카테고리 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <style>
        .cat-major { border:1px solid #ddd; border-radius:6px; padding:14px; margin-bottom:16px; background:#fff; }
        .cat-major-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .cat-major-head h4 { margin:0; }
        .cat-code { color:#999; font-size:12px; margin-left:6px; }
        .cat-off { color:#c00; font-size:12px; margin-left:6px; }
        .cat-actions form { display:inline; }
        .cat-actions .small-btn { margin-left:4px; }
        .cat-sub { margin:10px 0 0 20px; padding:10px 12px; background:#f7f7f7; border-radius:4px; }
        .cat-sub-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .cat-item-table { width:100%; margin-top:8px; border-collapse:collapse; }
        .cat-item-table td { padding:3px 4px; border-bottom:1px solid #e8e8e8; font-size:13px; }
        .cat-item-table input[type=text] { width:180px; }
        .cat-item-new { margin-top:6px; }
        .error-box { color:#c00; background:#fdecec; border:1px solid #f5b5b5; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>답례품 카테고리 관리</h3>
    <p style="color:#666; margin-bottom:12px;">
        답례품몰 GNB "전체 카테고리" 메가메뉴가 실제로 읽는 대분류(GIFT_CATEGORY) &gt; 중분류 &gt; 개별품목 3단계 트리입니다.
        여기서 변경하면 스토어프론트에 즉시 반영됩니다.
    </p>
    <div class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <p><a class="btn" th:href="@{/admin/gift-categories/majors/new}">+ 대분류 등록</a></p>

    <div class="cat-major" th:each="m,mStat : ${majors}">
        <div class="cat-major-head">
            <h4>
                <span th:text="${m.label()}"></span>
                <span class="cat-code" th:text="'[' + ${m.id()} + ']'"></span>
                <span class="cat-off" th:if="${m.useYn() != 'Y'}">비노출</span>
            </h4>
            <div class="cat-actions">
                <a class="small-btn" th:href="@{/admin/gift-categories/subcategories/new(categoryCode=${m.id()})}">+ 중분류 추가</a>
                <a class="small-btn" th:href="@{/admin/gift-categories/majors/{id}/edit(id=${m.id()})}">수정</a>
                <form th:action="@{/admin/gift-categories/majors/{id}/move(id=${m.id()},direction='up')}" method="post">
                    <button type="submit" class="small-btn" th:disabled="${mStat.first}">▲</button>
                </form>
                <form th:action="@{/admin/gift-categories/majors/{id}/move(id=${m.id()},direction='down')}" method="post">
                    <button type="submit" class="small-btn" th:disabled="${mStat.last}">▼</button>
                </form>
                <form th:action="@{/admin/gift-categories/majors/{id}/delete(id=${m.id()})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까? 이 대분류를 쓰는 답례품/하위 중분류가 있으면 삭제할 수 없습니다.')">
                    <button type="submit" class="small-btn danger">삭제</button>
                </form>
            </div>
        </div>

        <div class="cat-sub" th:each="s,sStat : ${m.subcategories()}">
            <div class="cat-sub-head">
                <strong th:text="${s.name()}"></strong>
                <div class="cat-actions">
                    <a class="small-btn" th:href="@{/admin/gift-categories/subcategories/{id}/edit(id=${s.subcategoryId()})}">수정(SEO 포함)</a>
                    <form th:action="@{/admin/gift-categories/subcategories/{id}/move(id=${s.subcategoryId()},direction='up')}" method="post">
                        <button type="submit" class="small-btn" th:disabled="${sStat.first}">▲</button>
                    </form>
                    <form th:action="@{/admin/gift-categories/subcategories/{id}/move(id=${s.subcategoryId()},direction='down')}" method="post">
                        <button type="submit" class="small-btn" th:disabled="${sStat.last}">▼</button>
                    </form>
                    <form th:action="@{/admin/gift-categories/subcategories/{id}/delete(id=${s.subcategoryId()})}" method="post"
                          onsubmit="return confirm('삭제하시겠습니까? 하위 개별품목도 함께 삭제됩니다.')">
                        <button type="submit" class="small-btn danger">삭제</button>
                    </form>
                </div>
            </div>

            <table class="cat-item-table">
                <tr th:each="it,iStat : ${s.items()}">
                    <td style="width:26px;">
                        <form th:action="@{/admin/gift-categories/items/{id}/move(id=${it.subcategoryItemId()},direction='up')}" method="post" style="display:inline;">
                            <button type="submit" th:disabled="${iStat.first}" title="위로">▲</button>
                        </form>
                        <form th:action="@{/admin/gift-categories/items/{id}/move(id=${it.subcategoryItemId()},direction='down')}" method="post" style="display:inline;">
                            <button type="submit" th:disabled="${iStat.last}" title="아래로">▼</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/admin/gift-categories/items/{id}(id=${it.subcategoryItemId()})}" method="post" style="display:inline;">
                            <input type="hidden" name="subcategoryId" th:value="${s.subcategoryId()}">
                            <input type="text" name="name" th:value="${it.name()}">
                            <button type="submit" class="small-btn">저장</button>
                        </form>
                        <form th:action="@{/admin/gift-categories/items/{id}/delete(id=${it.subcategoryItemId()})}" method="post" style="display:inline;"
                              onsubmit="return confirm('삭제하시겠습니까?')">
                            <button type="submit" class="small-btn danger">삭제</button>
                        </form>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(s.items())}" style="font-size:12px; color:#999;">등록된 개별품목이 없습니다.</p>
            <form class="cat-item-new" th:action="@{/admin/gift-categories/items}" method="post">
                <input type="hidden" name="subcategoryId" th:value="${s.subcategoryId()}">
                <input type="text" name="name" placeholder="새 개별품목명" required>
                <button type="submit" class="small-btn">+ 품목 추가</button>
            </form>
        </div>
        <p th:if="${#lists.isEmpty(m.subcategories())}" class="empty" style="margin-left:20px; color:#999;">등록된 중분류가 없습니다.</p>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(majors)}">등록된 카테고리가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
