<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${qna.subject} + ' - 1:1 문의 관리 - 고향사랑e음 (admin service)'">1:1 문의 관리</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/qna-admin}">1:1 문의 관리</a></div>
    <h3><span th:text="${qna.subject}"></span></h3>

    <p class="error" th:if="${param.errorMessage}" th:text="${param.errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="문의내용" style="margin-bottom:20px;">
            <colgroup><col style="width:180px;"><col></colgroup>
            <tbody>
            <tr><td class="label">분류</td><td th:text="${qna.qnaGroup}"></td></tr>
            <tr><td class="label">작성자</td><td th:text="${qna.userName} + ' (' + ${qna.email} + ')'"></td></tr>
            <tr><td class="label">작성일</td><td th:text="${qna.createdDate}"></td></tr>
            <tr><td class="label">비밀글</td><td th:text="${qna.secretFlag == 'Y'} ? '예' : '아니오'"></td></tr>
            <tr><td class="label">문의내용</td><td th:text="${qna.question}" style="white-space:pre-wrap;"></td></tr>
            <tr th:if="${!#lists.isEmpty(files)}">
                <td class="label">첨부파일</td>
                <td>
                    <div th:each="f : ${files}">
                        <a th:href="@{'/uploads/' + ${f.fileName}}" th:text="${f.orgFileName}"></a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${answer != null}">
        <h4>답변</h4>
        <div class="board_write">
            <table class="board_write_table" summary="답변" style="margin-bottom:20px;">
                <colgroup><col style="width:180px;"><col></colgroup>
                <tbody>
                <tr><td class="label">답변제목</td><td th:text="${answer.title}"></td></tr>
                <tr><td class="label">답변일</td><td th:text="${answer.answerDate}"></td></tr>
                <tr><td class="label">답변내용</td><td th:text="${answer.answer}" style="white-space:pre-wrap;"></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:unless="${answer != null}">
        <h4>답변 작성</h4>
        <div class="board_write">
            <table class="board_write_table" summary="답변 작성">
                <colgroup><col style="width:180px;"><col></colgroup>
                <tbody>
                <tr><td class="label">답변제목</td><td><input type="text" id="title" name="title" th:value="'RE: ' + ${qna.subject}" required form="answerForm"></td></tr>
                <tr><td class="label">답변내용</td><td><textarea id="content" name="content" required minlength="1" rows="6" form="answerForm"></textarea></td></tr>
                </tbody>
            </table>
        </div>
        <form id="answerForm" th:action="@{'/qna-admin/' + ${qna.qnaId} + '/answer'}" method="post"></form>
        <div class="btn_all btn_center">
            <button type="submit" form="answerForm" class="btn btn-dark-gray btn-small">답변 등록</button>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
