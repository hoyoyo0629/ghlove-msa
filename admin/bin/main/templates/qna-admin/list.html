<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 문의 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>1:1 문의 관리</h3>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>ID</th>
            <th>분류</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>비밀글</th>
            <th>답변상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${inquiries}">
            <td th:text="${row.qna().qnaId}"></td>
            <td th:text="${row.qna().qnaGroup}"></td>
            <td><a th:href="@{'/qna-admin/' + ${row.qna().qnaId}}" th:text="${row.qna().subject}"></a></td>
            <td th:text="${row.qna().userName}"></td>
            <td th:text="${row.qna().createdDate}"></td>
            <td th:text="${row.qna().secretFlag == 'Y'} ? '비밀글' : '-'"></td>
            <td>
                <span class="pill" th:classappend="${row.answer() != null} ? 'on' : 'off'"
                      th:text="${row.answer() != null} ? '답변완료' : '답변대기'"></span>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(inquiries)}">1:1문의 정보가 존재하지 않습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
