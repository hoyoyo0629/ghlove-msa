<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>탈퇴회원 조회 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D4 탈퇴회원 조회 (AS-IS opmanager/user/secede-user - SecedeUserManagerController). -->
<div class="contents contents_inner">
    <h3>탈퇴회원 조회</h3>

    <form th:action="@{/admin/secede-users}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="탈퇴회원 검색조건">
                <colgroup><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">탈퇴일자</td>
                    <td>
                        <div class="flex_box gap-08">
                            <input type="date" name="fromDate" th:value="${fromDate}">
                            <span class="wave">~</span>
                            <input type="date" name="toDate" th:value="${toDate}">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">검색조건</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select name="srchKey">
                                <option value="LOGIN_ID" th:selected="${srchKey == 'LOGIN_ID' or srchKey == null}">아이디</option>
                                <option value="LEAVE_REASON" th:selected="${srchKey == 'LEAVE_REASON'}">탈퇴사유</option>
                            </select>
                            <input type="text" name="srchValue" th:value="${srchValue}" placeholder="검색어">
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-small" onclick="searchClear()">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="탈퇴회원목록">
        <caption>탈퇴회원목록</caption>
        <thead>
        <tr>
            <th scope="col">아이디</th>
            <th scope="col">이름</th>
            <th scope="col">탈퇴일</th>
            <th scope="col">탈퇴사유</th>
            <th scope="col">상세</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${list}">
            <td th:text="${s.loginId}"></td>
            <td th:text="${s.userName}"></td>
            <td th:text="${s.leaveDate != null and #strings.length(s.leaveDate) >= 8}
                          ? ${#strings.substring(s.leaveDate,0,4) + '-' + #strings.substring(s.leaveDate,4,6) + '-' + #strings.substring(s.leaveDate,6,8)}
                          : ''"></td>
            <td th:text="${s.leaveReason} ?: '-'"></td>
            <td><a th:href="@{'/admin/members/' + ${s.userId}}" class="small-btn">상세보기</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">조건에 맞는 탈퇴회원이 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/admin/secede-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/admin/secede-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/admin/secede-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>

<script th:inline="none">
function searchClear() {
    location.href = /*[[@{/admin/secede-users}]]*/ '/admin/secede-users';
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
