<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배치 작업 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/batch-job}">배치 작업 스케줄러</a></div>
    <h3><span th:text="${job.batchJobId} != null ? '배치 작업 수정' : '배치 작업 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="배치 작업 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label"><span class="required_mark">*</span>작업명</td><td><input type="text" id="jobName" name="jobName" th:value="${job.jobName}" required form="jobForm"></td></tr>
            <tr><td class="label"><span class="required_mark">*</span>실행 메서드명</td><td><input type="text" id="jobMethod" name="jobMethod" th:value="${job.jobMethod}" required form="jobForm"></td></tr>
            <tr>
                <td class="label">트리거 종류</td>
                <td>
                    <label><input type="radio" name="triggerType" value="1" th:checked="${job.triggerType == null or job.triggerType == '1'}" form="jobForm"> 심플(초 반복)</label>
                    <label><input type="radio" name="triggerType" value="2" th:checked="${job.triggerType == '2'}" form="jobForm"> 크론</label>
                </td>
            </tr>
            <tr><td class="label">반복 초 (심플인 경우)</td><td><input type="text" id="triggerRepeatSeconds" name="triggerRepeatSeconds" th:value="${job.triggerRepeatSeconds}" form="jobForm"></td></tr>
            <tr><td class="label">크론 표현식 (크론인 경우)</td><td><input type="text" id="triggerCronExpression" name="triggerCronExpression" th:value="${job.triggerCronExpression}" placeholder="0 0 1 * * *" form="jobForm"></td></tr>
            <tr><td class="label">정렬순서</td><td><input type="number" id="ordering" name="ordering" th:value="${job.ordering}" form="jobForm"></td></tr>
            </tbody>
        </table>
    </div>
    <form id="jobForm" th:action="${job.batchJobId} != null ? @{'/batch-job/' + ${job.batchJobId}} : @{/batch-job}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="jobForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
