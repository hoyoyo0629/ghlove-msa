<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>약관 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/policy}">약관관리</a></div>
    <h3><span th:text="${policy.policyId} != null ? '약관 수정' : '약관 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="약관 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">유형</td>
                <td>
                    <select id="policyType" name="policyType" form="policyForm">
                        <option th:each="e : ${typeLabels}" th:value="${e.key}" th:text="${e.value}"
                                th:selected="${e.key == policy.policyType}"></option>
                    </select>
                </td>
            </tr>
            <tr><td class="label"><span class="required_mark">*</span>제목</td><td><input type="text" id="title" name="title" th:value="${policy.title}" required form="policyForm"></td></tr>
            <tr><td class="label">내용</td><td><textarea id="content" name="content" rows="14" th:text="${policy.content}" form="policyForm"></textarea></td></tr>
            <tr><td class="label">전시함</td><td><input type="checkbox" name="exhibitionStatus" value="Y" th:checked="${policy.exhibitionStatus == 'Y'}" form="policyForm"></td></tr>
            <tr><td class="label">전시 시작</td><td><input type="text" id="exhibitionStartDate" name="exhibitionStartDate" th:value="${policy.exhibitionStartDate}" placeholder="yyyyMMddHHmmss" form="policyForm"></td></tr>
            <tr><td class="label">전시 종료</td><td><input type="text" id="exhibitionEndDate" name="exhibitionEndDate" th:value="${policy.exhibitionEndDate}" placeholder="yyyyMMddHHmmss" form="policyForm"></td></tr>
            </tbody>
        </table>
    </div>
    <form id="policyForm" th:action="${policy.policyId} != null ? @{'/policy/' + ${policy.policyId}} : @{/policy}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="policyForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
