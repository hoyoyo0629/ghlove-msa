<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${boardTitle} + ' - 고향사랑e음 (admin service)'"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{'/community/' + ${boardType}}" th:text="${boardTitle}"></a></div>
    <h3><span th:text="${post.bbsId} != null ? '글 수정' : '글 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="글 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr th:if="${isFaq}">
                <td class="label">유형</td>
                <td>
                    <select id="faqType" name="faqType" form="postForm">
                        <option th:each="e : ${faqTypes}" th:value="${e.key}" th:text="${e.value}"
                                th:selected="${e.key == post.faqType}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="bbsTtl" name="bbsTtl" th:value="${post.bbsTtl}" required form="postForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>내용</td>
                <td><textarea id="bbsCn" name="bbsCn" rows="10" th:text="${post.bbsCn}" required form="postForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">공지로 등록</td>
                <td><input type="checkbox" name="noticeYn" th:checked="${post.noticeYn == 'Y'}" form="postForm"></td>
            </tr>
            <tr>
                <td class="label">비밀글</td>
                <td><input type="checkbox" name="isSecret" th:checked="${post.isSecret == 'Y'}" form="postForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="postForm" th:action="${post.bbsId} != null ? @{'/community/' + ${boardType} + '/' + ${post.bbsId}} : @{'/community/' + ${boardType}}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="postForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
