<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${boardTitle} + ' - 고향사랑e음 (admin service)'"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3 th:text="${boardTitle}"></h3>
    <p style="color:#666; margin-bottom:16px;">지자체 담당자 ↔ 행안부 내부 소통용 게시판입니다.</p>
    <p><a class="btn" th:href="@{'/community/' + ${boardType} + '/new'}">+ 글 등록</a></p>

    <table class="board_list_table">
        <thead>
        <tr>
            <th th:if="${isFaq}">유형</th>
            <th>제목</th><th>공지</th><th>비밀글</th><th>조회수</th><th>등록일</th><th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${posts}">
            <td th:if="${isFaq}" th:text="${faqTypes.get(p.faqType)} ?: ${p.faqType}"></td>
            <td><a th:href="@{'/community/' + ${boardType} + '/' + ${p.bbsId} + '/edit'}" th:text="${p.bbsTtl}"></a></td>
            <td th:text="${p.noticeYn == 'Y' ? '공지' : ''}"></td>
            <td th:text="${p.isSecret == 'Y' ? '비밀글' : ''}"></td>
            <td th:text="${p.inqCnt}"></td>
            <td th:text="${p.frstCrtDt != null ? #temporals.format(p.frstCrtDt, 'yyyy-MM-dd HH:mm') : ''}"></td>
            <td>
                <a class="small-btn" th:href="@{'/community/' + ${boardType} + '/' + ${p.bbsId} + '/edit'}">수정</a>
                <form th:action="@{'/community/' + ${boardType} + '/' + ${p.bbsId} + '/delete'}" method="post" class="inline-form"
                      onsubmit="return confirm('삭제하시겠습니까?')">
                    <button type="submit" class="small-btn danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(posts)}">등록된 글이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
