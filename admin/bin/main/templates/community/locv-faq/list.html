<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지자체FAQ 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>지자체FAQ 관리</h3>
    <p style="color:#666; margin-bottom:16px;">고객센터 FAQ(공개 화면)에 실제로 노출되는 콘텐츠입니다.</p>
    <!-- AS-IS 실제 권한: 지자체담당자(ROLE_ADMIN_5/6)는 조회만 가능, 쓰기는 시스템/행안부 전용
         (LocgFaqAdminController.requireWriteAccess) - 아예 못 누르게 버튼 자체를 숨긴다. -->
    <p th:unless="${loginManager.authority == 'ROLE_ADMIN_5' or loginManager.authority == 'ROLE_ADMIN_6'}">
        <a class="btn" th:href="@{/community/locv-faq/new}">+ FAQ 등록</a>
    </p>

    <table class="board_list_table">
        <thead>
        <tr><th>유형</th><th>제목</th><th>조회수</th><th>사용여부</th><th>수정일</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="f : ${faqs}" th:with="readOnly=${loginManager.authority == 'ROLE_ADMIN_5' or loginManager.authority == 'ROLE_ADMIN_6'}">
            <td th:text="${faqTypes.get(f.faqType)} ?: ${f.faqType}"></td>
            <td>
                <a th:unless="${readOnly}" th:href="@{'/community/locv-faq/' + ${f.id} + '/edit'}" th:text="${f.subject}"></a>
                <span th:if="${readOnly}" th:text="${f.subject}"></span>
            </td>
            <td th:text="${f.hits}"></td>
            <td>
                <span class="pill" th:classappend="${f.useYn == 'Y'} ? 'on' : 'off'"
                      th:text="${f.useYn == 'Y'} ? '사용' : '중지'"></span>
            </td>
            <td th:text="${f.updatedDate != null ? #temporals.format(f.updatedDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
            <td th:unless="${readOnly}">
                <a class="small-btn" th:href="@{'/community/locv-faq/' + ${f.id} + '/edit'}">수정</a>
                <form th:action="@{'/community/locv-faq/' + ${f.id} + '/toggle'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn ghost" th:text="${f.useYn == 'Y'} ? '중지' : '재사용'"></button>
                </form>
                <form th:action="@{'/community/locv-faq/' + ${f.id} + '/delete'}" method="post" class="inline-form"
                      onsubmit="return confirm('삭제하시겠습니까?')">
                    <button type="submit" class="small-btn danger">삭제</button>
                </form>
            </td>
            <td th:if="${readOnly}">-</td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(faqs)}">등록된 FAQ가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
