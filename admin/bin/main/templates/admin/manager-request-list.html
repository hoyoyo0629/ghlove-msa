<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자권한요청 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/manager-request/list.jsp 재현 (승인/거절, AS-IS CONFM_STTUS_CODE
     100/300 그대로). 승인하면 OP_MANAGER 행이 새로 만들어지고 임시 비밀번호가 발급되는데,
     이 프로젝트의 이메일 모크 정책과 동일하게 실제 메일 대신 이 화면에 1회 노출한다. -->
<div class="contents contents_inner">
    <h3>관리자 권한 요청</h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p th:if="${tempPassword}" class="dev-code" style="background:#eef4ff;color:#1a73e8;padding:10px;border-radius:4px;">
        <strong th:text="${approvedLoginId}"></strong> 계정이 승인되었습니다. 임시 비밀번호:
        <strong th:text="${tempPassword}"></strong> (신청자에게 별도로 전달해 주세요 - 다시 확인할 수 없습니다)
    </p>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>아이디</th>
            <th>소속구분</th>
            <th>부서/직위/직급</th>
            <th>연락처</th>
            <th>신청일</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${pending}">
            <td th:text="${r.loginId}"></td>
            <td th:text="${reqstSeCodeLabels.get(r.reqstSeCode)} ?: ${r.reqstSeCode}"></td>
            <td th:text="${r.psitnDeptNm} + ' / ' + ${r.psitnNm} + ' / ' + ${r.ofcpsNm}"></td>
            <td th:text="${r.cttpc}"></td>
            <td th:text="${#strings.substring(r.frstRegistPnttm, 0, 8)}"></td>
            <td>
                <!-- AS-IS 실제 6단계 권한 중 하나를 승인 시점에 직접 부여한다(ROLE_ADMIN_5/6을
                     고르면 소속 지자체도 같이 지정 - MenuService.LOCGOV_SCOPED_ROLES). -->
                <form th:action="@{'/admin/manager-requests/' + ${r.userId} + '/' + ${r.reqstSn} + '/approve'}"
                      method="post" class="approve-form" style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">
                    <select name="authority" class="authority-select" required onchange="toggleLocgovSelects(this)">
                        <option value="">권한 선택</option>
                        <option th:each="role : ${roles}" th:value="${role.authority}" th:text="${role.roleName}"></option>
                    </select>
                    <span class="locgov-selects" style="display:none;">
                        <select class="upper-locgov-select" onchange="filterLocgovOptions(this)">
                            <option value="">시·도</option>
                            <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                        </select>
                        <select name="assignedLocgovCode" class="locgov-select">
                            <option value="">시·군·구</option>
                            <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                                    th:attr="data-upper=${l.upperLocgovCode}"></option>
                        </select>
                    </span>
                    <button type="submit" class="small-btn">승인</button>
                </form>
                <form th:action="@{'/admin/manager-requests/' + ${r.userId} + '/' + ${r.reqstSn} + '/reject'}" method="post" class="inline-form"
                      onsubmit="return fillRejectReason(this)">
                    <input type="hidden" name="reason">
                    <button type="submit" class="small-btn ghost">거절</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(pending)}">대기 중인 요청이 없습니다.</p>
</div>

<script th:inline="none">
function fillRejectReason(form) {
    var reason = prompt('거절 사유를 입력해 주세요.');
    if (!reason) { return false; }
    form.reason.value = reason;
    return true;
}

/** ROLE_ADMIN_5/6(지자체 정·부담당자)을 고르면 소속 지자체 선택칸을 보여주고 필수로 만든다. */
function toggleLocgovSelects(select) {
    var form = select.closest('.approve-form');
    var wrap = form.querySelector('.locgov-selects');
    var locgovSelect = form.querySelector('.locgov-select');
    var scoped = select.value === 'ROLE_ADMIN_5' || select.value === 'ROLE_ADMIN_6';
    wrap.style.display = scoped ? 'inline-flex' : 'none';
    locgovSelect.required = scoped;
}

function filterLocgovOptions(upperSelect) {
    var form = upperSelect.closest('.approve-form');
    var upper = upperSelect.value;
    var locgovSelect = form.querySelector('.locgov-select');
    Array.prototype.forEach.call(locgovSelect.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
