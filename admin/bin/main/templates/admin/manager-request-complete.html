<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 권한 요청 완료 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<!-- login.html/manager-request-form.html과 같은 버그(자체발명 .wrap narrow 래퍼라
     opmanager.css가 하나도 안 먹음)를 여기도 똑같이 갖고 있어서 같은 admin_wrap 골격으로
     맞췄다. AS-IS엔 이 완료 화면 자체가 없다(신청 후 목록으로 바로 돌아감) - 그래도
     같은 흐름 안의 화면이니 로그인/권한요청 화면과 시각적으로 통일했다. -->
<div class="admin_wrap">
    <div id="header">
        <div class="header_wrap">
            <h1><a th:href="@{/admin/login}"><img th:src="@{/content/opmanager/images/img_logo.png}" alt="고향사랑기부제"></a></h1>
            <div class="tnb"></div>
        </div>
    </div>

    <div id="container" class="login">
        <div class="login_cont" style="text-align:center;">
            <div class="login_tit">신청이 접수되었습니다</div>
            <p class="login_sub_tit">시스템관리자 승인 후 로그인하실 수 있습니다.</p>
            <p style="margin-top:20px;"><a class="btn btn-dark-gray" th:href="@{/admin/login}"><span>로그인 화면으로</span></a></p>
        </div>
    </div>

    <div id="footer">
        <div class="footer_wrap">
            <span class="copy">© Ministry of the interior and safety. All rights reserved.</span>
        </div>
    </div>
</div>
</body>
</html>
