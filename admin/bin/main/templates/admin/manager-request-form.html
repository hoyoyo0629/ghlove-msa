<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 권한 요청 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<!-- AS-IS opmanager/manager-request/form.jsp 재현. 실제 AS-IS도 login_main.jsp와 동일한
     `.admin_wrap > #header + #container.login > .login_cont` 골격을 쓴다(admin/login.html의
     같은 버그를 여기서도 발견 - 자체발명 `.wrap narrow` 래퍼라 opmanager.css의
     `.admin_wrap .board_write_table`류 스타일이 하나도 안 먹고 있었다). AS-IS는 로그인
     화면에서 아이디/비번을 다시 입력해 신원을 확인하지만, 여기서는 SFR-010 공유 JWT로
     이미 로그인된 회원임을 확인하고(ManagerRequestController) 이름/휴대폰/이메일/생년월일을
     그대로 채워 보여준다(수정 불가 - member 서비스가 진실 소스). AS-IS는 소속구분(공무원/
     제공자/오프라인담당 등)에 따라 은행/행정복지센터/부서 선택란이 동적으로 바뀌는 복잡한
     분기가 있는데, 이 프로젝트는 지자체 담당자 승인 흐름만 지원하므로(ManagerRequestController
     참고) 그 분기는 재현하지 않고 담당 지자체+소속부서/직급/직위/연락처만 받는다. -->
<div class="admin_wrap">
    <div id="header">
        <div class="header_wrap">
            <h1><a th:href="@{/admin/login}"><img th:src="@{/content/opmanager/images/img_logo.png}" alt="고향사랑기부제"></a></h1>
            <div class="tnb"></div>
        </div>
    </div>

    <div id="container" class="login">
        <div class="login_cont">
            <div class="login_tit mt-70">관리자 권한 요청</div>
            <div class="login_sub_tit">최초 1회 로그인시 관리자 권한 요청페이지를 작성하셔야 합니다.<br>승인 후 정상적으로 이용이 가능합니다.</div>

            <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

            <div class="form-wrap">
                <form th:action="@{/admin/manager-requests/new}" method="post">
                    <div class="board_write">
                        <table class="board_write_table">
                            <colgroup><col style="width:220px;"><col></colgroup>
                            <tbody>
                            <tr>
                                <td class="label">아이디</td>
                                <td><p class="txt" th:text="${member.loginId}"></p></td>
                            </tr>
                            <tr>
                                <td class="label">이름</td>
                                <td><p class="txt" th:text="${member.userName}"></p></td>
                            </tr>
                            <tr>
                                <td class="label">휴대폰</td>
                                <td><p class="txt" th:text="${member.phoneNumber}"></p></td>
                            </tr>
                            <tr>
                                <td class="label">이메일 주소</td>
                                <td><p class="txt" th:text="${member.email}"></p></td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>소속구분</td>
                                <td>
                                    <select id="reqstSeCode" name="reqstSeCode" required>
                                        <option value="">선택해 주세요</option>
                                        <option th:each="c : ${reqstSeCodeList}" th:value="${c.key}" th:text="${c.value}"></option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>담당 광역지자체</td>
                                <td>
                                    <select id="locgovCode" name="locgovCode" required>
                                        <option value="">선택해 주세요</option>
                                        <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"></option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">소속 부서</td>
                                <td><input type="text" id="psitnDeptNm" name="psitnDeptNm" placeholder="예: 재정담당관"></td>
                            </tr>
                            <tr>
                                <td class="label">직급</td>
                                <td><input type="text" id="ofcpsNm" name="ofcpsNm" placeholder="예: 주무관"></td>
                            </tr>
                            <tr>
                                <td class="label">직위</td>
                                <td><input type="text" id="psitnNm" name="psitnNm" placeholder="예: 팀장"></td>
                            </tr>
                            <tr>
                                <td class="label">연락처</td>
                                <td><input type="text" id="cttpc" name="cttpc" placeholder="02-0000-0000"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="button_wrap">
                        <button type="submit" class="btn btn-dark-gray btn-large"><span>관리자 권한 요청하기</span></button>
                        <a th:href="@{/admin/login}" class="btn btn-dark-gray btn-mid h-large"><span>취소</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer">
        <div class="footer_wrap">
            <span class="copy">© Ministry of the interior and safety. All rights reserved.</span>
        </div>
    </div>
</div>
</body>
</html>
