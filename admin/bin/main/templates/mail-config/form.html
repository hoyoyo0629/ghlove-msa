<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${label} + ' 메일설정 - 고향사랑e음 (admin service)'"></title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/mail-config}">메일설정 관리</a></div>
    <h3><span th:text="${label} + ' 메일설정'"></span></h3>

    <p class="success" th:if="${param.message}" th:text="${param.message}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="메일설정 기본정보">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">템플릿 제목(관리용)</td><td><input type="text" id="title" name="title" th:value="${mailConfig.title}" form="mailForm"></td></tr>
            <tr><td class="label">SMS 동시발송</td><td><input type="checkbox" name="smsConfig" value="Y" th:checked="${mailConfig.smsConfig == 'Y'}" form="mailForm"> 문자(SMS)도 함께 발송</td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">구매자(기부자) 발송</h4>
    <div class="board_write">
        <table class="board_write_table" summary="구매자 발송">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">제목</td><td><input type="text" id="buyerSubject" name="buyerSubject" th:value="${mailConfig.buyerSubject}" form="mailForm"></td></tr>
            <tr><td class="label">본문</td><td><textarea id="buyerContent" name="buyerContent" rows="6" th:text="${mailConfig.buyerContent}" form="mailForm"></textarea></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">관리자 발송</h4>
    <div class="board_write">
        <table class="board_write_table" summary="관리자 발송">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">제목</td><td><input type="text" id="adminSubject" name="adminSubject" th:value="${mailConfig.adminSubject}" form="mailForm"></td></tr>
            <tr><td class="label">본문</td><td><textarea id="adminContent" name="adminContent" rows="6" th:text="${mailConfig.adminContent}" form="mailForm"></textarea></td></tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">판매자(제공자) 발송</h4>
    <div class="board_write">
        <table class="board_write_table" summary="판매자 발송">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">제목</td><td><input type="text" id="sellerSubject" name="sellerSubject" th:value="${mailConfig.sellerSubject}" form="mailForm"></td></tr>
            <tr><td class="label">본문</td><td><textarea id="sellerContent" name="sellerContent" rows="6" th:text="${mailConfig.sellerContent}" form="mailForm"></textarea></td></tr>
            </tbody>
        </table>
    </div>

    <form id="mailForm" th:action="@{'/mail-config/' + ${mailConfig.templateId}}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="mailForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
