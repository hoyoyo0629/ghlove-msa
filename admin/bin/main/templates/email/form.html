<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메일 작성 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/email}">이메일 발송</a></div>
    <h3><span>메일 작성</span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="메일 작성">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">발송대상</td>
                <td>
                    <label><input type="radio" name="authTarget" value="A" checked form="emailForm"> 전체 관리자</label>
                    <label><input type="radio" name="authTarget" value="D" form="emailForm"> ROLE_ADMIN만</label>
                    <label><input type="radio" name="authTarget" value="O" form="emailForm"> ROLE_OPERATOR만</label>
                </td>
            </tr>
            <tr><td class="label"><span class="required_mark">*</span>제목</td><td><input type="text" id="subject" name="subject" required form="emailForm"></td></tr>
            <tr><td class="label"><span class="required_mark">*</span>내용</td><td><textarea id="content" name="content" rows="8" required form="emailForm"></textarea></td></tr>
            </tbody>
        </table>
    </div>
    <form id="emailForm" th:action="@{/email}" method="post" onsubmit="return confirm('선택한 대상에게 즉시 발송합니다. 계속하시겠습니까?')"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="emailForm" class="btn btn-dark-gray btn-small">발송</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
