<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원등급 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/user-levels}">회원등급 관리</a></div>
    <h3><span th:text="${level} != null ? '회원등급 수정' : '회원등급 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="회원등급 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>등급명</td>
                <td><input type="text" name="levelName" th:value="${level != null ? level.levelName : ''}" required form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">단계(depth)</td>
                <td><input type="number" name="depth" th:value="${level != null ? level.depth : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">기준금액(시작)</td>
                <td><input type="number" name="priceStart" th:value="${level != null ? level.priceStart : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">기준금액(끝)</td>
                <td><input type="number" name="priceEnd" th:value="${level != null ? level.priceEnd : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">상시 할인율(%)</td>
                <td><input type="number" step="0.01" name="discountRate" th:value="${level != null ? level.discountRate : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">적립률(%)</td>
                <td><input type="number" step="0.01" name="pointRate" th:value="${level != null ? level.pointRate : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">배송비 할인쿠폰(장)</td>
                <td><input type="number" name="shippingCouponCount" th:value="${level != null ? level.shippingCouponCount : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">유지기간(일)</td>
                <td><input type="number" name="retentionPeriod" th:value="${level != null ? level.retentionPeriod : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">기준기간(일)</td>
                <td><input type="number" name="referencePeriod" th:value="${level != null ? level.referencePeriod : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">매출제외 기준일</td>
                <td><input type="number" name="exceptReferencePeriod" th:value="${level != null ? level.exceptReferencePeriod : 0}" form="levelForm"></td>
            </tr>
            <tr>
                <td class="label">아이콘</td>
                <td>
                    <input type="file" name="icon" accept="image/*" form="levelForm">
                    <div th:if="${level != null and level.fileName != null}">
                        <img th:src="@{${level.fileName}}" style="max-width:80px;margin-top:8px;" alt="현재 아이콘">
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="levelForm" enctype="multipart/form-data"
          th:action="${level} != null ? @{'/admin/user-levels/' + ${level.levelId}} : @{/admin/user-levels}"
          method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="levelForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
