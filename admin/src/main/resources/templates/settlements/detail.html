<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정산 상세 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <p><a th:href="@{/settlements}">&larr; 정산 목록으로</a></p>
    <h1>정산 #<span th:text="${settlement.settlementId}"></span></h1>
    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div class="card" style="margin-bottom:20px; max-width:400px;">
        <div>제공자: <strong th:text="${seller != null ? seller.sellerName() : ('ID ' + settlement.sellerId)}"></strong></div>
        <div>건수: <span th:text="${settlement.orderCount}"></span>건</div>
        <div>포인트 합계: <span th:text="${#numbers.formatInteger(settlement.totalPointAmount, 0, 'COMMA')} + 'P'"></span></div>
        <div>상태: <span th:text="${statusLabels.get(settlement.status)} ?: ${settlement.status}"></span></div>
        <div th:if="${settlement.invoiceNo}">세금계산서 번호: <span th:text="${settlement.invoiceNo}"></span></div>
    </div>

    <!-- AS-IS remittance가 확정 시점에 스냅샷하던 입금계좌 정보 - 입금확인 처리 전에
         어디로 송금해야 하는지 화면에서 바로 보여준다(gift 서비스 실시간 조회). -->
    <div class="card" style="margin-bottom:24px; max-width:400px;" th:if="${seller != null}">
        <div style="font-weight:bold; margin-bottom:6px;">입금계좌</div>
        <div th:text="${seller.bankName()} + ' ' + ${seller.bankAccountNumber()}"></div>
        <div>예금주: <span th:text="${seller.bankInName()}"></span></div>
    </div>
    <p class="empty" th:if="${seller == null}" style="margin-bottom:24px;">제공자 계좌 정보를 조회할 수 없습니다.</p>

    <div style="margin-bottom:24px;">
        <form th:if="${settlement.status == 'GENERATED'}" th:action="@{'/settlements/' + ${settlement.settlementId} + '/invoice'}" method="post" class="inline-form">
            <input type="text" name="invoiceNo" placeholder="세금계산서 번호" required style="width:auto; padding:8px;">
            <button type="submit">세금계산서 발행</button>
        </form>
        <form th:if="${settlement.status == 'INVOICED'}" th:action="@{'/settlements/' + ${settlement.settlementId} + '/deposit'}" method="post" class="inline-form">
            <button type="submit">입금확인 처리</button>
        </form>
        <form th:if="${settlement.status == 'DEPOSITED'}" th:action="@{'/settlements/' + ${settlement.settlementId} + '/close'}" method="post" class="inline-form">
            <button type="submit">정산 마감</button>
        </form>
        <span th:if="${settlement.status == 'CLOSED'}" class="pill on">정산이 완료되었습니다</span>
    </div>

    <h1 style="font-size:16px;">포함된 확정 주문</h1>
    <table>
        <thead>
        <tr>
            <th>주문번호</th>
            <th>품목ID</th>
            <th>수량</th>
            <th>포인트</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.orderId}"></td>
            <td th:text="${o.itemId}"></td>
            <td th:text="${o.quantity}"></td>
            <td th:text="${#numbers.formatInteger(o.pointAmount, 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
