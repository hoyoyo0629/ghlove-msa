<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>공지사항 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/notice/form.jsp 이식(메뉴 5111 공지사항 등록·수정).
     ★ AS-IS는 등록과 수정이 <b>같은 화면</b>이고 noticeId 유무로 버튼만 갈린다
     (5110 지자체공지사항만 edit.jsp가 따로 있다):
     - noticeId != 0 → 상단 [수정][삭제][목록] (역할 조건 없음)
     - noticeId == 0 → 하단 [등록][취소]

     AS-IS verbatim:
     - h3가 M00269다. 표 summary/caption도 M00269.
     - 내용 textarea 클래스가 editor-content 하나다(5110은 w90이 더 붙는다).
     - 게시여부 라디오는 .input-form 으로 하나씩 감싼다(5110은 감싸지 않는다) -
       CSS가 다르게 먹으므로 AS-IS 그대로 유지할 것.
     - 등록 버튼 문구만 리터럴 "등록"이다(5110은 M00088) / 취소는 M00037.
     - 취소 버튼 클래스의 btn-defualt 오타도 AS-IS 그대로다(기존 35곳에서 쓰는 패턴).

     AS-IS 비활성 그대로(옮기지 않음): 노출위치·판매자별노출여부·판매자명·URL속성·링크 입력
     (전부 큰 주석 블록), 검색조건 유지용 숨은 form(주석), noticeParam hidden(#searchParam이
     이 화면에 없어 항상 빈 값), addSeller/deleteSeller/deleteNoticeSeller·noticeList() 죽은 함수. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('M00269')}">공지사항</span></h3>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c00; margin-bottom:12px;"></p>

<form id="notice" method="post"
      th:action="${notice != null} ? @{'/admin/notices/edit/' + ${notice.noticeId}} : @{/admin/notices/create}">

    <div class="btn_all btn_right mb15" th:if="${notice != null}">
        <div class="flex_box gap-08">
            <button type="submit" class="btn btn-dark-gray btn-mini">수정</button>
            <!-- th:onclick은 Thymeleaf 3.1의 "신뢰할 수 없는 컨텍스트" 제한에 걸려 빌드 가드가 막는다 -->
            <button type="button" class="btn btn-dark-gray btn-mini"
                    th:attr="onclick=|deleteNotice(${notice.noticeId});|">삭제</button>
            <button type="button" class="btn btn-dark-default btn-mini"
                    onclick="location.href='/admin/notices'">목록</button>
        </div>
    </div>

    <div class="board_write">
        <table class="board_write_table" th:attr="summary=${msg.get('M00269')}">
            <caption th:text="${msg.get('M00269')}"></caption>
            <colgroup>
                <col style="width:220px;">
            </colgroup>
            <tbody>
            <tr>
                <td class="label">상단공지</td>
                <td>
                    <div class="flex_box gap-08 item-center">
                        <div class="checkbox">
                            <input type="checkbox" id="noticeFlag" name="noticeFlag" value="Y"
                                   th:checked="${notice != null and notice.noticeFlag == 'Y'}"/>
                            <label for="noticeFlag" th:text="${msg.get('M00083')}">사용</label>
                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00275')}">제목</span></td>
                <td>
                    <div>
                        <input type="text" id="subject" name="subject" th:title="${msg.get('M00275')}"
                               th:value="${notice != null} ? ${notice.subject} : ''"
                               class="input_txt required _filter half" maxlength="255"/>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00006')}">내용</span></td>
                <td>
                    <!-- smart_editor2 area -->
                    <div>
                        <textarea id="content" name="content" cols="30" rows="20" class="editor-content"
                                  th:title="${msg.get('M00006')}"
                                  th:text="${notice != null} ? ${notice.content} : ''"></textarea>
                    </div>
                    <!-- smart_editor2 area -->
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>게시여부</td>
                <td>
                    <div class="flex_box gap-12">
                        <div class="input-form">
                            <input type="radio" id="useYnY" name="useYn" value="Y" title="게시여부" class="required"
                                   th:checked="${notice == null or notice.useYn == 'Y'}"/>
                            <label for="useYnY">게시</label>
                        </div>
                        <div class="input-form">
                            <input type="radio" id="useYnN" name="useYn" value="N" title="게시여부" class="required"
                                   th:checked="${notice != null and notice.useYn == 'N'}"/>
                            <label for="useYnN">중지</label>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- 버튼시작 -->
        <div class="btn_all btn_center" th:if="${notice == null}">
            <div class="flex_box gap-08">
                <button type="submit" class="btn btn-dark-gray btn-small"><span>등록</span></button>
                <button type="button" class="btn btn-defualt btn-small" onclick="location.href='/admin/notices'"
                        th:text="${msg.get('M00037')}">취소</button>
            </div>
        </div>
        <!-- 버튼 끝-->
    </div> <!-- // board_write -->
</form>

    </div>
    </div>
</div>
</div>

<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('content')}"></div>

<script type="text/javascript" th:inline="javascript">
var redirectMessage = /*[[${redirectMessage}]]*/ null;

$(function() {
    if (redirectMessage) {
        alert(redirectMessage);
    }

    try {
        $('#notice').validator(function() {
            Common.getEditorContent("content");

            if ($('#content').val().toLowerCase() == '<p>&nbsp;</p>' || $('#content').val() == '') {
                alert($.validator.messages['text'].format($('#content').attr('title')));
                return false;
            }
        });
    } catch (e) {
        alert(e.message);
    }
});

/* AS-IS: 수정화면 [삭제] - ajax로 지우고 목록으로 돌아간다. */
function deleteNotice(noticeId) {
    Common.confirm(/*[[${msg.get('M00196')}]]*/ '삭제하시겠습니까?', function() {
        $.post(url("/admin/notices/delete/" + noticeId), {}, function(response) {
            Common.responseHandler(response, function() {
                alert(/*[[${msg.get('M00205')}]]*/ '삭제 되었습니다.');
                location.href = "/admin/notices";
            });
        });
    });
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
