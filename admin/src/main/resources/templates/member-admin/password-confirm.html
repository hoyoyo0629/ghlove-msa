<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>비밀번호 확인 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<!-- AS-IS opmanager/i18n/user/popup/customer-password-confirm.jsp 이식. layout=base 팝업.
     일반회원관리(메뉴 4101) 상세의 "개인정보 열람"이 띄우고, 운영자 자기 비밀번호를 확인한 뒤
     POST /popup/access/{userId}로 폼을 동적 생성해 보낸다(같은 창에서 열람 팝업으로 바뀐다).

     AS-IS verbatim: 팝업을 열고 나서 window.resizeTo(450, 300)으로 다시 키운다
     (window.open은 450x250으로 열린다), enter키로도 확인, 포커스는 비밀번호 칸. -->
<body>
<div class="popup_wrap">
	<div id="pop_header">
		<h1 class="popup_title">비밀번호 확인</h1>
		<a href="javascript:self.close();" class="btn_close"><img th:src="@{/content/opmanager/images/btn/btn_close.png}" alt="닫기"></a>
	</div>
	<div class="popup_contents">
		<div class="flex_box col item-center">
			<input id="password" title="비밀번호 입력" class="input_txt required _filter wd-150" type="password" value="" placeholder="비밀번호 입력">
			<p class="popup_btns">
				<button type="button" class="btn btn-active" onclick="passwordConfirm();">확인</button>
				<button type="button" class="btn btn-default" onclick="self.close();">취소</button>
			</p>
		</div>
	</div>
</div>

<script type="text/javascript" th:inline="javascript">
	var userId = [[${userId}]];
	var message = [[${message}]];

	$(function(){
		// 윈도우 팝업 사이즈 재조정
		window.resizeTo(450, 300);

		// 비밀번호 불일치로 되돌아온 경우
		if(message) {
			alert(message);
		}

		// enter key event
		$('#password').keypress(function(e) {
			if (e.keyCode === 13) {
				e.preventDefault();
				passwordConfirm();
			}
		});

		// 비밀번호 포커스
		$("#password").focus();
	});

	/**
	 *	함 수 명 : passwordConfirm
	 *	기	능  : 패스워드 확인
	 */
	function passwordConfirm() {
		if($.trim($("#password").val()) == "") {
			alert("비밀번호를 입력해 주세요.");
			$("#password").focus();
			return false;
		}

		if(!userId) {
			alert("사용자 정보가 올바르지 않습니다.");
			return false;
		}

		var form = document.createElement('form');
		form.setAttribute("charset"	, "UTF-8");
		form.setAttribute("method"	, "POST");
		form.setAttribute("action"	, "/admin/members/popup/access/" + userId);

		var hidden = document.createElement("input");
		hidden.setAttribute("type", "hidden");
		hidden.setAttribute("name", "password");
		hidden.setAttribute("value", $("#password").val());
		form.appendChild(hidden);

		document.body.appendChild(form);
		form.submit();
	}
</script>
</body>
</html>
