<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/customer/list.jsp 이식(메뉴 4101 일반회원관리).
     검색구분(아이디/이름/주소) + 가입일 범위(필수, 기본 오늘, 전체(all-1) 포함) +
     가입구분(전체/온라인/오프라인) + Email 수신동의(전체/동의/비동의) + 화면출력 + 9컬럼.

     ★ AS-IS는 진입(GET) 시 조회하지 않는다 - 검색해야(POST) 조회된다.
     ★ 목록 모집단은 정상회원만이다(AS-IS WHERE U.STATUS_CODE = 9). 탈퇴·휴면 회원은
        4105 탈퇴회원리스트 / 4107 휴면회원관리에서 본다.

     AS-IS verbatim:
     - h3가 메뉴명(일반회원관리)이 아니라 M00210이다.
     - colgroup에 col이 1개뿐이다(컬럼은 9개).
     - 아이디·이름 두 칸이 모두 상세 링크다.
     - 이메일 수신동의는 '0'이면 동의, 그 외(1·미설정)는 비동의.
     - 기부누적액·포인트잔액은 #,###.## 포맷이고 값이 없으면 '-'.
     - 엑셀 다운로드 버튼이 없다(구버전 list-old.jsp에만 있었다).
     - 검색 시 가입일이 비어 있으면 "가입일을 입력 하십시오"로 막는다.
     - 빈 목록 행에는 background 스타일이 없다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('M00210')}">회원관리</span></h3>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/members}">
	<input type="hidden" id="sort" name="sort" th:value="${searchParam.sort}"/>
	<input type="hidden" id="orderBy" name="orderBy" th:value="${searchParam.orderBy}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08">
							<select id="srchKey" name="srchKey" title="아이디" class="wd-150">
								<option value="LOGIN_ID" th:selected="${searchParam.srchKey == 'LOGIN_ID'}">아이디</option>
								<option value="USER_NAME" th:selected="${searchParam.srchKey == 'USER_NAME'}">이름</option>
								<option value="ADDRESS" th:selected="${searchParam.srchKey == 'ADDRESS'}">주소</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분"
							       class="input_txt required _filter half" th:value="${searchParam.srchValue}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>가입일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="srchStartCreated" name="srchStartCreated" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartCreated}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndCreated" name="srchEndCreated" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndCreated}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
								<a href="javascript:void(0);" class="btn_date all-1" th:text="${msg.get('M00039')}">전체</a>
							</span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">가입구분</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input type="radio" id="srchSbscrbSeCode0" name="srchSbscrbSeCode" value=""
								       th:checked="${#strings.isEmpty(searchParam.srchSbscrbSeCode)}"/>
								<label for="srchSbscrbSeCode0">전체</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchSbscrbSeCode100" name="srchSbscrbSeCode" value="100"
								       th:checked="${searchParam.srchSbscrbSeCode == '100'}"/>
								<label for="srchSbscrbSeCode100">온라인</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchSbscrbSeCode200" name="srchSbscrbSeCode" value="200"
								       th:checked="${searchParam.srchSbscrbSeCode == '200'}"/>
								<label for="srchSbscrbSeCode200">오프라인</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">Email 수신동의</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input type="radio" id="srchReceiveEmail0" name="srchReceiveEmail" value=""
								       th:checked="${#strings.isEmpty(searchParam.srchReceiveEmail)}"/>
								<label for="srchReceiveEmail0">전체</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchReceiveEmailY" name="srchReceiveEmail" value="0"
								       th:checked="${searchParam.srchReceiveEmail == '0'}"/>
								<label for="srchReceiveEmailY">동의</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchReceiveEmailN" name="srchReceiveEmail" value="1"
								       th:checked="${searchParam.srchReceiveEmail == '1'}"/>
								<label for="srchReceiveEmailN">비동의</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/members'">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<table class="board_list_table" summary="일반회원관리">
		<caption>일반회원관리</caption>
		<colgroup>
			<col style="width:5%;">
		</colgroup>
		<thead>
			<tr>
				<th scope="col">No.</th>
				<th scope="col">가입일</th>
				<th scope="col">아이디</th>
				<th scope="col">이름</th>
				<th scope="col">주소</th>
				<th scope="col">이메일 수신동의</th>
				<th scope="col">기부누적액</th>
				<th scope="col">포인트잔액</th>
				<th scope="col">가입경로</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item, i : ${list}" style="background:#fff;">
				<td th:text="${pagination.itemNumber - i.count}">0</td>
				<td th:text="${item.createdDate}"></td>
				<td><a th:href="|javascript:customerDetails('${item.userId}');|" th:text="${item.loginId}"></a></td>
				<td><a th:href="|javascript:customerDetails('${item.userId}');|" th:text="${item.userName}"></a></td>
				<td th:text="${item.addressText}"></td>
				<td th:text="${item.receiveEmailText}"></td>
				<td th:text="${item.totalCntrAmt != null}
				             ? ${#numbers.formatDecimal(item.totalCntrAmt, 1, 'COMMA', 2, 'POINT')} : '-'"></td>
				<td th:text="${item.totalCntrBlcePoint != null}
				             ? ${#numbers.formatDecimal(item.totalCntrBlcePoint, 1, 'COMMA', 2, 'POINT')} : '-'"></td>
				<td th:text="${item.sbscrbSeNm}"></td>
			</tr>
			<tr th:if="${#lists.isEmpty(list)}">
				<td colspan="9">일반회원 정보가 존재하지 않습니다.</td>
			</tr>
		</tbody>
	</table>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
<!--// List -->

<!-- 날짜 셋팅 영역 -->
<div style="display: none;">
	<span id="today" th:text="${searchDates.today}"></span>
	<span id="week" th:text="${searchDates.week}"></span>
	<span id="month1" th:text="${searchDates.month1}"></span>
	<span id="month3" th:text="${searchDates.month3}"></span>
	<span id="year1" th:text="${searchDates.year1}"></span>
</div>
<!--// 날짜 셋팅 영역  -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript" th:inline="javascript">
	$(function(){

		// 기간 검색 적용 (검색조건 : 가입일)
		serachDate();

		// 한 페이지 출력 갯수 변경 이벤트
		displayChange();

		// 선택된 페이지 출력 갯수 셋팅
		displaySelected();

		// 날짜 변경 이벤트
		datepickerChange();

		// 검색 enter key
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartCreated"]' , 'input[name="srchEndCreated"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	/**
	 *	함 수 명 : serachDate
	 *	기	능  : 기간 검색 적용
	 */
	function serachDate() {
		$(".btn_date").on('click',function(){
			var $id = $(this).attr('class').replace('btn_date ','');
			if ($id == 'all') {
				$("input[type=text]",$(this).parent().parent()).val('');

			} else {
				var today = $("#today").text();
				var date1 = '';
				var date2 = '';

				if ($id == 'today') {
					date1 = today;
					date2 = today;
				} else {
					date1 = $("#"+$id).text();
					date2 = today;
				}

				$("input[type=text]",$(this).parent().parent()).eq(0).val(date1);
				$("input[type=text]",$(this).parent().parent()).eq(1).val(date2);
			}
		});
	}

	/**
	 *	함 수 명 : displayChange
	 *	기	능  : 한 페이지 출력 갯수 변경 이벤트
	 */
	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	/**
	 *	함 수 명 : displaySelected
	 *	기	능  : 선택된 페이지 출력 갯수 셋팅
	 */
	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	/**
	 *	함 수 명 : customerDetails
	 *	기	능  : 일반회원 상세 조회
	 *	파라미터  : userId - 사용자 ID
	 */
	function customerDetails(userId) {
		location.href = "/admin/members/details/"+userId+location.search;
	}

	/**
	 *	함 수 명 : datepickerChange
	 *	기	능  : 날짜 변경 이벤트
	 */
	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	/**
	 *	함 수 명 : search
	 *	기	능  : 검색
	 */
	function search() {
		var strStartDate = $("#srchStartCreated").val();
		var strEndDate = $("#srchEndCreated").val();

		if(strStartDate === '' || strEndDate === '') {
			alert('가입일을 입력 하십시오');
			return false;
		}
		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndCreated").val();
				$("#srchEndCreated").val("");
				$("#srchEndCreated").focus();
				$("#srchEndCreated").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	/**
	 *	함 수 명 : searchEnterKey
	 *	기	능  : 검색 엔터키 이벤트
	 */
	function searchEnterKey() {
		$("#srchValue, #srchStartCreated, #srchEndCreated").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
</body>
</html>
