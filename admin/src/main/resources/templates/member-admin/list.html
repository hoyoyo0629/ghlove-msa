<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D3 일반회원 검색/상세 (AS-IS opmanager/user/general-customer - GeneralCustomerManagerController).
     실제 데이터는 member 서비스에 있고(MemberAdminClient), 여기는 admin 콘솔의 로그인/RBAC과
     화면만 담당한다. [[admin-pii-display-no-masking]] 관행대로 이 목록화면은 마스킹 없이 그대로
     노출한다(전화번호는 상세화면에서만 재확인 게이트 대상). -->
<div class="contents contents_inner">
    <h3>회원관리</h3>
    <p style="margin-bottom:12px;">
        <a th:href="@{/admin/members/batch}">회원 배치관리(휴면전환/데이터파기)</a> ·
        <a th:href="@{/log/user-change}">권한/상태변경 이력 관리</a>
    </p>

    <form th:action="@{/admin/members}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="회원 검색조건">
                <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">가입일자</td>
                    <td colspan="3">
                        <div class="flex_box gap-08">
                            <input type="date" name="fromDate" th:value="${fromDate}">
                            <span class="wave">~</span>
                            <input type="date" name="toDate" th:value="${toDate}">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">검색조건</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select name="srchKey">
                                <option value="LOGIN_ID" th:selected="${srchKey == 'LOGIN_ID' or srchKey == null}">아이디</option>
                                <option value="USER_NAME" th:selected="${srchKey == 'USER_NAME'}">이름</option>
                                <option value="ADDRESS" th:selected="${srchKey == 'ADDRESS'}">주소</option>
                            </select>
                            <input type="text" name="srchValue" th:value="${srchValue}" placeholder="검색어">
                        </div>
                    </td>
                    <td class="label">가입구분</td>
                    <td>
                        <select name="sbscrbSeCode">
                            <option value="">전체</option>
                            <option value="GENERAL" th:selected="${sbscrbSeCode == 'GENERAL'}">일반회원</option>
                            <option value="OVERSEAS" th:selected="${sbscrbSeCode == 'OVERSEAS'}">재외국민</option>
                            <option value="LOCALGOV" th:selected="${sbscrbSeCode == 'LOCALGOV'}">지자체 담당자</option>
                            <option value="PROVIDER" th:selected="${sbscrbSeCode == 'PROVIDER'}">답례품 제공자</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">이메일 수신동의</td>
                    <td colspan="3">
                        <select name="receiveEmail">
                            <option value="">전체</option>
                            <option value="Y" th:selected="${receiveEmail == 'Y'}">동의</option>
                            <option value="N" th:selected="${receiveEmail == 'N'}">미동의</option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-small" onclick="searchClear()">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="회원목록">
        <caption>회원목록</caption>
        <thead>
        <tr>
            <th scope="col">아이디</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">휴대폰</th>
            <th scope="col">가입구분</th>
            <th scope="col">상태</th>
            <th scope="col">가입일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${list}">
            <td><a th:href="@{'/admin/members/' + ${m.userId}}" th:text="${m.loginId}"></a></td>
            <td th:text="${m.userName}"></td>
            <td th:text="${m.email}"></td>
            <td th:text="${m.phoneNumber}"></td>
            <td th:text="${m.sbscrbSeCode}"></td>
            <td th:text="${m.statusCode == 'ACTIVE' ? '정상' : (m.statusCode == 'DORMANT' ? '휴면' : (m.statusCode == 'LOCKED' ? '잠금' : (m.statusCode == 'WITHDRAWN' ? '탈퇴' : m.statusCode)))}"></td>
            <td th:text="${m.createdDate != null and #strings.length(m.createdDate) >= 8}
                          ? ${#strings.substring(m.createdDate,0,4) + '-' + #strings.substring(m.createdDate,4,6) + '-' + #strings.substring(m.createdDate,6,8)}
                          : ''"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">조건에 맞는 회원이 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/admin/members(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},sbscrbSeCode=${sbscrbSeCode},receiveEmail=${receiveEmail},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/admin/members(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},sbscrbSeCode=${sbscrbSeCode},receiveEmail=${receiveEmail},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/admin/members(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},sbscrbSeCode=${sbscrbSeCode},receiveEmail=${receiveEmail},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>

<script th:inline="none">
function searchClear() {
    location.href = /*[[@{/admin/members}]]*/ '/admin/members';
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
