<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>카테고리 그룹 관리 - 고향사랑e음 (admin service)</title>
    <!-- 공통 head(AS-IS inc_head verbatim: CSS 6 + JS 12) - csrf meta/폰트/op.* 전부 여기서 로드 -->
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/categories-team-group/group/form.jsp 이식 - 카테고리 그룹 등록/수정 폼(categoryGroupId == 0 이면 등록).
     ★ AS-IS 특징(그대로 옮김)
     - "1차 카테고리 설정" 영역(.email_tb)은 AS-IS도 display:none - 화면에선 안 보이지만 거기 담긴 categoryCodes(이 그룹의 공개 1차
       카테고리)가 수정 때 같이 전송돼, 수정은 "선택 목록에 없는 카테고리의 그룹을 0으로 풀고 목록의 카테고리를 이 그룹으로 묶는" 처리를 한다.
     - 접속권한 "성인만" 라디오는 AS-IS가 hidden 클래스로 숨겨 둔다. 대그룹 select는 readonly 속성이지만 select엔 효과가 없다.
     - 등록은 코드를 영문/숫자/하이픈/언더바로 검사하고 OP_CATEGORY의 URL/코드 중복을 확인한 뒤 확인창을 띄운다(수정은 확인창만). -->
<style type="text/css">
	.categories_color1,	.categories_color2{ background: #ffffcc; }
	.category_set {margin-top: 10px;}
	.category_set h4 {color: #fff; margin-left: 0;}
	.category_set .category_list {margin-left: 0;}
</style>
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

	<h3><span th:utext="${msg.get('MENU_2104')}">카테고리 그룹 관리</span></h3>

	<form id="categoriesGroup" method="post"
	      th:action="${categoriesGroup.categoryGroupId > 0} ? @{/categories-team-group/group/edit/{id}(id=${categoriesGroup.categoryGroupId})} : @{/categories-team-group/group/create}">
    <div class="btn_all btn_right mb15">
        <div class="flex_box gap-08">
			<th:block th:if="${categoriesGroup.categoryGroupId > 0}">
				<button type="submit" class="btn btn-dark-gray btn-mini" th:utext="${msg.get('M00087')}">수정</button>
				<button type="button" th:attr="onclick=|deleteCategoryGroup(${categoriesGroup.categoryGroupId})|" class="btn btn-dark-gray btn-mini" th:utext="${msg.get('M00074')}">삭제</button>
				<button type="button" class="btn btn-default btn-mini" onclick="location.href='/categories-team-group/list';">목록</button>
			</th:block>
        </div>
    </div>

	<div class="board_write">
		<table class="board_write_table" th:summary="${msg.get('MENU_2104')}">
			<caption th:utext="${msg.get('MENU_2104')}">카테고리 그룹 관리</caption>
			<colgroup>
				<col style="width: 220px;" />
				<col style="width: auto;" />
			</colgroup>
			<tbody>
			 	 <tr>
					<td class="label" th:utext="${msg.get('M00865')}">대그룹</td>
					<td>
						<div>
							<select id="categoryTeamId" name="categoryTeamId" class="required full" th:title="${msg.get('M00865')}" readonly="readonly">
								<option th:each="team : ${categoriesTeamSelectBox}" th:value="${team.categoryTeamId}" th:text="${team.name}"
								        th:selected="${team.categoryTeamId == categoriesGroup.categoryTeamId}"></option>
							</select>
					 	</div>
					</td>
				</tr>
				<tr>
					<td class="label" th:utext="${msg.get('M00866')}">카테고리(메뉴)명</td>
					<td>
						<div>
							<input id="name" name="name" type="text" class="input_txt required _filter full" th:title="${msg.get('M00866')}" th:value="${categoriesGroup.name}" />
					 	</div>
					</td>
				</tr>
				<tr>
					<td class="label">CODE</td>
					<td>
						<div>
							<input id="code" name="code" type="text" class="input_txt required _filter full" title="CODE" th:value="${categoriesGroup.code}" />
					 	</div>
					</td>
				</tr>
				<tr>
					<td class="label" th:utext="${msg.get('M01604')}">접속권한</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="accessType1" name="accessType" type="radio" value="1" th:checked="${categoriesGroup.accessType != '2'}" />
								<label for="accessType1" th:utext="${msg.get('M00497')}">제한 없음</label>
							</div>
							<div class="input-form hidden">
								<input id="accessType2" name="accessType" type="radio" value="2" th:checked="${categoriesGroup.accessType == '2'}" />
								<label for="accessType2" th:utext="${msg.get('M01679')}">성인만</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label" th:utext="${msg.get('M00191')}">공개유무</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="categoryGroupFlag1" name="categoryGroupFlag" type="radio" value="Y" th:checked="${categoriesGroup.flag == 'Y'}" />
								<label for="categoryGroupFlag1" th:utext="${msg.get('M00096')}">공개</label>
							</div>
							<div class="input-form">
								<input id="categoryGroupFlag2" name="categoryGroupFlag" type="radio" value="N" th:checked="${categoriesGroup.flag == 'N'}" />
								<label for="categoryGroupFlag2" th:utext="${msg.get('M00097')}">비공개</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</div> <!--// board_write E-->



	<div class="email_tb" style="display:none;">
		<h4>| <th:block th:utext="${msg.get('M00573')}">1차 카테고리 설정</th:block></h4>
		<div class="category_set">
			<div class="category_short">
				<h4 th:utext="${msg.get('M00574')}">전체 1차 카테고리 목록</h4>
				<div class="category_list" style="width:97.5%; overflow: scroll; height: 435px;">
					<div class="bundle_two">
						<th:block th:each="list : ${categoriesGroupInList}">
						<h5 th:if="${list.categoryGroupId != 0}" th:text="|[${list.name}]|"></h5>
						<h5 th:if="${list.categoryGroupId == 0}">[미등록]</h5>
							<ul>
							<li class="categories_go" th:each="list2 : ${list.categoryList}" th:id="${list2.categoryCode}"><a href="javascript:;" th:text="|- ${list2.categoryName}|"></a></li>
							</ul>
						</th:block>
					</div>
				</div> <!-- // category_list -->
			</div> <!-- // category_short -->


			<div class="category_btn">
				<a href="javascript:;" id="add"><img src="/content/opmanager/images/btn/more_btn.png" alt="추가 버튼"></a>
			</div> <!-- // category_btn -->

			<div class="category_short">
				<h4 th:utext="${msg.get('M00575')}">등록 할 카테고리 목록</h4>
				<div class="category_list h370" style="width:97.5%; margin-bottom: 5px">
					<div class="bundle_two">
						<ul id="addCategory">
							<li class="categories_value" th:each="list : ${categoriesList}">
								<th:block th:text="|- ${list.categoryName}|"></th:block>
								<input type="hidden" name="categoryCodes" th:value="${list.categoryCode}" />
							</li>
						</ul>
					</div> <!-- // bundle_two -->
				</div> <!-- // category_list -->

				<div style="margin-left: -6px; margin-top: 2px; margin-right:10px">
					<div class="btn_left ml6">
						<button type="button" id="categoryAllDelete" class="btn ctrl_btn w98"><span th:utext="${msg.get('M00411')}">전체삭제</span></button>
					</div>
					<div class="btn_right ml6">
						<button type="button" id="categorySelectDelete" class="btn ctrl_btn w98"><span th:utext="${msg.get('M00576')}">선택 삭제</span></button>
					</div>
				</div>
			</div> <!-- // category_short -->
		</div> <!-- // category_set -->

		<div class="board_guide ml10">
			<p class="tip">Tip</p>
			<p class="tip" th:utext="${msg.get('M00577')}">- 타 그룹에 이미 속해 있는 카테고리도 현재 카테고리로 이동하실 수 있습니다.</p>
		</div>
	</div> <!-- //  email_tb -->

	<div class="btn_all btn_center">
		<div class="flex_box gap-08">
			<th:block th:if="${categoriesGroup.categoryGroupId == 0}">
				<button type="submit" class="btn btn-dark-gray btn-small" th:utext="${msg.get('M00088')}">등록</button>
				<button type="button" class="btn btn-default btn-small" onclick="location.href='/categories-team-group/list';" th:utext="${msg.get('M00037')}">취소</button>
			</th:block>
		</div>
	</div>
	</form>

    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<!-- AS-IS가 JSP에서 JS 문자열에 직접 박던 값 -->
<input type="hidden" id="categoryGroupIdParam" th:value="${categoriesGroup.categoryGroupId}">
<input type="hidden" id="msgRegisterConfirm" th:value="${msg.get('M00159')}">
<input type="hidden" id="msgModifyConfirm" th:value="${msg.get('M00365')}">

<script type="text/javascript">
var categoryGroupId = $("#categoryGroupIdParam").val();
var patterns = /^[a-zA-Z0-9_-]+$/;
$(function(){

	if($("input[name='code']").val() != ''){
		$("input[name='code']").attr("readonly",true);
	}

	fn_categoriesAdd();
	fn_categoriesDelete();

	$("#categoriesGroup").validator(function() {
		// 등록인 경우.
		if (categoryGroupId == 0) {
			var $code = $('#code');

			if( $code.val() == null || $.trim($code.val()) == '' ) {
				alert(Message.get("M01331")); // 카테고리 URL 값을 입력해주세요
				$code.focus();
				return false;
			}

			var value = $.trim($code.val());
			$code.val(value);

			if(!patterns.test(value)){
				alert(Message.get("M01332")); // 영문, 숫자, 하이픈, 언더바 만 입력가능합니다.
				$code.focus();
				return false;
			}



			var isAvailableCode = false;

			$.ajaxSetup({
				async: false
			});
			var param = {
				"categoryUrl" : value
			};
			$.post("/categories/code-check",param,function(resp){
				Common.responseHandler(resp, function(){
					isAvailableCode = true;
				},function(){
					alert(resp.errorMessage);
					isAvailableCode = false;
				});
			});

			if (!isAvailableCode) {
				$code.focus();
				return false;
			}

			Common.confirm("정보를 " + $("#msgRegisterConfirm").val(), function(form) {
				$('#categoriesGroup').submit();
			});

			return false;
		}
		// 수정인 경우
		else {
			Common.confirm("정보를 " + $("#msgModifyConfirm").val(), function(form) {
				$('#categoriesGroup').submit();
			});

			return false;
		}

	});

	$(".seo_copy").on("click",function(){
		seoCopy($(this));
	});
});

//카테고리 추가
function fn_categoriesAdd(){

	$(".categories_go").on("click",{
		toClass : "categories_color1"
	},backgroundChange);

	$(".email_tb").on("click",".categories_value",{
		toClass : "categories_color2"
	},backgroundChange);

	$("#add").on("click",{
		add : ".categories_color1",
		check : "input[name='categoryCodes']",
		from : "#addCategory",
		addValue : "<li class='categories_value'><a href='javacript:;'>::text::</a><input type='hidden' name='categoryCodes' value='::value::' /></li>"
	}, categortAdd);

}

function backgroundChange(event){
	if(!$(this).hasClass(event.data.toClass)){
		$(this).addClass(event.data.toClass);
	}else{
		$(this).removeClass(event.data.toClass);
	}
}

function categortAdd(event){
	var categoriesLi = "";
	$(event.data.add).each(function(){
		var flag = true;
		var id = $(this).attr("id");
		$(event.data.check).each(function(){
			if(id == $(this).val()){
				flag = false;
			}
		});

		if(flag){
			categoriesLi += event.data.addValue.replaceAll("::text::",$(this).text()).replaceAll("::value::",$(this).attr("id"));
		}
	});

	$(event.data.from).append(categoriesLi);
}

//카테고리 삭제
function fn_categoriesDelete(){
	$("#categoryAllDelete").on("click",function(){
		$(".categories_value").remove();
	});

	$("#categorySelectDelete").on("click",function(){
		$(".categories_color2").each(function(){
			$(this).remove();
		});
	});
}

// 1차 카테고리로 변경하기.
function changeGroupToCategory(categoryGroupId) {
	Common.popup('/categories-team-group/group/change-group-to-category/' + categoryGroupId, 'change-group-to-category', 500, 400);
}


// 그룹삭제
function deleteCategoryGroup(categoryGroupId){

	var param = {
		'categoryGroupId': categoryGroupId
	};

	var message = Message.get("M00196");	// 삭제하시겠습니까?
	if (confirm(message)) {
		$.post("/categories-team-group/group/delete", param, function(resp){
			Common.responseHandler(resp, function(){
				location.replace('/categories-team-group/list');
			});
		});
	}
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
