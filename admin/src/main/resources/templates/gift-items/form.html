<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 등록/수정(관리자) - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/gift-items}">답례품 상품관리(관리자)</a></div>
    <h3><span th:text="${item.itemId()} != null ? '답례품 수정' : '답례품 직접 등록'"></span></h3>
    <p style="color:#c00;" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="답례품 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>판매자(셀러)</td>
                <td>
                    <select name="sellerId" required form="itemForm">
                        <option value="">선택하세요</option>
                        <option th:each="s : ${sellers}" th:value="${s.sellerId()}" th:text="${s.sellerName()} + ' (' + ${s.companyName()} + ')'"
                                th:selected="${s.sellerId()} == ${item.sellerId()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>답례품명</td>
                <td><input type="text" name="itemName" th:value="${item.itemName()}" required form="itemForm" style="width:400px;"></td>
            </tr>
            <tr>
                <td class="label">요약설명</td>
                <td><input type="text" name="itemSummary" th:value="${item.itemSummary()}" style="width:400px;" form="itemForm"></td>
            </tr>
            <tr>
                <td class="label">상세설명</td>
                <td><textarea name="detailContent" rows="8" style="width:500px;" th:text="${item.detailContent()}" form="itemForm"></textarea></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>카테고리</td>
                <td>
                    <select name="categoryCode" required form="itemForm">
                        <option value="">선택하세요</option>
                        <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.label()}"
                                th:selected="${c.id()} == ${item.categoryCode()}"></option>
                    </select>
                </td>
            </tr>
            <tr th:if="${item.itemId()} == null">
                <td class="label">지자체코드</td>
                <td>
                    <select name="locgovCode" form="itemForm">
                        <option value="">선택 안 함</option>
                        <option th:each="l : ${locgovs}" th:value="${l.locgovCode()}" th:text="${l.locgovNm()} + ' (' + ${l.locgovCode()} + ')'"
                                th:selected="${l.locgovCode()} == ${item.locgovCode()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">브랜드</td>
                <td>
                    <select name="brandId" form="itemForm">
                        <option value="">선택 안 함(자사제품)</option>
                        <option th:each="b : ${brands}" th:value="${b.brandId()}" th:text="${b.brandName()}"
                                th:selected="${b.brandId()} == ${item.brandId()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>판매가격</td>
                <td><input type="number" name="salePrice" th:value="${item.salePrice()}" min="1" required form="itemForm" style="width:150px;"> 원</td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>재고수량</td>
                <td><input type="number" name="stockQuantity" th:value="${item.stockQuantity()}" min="0" required form="itemForm" style="width:150px;"></td>
            </tr>
            <tr>
                <td class="label">최소 기부금액</td>
                <td><input type="number" name="minDonationAmount" th:value="${item.minDonationAmount()}" min="0" form="itemForm" style="width:150px;"> 원</td>
            </tr>
            <tr>
                <td class="label">노출유형</td>
                <td>
                    <select name="displayType" form="itemForm">
                        <option value="ALWAYS" th:selected="${item.displayType()} == null or ${item.displayType()} == 'ALWAYS'">상시노출</option>
                        <option value="LIMITED" th:selected="${item.displayType()} == 'LIMITED'">한시노출</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">노출 시작일</td>
                <td><input type="date" name="displayStartDate" th:value="${item.displayStartDate()}" form="itemForm"></td>
            </tr>
            <tr>
                <td class="label">노출 종료일</td>
                <td><input type="date" name="displayEndDate" th:value="${item.displayEndDate()}" form="itemForm"></td>
            </tr>
            <tr th:if="${item.itemId()} == null">
                <td class="label">이미지</td>
                <td><input type="file" name="images" multiple accept="image/*" form="itemForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="itemForm"
          th:action="${item.itemId()} != null ? @{/admin/gift-items/{id}(id=${item.itemId()})} : @{/admin/gift-items}"
          method="post" enctype="multipart/form-data"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="itemForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>

    <!-- 배송비/택배사 설정 (SFR-005 재검토 라운드 - 원래 코드가 전혀 없던 gap) - order가
         이 값을 읽어 주문 시점 배송비를 계산한다. -->
    <div th:if="${item.itemId()} != null" style="margin-top:32px;">
        <h4>배송비/택배사 설정</h4>
        <form th:action="@{'/admin/gift-items/' + ${item.itemId()} + '/shipping'}" method="post">
            <table class="board_write_table">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">택배사</td>
                    <td><input type="text" name="deliveryCompanyName" th:value="${item.deliveryCompanyName()}" placeholder="예: CJ대한통운" style="width:200px;"></td>
                </tr>
                <tr>
                    <td class="label">배송비 구분</td>
                    <td>
                        <select name="shippingType">
                            <option value="1" th:selected="${item.shippingType()} == '1'">무료배송</option>
                            <option value="2" th:selected="${item.shippingType()} == '2'">판매자조건부</option>
                            <option value="3" th:selected="${item.shippingType()} == '3'">출고지조건부</option>
                            <option value="4" th:selected="${item.shippingType()} == '4'">상품조건부</option>
                            <option value="5" th:selected="${item.shippingType()} == '5'">개당배송비</option>
                            <option value="6" th:selected="${item.shippingType()} == null or ${item.shippingType()} == '6'">고정배송비</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">기본 배송비</td>
                    <td><input type="number" name="shipping" th:value="${item.shipping()}" min="0" style="width:150px;"> 원</td>
                </tr>
                <tr>
                    <td class="label">조건부 무료배송 기준금액</td>
                    <td><input type="number" name="shippingFreeAmount" th:value="${item.shippingFreeAmount()}" min="0" style="width:150px;"> 원 이상 구매 시 무료(구분이 2~4일 때만 적용)</td>
                </tr>
                <tr>
                    <td class="label">제주 추가배송비</td>
                    <td><input type="number" name="shippingExtraCharge1" th:value="${item.shippingExtraCharge1()}" min="0" style="width:150px;"> 원</td>
                </tr>
                <tr>
                    <td class="label">도서산간 추가배송비</td>
                    <td><input type="number" name="shippingExtraCharge2" th:value="${item.shippingExtraCharge2()}" min="0" style="width:150px;"> 원</td>
                </tr>
                <tr>
                    <td class="label">반품 가능여부</td>
                    <td><label><input type="checkbox" name="itemReturnAllowed" value="true" th:checked="${item.itemReturnFlag()} == null or ${item.itemReturnFlag()} == 'Y'"> 반품 가능</label></td>
                </tr>
                </tbody>
            </table>
            <div class="btn_all btn_right" style="margin-top:8px;">
                <button type="submit" class="btn btn-dark-gray btn-mini">배송설정 저장</button>
            </div>
        </form>
    </div>

    <!-- 답례품 옵션 관리 (SFR-005 재검토 라운드 - 원래 코드가 전혀 없던 gap) - 카탈로그
         관리만 다룬다(장바구니/주문에는 아직 반영 안 됨). 신규 등록 화면에서는 답례품ID가
         아직 없어 옵션을 붙일 수 없다. -->
    <div th:if="${item.itemId()} != null" style="margin-top:32px;">
        <h4>답례품 옵션</h4>
        <table class="board_list_table">
            <thead><tr><th>옵션명</th><th>추가금액</th><th>재고연동</th><th>재고수량</th><th>품절</th><th>노출</th><th>처리</th></tr></thead>
            <tbody>
            <tr th:each="o : ${options}">
                <td th:text="${o.optionName1()}"></td>
                <td th:text="${#numbers.formatInteger(o.optionPrice() ?: 0, 0, 'COMMA')} + '원'"></td>
                <td th:text="${o.optionStockFlag()} == 'Y' ? '연동' : '미연동'"></td>
                <td th:text="${o.optionStockFlag()} == 'Y' ? ${o.optionStockQuantity()} : '-'"></td>
                <td th:text="${o.optionSoldOutFlag()} == 'Y' ? '품절' : '-'"></td>
                <td th:text="${o.optionDisplayFlag()} == 'N' ? '숨김' : '노출'"></td>
                <td>
                    <form class="inline-form" style="display:inline;" method="post"
                          th:action="@{'/admin/gift-items/' + ${item.itemId()} + '/options/' + ${o.itemOptionId()} + '/display'}">
                        <input type="hidden" name="display" th:value="${o.optionDisplayFlag()} == 'N' ? 'true' : 'false'">
                        <button type="submit" class="small-btn" th:text="${o.optionDisplayFlag()} == 'N' ? '노출복원' : '숨김'"></button>
                    </form>
                    <form class="inline-form" style="display:inline;" method="post"
                          th:action="@{'/admin/gift-items/' + ${item.itemId()} + '/options/' + ${o.itemOptionId()} + '/delete'}"
                          onsubmit="return confirm('이 옵션을 삭제하시겠습니까?')">
                        <button type="submit" class="small-btn danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(options)}">등록된 옵션이 없습니다.</p>

        <form th:action="@{'/admin/gift-items/' + ${item.itemId()} + '/options'}" method="post" style="margin-top:12px;">
            <div class="flex_box gap-08 item-center">
                <input type="text" name="optionName" placeholder="옵션명(예: 빨강, L 사이즈)" required style="width:200px;">
                <input type="number" name="optionPrice" placeholder="추가금액" min="0" style="width:120px;"> 원
                <label><input type="checkbox" name="stockTracked" value="true"> 재고연동</label>
                <input type="number" name="stockQuantity" placeholder="재고수량" min="0" style="width:100px;">
                <button type="submit" class="btn btn-dark-gray btn-mini">옵션 추가</button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
