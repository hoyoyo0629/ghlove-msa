<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답례품 상품관리(관리자) - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <style>
        .search-form { background:#f7f7f7; border:1px solid #ddd; border-radius:4px; padding:10px 12px; margin-bottom:12px; }
        .search-form select, .search-form input[type=text] { margin-right:6px; }
        .error-box { color:#c00; background:#fdecec; border:1px solid #f5b5b5; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
        .bulk-bar { background:#f0f6ff; border:1px solid #cfe0ff; border-radius:4px; padding:8px 12px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>답례품 상품관리(관리자)</h3>
    <p style="color:#666; margin-bottom:12px;">
        관리자가 판매자(셀러)를 대신 지정해 답례품을 직접 등록/수정합니다. 관리자가 직접 만든 상품은 승인 대기 없이 바로 노출됩니다.
    </p>
    <div class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="search-form" method="get" th:action="@{/admin/gift-items}">
        <input type="text" name="itemName" th:value="${itemName}" placeholder="답례품명 검색">
        <select name="categoryCode">
            <option value="">전체 카테고리</option>
            <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.label()}" th:selected="${c.id()} == ${categoryCode}"></option>
        </select>
        <select name="sellerId">
            <option value="">전체 판매자</option>
            <option th:each="s : ${sellers}" th:value="${s.sellerId()}" th:text="${s.sellerName()}" th:selected="${s.sellerId()} == ${sellerId}"></option>
        </select>
        <select name="dataStatusCode">
            <option value="">전체 상태</option>
            <option value="PENDING" th:selected="${dataStatusCode == 'PENDING'}">승인대기</option>
            <option value="APPROVED" th:selected="${dataStatusCode == 'APPROVED'}">승인됨</option>
            <option value="REJECTED" th:selected="${dataStatusCode == 'REJECTED'}">반려됨</option>
            <option value="STOPPED" th:selected="${dataStatusCode == 'STOPPED'}">판매중지</option>
            <option value="DISCONTINUED" th:selected="${dataStatusCode == 'DISCONTINUED'}">폐지</option>
        </select>
        <button type="submit" class="small-btn">검색</button>
        <a class="btn" style="float:right;" th:href="@{/admin/gift-items/new}">+ 답례품 직접 등록</a>
    </form>

    <p style="margin-bottom:12px;">
        <a th:href="@{/admin/gift-items/representative}">대표상품관리</a> ·
        <a th:href="@{/admin/gift-reviews}">답례품 리뷰 관리</a> ·
        <a th:href="@{/admin/gift-inquiries}">답례품 문의(Q&amp;A) 관리</a>
    </p>

    <div class="bulk-bar">
        <span>엑셀:</span>
        <a class="small-btn" th:href="@{/admin/gift-items/excel}">대량등록(업로드)</a>
        <a class="small-btn"
           th:href="@{/admin/gift-items/export(itemName=${itemName},categoryCode=${categoryCode},sellerId=${sellerId},dataStatusCode=${dataStatusCode})}">현재 목록 다운로드(CSV)</a>
    </div>

    <form id="bulkForm" th:action="@{/admin/gift-items/bulk-category}" method="post">
        <div class="bulk-bar">
            <span>선택 항목 카테고리 일괄 배정:</span>
            <select name="categoryCode">
                <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.label()}"></option>
            </select>
            <button type="submit" class="small-btn" onclick="return confirm('선택한 답례품의 카테고리를 일괄 변경하시겠습니까?')">일괄 배정</button>
        </div>
        <div class="bulk-bar">
            <span>선택 항목 일괄 처리:</span>
            <button type="submit" formaction="@{/admin/gift-items/bulk-display}" name="displayFlag" value="Y" class="small-btn"
                    onclick="return confirm('선택한 답례품을 노출 처리하시겠습니까?')">노출 ON</button>
            <button type="submit" formaction="@{/admin/gift-items/bulk-display}" name="displayFlag" value="N" class="small-btn"
                    onclick="return confirm('선택한 답례품을 비노출 처리하시겠습니까?')">노출 OFF</button>
            <select name="itemLabel">
                <option value="1">라벨:없음</option>
                <option value="2">NEW</option>
                <option value="3">SALE</option>
                <option value="4">사기</option>
            </select>
            <button type="submit" formaction="@{/admin/gift-items/bulk-label}" class="small-btn">라벨 적용</button>
            <button type="submit" formaction="@{/admin/gift-items/bulk-sales}" formmethod="get" class="small-btn">판매정보 일괄수정</button>
            <button type="submit" formaction="@{/admin/gift-items/bulk-delete}" class="small-btn" style="color:#c00;"
                    onclick="return confirm('선택한 답례품을 삭제(폐지) 처리하시겠습니까? 되돌릴 수 없습니다.')">일괄 삭제</button>
        </div>

        <table class="board_list_table">
            <thead>
            <tr><th></th><th>ID</th><th>답례품명</th><th>카테고리</th><th>판매자</th><th>가격</th><th>재고</th><th>상태</th><th>노출</th><th>라벨</th><th>순서</th><th>처리</th></tr>
            </thead>
            <tbody>
            <tr th:each="it : ${items}">
                <td><input type="checkbox" name="itemIds" th:value="${it.itemId()}"></td>
                <td th:text="${it.itemId()}"></td>
                <td><a th:href="@{/admin/gift-items/{id}/edit(id=${it.itemId()})}" th:text="${it.itemName()}"></a></td>
                <td th:text="${it.categoryCode()}"></td>
                <td th:text="${it.sellerId()}"></td>
                <td th:text="${#numbers.formatInteger(it.salePrice(), 0, 'COMMA')} + '원'"></td>
                <td th:text="${it.stockQuantity()}"></td>
                <td th:switch="${it.dataStatusCode()}">
                    <span th:case="'PENDING'">승인대기</span>
                    <span th:case="'APPROVED'">승인됨</span>
                    <span th:case="'REJECTED'">반려됨</span>
                    <span th:case="'STOPPED'">판매중지</span>
                    <span th:case="'DISCONTINUED'">폐지</span>
                    <span th:case="*" th:text="${it.dataStatusCode()}"></span>
                </td>
                <td th:text="${it.displayFlag()} == 'Y' ? '노출' : '비노출'"></td>
                <td th:switch="${it.itemLabel()}">
                    <span th:case="'2'">NEW</span>
                    <span th:case="'3'">SALE</span>
                    <span th:case="'4'">사기</span>
                    <span th:case="*">-</span>
                </td>
                <td><input type="number" name="orderings" style="width:60px;" th:value="${it.adminOrdering()} ?: 0" form="orderingForm">
                    <input type="hidden" name="itemIds" th:value="${it.itemId()}" form="orderingForm"></td>
                <td>
                    <a class="small-btn" th:href="@{/admin/gift-items/{id}/edit(id=${it.itemId()})}">수정</a>
                    <form class="inline-form" style="display:inline;" th:action="@{/admin/gift-items/{id}/copy(id=${it.itemId()})}" method="post"
                          onsubmit="return confirm('이 답례품을 복사하시겠습니까? 복사본은 승인대기 상태로 생성됩니다.')">
                        <button type="submit" class="small-btn">복사</button>
                    </form>
                    <span th:if="${it.dataStatusCode() == 'PENDING'}">
                        <form class="inline-form" style="display:inline;" th:action="@{/admin/gift-items/{id}/approve(id=${it.itemId()})}" method="post">
                            <button type="submit" class="small-btn">승인</button>
                        </form>
                        <form class="inline-form" style="display:inline;" th:action="@{/admin/gift-items/{id}/reject(id=${it.itemId()})}" method="post"
                              onsubmit="return confirm('이 답례품을 반려하시겠습니까?')">
                            <button type="submit" class="small-btn danger">반려</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(items)}">검색된 답례품이 없습니다.</p>
    </form>
    <form id="orderingForm" th:action="@{/admin/gift-items/bulk-ordering}" method="post">
        <button type="submit" form="orderingForm" class="small-btn" th:if="${not #lists.isEmpty(items)}">순서 저장</button>
    </form>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
