<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부금 모금현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/give-state/list.jsp 재현 - 년도×지자체로 집계된 기부금 모금현황
     (기부모금액/기부건수/기부인원/발생포인트/답례품금액). admin은 donation/point의 DB를
     직접 못 읽어서(DB per Service) 이미 있는 통계 ReadModel(GiveStateService)을 그대로
     집계한다(원장 추가 없음). AS-IS는 시스템/행안부 권한("mois")과 지자체 담당자 권한을
     분리해 각자 다른 화면을 보여주지만(지자체는 자기 지자체만), 이 프로젝트는 아직
     지자체 단위로 세분화된 역할이 없어(ROLE_ADMIN/ROLE_OPERATOR만) ROLE_ADMIN 전용
     "전체 보기" 화면만 우선 구현했다. -->
<div class="wrap">
    <h1>기부금 모금현황</h1>

    <form th:action="@{/give-state}" method="get" style="margin-bottom:20px;">
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="field" style="margin-bottom:0;">
                <label for="cntrYear">년도</label>
                <select id="cntrYear" name="cntrYear">
                    <option value="">전체</option>
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == cntrYear}"></option>
                </select>
            </div>
            <div class="field" style="margin-bottom:0;">
                <label for="upperLocgovCode">시·도</label>
                <select id="upperLocgovCode" name="upperLocgovCode" onchange="filterLocgov()">
                    <option value="">전체</option>
                    <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}" th:selected="${p.key == upperLocgovCode}"></option>
                </select>
            </div>
            <div class="field" style="margin-bottom:0;">
                <label for="locgovCode">시·군·구</label>
                <select id="locgovCode" name="locgovCode">
                    <option value="">전체</option>
                    <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                            th:attr="data-upper=${l.upperLocgovCode}" th:selected="${l.locgovCode == locgovCode}"></option>
                </select>
            </div>
            <button type="submit">검색</button>
        </div>
    </form>

    <div class="card-grid" style="margin-bottom:28px;">
        <div class="card">
            <div class="type">기부모금액</div>
            <div class="count" th:text="${#numbers.formatInteger(totalAmt, 0, 'COMMA')} + '원'"></div>
        </div>
        <div class="card">
            <div class="type">기부건수</div>
            <div class="count" th:text="${#numbers.formatInteger(totalCnt, 0, 'COMMA')} + '건'"></div>
        </div>
        <div class="card">
            <div class="type">기부인원</div>
            <div class="count" th:text="${#numbers.formatInteger(totalPersons, 0, 'COMMA')} + '명'"></div>
        </div>
        <div class="card">
            <div class="type">발생포인트</div>
            <div class="count" th:text="${#numbers.formatInteger(totalPoint, 0, 'COMMA')} + 'P'"></div>
        </div>
        <div class="card">
            <div class="type">답례품 사용금액</div>
            <div class="count" th:text="${#numbers.formatInteger(totalUsePoint, 0, 'COMMA')} + 'P'"></div>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>년도</th>
            <th>광역지자체</th>
            <th>기부지자체</th>
            <th>기부모금액</th>
            <th>기부건수</th>
            <th>기부인원</th>
            <th>발생포인트</th>
            <th>답례품 사용금액</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.cntrYear}"></td>
            <td>
                <a th:href="@{/give-state/detail(cntrYear=${r.cntrYear},upperLocgovCode=${r.upperLocgovCode},locgovCode=${r.locgovCode})}"
                   th:text="${r.upperLocgovNm}"></a>
            </td>
            <td>
                <a th:href="@{/give-state/detail(cntrYear=${r.cntrYear},upperLocgovCode=${r.upperLocgovCode},locgovCode=${r.locgovCode})}"
                   th:text="${r.locgovNm}"></a>
            </td>
            <td th:text="${#numbers.formatInteger(r.cntrAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.giveCnt, 0, 'COMMA')} + '건'"></td>
            <td th:text="${#numbers.formatInteger(r.givePersons, 0, 'COMMA')} + '명'"></td>
            <td th:text="${#numbers.formatInteger(r.cntrPoint, 0, 'COMMA')} + 'P'"></td>
            <td th:text="${#numbers.formatInteger(r.cntrUsePoint, 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">조회된 기부현황이 없습니다.</p>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
filterLocgov();
</script>
</body>
</html>
