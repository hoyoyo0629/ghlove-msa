<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부 통계 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/give/statistics 재현 - 8개+ legacy 화면 중 지자체별/운영통계는
     give-state/give-operation/stats와 중복이라 제외하고, 월별 추이/연령대별/금액구간별/
     개인별 순위/분담금 산정을 하나의 화면으로 통합했다(사용자 확인된 스코프). -->
<div class="wrap">
    <h1>기부 통계</h1>

    <form th:action="@{/give-statistics}" method="get" style="margin-bottom:28px;">
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="field" style="margin-bottom:0;">
                <label for="cntrYear">년도</label>
                <select id="cntrYear" name="cntrYear">
                    <option value="">전체</option>
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == cntrYear}"></option>
                </select>
            </div>
            <div class="field" style="margin-bottom:0;">
                <label for="upperLocgovCode">시·도</label>
                <select id="upperLocgovCode" name="upperLocgovCode" onchange="filterLocgov()">
                    <option value="">전체</option>
                    <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}" th:selected="${p.key == upperLocgovCode}"></option>
                </select>
            </div>
            <div class="field" style="margin-bottom:0;">
                <label for="locgovCode">시·군·구</label>
                <select id="locgovCode" name="locgovCode">
                    <option value="">전체</option>
                    <option th:each="l : ${allLocgovs}" th:value="${l.locgovCode}" th:text="${l.locgovNm}"
                            th:attr="data-upper=${l.upperLocgovCode}" th:selected="${l.locgovCode == locgovCode}"></option>
                </select>
            </div>
            <button type="submit">조회</button>
        </div>
    </form>

    <h2>월별 추이</h2>
    <table style="margin-bottom:32px;">
        <thead><tr><th>월</th><th>기부금액</th><th>기부건수</th></tr></thead>
        <tbody>
        <tr th:each="r : ${monthRows}">
            <td th:text="${r.month} + '월'"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.count, 0, 'COMMA')} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h2>연령대별 분포</h2>
    <table style="margin-bottom:32px;">
        <thead><tr><th>연령대</th><th>기부금액</th><th>기부건수</th></tr></thead>
        <tbody>
        <tr th:each="r : ${ageRows}">
            <td th:text="${r.bracket}"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.count, 0, 'COMMA')} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h2>금액구간별 분포</h2>
    <table style="margin-bottom:32px;">
        <thead><tr><th>기부금액 구간</th><th>합계금액</th><th>기부건수</th></tr></thead>
        <tbody>
        <tr th:each="r : ${amountRows}">
            <td th:text="${r.bracket}"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.count, 0, 'COMMA')} + '건'"></td>
        </tr>
        </tbody>
    </table>

    <h2>개인별 순위 (상위 20명)</h2>
    <table style="margin-bottom:32px;">
        <thead><tr><th>순위</th><th>기부자명</th><th>아이디</th><th>기부금액</th><th>기부건수</th></tr></thead>
        <tbody>
        <tr th:each="r, i : ${personalRows}">
            <td th:text="${i.index + 1}"></td>
            <td th:text="${r.userName}"></td>
            <td th:text="${r.loginId}"></td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.count, 0, 'COMMA')} + '건'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(personalRows)}">조회된 기부내역이 없습니다.</p>

    <h2>분담금 산정 리포트</h2>
    <p style="font-size:13px; color:#666; margin-bottom:12px;">
        ※ 실제 분담금 산정 기준이 별도로 확정되지 않아, 지자체 유치 기부금액의 1%를 임시 가정치로 적용했습니다. 기준 확정 시 교체가 필요합니다.
    </p>
    <table>
        <thead><tr><th>광역지자체</th><th>기부지자체</th><th>기부금액</th><th>분담금(가정치 1%)</th></tr></thead>
        <tbody>
        <tr th:each="r : ${levyRows}">
            <td th:text="${r.upperLocgovNm}"></td>
            <td th:text="${r.locgovNm}"></td>
            <td th:text="${#numbers.formatInteger(r.cntrAmt, 0, 'COMMA')} + '원'"></td>
            <td th:text="${#numbers.formatInteger(r.levyAmt, 0, 'COMMA')} + '원'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(levyRows)}">조회된 지자체 실적이 없습니다.</p>
</div>

<script th:inline="none">
function filterLocgov() {
    var upper = document.getElementById('upperLocgovCode').value;
    var select = document.getElementById('locgovCode');
    Array.prototype.forEach.call(select.options, function (opt) {
        if (!opt.value) { return; }
        opt.hidden = upper !== '' && opt.dataset.upper !== upper;
    });
}
filterLocgov();
</script>
</body>
</html>
