<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* AS-IS front/i18n/smarteditor/upload-ctp-result.jsp 이식 - CTP 업로드 결과 iframe 문서.
       이미지 결과와 같은 이스케이프 왕복이다(th:text로 심고 JS가 .html()로 읽어 넘긴다).
       오류는 서버가 코드만 내려주고 문구는 여기서 만든다(AS-IS 동일). */-->
<!--/* AS-IS는 <page:javascript> 레이아웃 태그가 이 스크립트를 jQuery가 있는 쪽으로 옮겨 준다.
       TO-BE는 레이아웃이 없는 bare 문서라 여기서 jQuery를 직접 싣는다(AS-IS 코드는 그대로 둔다). */-->
<script type="text/javascript" th:src="@{/content/modules/jquery/jquery-1.11.0.min.js}"></script>

<th:block th:if="${editorErrorCode == null}">
	<div id="ctp_content" th:text="${ctpContent}"></div>

	<script type="text/javascript">
	$(function() {
		var ctpContent = $('#ctp_content').html();
		//alert("------------->" + ctpContent);
		setTimeout(function() {
			parent.setCTPToEditor(ctpContent);
		}, 500);
	});
	</script>
</th:block>

<th:block th:if="${editorErrorCode != null}">
	<script type="text/javascript" th:inline="javascript">
		var editorErrorCode = /*[[${editorErrorCode}]]*/ '';
		var editorErrorMessage = /*[[${editorErrorMessage}]]*/ '';
		var errorMessage = {
			"ERROR_01": '등록이 불가능한 파일입니다. (' + editorErrorMessage + ')',
			"ERROR_02": '최대 등록 가능한 파일 사이즈는 ' + editorErrorMessage + 'MB 입니다.',
			"ERROR_03": 'html 파일은 포함하여 등록해 주세요.'
		};
		parent.Common.loading.hide();
		alert(errorMessage[editorErrorCode]);
	</script>
</th:block>
</body>
</html>
