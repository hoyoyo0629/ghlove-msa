<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title>관리자페이지</title>
	<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

	<link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print"/>

	<script type="text/javascript" th:src="@{/content/modules/jquery/jquery-1.11.0.min.js}"></script>
	<script type="text/javascript" th:src="@{/content/modules/spin.min.js}"></script>
	<script type="text/javascript" th:src="@{/content/modules/op.common.js}" charset="utf-8"></script>
	<script type="text/javascript" th:src="@{/content/modules/op.file.js}" charset="utf-8"></script>

	<meta name="_csrf" content=""/>
	<meta name="_csrf_header" content="X-CSRF-TOKEN"/>

</head>
<body>
<!-- AS-IS front/i18n/smarteditor/upload-ctp.jsp 이식 - 스마트에디터 "CTP(템플릿)" 버튼 팝업.
     스킨(SmartEditor2Skin_ko.html)이 hp_SE2M_CTP 플러그인을 노출하므로 이 경로도 있어야 한다.
     html(ctp) 파일과 그 안에서 참조하는 이미지를 함께 올리면, 서버가 <body> 안쪽만 떼어내고
     상대경로 이미지를 저장경로로 바꿔 돌려준다(SmartEditorController.uploadCtpProcess). -->
<div class="popup_wrap">
	<h1 class="popup_title">CTP <span th:text="${msg.get('M00088')}">등록</span></h1> <!-- 등록 -->

	<div class="popup_contents">
		<form id="editor_upimage" name="editor_upimage" th:action="@{/smarteditor/upload-ctp}" method="post"
		      target="frame_action" enctype="multipart/form-data">

			<p class="text-info text-sm">
				* html,css,image 파일을 드레그하여 선택해 주세요. <br>
				* <strong>5MB</strong><span th:text="${msg.get('M01072')}">이하의 이미지 파일(jpg, jpeg, gif, png)과 html(ctp) 파일만 등록할 수 있습니다.</span>

			</p>

			<table class="board_write_table" summary="관련상품등록">
				<caption>관련상품등록</caption>
				<colgroup>
					<col style="width: 80px"/>
					<col style=""/>
				</colgroup>
				<tbody>
				<tr>
					<td class="label" th:text="${msg.get('M01070')}">파일</td> <!-- 파일 -->
					<td>
						<div>
							<button type="button" id="add_file" style="display:none" class="table_btn">
								<span>+ <span th:text="${msg.get('M01071')}">파일추가</span></span></button> <!-- 파일추가 -->
							<p class="default_file"><input type="file" class="upload" id="uploadInputBox" name="file[]"
							                               multiple="multiple"/></p>

							<div id="multiple_files">

							</div>
						</div>
					</td>
				</tr>
				</tbody>
			</table>

			<p class="popup_btns">
				<button type="submit" class="btn btn-active" th:text="${msg.get('M00088')}">등록</button> <!-- 등록 -->
				<a href="javascript:self.close();" class="btn btn-default" th:text="${msg.get('M00037')}">취소</a> <!-- 취소 -->
			</p>

		</form>
	</div>
</div>

<iframe src="" id="frame_action" name="frame_action"
        style="display:none;width: 1000px;height: 800px; border:1px solid red"></iframe>

<script type="text/javascript">
	$(function () {

		// multiple file is not support
		if (!File.isSupportMultiple) {
			// 파일 추가
			$('#add_file').css('margin-bottom', '10px').show().on("click", function () {
				var html = '<p><input type="file" name="file[]" multiple="multiple" /> <a href="javascript:deleteFile()" class="delete_detail_image_file">[' + Message.get("M00074") + ']</a></p>';  // 삭제
				$('#multiple_files').append(html);
			});

			// 추가항목 삭제
			$('#multiple_files').on('click', '.delete_detail_image_file', function (e) {
				e.preventDefault();
				$(this).parent().remove();
			});
		}
	});

	function setCTPToEditor(oFileInfo) {
		if (!!opener && !!opener.nhn && !!opener.nhn.husky && !!opener.nhn.husky.PopUpManager) {
			//스마트 에디터 플러그인을 통해서 넣는 방법 (oFileInfo는 Array)
			//opener.nhn.husky.PopUpManager.setCallback(window, 'SET_CTP', [oFileInfo]);
			//본문에 바로 tag를 넣는 방법 (oFileInfo는 String으로 <img src=....> )
			//opener.nhn.husky.PopUpManager.setCallback(window, 'SET_CONTENTS', [""]);
			opener.nhn.husky.PopUpManager.setCallback(window, 'PASTE_HTML', [oFileInfo]);
			//opener.nhn.husky.PopUpManager.setCallback(window, 'PASTE_HTML', "텍스트");

			self.close();
		}
	}
</script>

</body>
</html>
