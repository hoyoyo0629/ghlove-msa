<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>운영유지관리 게시판 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <h3>운영유지관리 게시판</h3>

    <form method="get" th:action="@{/admin/maintenance}" class="search_form">
        <label>접수일 시작 <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd"></label>
        <label>접수일 종료 <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd"></label>
        <label>완료구분
            <select name="processState">
                <option value="">전체</option>
                <option value="접수" th:selected="${processState == '접수'}">접수</option>
                <option value="처리중" th:selected="${processState == '처리중'}">처리중</option>
                <option value="처리완료" th:selected="${processState == '처리완료'}">처리완료</option>
                <option value="제외" th:selected="${processState == '제외'}">제외</option>
            </select>
        </label>
        <label>제목검색 <input type="text" name="keyword" th:value="${keyword}"></label>
        <button type="submit" class="btn">검색</button>
    </form>

    <p>
        <a class="btn" th:href="@{/admin/maintenance/new}">+ SR 등록</a>
        <!-- AS-IS PrivacyAccess.MAINTENANCE_EXCEL_DOWNLOAD("운영관리 SR게시판") - 개인정보 포함
             다운로드라 사유 모달을 먼저 띄워 접근로그를 남긴다 -->
        <a class="btn" href="javascript:;"
           th:attr="data-download-url=@{/admin/maintenance/export(startDate=${startDate},endDate=${endDate},processState=${processState},keyword=${keyword})}"
           onclick="openPrivacyModal(this.getAttribute('data-download-url'));">CSV 다운로드</a>
    </p>
    <div th:replace="~{fragments/privacy-access :: modal}"></div>

    <table class="board_list_table">
        <thead>
        <tr><th>접수일</th><th>제목</th><th>요청경로</th><th>업무구분</th><th>완료구분</th><th>담당자</th><th>긴급</th><th>조회수</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.reqCrtDate}"></td>
            <td><a th:href="@{'/admin/maintenance/' + ${r.bbsId} + '/edit'}" th:text="${r.bbsTtl}"></a></td>
            <td th:text="${r.reqChannel}"></td>
            <td th:text="${r.processType}"></td>
            <td th:text="${r.processState}"></td>
            <td th:text="${r.processManagerNm}"></td>
            <td th:text="${r.urgentYn == 'Y' ? '긴급' : ''}"></td>
            <td th:text="${r.inqCnt}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">등록된 SR이 없습니다.</p>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
