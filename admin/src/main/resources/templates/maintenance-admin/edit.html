<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>운영유지관리 SR게시판 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/maintenance/edit.jsp 이식(메뉴 5113 수정).
     등록화면(form.jsp)과 표 구성은 같고 bbsId hidden·값 바인딩·기존 첨부 목록이 더 있다.

     ★ AS-IS verbatim: 저장 버튼 문구가 M00087("수정")이고 confirm은 "게시글을 수정 하시겠습니까?"다.
       첨부 옆 [x]는 소프트 삭제(USE_YN='N')이고 확인 문구는 브라우저 confirm이다.
       목록 버튼은 AS-IS가 주석처리해 두었다 - 취소 버튼만 있다.
     ★ 표 전체가 role 체크로 감싸져 ROLE_ADMIN_1·2에게만 보인다.
       담당자·조치결과·날짜는 ROLE_ADMIN_1만 입력할 수 있다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span></span></h3>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c00; margin-bottom:12px;"></p>

<form id="maintenanceDto" method="post" enctype="multipart/form-data"
      th:action="@{'/admin/maintenance/edit/' + ${maintenanceDto.bbsId}}">
	<input type="hidden" name="bbsId" th:value="${maintenanceDto.bbsId}"/>

	<div class="board_write">
		<table class="board_write_table" th:attr="summary=${msg.get('M00269')}">
			<colgroup>
				<col style="width: 220px;">
			</colgroup>
			<tbody>
			<th:block th:if="${role == 'ROLE_ADMIN_1' or role == 'ROLE_ADMIN_2'}">
				<tr>
					<td class="label"><span class="required_mark">*</span>KI구분</td>
					<td colspan="3">
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="ki_1" name="kiType" type="radio" value="1" th:checked="${maintenanceDto.kiType == '1'}">
								<label for="ki_1">홈페이지</label>
							</div>
							<div class="input-form">
								<input id="ki_2" name="kiType" type="radio" value="2" th:checked="${maintenanceDto.kiType == '2'}">
								<label for="ki_2">관리자시스템</label>
							</div>
							<div class="input-form">
								<input id="ki_3" name="kiType" type="radio" value="3" th:checked="${maintenanceDto.kiType == '3'}">
								<label for="ki_3">기타</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>요청경로</td>
					<td>
						<div class="flex_box gap-08 item-center">
							<select id="reqChannel" name="reqChannel" title="요청경로" class="wd-200 required">
								<option value="">-선택-</option>
								<option th:each="code : ${maintenPathList}" th:value="${code.key}" th:text="${code.value}"
										th:selected="${maintenanceDto.reqChannel == code.key}"></option>
							</select>
						</div>
					</td>
					<td class="label"><span class="required_mark">*</span>업무구분</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="req_1" name="reqType" type="radio" value="1" th:checked="${maintenanceDto.reqType == '1'}">
								<label for="req_1">기부</label>
							</div>
							<div class="input-form">
								<input id="req_2" name="reqType" type="radio" value="2" th:checked="${maintenanceDto.reqType == '2'}">
								<label for="req_2">답례품</label>
							</div>
							<div class="input-form">
								<input id="req_3" name="reqType" type="radio" value="3" th:checked="${maintenanceDto.reqType == '3'}">
								<label for="req_3">기타</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>처리구분</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="proc_1" name="processType" type="radio" value="1" th:checked="${maintenanceDto.processType == '1'}">
								<label for="proc_1">기능신규</label>
							</div>
							<div class="input-form">
								<input id="proc_2" name="processType" type="radio" value="2" th:checked="${maintenanceDto.processType == '2'}">
								<label for="proc_2">기능개선</label>
							</div>
							<div class="input-form">
								<input id="proc_3" name="processType" type="radio" value="3" th:checked="${maintenanceDto.processType == '3'}">
								<label for="proc_3">오류수정</label>
							</div>
							<div class="input-form">
								<input id="proc_4" name="processType" type="radio" value="4" th:checked="${maintenanceDto.processType == '4'}">
								<label for="proc_4">자료추출</label>
							</div>
							<div class="input-form">
								<input id="proc_5" name="processType" type="radio" value="5" th:checked="${maintenanceDto.processType == '5'}">
								<label for="proc_5">데이터수정</label>
							</div>
							<div class="input-form">
								<input id="proc_6" name="processType" type="radio" value="6" th:checked="${maintenanceDto.processType == '6'}">
								<label for="proc_6">기타</label>
							</div>
						</div>
					</td>
					<td class="label"><span class="required_mark">*</span>완료구분</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input id="stat_1" name="processState" type="radio" value="1" th:checked="${maintenanceDto.processState == '1'}">
								<label for="stat_1">접수</label>
							</div>
							<div class="input-form">
								<input id="stat_2" name="processState" type="radio" value="2" th:checked="${maintenanceDto.processState == '2'}">
								<label for="stat_2">처리중</label>
							</div>
							<div class="input-form">
								<input id="stat_3" name="processState" type="radio" value="3" th:checked="${maintenanceDto.processState == '3'}">
								<label for="stat_3">처리완료</label>
							</div>
							<div class="input-form">
								<input id="stat_4" name="processState" type="radio" value="9" th:checked="${maintenanceDto.processState == '9'}">
								<label for="stat_4">제외</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark"></span>고객전화번호</td>
					<td>
						<div class="flex_box gap-08 item-center">
							<input type="hidden" id="reqUserPhoneNumber" name="reqUserPhoneNumber"
								   th:value="${maintenanceDto.reqUserPhoneNumber}"/>
							<select id="chargerCttpc1" title="-선택-" class="wd-150">
								<option value="">-선택-</option>
								<option th:each="code : ${phoneCodeList}" th:value="${code.key}" th:text="${code.value}"></option>
								<option th:each="code : ${telCodeList}" th:value="${code.key}" th:text="${code.value}"></option>
							</select>
							<span class="wave">-</span>
							<input id="chargerCttpc2" class="basic wd-150 _number" title="" type="text" maxlength="4" value="">
							<span class="wave">-</span>
							<input id="chargerCttpc3" class="basic wd-150 _number" title="" type="text" maxlength="4" value="">
						</div>
					</td>
					<td class="label"><span class="required_mark"></span>고객실명정보(아이디 이메일 등)</td>
					<td>
						<div>
							<input type="text" id="reqUserInfo" name="reqUserInfo" title="고객정보"
								   class="input_txt _filter full" maxlength="255"
								   th:value="${maintenanceDto.reqUserInfo}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00275')}">제목</span></td>
					<td colspan="3">
						<div>
							<input type="text" id="bbsTtl" name="bbsTtl" th:title="${msg.get('M00275')}"
								   class="input_txt required _filter half" maxlength="255"
								   th:value="${maintenanceDto.bbsTtl}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00006')}">내용</span></td>
					<td colspan="3">
						<!-- smart_editor2 area -->
						<div class="smart_editor2-wrap">
							<textarea id="bbsCn" name="bbsCn" cols="30" rows="20" maxlength="300"
									  class="w90 editor-content" th:title="${msg.get('M00006')}"
									  th:text="${maintenanceDto.bbsCn}"></textarea>
						</div>
						<!-- smart_editor2 area -->
					</td>
				</tr>
				<tr>
					<td class="label" th:text="${msg.get('M01699')}">첨부파일</td>
					<td colspan="3">
						<div class="flex_box item-center">
							<span class="input_file_txt">파일 등록 : </span>
							<input type="file" name="detailImageFiles" onchange="addFile(this);"/>
						</div>
						<div>
							<p style="color:red;">※ 첨부파일은 1개(50MB 이하) / jp(e)g, png, ppt(x), xlsx, hwp(x), doc(x), pdf,  bmp, gif, zip, 7z만 가능합니다.</p>
						</div>
						<div class="file-list-title">
							<div class="file_camera" th:each="file : ${files}" th:id="'fileId_' + ${file.fileId}">
								<a th:attr="onclick=|downloadItemImage(${file.fileId});|" href="javascript:;"
								   th:text="${file.orgnlAtchFileNm}"></a>
								<a th:attr="onclick=|deleteItemImage(${file.fileId});|" href="javascript:;">
									<img th:src="@{/content/images/btn/file_close.gif}" alt="close">
								</a>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark"></span>담당자</td>
					<td>
						<div>
							<input type="text" id="processManagerNm" name="processManagerNm" title="담당자"
								   class="input_txt _filter half" maxlength="255"
								   th:value="${maintenanceDto.processManagerNm}"
								   th:disabled="${role != 'ROLE_ADMIN_1'}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark"></span>조치결과</td>
					<td colspan="3">
						<div>
							<span class="placeholder_wrap">
								<span class="placeholder"></span>
								<textarea id="processCn" name="processCn" cols="30" rows="10"
										  class="input_txt _filter full" title="조치결과"
										  th:disabled="${role != 'ROLE_ADMIN_1'}"
										  th:text="${maintenanceDto.processCn}"></textarea>
							</span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark"></span>접수일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="processReceiptDate" name="processReceiptDate"
								pattern="[0-9]{8}" maxlength="8" class="datepicker" title="접수일"
								th:value="${maintenanceDto.processReceiptDate}"/></span>
						</div>
					</td>
					<td class="label"><span class="required_mark"></span>종료예정일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="processTargetEndDate" name="processTargetEndDate"
								pattern="[0-9]{8}" maxlength="8" class="datepicker" title="종료예정일"
								th:value="${maintenanceDto.processTargetEndDate}"/></span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark"></span>시작일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="processStartDate" name="processStartDate"
								pattern="[0-9]{8}" maxlength="8" class="datepicker" title="시작일"
								th:value="${maintenanceDto.processStartDate}"/></span>
						</div>
					</td>
					<td class="label"><span class="required_mark"></span>종료일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="processEndDate" name="processEndDate"
								pattern="[0-9]{8}" maxlength="8" class="datepicker" title="종료일"
								th:value="${maintenanceDto.processEndDate}"/></span>
						</div>
					</td>
				</tr>
			</th:block>
			</tbody>
		</table>

		<div class="btn_all btn_center">
			<div class="flex_box gap-08">
				<!-- AS-IS 주석처리: [목록] 버튼 -->
				<button type="submit" class="btn btn-dark-gray btn-small">
					<span th:text="${msg.get('M00087')}">수정</span>
				</button>
				<button type="button" class="btn btn-defualt btn-small"
						onclick="location.href='/admin/maintenance'" th:text="${msg.get('M00037')}">취소</button>
			</div>
		</div>
	</div>
</form>

    </div>
    </div>
</div>
</div>

<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('bbsCn')}"></div>

<script type="text/javascript" th:inline="javascript">
var isSystemAdmin = /*[[${role == 'ROLE_ADMIN_1'}]]*/ false;
var savedPhone = /*[[${maintenanceDto.reqUserPhoneNumber}]]*/ '';

$(function() {
	try {
		if (!isSystemAdmin) {
			$('.datepicker').datepicker('disable');
		}
		$('#maintenanceDto').validator(function() {
			Common.getEditorContent("bbsCn");

			if ($('#bbsCn').val().toLowerCase() == '<p>&nbsp;</p>' || $('#bbsCn').val() == '') {
				alert($.validator.messages['text'].format($('#bbsCn').attr('title')));
				return false;
			}
		});
	} catch (e) {
		alert(e.message);
	}

	// 저장된 전화번호를 세 칸으로 되돌린다(AS-IS는 JSP EL로 앞자리만 선택해 둔다)
	if (savedPhone) {
		var parts = String(savedPhone).split('-');
		if (parts.length === 3) {
			$('#chargerCttpc1').val(parts[0]);
			$('#chargerCttpc2').val(parts[1]);
			$('#chargerCttpc3').val(parts[2]);
		}
	}

	$("#maintenanceDto").on("submit", function(e) {
		var chargerCttpc = $("#chargerCttpc1").val() + "-" + $("#chargerCttpc2").val() + "-" + $("#chargerCttpc3").val();
		$("#reqUserPhoneNumber").val(chargerCttpc);
		if (!confirm("게시글을 수정 하시겠습니까?")) {
			e.preventDefault();
		}
	});
});

/*
 * 함 수 명 : addFile
 * 기 능 : 첨부파일 유효성 검사
 */
function addFile(obj) {
	let size = 50 * 1024 * 1024;
	let fileTypes = ['jpg', 'jpeg', 'gif', 'bmp', 'png', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'pdf', 'tif', 'tiff', 'hwp', 'hwpx', 'zip', '7z'];

	if ($('.file_camera').length > 0) {
		alert("이미 등록된 파일이이 있습니다.");
		$("input:file[name='detailImageFiles']").val('');
		return false;
	}

	if (obj.files.length > 5) {
		alert("첨부파일은 최대 5개 까지 첨부 가능합니다.");
		$("input:file[name='detailImageFiles']").val('');
		return false;
	}

	for (const file of obj.files) {
		let type = file.name.split('.').pop().toLowerCase();

		if (file.size > size) {
			alert("첨부파일 용량은 최대 50MB 까지 가능합니다.");
			$("input:file[name='detailImageFiles']").val('');
			return false;
		} else if ($.inArray(type, fileTypes) == -1) {
			alert("등록할 수 없는 첨부파일 입니다.")
			$("input:file[name='detailImageFiles']").val('');
			return false;
		}
	}
}

function downloadItemImage(fileId) {
	location.href = '/admin/maintenance/file-download/' + fileId;
}

function deleteItemImage(fileId) {
	var message = '파일이 실제로 삭제됩니다.\n삭제하시겠습니까?';
	if (!confirm(message)) {
		return;
	}

	var param = {'fileId': fileId};
	$.post('/admin/maintenance/delete-item-image', param, function(response) {
		Common.responseHandler(response);
		$("#fileId_" + fileId).remove();
	});
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
