<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>이벤트 관리 - 고향사랑e음 (admin service)</title>
</head>
<!-- AS-IS opmanager/i18n/featured/list.jsp 이식(이벤트 관리). OP_FEATURED는 지자체별 이벤트(class=0,type=1).
     GET=빈 목록(검색폼만), POST=검색. 지자체 스코핑: ROLE_ADMIN_5~8 자기 지자체, 1~4(시스템/행안부) 전체+시도/시군구 필터.
     체크박스·등록·삭제 버튼은 ROLE_ADMIN_5/6만(canManage). 지자체 컬럼/필터는 1~4만(systemOrMois). -->
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
        <h3><span>이벤트 관리</span></h3>

        <!-- 조회 영역 -->
        <form id="featuredParam" method="post" th:action="@{/admin/featured}">
            <div class="item_list">
                <div class="board_write">
                    <table class="board_write_table" summary="이벤트 등록">
                        <colgroup>
                            <col style="width:220px;">
                            <col>
                            <col style="width:220px;">
                            <col>
                        </colgroup>
                        <tbody>
                            <!-- 시스템/행안부 관리자(1~4)만 지자체 필터 -->
                            <tr th:if="${systemOrMois}">
                                <td class="label">지자체</td>
                                <td colspan="3">
                                    <div class="flex_box gap-08">
                                        <select id="selectSidoCode" name="upperLocgovCode" title="지자체" class="wd-150"
                                                onchange="searchSigungu(this)">
                                            <option value="">-시,도-</option>
                                            <option th:each="s : ${sido}" th:value="${s.value}" th:text="${s.label}"
                                                    th:selected="${s.value == upperLocgovCode}"></option>
                                        </select>
                                        <select id="selectSigungu" name="locgovCode" title="지자체" class="wd-150">
                                            <option value="">-시,군,구-</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">검색구분</td>
                                <td colspan="3">
                                    <div class="flex_box gap-08">
                                        <select name="where" title="상세검색 선택" class="wd-150">
                                            <option value="FEATURED_NAME" th:selected="${where == 'FEATURED_NAME'}">이벤트명</option>
                                        </select>
                                        <input name="query" class="input_txt required _filter full" title="검색어"
                                               type="text" th:value="${query}"/>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">진행상태</td>
                                <td>
                                    <div class="flex_box gap-12">
                                        <label><input type="radio" name="progression" value=""
                                                      th:checked="${progression == null or progression == ''}"/> 전체</label>
                                        <label><input type="radio" name="progression" value="2"
                                                      th:checked="${progression == '2'}"/> 진행중</label>
                                        <label><input type="radio" name="progression" value="3"
                                                      th:checked="${progression == '3'}"/> 진행완료</label>
                                    </div>
                                </td>
                                <td class="label">공개유무</td>
                                <td>
                                    <div class="flex_box gap-12">
                                        <label><input type="radio" name="displayListFlag" value=""
                                                      th:checked="${displayListFlag == null or displayListFlag == ''}"/> 전체</label>
                                        <label><input type="radio" name="displayListFlag" value="Y"
                                                      th:checked="${displayListFlag == 'Y'}"/> 공개</label>
                                        <label><input type="radio" name="displayListFlag" value="N"
                                                      th:checked="${displayListFlag == 'N'}"/> 비공개</label>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="btn_all btn_left">
                        <ul class="list-bullet point">
                            <li>검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.</li>
                        </ul>
                    </div>
                    <div class="btn_all btn_right">
                        <div class="flex_box gap-08">
                            <button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/featured';">초기화</button>
                            <button type="submit" class="btn btn-dark-gray btn-mini">검색</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- // 조회 영역 -->

            <!-- 결과 영역 -->
            <div class="count_title mt-40">
                <h5>총 <span th:text="${featuredCount}">0</span>건</h5>
                <span>
                    <select name="itemsPerPage" title="화면출력수" onchange="this.form.submit();">
                        <option value="10" th:selected="${itemsPerPage == 10}">10개 출력</option>
                        <option value="20" th:selected="${itemsPerPage == 20}">20개 출력</option>
                        <option value="50" th:selected="${itemsPerPage == 50}">50개 출력</option>
                        <option value="100" th:selected="${itemsPerPage == 100}">100개 출력</option>
                    </select>
                </span>
            </div>
        </form>

        <form id="listForm" method="post" th:action="@{/admin/featured/checked-delete}">
            <div class="board_list">
                <table class="board_list_table">
                    <colgroup>
                        <col th:if="${canManage}" style="width:50px;">
                        <col style="width:50px;">
                        <col th:if="${systemOrMois}" style="width:200px;">
                        <col style="width:500px;">
                        <col style="width:150px;">
                        <col style="width:150px;">
                        <col style="width:200px;">
                        <col style="width:200px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col" th:if="${canManage}"><input type="checkbox" id="check_all"></th>
                            <th scope="col">No.</th>
                            <th scope="col" th:if="${systemOrMois}">지자체</th>
                            <th scope="col">이벤트명</th>
                            <th scope="col">진행상태</th>
                            <th scope="col">공개여부</th>
                            <th scope="col">진행기간</th>
                            <th scope="col">등록일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r, i : ${featuredList}" style="background:#fff;">
                            <td th:if="${canManage}">
                                <div><input type="checkbox" name="featuredIds" th:value="${r.featuredId}"></div>
                            </td>
                            <td><div th:text="${pagination.itemNumber - i.count}">0</div></td>
                            <td th:if="${systemOrMois}"><div th:text="${r.locgovName}"></div></td>
                            <td>
                                <div><a th:href="@{/admin/featured/{id}/edit(id=${r.featuredId})}" th:text="${r.featuredName}"></a></div>
                            </td>
                            <td>
                                <div th:text="${r.progression == '1'} ? '미진행' : (${r.progression == '2'} ? '진행중' : (${r.progression == '3'} ? '진행완료' : ''))"></div>
                            </td>
                            <td>
                                <div th:text="${r.displayListFlag == 'Y'} ? '공개' : (${r.displayListFlag == 'N'} ? '비공개' : '')"></div>
                            </td>
                            <td>
                                <!-- AS-IS 진행기간: 99999999 센티넬(상시 게시/개방형), op:date=yyyy-MM-dd -->
                                <div th:text="${(r.startDate == '99999999' and r.endDate == '99999999') ? '상시 게시'
                                              : ((r.startDate != '99999999' and r.endDate == '99999999') ? (@opDate.ymd(r.startDate) + ' ~ ')
                                              : ((r.startDate != null and r.startDate != '') ? (@opDate.ymd(r.startDate) + ' ~ ' + @opDate.ymd(r.endDate))
                                              : '-'))}"></div>
                            </td>
                            <td><div th:text="${@opDate.ymd(r.createdDate)}"></div></td>
                        </tr>
                    </tbody>
                </table>
                <div class="no_content" th:if="${#lists.isEmpty(featuredList)}">
                    데이터가 없습니다.
                </div>

                <!-- 하단 버튼: ROLE_ADMIN_5/6만 -->
                <div class="btn_all btn_right" th:if="${canManage}">
                    <div class="flex_box gap-08">
                        <button type="button" class="btn btn-dark-gray btn-mini" onclick="document.location.href='/admin/featured/new';">등록</button>
                        <button id="deleteBtn" type="button" class="btn btn-default btn-mini">삭제</button>
                    </div>
                </div>

                <div class="pagination-wrap" th:if="${not #lists.isEmpty(featuredList)}">
                    <div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
                </div>
            </div>
        </form>
        <!-- // 결과 영역 -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript" th:inline="javascript">
    var selectedUpper = /*[[${upperLocgovCode}]]*/ '';
    var selectedLocgov = /*[[${locgovCode}]]*/ '';

    $(function(){
        // 삭제(선택삭제) - ROLE_ADMIN_5/6
        $("#deleteBtn").on("click", function(){
            if ($("input[name='featuredIds']:checked").size() > 0) {
                if (confirm("삭제하시겠습니까?")) {
                    $("#listForm").submit();
                }
            } else {
                alert("선택된 데이터가 없습니다.");
            }
        });
        $("#check_all").on("click", function(){
            $("input[name='featuredIds']").prop("checked", $(this).prop("checked"));
        });

        // 시도 선택돼 있으면 시군구 목록 복원
        if (selectedUpper) {
            $("#selectSidoCode").val(selectedUpper);
            searchSigungu(document.getElementById("selectSidoCode"));
        }
    });

    // AS-IS searchSigungu - 선택 시도의 시군구 목록 조회(/admin/featured/locgov-children)
    function searchSigungu(sidoElement) {
        var sidoValue = sidoElement.value;
        $("#selectSigungu option").remove();
        $("#selectSigungu").append('<option value="">-시,군,구-</option>');
        if (!sidoValue) { return; }
        $.get("/admin/featured/locgov-children", { "upper": sidoValue }, function(data){
            for (var i = 0; i < data.length; i++) {
                $("#selectSigungu").append('<option value="' + data[i].LOCGOV_CODE + '">' + data[i].LOCGOV_NM + '</option>');
            }
            if (selectedLocgov) {
                $("#selectSigungu").val(selectedLocgov);
            }
        });
    }
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
