<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .hint { font-size: 12px; color: #777; margin: 6px 0; text-align: left; width: 100%; }
        .dev-code { font-size: 12px; color: #00215A; background: #eef1f7; border-radius: 5px; padding: 8px 10px; margin: 6px 0; width: 100%; text-align: left; }
    </style>
</head>
<body>
<!-- AS-IS opmanager/user/login_main.jsp 재현 - 인증서(금융/공동인증서) 로그인 카드와
     아이디 로그인 카드를 좌우로 나란히 배치한다. 인증서 로그인은 MagicLine4Web 브라우저
     SDK(로컬에 없음, 정부 PKI 연계 방화벽도 미개방) 대신 인증서 파일을 직접 업로드받아
     서버에서 X.509를 파싱하는 방식으로 실제 동작한다(CertLoginService와 동일 패턴,
     지자체 담당자 인증서 로그인에서 이미 검증된 방식) - 나중에 실제 방화벽이 열리고
     MagicLine 연계가 필요해지면 이 업로드 폼을 SDK 콜백으로 바꾸기만 하면 된다.
     아이디 로그인은 AS-IS와 동일하게 한 카드 안에서 ID/PW -> (이메일 미등록 시 이메일
     입력) -> 인증번호 입력이 순차로 펼쳐지는 인라인 흐름이다(페이지 이동 없음). -->
<nav class="navbar">
    <div class="logo">운영관리<span class="badge">admin</span></div>
</nav>

<div class="wrap" style="max-width: 1040px; margin: 0 auto;">
    <div class="login_tit">관리자 로그인</div>

    <p class="error" id="errorMessage" style="display:none; text-align:center;"></p>

    <div class="login_form_box">
        <!-- 인증서 로그인 -->
        <div class="login_form auth">
            <div class="top_area"><span class="top_tit">인증서 로그인</span></div>
            <div class="cont_area">
                <form id="certForm" onsubmit="return submitCert()">
                    <div class="button_wrap">
                        <button type="button" class="btn" onclick="document.getElementById('certFile').click()">
                            <span>금융인증서</span>
                        </button>
                        <button type="button" class="btn" onclick="document.getElementById('certFile').click()">
                            <span>공동인증서</span><span class="text-lg">(구 공인인증서)</span>
                        </button>
                    </div>
                    <input type="file" id="certFile" name="certFile" accept=".der,.crt,.pem,.cer" style="display:none" onchange="submitCert()">
                    <p class="hint" id="certHint" style="text-align:center;">인증서 파일을 선택하면 바로 로그인을 시도합니다.</p>
                    <div class="info_area">
                        <p class="txt">인증서가 사전 등록되어 있어야<br>로그인이 가능합니다.</p>
                        <a class="btn btn-mini" style="height:36px; padding:0 14px; font-size:12px;"
                           th:href="@{/admin/my-cert}">인증서 등록/삭제</a>
                    </div>
                </form>
            </div>
        </div>
        <!--// 인증서 로그인 -->

        <!-- 아이디 로그인 -->
        <div class="login_form pwd">
            <div class="top_area"><span class="top_tit">아이디 로그인</span></div>
            <div class="cont_area">
                <form id="stepPassword" onsubmit="return submitCheck()">
                    <div class="id_pw_row" id="idpwDiv">
                        <div class="flex_box col">
                            <input type="text" id="loginId" name="loginId" placeholder="아이디" required autofocus autocomplete="username">
                            <input type="password" id="password" name="password" placeholder="비밀번호" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn">인증번호<br>발송</button>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" id="idSave">
                        <label for="idSave">아이디 저장</label>
                    </div>
                </form>

                <form id="stepEmail" class="reveal-row" style="display:none" onsubmit="return submitEmail()">
                    <div class="flex_box col">
                        <input type="text" id="email" name="email" placeholder="이메일" required autocomplete="email">
                    </div>
                    <button type="submit" class="btn">저장</button>
                </form>

                <form id="stepAuth" class="reveal-row" style="display:none" onsubmit="return submitVerify()">
                    <div class="flex_box col">
                        <input type="text" id="authNum" name="authNum" placeholder="인증번호" maxlength="6" inputmode="numeric" required autocomplete="off">
                        <span class="time" id="timerDisplay"></span>
                    </div>
                    <button type="submit" class="btn">로그인</button>
                </form>
                <p class="hint" id="authSentMessage"></p>
                <p class="dev-code" id="devCodeHint" style="display:none"></p>
            </div>
        </div>
        <!--// 아이디 로그인 -->
    </div>

    <div class="login_sub_tit">
        <ul style="margin-bottom:16px;">
            <li>○ <strong>인증서 로그인</strong></li>
            <li style="padding-left:16px;">- 원활한 이용을 위해 인증서를 미리 발급 및 등록해 주시기 바랍니다.</li>
        </ul>
        <ul>
            <li>○ <strong>아이디 로그인</strong></li>
            <li style="padding-left:16px;">- 아이디와 비밀번호를 입력한 후 [인증번호 발송]을 누르면 회원정보에 등록한 이메일로 인증번호가 발송됩니다.</li>
        </ul>
    </div>

    <p style="text-align:center; margin-top:8px; font-size:13px;">
        <a th:href="@{/admin/manager-requests/new}">관리자 계정이 없으신가요? 권한 요청하기</a>
    </p>
</div>

<script th:inline="none">
var RETURN_TO = /*[[${returnTo}]]*/ null;
var timer = null;

function showError(msg) {
    var el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
}

function postForm(url, params) {
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(params).toString()
    }).then(function (r) { return r.json(); });
}

function postFile(url, fieldName, file, extra) {
    var fd = new FormData();
    fd.append(fieldName, file);
    Object.keys(extra || {}).forEach(function (k) { fd.append(k, extra[k]); });
    return fetch(url, { method: 'POST', body: fd }).then(function (r) { return r.json(); });
}

function showDevCode(devCode) {
    var hint = document.getElementById('devCodeHint');
    if (devCode) {
        hint.textContent = '🔧 개발모드(이메일 미연동): 인증번호는 ' + devCode + ' 입니다.';
        hint.style.display = 'block';
    } else {
        hint.style.display = 'none';
    }
}

function startTimer() {
    var display = document.getElementById('timerDisplay');
    var leftSec = 300;
    if (timer) { clearInterval(timer); }
    display.style.color = '';
    var tick = function () {
        var m = Math.floor(leftSec / 60), s = leftSec % 60;
        display.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        if (--leftSec < 0) {
            clearInterval(timer);
            display.textContent = '시간초과';
            display.style.color = '#EB474D';
        }
    };
    tick();
    timer = setInterval(tick, 1000);
}

// 아이디 저장
window.addEventListener('DOMContentLoaded', function () {
    var saved = localStorage.getItem('saved_manager_login_id');
    if (saved) {
        document.getElementById('idSave').checked = true;
        document.getElementById('loginId').value = saved;
    }
});

function submitCheck() {
    showError('');
    var loginId = document.getElementById('loginId').value;
    var password = document.getElementById('password').value;
    postForm('/admin/login/check', { loginId: loginId, password: password }).then(function (res) {
        if (res.status === 'NEED_EMAIL') {
            document.getElementById('idpwDiv').closest('form').classList.add('disabled-div');
            document.getElementById('stepEmail').style.display = 'flex';
            document.getElementById('email').focus();
        } else if (res.status === 'CODE_SENT') {
            if (document.getElementById('idSave').checked) {
                localStorage.setItem('saved_manager_login_id', loginId);
            } else {
                localStorage.removeItem('saved_manager_login_id');
            }
            document.getElementById('stepPassword').classList.add('disabled-div');
            document.getElementById('authSentMessage').textContent = res.message;
            showDevCode(res.devCode);
            document.getElementById('stepAuth').style.display = 'flex';
            document.getElementById('authNum').focus();
            startTimer();
        } else {
            showError(res.message || '오류가 발생했습니다.');
        }
    });
    return false;
}

function submitEmail() {
    showError('');
    var email = document.getElementById('email').value;
    postForm('/admin/login/save-email', { email: email }).then(function (res) {
        if (res.status === 'CODE_SENT') {
            document.getElementById('stepEmail').style.display = 'none';
            document.getElementById('authSentMessage').textContent = res.message;
            showDevCode(res.devCode);
            document.getElementById('stepAuth').style.display = 'flex';
            document.getElementById('authNum').focus();
            startTimer();
        } else {
            showError(res.message || '오류가 발생했습니다.');
        }
    });
    return false;
}

function submitVerify() {
    showError('');
    var code = document.getElementById('authNum').value;
    postForm('/admin/login/verify', { code: code, returnTo: RETURN_TO || '' }).then(function (res) {
        if (res.status === 'OK') {
            if (timer) { clearInterval(timer); }
            location.href = res.redirect || '/stats';
        } else {
            showError(res.message || '오류가 발생했습니다.');
        }
    });
    return false;
}

function submitCert() {
    showError('');
    var file = document.getElementById('certFile').files[0];
    if (!file) { return false; }
    document.getElementById('certHint').textContent = '인증서 확인 중...';
    postFile('/admin/login/cert', 'certFile', file, { returnTo: RETURN_TO || '' }).then(function (res) {
        document.getElementById('certHint').textContent = '인증서 파일을 선택하면 바로 로그인을 시도합니다.';
        if (res.status === 'OK') {
            location.href = res.redirect || '/stats';
        } else {
            showError(res.message || '오류가 발생했습니다.');
        }
    });
    return false;
}
</script>
</body>
</html>
