<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>접근 권한 없음 - 고향사랑e음 (admin service)</title>

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

     UserException("관리자 메뉴 접근 권한이 없습니다.") 재현. -->
<div class="wrap narrow" style="text-align:center;">
    <h1>접근 권한이 없습니다</h1>
    <p>이 메뉴에 대한 권한이 없습니다. 시스템관리자에게 문의해 주세요.</p>
    <p style="margin-top:20px;"><a class="btn" th:href="@{${homeUrl}}">돌아가기</a></p>
</div>
</body>
</html>
