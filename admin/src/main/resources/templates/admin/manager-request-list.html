<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자권한요청 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/manager-request/list.jsp 재현 (승인/거절, AS-IS CONFM_STTUS_CODE
     100/300 그대로). 승인하면 OP_MANAGER 행이 새로 만들어지고 임시 비밀번호가 발급되는데,
     이 프로젝트의 이메일 모크 정책과 동일하게 실제 메일 대신 이 화면에 1회 노출한다. -->
<div class="wrap">
    <h1>관리자 권한 요청</h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p th:if="${tempPassword}" class="dev-code" style="background:#eef4ff;color:#1a73e8;padding:10px;border-radius:4px;">
        <strong th:text="${approvedLoginId}"></strong> 계정이 승인되었습니다. 임시 비밀번호:
        <strong th:text="${tempPassword}"></strong> (신청자에게 별도로 전달해 주세요 - 다시 확인할 수 없습니다)
    </p>

    <table>
        <thead>
        <tr>
            <th>아이디</th>
            <th>소속구분</th>
            <th>부서/직위/직급</th>
            <th>연락처</th>
            <th>신청일</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${pending}">
            <td th:text="${r.loginId}"></td>
            <td th:text="${reqstSeCodeLabels.get(r.reqstSeCode)} ?: ${r.reqstSeCode}"></td>
            <td th:text="${r.psitnDeptNm} + ' / ' + ${r.psitnNm} + ' / ' + ${r.ofcpsNm}"></td>
            <td th:text="${r.cttpc}"></td>
            <td th:text="${#strings.substring(r.frstRegistPnttm, 0, 8)}"></td>
            <td>
                <form th:action="@{'/admin/manager-requests/' + ${r.userId} + '/' + ${r.reqstSn} + '/approve'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn">승인</button>
                </form>
                <form th:action="@{'/admin/manager-requests/' + ${r.userId} + '/' + ${r.reqstSn} + '/reject'}" method="post" class="inline-form"
                      onsubmit="return fillRejectReason(this)">
                    <input type="hidden" name="reason">
                    <button type="submit" class="small-btn ghost">거절</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(pending)}">대기 중인 요청이 없습니다.</p>
</div>

<script th:inline="none">
function fillRejectReason(form) {
    var reason = prompt('거절 사유를 입력해 주세요.');
    if (!reason) { return false; }
    form.reason.value = reason;
    return true;
}
</script>
</body>
</html>
