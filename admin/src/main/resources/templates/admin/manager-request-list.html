<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>관리자 권한 승인관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/manager-request/list.jsp 이식. 검색구분(아이디/이름/이메일) +
     등록일 범위(날짜버튼 5종) + 상태(전체/대기/승인/거절) + 화면출력 + 페이징.
     보는 사람 권한에 따라 컬럼이 달라진다: 'ALL'(시스템/행안부)만 "구분"을 보고,
     ROLE_ADMIN_6(지자체)은 "소속"을 보지 않는다. 상태는 상세 팝업, 이력은 신청이력 팝업. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_1406')}">관리자 권한 승인관리</span></h3>

<div class="board_guide" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<div class="board_guide" th:if="${approvedLoginId}">
    <p class="tip"><span th:text="${approvedLoginId}"></span> 계정이 승인되었습니다. 임시 비밀번호: <strong th:text="${tempPassword}"></strong></p>
</div>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/manager-requests}">
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
				<col>
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08">
							<select id="srchKey" name="srchKey" title="구분" class="wd-150">
								<option value="LOGIN_ID" th:selected="${searchParam.srchKey == 'LOGIN_ID'}">아이디</option>
								<option value="USER_NAME" th:selected="${searchParam.srchKey == 'USER_NAME'}">이름</option>
								<option value="EMAIL" th:selected="${searchParam.srchKey == 'EMAIL'}">이메일</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분" class="input_txt required _filter half" th:value="${searchParam.srchValue}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">등록일</td>
					<td>
						<div class="search-date">
							<span class="datepicker"><input type="text" id="srchStartCreated" name="srchStartCreated" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartCreated}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndCreated" name="srchEndCreated" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndCreated}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
							</span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">상태</td>
					<td>
						<div class="flex_box gap-08">
							<div class="input-form">
								<input type="radio" id="st0" name="srchConfmSttusCode" value="" th:checked="${#strings.isEmpty(searchParam.srchConfmSttusCode)}" /><label for="st0">전체</label>
							</div>
							<div class="input-form">
								<input type="radio" id="st200" name="srchConfmSttusCode" value="200" th:checked="${searchParam.srchConfmSttusCode == '200'}" /><label for="st200">대기</label>
							</div>
							<div class="input-form">
								<input type="radio" id="st100" name="srchConfmSttusCode" value="100" th:checked="${searchParam.srchConfmSttusCode == '100'}" /><label for="st100">승인</label>
							</div>
							<div class="input-form">
								<input type="radio" id="st300" name="srchConfmSttusCode" value="300" th:checked="${searchParam.srchConfmSttusCode == '300'}" /><label for="st300">거절</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/manager-requests';">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<table class="board_list_table" summary="관리자 권한 승인관리">
		<caption>관리자 권한 승인관리</caption>
			<colgroup>
				<col style="width:5%;">
			</colgroup>
			<thead>
				<tr>
					<th scope="col">No.</th>
					<th scope="col" th:if="${loginUserAuth == 'ALL'}">구분</th>
					<th scope="col" th:unless="${loginUserAuth == 'ROLE_ADMIN_6'}">소속</th>
					<th scope="col">부서</th>
					<th scope="col">아이디</th>
					<th scope="col">이름</th>
					<th scope="col">이메일</th>
					<th scope="col">직위</th>
					<th scope="col">상태</th>
					<th scope="col">요청일</th>
					<th scope="col">이력</th>
				</tr>
			</thead>
			<tbody>
				<th:block th:if="${not #lists.isEmpty(list)}">
					<tr th:each="item, i : ${list}" style="background:#fff;">
						<td th:text="${pagination.itemNumber - i.count}">0</td>
						<!-- 시스템/행안부일 경우만 '구분'필드 노출 -->
						<td th:if="${loginUserAuth == 'ALL'}"
						    th:text="${reqstSeCodeLabels.containsKey(item.reqstSeCode)} ? ${reqstSeCodeLabels.get(item.reqstSeCode)} : ${item.reqstSeCode}"></td>
						<th:block th:unless="${loginUserAuth == 'ROLE_ADMIN_6'}">
							<!-- 구분값이 '지자체'(ROLE_ADMIN_6/10)면 선택된 지자체, '오프라인'(ROLE_ADMIN_8)이면
							     은행 정보, 시스템/행안부면 공백 - AS-IS와 동일 -->
							<td th:if="${item.reqstSeCode == 'ROLE_ADMIN_6' or item.reqstSeCode == 'ROLE_ADMIN_10'}"
							    th:text="${locgovNames.containsKey(item.locgovCode)} ? ${locgovNames.get(item.locgovCode)} : ${item.locgovCode}"></td>
							<td th:if="${item.reqstSeCode == 'ROLE_ADMIN_8'}" th:text="${item.psitnNm}"></td>
							<td th:unless="${item.reqstSeCode == 'ROLE_ADMIN_6' or item.reqstSeCode == 'ROLE_ADMIN_10' or item.reqstSeCode == 'ROLE_ADMIN_8'}"></td>
						</th:block>
						<td th:text="${item.psitnDeptNm}"></td>
						<td th:text="${item.loginId}"></td>
						<td th:text="${memberByUserId.get(item.userId) != null} ? ${memberByUserId.get(item.userId).userName} : ''"></td>
						<td th:text="${memberByUserId.get(item.userId) != null} ? ${memberByUserId.get(item.userId).email} : ''"></td>
						<td th:text="${item.ofcpsNm}"></td>
						<td>
							<a th:href="|javascript:detailsPopup('${item.userId}', '${item.reqstSn}')|"
							   th:text="${confmSttusLabels.containsKey(item.confmSttusCode)} ? ${confmSttusLabels.get(item.confmSttusCode)} : ${item.confmSttusCode}"></a>
						</td>
						<td th:text="${item.frstRegistPnttm}"></td>
						<td><a th:href="|javascript:histroyPopup('${item.userId}')|">보기</a></td>
					</tr>
				</th:block>
				<tr th:if="${#lists.isEmpty(list)}">
					<td colspan="10">관리자 권한 승인 신청한 정보가 없습니다.</td>
				</tr>
			</tbody>
	</table>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript">
	$(function() {

		// 한 페이지 출력 갯수 변경 이벤트
		displayChange();

		// 선택된 페이지 출력 갯수 셋팅
		displaySelected();

		// 날짜 변경 이벤트
		datepickerChange();

		// 검색 enter key
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartCreated"]' , 'input[name="srchEndCreated"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	/**
	 *	함 수 명 : detailsPopup
	 *	기	능  : 관리자 권한 승인관리 상세 조회
	 *	파라미터  : userId - 사용자ID , reqstSn - 신청 일련번호
	 */
	function detailsPopup(userId, reqstSn) {
		var url = '/admin/manager-requests/popup/details/'+userId+'/'+reqstSn;
		var popupName = 'managerRequestDetails';

		// 상세 팝업 활성화
		Common.popup(url, popupName, 600, 650 ,1, 0, 0);
	}

	/**
	 *	함 수 명 : histroyPopup
	 *	기	능  : 신청 이력 팝업
	 */
	function histroyPopup(userId) {
		Common.popup('/admin/manager-requests/popup/history/'+userId, 'managerRequestHistory', 700, 500, 1);
	}

	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	function search() {
		var strStartDate = $("#srchStartCreated").val();
		var strEndDate = $("#srchEndCreated").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndCreated").val();
				$("#srchEndCreated").val("");
				$("#srchEndCreated").focus();
				$("#srchEndCreated").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	function searchEnterKey() {
		$("#srchValue, #srchStartCreated, #srchEndCreated").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
