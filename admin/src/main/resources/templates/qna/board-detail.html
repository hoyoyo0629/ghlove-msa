<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객센터 &gt; Q&amp;A - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/data_v.css}">
    <link rel="stylesheet" th:href="@{/css/ct_nov.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS qna/qna-detail.html 재현. 비밀글이고 작성자 본인이 아니면(detail.locked)
     서버가 아예 질문/답변 내용을 내려주지 않는다(QnaService.publicBoardDetail) - 클라이언트에
     숨기는 방식이 아니라 데이터 자체를 안 준다. -->
<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            고객센터
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/qna/board}">Q&amp;A</a>
        </span>
        <h2 class="page-title-txt">Q&amp;A</h2>
    </div>
</section>

<div th:replace="~{fragments/customer-lnb :: customer-lnb('qna')}"></div>

<div class="contents-wrap" id="contents">
    <div class="center">
        <div class="s-contents list-wrapper qna">

            <div th:if="${detail.locked}" class="list-none">
                <img th:src="@{/images/icon/non-list.png}" alt="비밀글">
                비밀글입니다. 작성자 본인만 열람할 수 있습니다.
            </div>

            <div th:unless="${detail.locked}" class="list-search-body inquiry faq">
                <ul class="list-search-group">
                    <li class="list-items dropdown show">
                        <div class="notice-header inquiry dropdown-toggle">
                            <div class="notice-header-txt">
                                <img class="faq-icon" th:src="@{/images/icon/cli-icon_faq-q.png}" alt="">
                                <div class="notice-txt">
                                    <span class="subject" th:text="${detail.qna.subject}"></span>
                                    <div class="q_contents" th:text="${detail.qna.question}" style="white-space:pre-wrap"></div>
                                    <div class="q-add_file" th:if="${!#lists.isEmpty(detail.files)}">
                                        <button class="moreView" type="button" th:each="f : ${detail.files}" th:text="${f.orgFileName}"></button>
                                    </div>
                                </div>
                            </div>
                            <div class="notice-header-status">
                                <div class="date-col" th:text="${detail.qna.userName}"></div>
                                <div class="date-col" th:text="${#strings.substring(detail.qna.createdDate, 0, 8)}"></div>
                                <div class="date-col" th:text="'조회 ' + (${detail.qna.hits} ?: 0)"></div>
                            </div>
                        </div>
                        <div class="notice-body dropdown-menu show" th:if="${detail.answer != null}">
                            <div class="notice-wrap">
                                <img class="faq-icon" th:src="@{/images/icon/cli-icon_faq-a.png}" alt="">
                                <div class="notice-txt">
                                    <span class="subject" th:text="${detail.answer.title}"></span>
                                    <div class="q_contents" th:text="${detail.answer.answer}" style="white-space:pre-wrap"></div>
                                </div>
                            </div>
                        </div>
                        <div class="notice-body dropdown-menu show" th:if="${detail.answer == null}">
                            <div class="notice-wrap">
                                <div class="notice-txt">
                                    <span class="q_contents">아직 답변이 등록되지 않았습니다.</span>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="btn-box">
                <button type="button" class="formBtn" onclick="location.href='/qna/board'">목록으로</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
