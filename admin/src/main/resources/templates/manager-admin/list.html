<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 계정관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D2 매니저(admin 로그인계정) CRUD (AS-IS opmanager/user/manager - UserManagerController).
     ManagerRequestController(관리자권한요청 승인 큐)와 별개로, 이미 발급된 OP_MANAGER 행을
     사후 검색/수정/삭제하고 임시비밀번호를 재발급하는 화면이다. -->
<div class="contents contents_inner">
    <h3>관리자 계정관리</h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>
    <p th:if="${tempPassword}" class="dev-code" style="background:#eef4ff;color:#1a73e8;padding:10px;border-radius:4px;">
        <strong th:text="${createdLoginId}"></strong> 계정의 (임시)비밀번호:
        <strong th:text="${tempPassword}"></strong> (담당자에게 별도로 전달해 주세요 - 다시 확인할 수 없습니다)
    </p>

    <form th:action="@{/admin/managers}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="관리자 계정 검색조건">
                <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">권한</td>
                    <td>
                        <select name="authority">
                            <option value="">전체</option>
                            <option th:each="role : ${roles}" th:value="${role.authority}" th:text="${role.roleName}"
                                    th:selected="${role.authority == authority}"></option>
                        </select>
                    </td>
                    <td class="label">아이디/이름</td>
                    <td><input type="text" name="keyword" th:value="${keyword}" placeholder="아이디 또는 이름"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <a class="btn btn-dark-gray btn-small" th:href="@{/admin/managers/new}">+ 계정 등록</a>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="관리자계정목록">
        <caption>관리자계정목록</caption>
        <thead>
        <tr>
            <th scope="col">아이디</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">권한</th>
            <th scope="col">소속지자체</th>
            <th scope="col">상태</th>
            <th scope="col">최종로그인</th>
            <th scope="col">처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${list}">
            <td><a th:href="@{'/admin/managers/' + ${m.userId} + '/edit'}" th:text="${m.loginId}"></a></td>
            <td th:text="${m.userName}"></td>
            <td th:text="${m.email}"></td>
            <td th:text="${m.authority}"></td>
            <td th:text="${m.locgovCode} ?: '-'"></td>
            <td th:text="${m.statusCode == 'ACTIVE' ? '정상' : (m.statusCode == 'LOCKED' ? '잠금' : m.statusCode)}"></td>
            <td th:text="${m.loginDate != null and #strings.length(m.loginDate) >= 14}
                          ? ${#strings.substring(m.loginDate,0,4) + '-' + #strings.substring(m.loginDate,4,6) + '-' + #strings.substring(m.loginDate,6,8)}
                          : '-'"></td>
            <td>
                <form th:action="@{'/admin/managers/' + ${m.userId} + '/reset-password'}" method="post" style="display:inline;"
                      onsubmit="return confirm('임시비밀번호를 재발급하시겠습니까?');">
                    <button type="submit" class="small-btn">비밀번호 재발급</button>
                </form>
                <form th:action="@{'/admin/managers/' + ${m.userId} + '/delete'}" method="post" style="display:inline;"
                      onsubmit="return confirm('이 계정을 삭제하시겠습니까?');">
                    <button type="submit" class="small-btn ghost">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">등록된 관리자 계정이 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/admin/managers(authority=${authority},keyword=${keyword},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/admin/managers(authority=${authority},keyword=${keyword},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/admin/managers(authority=${authority},keyword=${keyword},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
