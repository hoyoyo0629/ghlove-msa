<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모바일 카테고리 편집 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <style>
        .search-form { background:#f7f7f7; border:1px solid #ddd; border-radius:4px; padding:10px 12px; margin-bottom:12px; }
        .error-box { color:#c00; background:#fdecec; border:1px solid #f5b5b5; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
        .edit-thumb { width:60px; height:40px; object-fit:cover; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>모바일 카테고리 편집</h3>
    <p style="color:#666; margin-bottom:12px;">모바일 메인/카테고리 화면의 위치별 HTML블록·배너를 편집합니다(AS-IS opmanager/mobile-category-edit).</p>
    <div class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="search-form" method="get" th:action="@{/admin/mobile-category-edit}">
        <input type="text" name="code" th:value="${code}" placeholder="화면 코드(예: main)">
        <button type="submit" class="small-btn">검색</button>
        <a class="btn" style="float:right;" th:href="@{/admin/mobile-category-edit/new(code=${code})}">+ 편집 항목 등록</a>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>ID</th><th>화면코드</th><th>종류</th><th>위치</th><th>미리보기</th><th>URL</th><th>수정일</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.categoryEditId}"></td>
            <td th:text="${r.code}"></td>
            <td th:text="${r.editKind == '1' ? 'HTML블록' : '배너이미지'}"></td>
            <td><a th:href="@{/admin/mobile-category-edit/{id}/edit(id=${r.categoryEditId})}" th:text="${r.editPosition}"></a></td>
            <td>
                <img th:if="${r.editImage != null}" class="edit-thumb" th:src="${giftBaseUrl + '/uploads/' + r.editImage}" alt="">
                <span th:if="${r.editKind == '1'}" th:text="${#strings.abbreviate(r.editContent ?: '', 30)}"></span>
            </td>
            <td th:text="${r.editUrl}"></td>
            <td th:text="${r.updatedDate}"></td>
            <td>
                <a class="small-btn" th:href="@{/admin/mobile-category-edit/{id}/edit(id=${r.categoryEditId})}">수정</a>
                <form style="display:inline;" th:action="@{/admin/mobile-category-edit/{id}/delete(id=${r.categoryEditId})}" method="post"
                      onsubmit="return confirm('이 편집 항목을 삭제하시겠습니까?')">
                    <input type="hidden" name="code" th:value="${code}">
                    <button type="submit" class="small-btn">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">등록된 편집 항목이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
