<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원탈퇴관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/secede-user/list.jsp 이식(메뉴 4105).
     검색구분(아이디/탈퇴사유) + 탈퇴일 범위(기본 오늘) + 탈퇴구분(전체/회원탈퇴/관리자탈퇴) +
     화면출력(10/20/50/100) + 6컬럼 + 탈퇴사유 팝업(600x350).

     ★ AS-IS는 진입(GET) 시 목록을 조회하지 않는다 - 컨트롤러가 빈 목록/0건을 내려주고
     검색을 눌러야(POST) 조회된다. 화면 왼쪽 아래 안내문구가 그 설명이다. 그대로 재현했다.

     AS-IS verbatim:
     - h3는 메뉴명(탈퇴회원리스트)이 아니라 MENU_4105 문구값 "회원탈퇴관리"다.
     - 4번째 컬럼 헤더가 **"탙퇴사유"** 오타다(탈→탙). 그대로 둔다.
     - 날짜 버튼에 "전체"(all-1)가 하나 더 있다(다른 화면에는 없다).
     - colgroup에 col이 1개뿐인데 컬럼은 6개다.
     - 빈 목록도 표 안의 한 행("회원탈퇴관리 정보가 존재하지 않습니다.")으로 보여준다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_4105')}">회원탈퇴관리</span></h3>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/secede-users}">
	<input type="hidden" id="sort" name="sort" th:value="${searchParam.sort}"/>
	<input type="hidden" id="orderBy" name="orderBy" th:value="${searchParam.orderBy}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08">
							<select id="srchKey" name="srchKey" title="전체" class="wd-150">
								<option value="LOGIN_ID" th:selected="${searchParam.srchKey == 'LOGIN_ID'}">아이디</option>
								<option value="LEAVE_REASON" th:selected="${searchParam.srchKey == 'LEAVE_REASON'}">탈퇴사유</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분"
							       class="input_txt required _filter half" th:value="${searchParam.srchValue}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">탈퇴일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="srchStartLeaveDate" name="srchStartLeaveDate" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartLeaveDate}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndLeaveDate" name="srchEndLeaveDate" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndLeaveDate}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
								<a href="javascript:void(0);" class="btn_date all-1" th:text="${msg.get('M00039')}">전체</a>
							</span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">탈퇴구분</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input type="radio" id="srchLeaveType1" name="srchLeaveType" value="" th:checked="${#strings.isEmpty(searchParam.srchLeaveType)}"/>
								<label for="srchLeaveType1">전체</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchLeaveType2" name="srchLeaveType" value="U" th:checked="${searchParam.srchLeaveType == 'U'}"/>
								<label for="srchLeaveType2">회원탈퇴</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchLeaveType3" name="srchLeaveType" value="M" th:checked="${searchParam.srchLeaveType == 'M'}"/>
								<label for="srchLeaveType3">관리자탈퇴</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/secede-users'">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<table class="board_list_table" summary="회원탈퇴관리">
		<caption>회원탈퇴관리</caption>
		<colgroup>
			<col style="width:5%;">
		</colgroup>
		<thead>
			<tr>
				<th scope="col">No.</th>
				<th scope="col">탈퇴일</th>
				<th scope="col">아이디</th>
				<!-- AS-IS 오타 그대로("탙퇴사유") -->
				<th scope="col">탙퇴사유</th>
				<th scope="col">탈퇴구분</th>
				<th scope="col">담당자</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item, i : ${list}" style="background:#fff;">
				<td th:text="${pagination.itemNumber - i.count}">0</td>
				<td th:text="${item.leaveDate}"></td>
				<td th:text="${item.loginId}"></td>
				<td>
					<a th:href="|javascript:reasonDetailsPopup('${item.userId}')|"
					   th:text="${#strings.length(item.leaveReasonText) > 50}
					            ? ${#strings.substring(item.leaveReasonText,0,50)} + '...'
					            : ${item.leaveReasonText}"></a>
				</td>
				<td th:text="${item.leaveType == 'M'} ? '관리자탈퇴' : '회원탈퇴'"></td>
				<td>
					<th:block th:if="${item.leaveType == 'M'}">
						<span th:text="${item.roleName}"></span>
						<th:block th:if="${not #strings.isEmpty(item.leaveUserName)}">
							<br/><span th:text="'(' + ${item.leaveUserName} + ')'"></span>
						</th:block>
					</th:block>
					<th:block th:unless="${item.leaveType == 'M'}">-</th:block>
				</td>
			</tr>
			<tr th:if="${#lists.isEmpty(list)}" style="background:#fff;">
				<td colspan="6">회원탈퇴관리 정보가 존재하지 않습니다.</td>
			</tr>
		</tbody>
	</table>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
<!--/ List -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript">
	$(function(){
		displayChange();
		displaySelected();
		datepickerChange();
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartLeaveDate"]' , 'input[name="srchEndLeaveDate"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	/**
	 *	함 수 명 : displayChange
	 *	기	능  : 한 페이지 출력 갯수 변경 이벤트
	 */
	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	/**
	 *	함 수 명 : displaySelected
	 *	기	능  : 선택된 페이지 출력 갯수 셋팅
	 */
	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	/**
	 *	함 수 명 : reasonDetailsPopup
	 *	기	능  : 탈퇴사유 상세 팝업
	 */
	function reasonDetailsPopup(userId) {
		var url = "/admin/secede-users/popup/reason-details/"+userId;
		var popupName = "/admin/secede-users/popup/reason-details";
		Common.popup(url, popupName, 600, 350, 1, 0, 0);
	}

	/**
	 *	함 수 명 : datepickerChange
	 *	기	능  : 날짜 변경 이벤트
	 */
	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	/**
	 *	함 수 명 : search
	 *	기	능  : 검색
	 */
	function search() {
		var strStartDate = $("#srchStartLeaveDate").val();
		var strEndDate = $("#srchEndLeaveDate").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndLeaveDate").val();
				$("#srchEndLeaveDate").val("");
				$("#srchEndLeaveDate").focus();
				$("#srchEndLeaveDate").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	/**
	 *	함 수 명 : searchEnterKey
	 *	기	능  : 검색 엔터키 이벤트
	 */
	function searchEnterKey() {
		$("#srchValue, #srchStartLeaveDate, #srchEndLeaveDate").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
</body>
</html>
