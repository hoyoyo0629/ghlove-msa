<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>설문 결과 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/qustnr/result.jsp 이식. 설문 참여 인원(중복 제거) + 문항별 선택지와
     응답수. 응답수는 G_QUSTNR_RSPNS_RESULT를 선택지 단위로 센 값이다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span>설문 결과</span></h3>

<div class="btn_all btn_right mb15">
	<div class="flex_box gap-08">
		<button type="button" class="btn btn-dark-default btn-mini" onclick="location.href='/admin/surveys'">목록</button>
	</div>
</div>

<div class="board_write">
	<table class="board_write_table" summary="기부모금액">
		<colgroup>
			<col style="width:220px;">
			<col>
		</colgroup>
		<tbody>
			<tr>
				<td class="label">설문 참여</td>
				<td>
					<div>총 <span th:text="${#numbers.formatInteger(total, 0, 'COMMA')}">0</span>건</div>
				</td>
			</tr>
		</tbody>
	</table>
</div>

<div class="board_write mt-40 question_board">
	<table id="qusten" class="board_write_table" summary="질문 테이블">
		<colgroup>
			<col style="width:220px;">
			<col>
		</colgroup>
		<tbody>
			<th:block th:each="item, state : ${qesitmList}">
				<tr>
					<td class="label">질문</td>
					<td>
						<div class="flex_box gap-08">
							<span th:text="${item.qestnCn}"></span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">답변</td>
					<td class="answer">
						<div class="flex_box gap-08 answer-box" th:each="answer : ${item.qustnrIem}">
							<span th:text="${answer.iemCn} + ' (' + ${#numbers.formatInteger(answer.userCnt, 0, 'COMMA')} + ')'"></span>
						</div>
					</td>
				 </tr>
				 <tr style="height : 20px" th:unless="${state.last}"></tr>
			</th:block>
		</tbody>
	</table>
</div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript">
$(function() {
	$(".contents_inner").find("div.location a").removeClass("on");
	$(".contents_inner").find("div.location").append('> <a href="javascript:;" class="on">결과</a>');
	$(".contents_inner").find('h3:first > span').html("설문 결과");

});


</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
