<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>설문조사 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>설문조사 관리</h3>
    <p><a class="btn" th:href="@{/admin/surveys/new}">+ 설문 등록</a></p>

    <table class="board_list_table">
        <thead>
        <tr><th>제목</th><th>기간</th><th>노출여부</th><th>등록일</th><th>결과</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${surveys}">
            <td><a th:href="@{'/admin/surveys/' + ${s.qustnrSn} + '/edit'}" th:text="${s.qustnrSj}"></a></td>
            <td th:text="${s.qustnrBgnDe} + ' ~ ' + ${s.qustnrEndDe}"></td>
            <td th:text="${s.isShow == 'Y' ? '노출' : '비노출'}"></td>
            <td th:text="${s.frstCrtDt != null ? #temporals.format(s.frstCrtDt, 'yyyy-MM-dd HH:mm') : ''}"></td>
            <td><a th:href="@{'/admin/surveys/' + ${s.qustnrSn} + '/result'}">결과보기</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(surveys)}">등록된 설문이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
