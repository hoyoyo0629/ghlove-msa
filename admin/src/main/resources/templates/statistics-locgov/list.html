<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>관심 지자체 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/statistics/locgov/list.jsp 이식.

     ★ 이전 구현은 AS-IS와 구조가 전혀 달랐다(텍스트검색·"전체 연도"·막대그래프 div 등
     전부 발명). 지자체 2단 select(WDR→LOCGOV_CODE, 최고관리자만) · 초기화/검색 버튼 ·
     count_title + itemsPerPage select(10/20/50/100) · No./지자체/등록수 3칸 표 ·
     정렬은 등록수 내림차순(서버가 이미 그렇게 정렬해 보낸다) · 좌측 엑셀 버튼(개인정보
     사유 모달 경유) · 표준 페이지네이션 조각 - AS-IS 그대로 다시 만들었다.

     ★ 지자체담당자(ROLE_ADMIN_5/6 등 scoped)는 컨트롤러가 이 화면에 들어오지 못하게
     막는다 - AS-IS GET/POST like 모두 scoped 면 바로 자기 지자체 상세로 리다이렉트한다
     (목록 화면 자체를 볼 수 없다). 그래서 이 템플릿엔 scoped 분기가 없다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span>관심 지자체</span></h3>
<div class="item_list">
<form id="searchParam" method="post" th:action="@{/statistics/interest-locgov}">
    <input type="hidden" id="page" name="page" th:value="${pagination.currentPage}">
    <div class="board_write">
        <table class="board_write_table">
            <colgroup>
                <col style="width:220px;">
                <col>
            </colgroup>
            <tbody>
                <tr>
                    <td class="label">지자체</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select id="shWdr" name="shWdr" title="지자체" class="wd-150" onchange="wdrChange(this.value)">
                                <option value="">-시,도 선택-</option>
                                <option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"
                                        th:selected="${p.key == searchParam.shWdr}"></option>
                            </select>
                            <select id="shLocgovCode" name="shLocgovCode" title="지자체" class="wd-150">
                                <option value="">-시,군,구-</option>
                            </select>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="btn_all btn_left">
            <ul class="list-bullet point">
                <li>검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.</li>
            </ul>
        </div>
        <div class="btn_all btn_right">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-mini"
                        onclick="location.href='/statistics/interest-locgov';">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-mini">검색</button>
            </div>
        </div>
    </div>

    <div class="count_title mt-40 flex_box juc-sbt item-center">
        <h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
        <div class="flex_box gap-08">
            <span>
                <select id="itemsPerPage" name="itemsPerPage" title="화면출력" onchange="$('#page').val(1); $('#searchParam').submit();">
                    <option value="10" th:selected="${pagination.itemsPerPage == 10}">10개 출력</option>
                    <option value="20" th:selected="${pagination.itemsPerPage == 20}">20개 출력</option>
                    <option value="50" th:selected="${pagination.itemsPerPage == 50}">50개 출력</option>
                    <option value="100" th:selected="${pagination.itemsPerPage == 100}">100개 출력</option>
                </select>
            </span>
        </div>
    </div>
</form>
</div>

<div class="board_list">
    <table class="board_list_table">
        <caption></caption>
        <colgroup>
            <col style="width:50px;">
            <col style="width:300px;">
            <col style="width:200px;">
        </colgroup>
        <thead>
            <tr>
                <th scope="col" class="col-md-1">No.</th>
                <th scope="col" class="col-md-7">지자체</th>
                <th scope="col" class="col-md-4">등록수</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="3">조회 정보가 존재하지 않습니다.</td>
            </tr>
            <tr th:each="row, i : ${rows}" style="background:#fff;">
                <td><div th:text="${pagination.itemNumber - i.count}">0</div></td>
                <td>
                    <div>
                        <a href="javascript:;" th:attr="onclick=|location.href='/statistics/interest-locgov/${row.locgovCode}';|"
                           th:text="${(row.upperLocgovNm != null ? row.upperLocgovNm + ' ' : '') + row.locgovNm}"></a>
                    </div>
                </td>
                <td><div th:text="${#numbers.formatInteger(row.count, 0, 'COMMA')}">0</div></td>
            </tr>
        </tbody>
    </table>
    <div class="btn_all btn_left">
        <div class="flex_box gap-08">
            <button type="button" class="btn btn-dark-gray btn-mini" onclick="downloadExcel()">엑셀</button>
        </div>
    </div>
    <div class="pagination-wrap">
        <div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript">
/*<![CDATA[*/
    var ALL_LOCGOVS = /*[[${allLocgovs}]]*/ [];
    var SEL_LOCGOV  = /*[[${searchParam.shLocgovCode}]]*/ '';

    $(function(){ wdrChange($("#shWdr").val()); });

    function wdrChange(value) {
        $("#shLocgovCode option").remove();
        if (value && value != "") {
            $('#shLocgovCode').append('<option value="">-전체-</option>');
            for (var i = 0; i < ALL_LOCGOVS.length; i++) {
                if (ALL_LOCGOVS[i].upperLocgovCode == value) {
                    $('#shLocgovCode').append('<option value="' + ALL_LOCGOVS[i].locgovCode + '">' + ALL_LOCGOVS[i].locgovNm + '</option>');
                }
            }
            if (SEL_LOCGOV) { $("#shLocgovCode").val(SEL_LOCGOV); }
        } else {
            $('#shLocgovCode').append('<option value="">-시,군,구-</option>');
        }
    }

    /* AS-IS downloadExcel - Shop.downloadExcelOrder(url, 검색조건, true) = 개인정보 사유 모달 경유.
       엑셀은 페이징과 무관한 전체이므로 page/itemsPerPage 는 보내지 않는다. */
    function downloadExcel() {
        var qs = 'shWdr=' + encodeURIComponent($('#shWdr').val() || '')
               + '&shLocgovCode=' + encodeURIComponent($('#shLocgovCode').val() || '');
        openPrivacyModal('/statistics/interest-locgov/excel?' + qs);
    }
/*]]>*/
</script>

    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<!-- AS-IS Shop.downloadExcelOrder 가 띄우는 개인정보 다운로드 사유 모달 -->
<div th:replace="~{fragments/privacy-access :: modal}"></div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
