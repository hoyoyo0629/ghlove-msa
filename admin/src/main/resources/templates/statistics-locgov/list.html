<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관심 지자체 통계 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>관심 지자체 통계</h3>
    <p style="color:#666; margin-bottom:12px;">회원이 마이페이지에서 "관심지자체"로 등록한 건수를 연도별/지자체별로 집계합니다.</p>

    <form method="get" th:action="@{/statistics/interest-locgov}" class="field" style="display:flex; gap:8px; align-items:center;">
        <select name="year">
            <option value="">전체 연도</option>
            <option th:each="y : ${years}" th:value="${y}" th:text="${y} + '년'" th:selected="${y == year}"></option>
        </select>
        <input type="text" name="locgovNm" th:value="${locgovNm}" placeholder="지자체명 검색">
        <button type="submit" class="btn">조회</button>
    </form>

    <p>총 등록건수 <strong th:text="${result.total()} + '건'"></strong></p>

    <h4>월별 등록 추이</h4>
    <table class="board_list_table" style="margin-bottom:24px;">
        <thead>
        <tr><th>연월</th><th>등록건수</th><th>분포</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${result.monthly()}">
            <td th:text="${m.yearMonth()}"></td>
            <td th:text="${m.count()} + '건'"></td>
            <td>
                <div style="background:#eee; height:10px; width:200px;">
                    <div style="background:#3a7ad5; height:10px;"
                         th:style="${'width:' + (result.total() > 0 ? (m.count() * 200 / result.total()) : 0) + 'px;'}"></div>
                </div>
            </td>
        </tr>
        </tbody>
        <tr th:if="${#lists.isEmpty(result.monthly())}"><td colspan="3" class="empty">데이터가 없습니다.</td></tr>
    </table>

    <h4>지자체별 등록건수</h4>
    <table class="board_list_table">
        <thead>
        <tr><th>광역</th><th>지자체</th><th>등록건수</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${result.byLocgov()}">
            <td th:text="${row.upperLocgovNm()}"></td>
            <td th:text="${row.locgovNm()}"></td>
            <td th:text="${row.count()} + '건'"></td>
            <td><a class="small-btn" th:href="@{/statistics/interest-locgov/{locgovCode}(locgovCode=${row.locgovCode()}, year=${year})}">상세</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(result.byLocgov())}">해당 조건의 데이터가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
