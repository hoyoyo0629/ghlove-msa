<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>중분류 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/gift-categories}">답례품 카테고리 관리</a></div>
    <h3><span th:text="${subcategory.subcategoryId()} != null ? '중분류 수정' : '중분류 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="중분류 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>상위 대분류</td>
                <td>
                    <select name="categoryCode" form="subcategoryForm" required>
                        <option th:each="m : ${majors}" th:value="${m.id()}" th:text="${m.label()} + ' (' + ${m.id()} + ')'"
                                th:selected="${m.id()} == ${subcategory.categoryCode()}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>중분류명</td>
                <td><input type="text" name="name" th:value="${subcategory.name()}" required form="subcategoryForm"></td>
            </tr>
            <tr>
                <td class="label">SEO 메타 타이틀</td>
                <td><input type="text" name="metaTitle" th:value="${subcategory.metaTitle()}" style="width:400px;" form="subcategoryForm"></td>
            </tr>
            <tr>
                <td class="label">SEO 메타 키워드</td>
                <td><input type="text" name="metaKeywords" th:value="${subcategory.metaKeywords()}" style="width:400px;" placeholder="쉼표로 구분" form="subcategoryForm"></td>
            </tr>
            <tr>
                <td class="label">SEO 메타 설명</td>
                <td><textarea name="metaDescription" rows="3" style="width:400px;" th:text="${subcategory.metaDescription()}" form="subcategoryForm"></textarea></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="subcategoryForm"
          th:action="${subcategory.subcategoryId()} != null ? @{/admin/gift-categories/subcategories/{id}(id=${subcategory.subcategoryId()})} : @{/admin/gift-categories/subcategories}"
          method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="subcategoryForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
