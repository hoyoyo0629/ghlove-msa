<!-- AS-IS opmanager/i18n/order/list/all.jsp 이식 - 전체주문관리(메뉴 16401).
     ★ AS-IS 특징(그대로)
     - 처음 열면(GET) 조회하지 않고 검색 폼만 보인다(총 0건). [검색]을 눌러 POST할 때만 조회한다. 주문일 기본값은 오늘, 시간은 00시~23시.
     - 목록은 "주문 품목 한 줄" 단위다. 처리구분 체크박스를 하나도 안 켜고 검색하면 상태 조건 없이 전부 나온다.
       입금대기(0)는 체크박스가 없어서, 체크박스를 켠 채 검색하면 입금대기 주문은 빠진다.
     - 지자체 칸·시도/시군구 검색은 시스템/행안부(SYS)에게만. 소속 지자체가 있는 관리자는 롤과 상관없이 그 지자체 주문만 본다.
     - 이름·휴대폰·상세주소·생년월일은 지자체 담당자(ROLE_ADMIN_5/6)가 아니면 가려서 보인다(엑셀은 원문). "핸드폰번호"는 마스킹 때 수취인 휴대폰을 가린 값이다(AS-IS 오타 그대로).
     - 배송정보 칸: 송장번호가 없으면 택배사명이 있어도 "택배사 정보 없음"으로 나온다(AS-IS 표현식 결함 그대로).
     - 주문번호 링크는 주문 상세정보(order/detail-all.html, 읽기 화면)를 연다. 날짜 "전체" 버튼은 ROLE_ADMIN_CALL 전용이라 마크업만 둔다. -->

<script type="text/javascript" th:inline="none">

	var checkAllCnt;	// 일반주문 전체 체크 카운트
	var checkClaimCnt;	// 클레임주문 전체 체크 카운트

	$(function(){
		var redirectMessage = $("#redirectMessage").val();
		if (redirectMessage) {
			alert(redirectMessage);
		}

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="searchStartDate"]' , 'input[name="searchEndDate"]');
		EventHandler.calendarStartDateAndEndDateVaild();

		$('#op-order-default').on('click', function(){
			$('.op-order-default').prop('checked', $(this).prop('checked'));
		});

		$('.op-order-default').on('click', function(){

			checkAllCnt = 0;	// 초기화

            $.each($('.op-order-default:checked'), function(i){
            	checkAllCnt++;	// 일반주문 5단계 체크할떄마다 카운트 증가
            });

			if(checkAllCnt < 5) {	// 모두 체크하면 전체선택
				$('#op-order-default').prop('checked', false);
			} else {	// 한개라도 해제하면 전체해제
				$('#op-order-default').prop('checked', true);
			}
		});

		$('#op-order-claim').on('click', function(){
			$('.op-order-claim').prop('checked', $(this).prop('checked'));
		});

		$('.op-order-claim').on('click', function(){

			checkClaimCnt = 0;	// 초기화

            $.each($('.op-order-claim:checked'), function(i){
            	checkClaimCnt++;	// 클레임주문 7단계 체크할떄마다 카운트 증가
            });

			if(checkClaimCnt < 7) {	// 모두 체크하면 전체선택
				$('#op-order-claim').prop('checked', false);
			} else {	// 한개라도 해제하면 전체해제
				$('#op-order-claim').prop('checked', true);
			}
		});
	});

	$(function() {
	    wdrChange($("#shWdr").val());
	});

	var changeYn = "N";

	// 지차체 변경여부 체크
	$("select[name='shWdr']").on('focus', function () {

	}).change(function() {
		changeYn = "Y";
	});

	// 지자체 변경
	function wdrChange(value) {
		Common.loading.hide();
		$("#shLocgovCode option").remove();
		if ($("#shWdr").val() != "") {
			$.post(url("/give-state/options-by-locgovCode"), {'code' : value}, function(response) {

				for (var i = 0; i < response.length; i++) {
		            var options = '<option value="' + response[i].LOCGOV_CODE + '">' + response[i].LOCGOV_NM + '</option>';
		            $('#shLocgovCode').append(options);
		        }

				// 조회 된 값 유지
				if (ORDER_PAGE.shLocgovCode != "" && changeYn == 'N') {
				    $("#shLocgovCode").val(ORDER_PAGE.shLocgovCode).prop("selected", true);
				} else {
					// 지차체 변경후 시,군,구 index 제일 처음으로 설정
					$("#shLocgovCode option:eq(0)").attr("selected", "selected");
				}

		    });
		} else {
	        $('#shLocgovCode').append('<option value="">-시,군,구-</option>');
		}
	}

	function search_net() {
		if(Common.useNetfunnel()){
			NetFunnel_Action({ action_id: 'se_login' }, function (ev, ret) {
	        	search();
	        });
		}else{
			search();
		}
	}

	/**
	 *	함 수 명 : search
	 *	기	능  : 검색
	 */
	function search() {
		var strStartDate	= $("#searchStartDate").val();
		var strEndDate		= $("#searchEndDate").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate 	= Number(strStartDate);
			var endDate		= Number(strEndDate);

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				$("#searchEndDate").focus();
				return false;
			}
			var searchChk = Common.searchDateMonth(startDate, endDate);
			if(!searchChk) return false;
		}

		$("#orderParam").submit();
	}

	/** 엑셀 - 2000건을 넘으면 확인을 받고(AS-IS), 개인정보 사유 모달을 띄워 접근로그를 남긴 뒤 내려받는다. */
	function downloadOrderExcel(totalCount) {
		if (totalCount <= 2000) {
	        openPrivacyModal("/order/list/order-excel-download?" + $('#orderParam').serialize());
		} else if (confirm('주문 내역이 많아 서버에 무리가 갈 수 있습니다. 진행하시겠습니까?')) {
			openPrivacyModal("/order/list/order-excel-download?" + $('#orderParam').serialize());
		}
    }

</script>
    </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
