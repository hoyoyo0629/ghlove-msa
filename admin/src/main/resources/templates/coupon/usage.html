<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 사용내역 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <p><a th:href="@{/coupon}">&larr; 쿠폰관리</a></p>
    <h1 th:text="${coupon.couponName()} + ' - 사용내역'"></h1>
    <p style="color:#666; margin-bottom:16px;">
        총 다운로드 <strong th:text="${counts.downloadCount()} + '건'"></strong> /
        사용완료 <strong th:text="${counts.usedCount()} + '건'"></strong>
    </p>

    <table>
        <thead>
        <tr><th>발급ID</th><th>회원ID</th><th>상태</th><th>다운로드일</th><th>사용일</th><th>주문번호</th><th>할인금액</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usageList}">
            <td th:text="${u.couponUserId()}"></td>
            <td th:text="${u.userId()}"></td>
            <td th:text="${u.dataStatusCode() == '1' ? '사용완료' : '다운로드'}"></td>
            <td th:text="${u.downloadDate()}"></td>
            <td th:text="${u.usedDate() != null ? u.usedDate() : '-'}"></td>
            <td th:text="${u.orderCode() != null ? u.orderCode() : '-'}"></td>
            <td th:text="${u.discountAmount() != null ? (#numbers.formatInteger(u.discountAmount(), 0, 'COMMA') + 'P') : '-'}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(usageList)}">다운로드 내역이 없습니다.</p>
</div>
</body>
</html>
