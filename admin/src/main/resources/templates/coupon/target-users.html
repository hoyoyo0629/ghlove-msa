<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쿠폰 선택회원 지정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <p><a th:href="@{/coupon}">&larr; 쿠폰관리</a></p>
    <h1 th:text="${coupon.couponName()} + ' - 선택회원 지정'"></h1>

    <form th:action="@{'/coupon/' + ${coupon.couponId()} + '/target-users'}" method="post" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="number" name="userId" placeholder="회원ID" required>
        <button type="submit" class="btn">추가</button>
    </form>

    <table>
        <thead>
        <tr><th>회원ID</th><th>등록일</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${users}">
            <td th:text="${t.userId()}"></td>
            <td th:text="${t.createdDate()}"></td>
            <td>
                <form th:action="@{'/coupon/' + ${coupon.couponId()} + '/target-users/' + ${t.userId()} + '/delete'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn danger">제외</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(users)}">지정된 회원이 없습니다.</p>
</div>
</body>
</html>
