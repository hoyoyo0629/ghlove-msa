<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>지자체 공지사항 등록 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/locgov-notice/form.jsp 이식(등록 화면).
     AS-IS form.jsp는 notice.noticeId != 0일 때의 상단 버튼바 분기도 갖고 있지만 이 컨트롤러
     흐름에서는 절대 도달하지 않는 죽은 코드라 옮기지 않았다(신규 등록만 이 화면을 쓴다 -
     수정은 별도 화면 locgov-notice/edit.html). 판매자선택(seller) 관련 주석처리 블록도
     AS-IS가 켜지 않은 상태라 옮기지 않는다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span>지자체 공지사항</span></h3>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c00; margin-bottom:12px;"></p>

<form id="notice" method="post" th:action="@{/admin/locgov-notices/create}">
    <div class="board_write">
        <table class="board_write_table" summary="지자체 공지사항 등록">
            <colgroup>
                <col style="width:220px;">
            </colgroup>
            <tbody>
            <tr>
                <td class="label">상단공지</td>
                <td>
                    <div class="flex_box gap-08 item-center">
                        <div class="checkbox">
                            <input type="checkbox" id="noticeFlag" name="noticeFlag" value="Y"/>
                            <label for="noticeFlag" th:text="${msg.get('M00083')}">사용</label>
                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00275')}">제목</span></td>
                <td>
                    <div>
                        <input type="text" id="subject" name="subject" th:title="${msg.get('M00275')}"
                               class="input_txt required _filter half" maxlength="255"/>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00006')}">내용</span></td>
                <td>
                    <!-- smart_editor2 area -->
                    <div>
                        <textarea id="content" name="content" cols="30" rows="20" class="w90 editor-content"
                                  th:title="${msg.get('M00006')}"></textarea>
                    </div>
                    <!-- smart_editor2 area -->
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>게시여부</td>
                <td>
                    <!-- AS-IS locgov-notice/form.jsp는 라디오를 .input-form으로 감싸지 않는다
                         (5111 notice/form.jsp만 감싼다) - 감싸면 flex gap이 달라져 간격이 틀어진다 -->
                    <div class="flex_box gap-12">
                        <input type="radio" id="useYnY" name="useYn" value="Y" title="게시여부" class="required" checked="checked"/>
                        <label for="useYnY">게시</label>
                        <input type="radio" id="useYnN" name="useYn" value="N" title="게시여부" class="required"/>
                        <label for="useYnN">중지</label>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="btn_all btn_center">
            <div class="flex_box gap-08">
                <button type="submit" class="btn btn-dark-gray btn-small"><span th:text="${msg.get('M00088')}">등록</span></button>
                <button type="button" class="btn btn-defualt btn-small" onclick="location.href='/admin/locgov-notices'"
                        th:text="${msg.get('M00037')}">목록</button>
            </div>
        </div>
    </div>
</form>

    </div>
    </div>
</div>
</div>

<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('content')}"></div>

<script type="text/javascript">
$(function() {
    try {
        $('#notice').validator(function() {
            Common.getEditorContent("content");

            if ($('#content').val().toLowerCase() == '<p>&nbsp;</p>' || $('#content').val() == '') {
                alert($.validator.messages['text'].format($('#content').attr('title')));
                return false;
            }
        });
    } catch (e) {
        alert(e.message);
    }
});
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
