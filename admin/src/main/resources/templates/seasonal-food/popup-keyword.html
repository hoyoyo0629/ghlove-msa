<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>제철식품관 관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<!-- AS-IS opmanager/i18n/seasonal-food/popup-keyword.jsp 이식 - 제철식품관 관리의 [등록] 팝업(layout=base, 700x310).
     키워드와 시작월~종료월을 고르고 [추가]하면 부모 창에 postMessage로 맡긴다(부모가 월마다 기존 키워드와 합쳐 ajax 저장). 시작월이 종료월보다 크면 12월을 넘어 이어진다. -->
<body>
	<!-- 키워드 등록 popup -->
    <div class="popup_wrap">
        <div id="pop_header">
            <h1 class="popup_title" th:text="${msg.get('키워드 등록')}">키워드 등록</h1><!-- 키워드 등록 -->
			<a href="javascript:self.close();" class="btn_close"><img src="../../content/opmanager/images/btn/btn_close.png" th:alt="${msg.get('M00569')}" alt="닫기"></a><!-- 닫기 -->
		</div>

        <div class="popup_contents">
            <div class="board_write">
                <table class="board_write_table" summary="">
                    <colgroup>
                        <col style="width:150px;">
                        <col />
                    </colgroup>
                    <tbody>
                        <tr>
                            <td class="label"><span class="required_mark">*</span><th:block th:text="${msg.get('키워드')}">키워드</th:block></td><!-- 키워드 -->
                            <td>
                                <div class="flex_box gap-08">
                                    <input id="keyword" name="keyword" th:title="${msg.get('M00011')}" class="input_txt required _filter wd-200"
                                    	type="text" value="" oninput="javascript:inputCheck(this);"><!-- 검색구분 -->
                                </div>
                            </td>

                        </tr>
                        <tr>
                            <td class="label"><span class="required_mark">*</span><th:block th:text="${msg.get('M01347')}">기간</th:block></td><!-- 기간 -->
                            <td>
                                <div class="flex_box gap-04 item-center">
                                    <select id="startMonth" name="startMonth" th:title="${msg.get('M00431')}" class="wd-200"><!-- 선택 -->
                                        <option value="" th:text="${msg.get('M00431')}">선택</option><!-- 선택 -->
                                        <option th:each="no : ${#numbers.sequence(1, 12)}" th:value="${no}" th:text="${no}"></option>
                                    </select>
                                    <span class="wave" th:text="${msg.get('M01077')}">월</span><!-- 월 -->
                                    <span class="wave">~</span>
                                    <select id="endMonth" name="endMonth" th:title="${msg.get('M00431')}" class="wd-200"><!-- 선택 -->
                                        <option value="" th:text="${msg.get('M00431')}">선택</option><!-- 선택 -->
                                        <option th:each="no : ${#numbers.sequence(1, 12)}" th:value="${no}" th:text="${no}"></option>
                                    </select>
                                    <span class="wave" th:text="${msg.get('M01077')}">월</span><!-- 월 -->
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p class="popup_btns">
                    <button type="button" class="btn btn-active" onclick="javascript:save();" th:text="${msg.get('M00192')}">추가</button><!-- 추가 -->
                    <button type="button" class="btn btn-default" onclick="javascript:self.close();" th:text="${msg.get('M00569')}">닫기</button><!-- 닫기 -->
                </p>
            </div>
        </div>
    </div>
    <!-- // 키워드 등록 popup -->

    <form id="seasonalFoodKeywordData" >
	    <input type="hidden" id="month">
	    <input type="hidden" id="keyword">
    </form>

<!-- AS-IS EL(${op:message(..)})을 서버에서 풀어 JS 문자열로 넘긴다 -->
<script type="text/javascript" th:inline="javascript">
var MSG_NO_KEYWORD = /*[[${msg.get('키워드를 입력해주세요.')}]]*/ '키워드를 입력해주세요.';
var MSG_NO_PERIOD = /*[[${msg.get('기간을 선택해주세요.')}]]*/ '기간을 선택해주세요.';
var MSG_CONFIRM_SAVE = /*[[${msg.get('정보를 저장하시겠습니까?')}]]*/ '정보를 저장하시겠습니까?';
var MSG_NOT_IN_PARENT = /*[[${msg.get('제철식품관 관리 화면에서 진행해주세요.')}]]*/ '제철식품관 관리 화면에서 진행해주세요.';
</script>

<script type="text/javascript">

$(function() {

});

function save() {
	let startMonth = $("#startMonth").val();
	let endMonth = $("#endMonth").val();
	let keyword = $("#keyword").val();

	if (!keyword) {
		alert(MSG_NO_KEYWORD);	// 키워드를 입력해주세요.
		return;
	}
	if (!startMonth || !endMonth) {
		alert(MSG_NO_PERIOD);		//
		return;
	}

	try {
		if (confirm(MSG_CONFIRM_SAVE)) {
			// opener.regSeasonalFoodData(startMonth, endMonth, keyword);		// parent window 에서 개발자 도구 띄우지 않으면 호출 안됨....
			window.opener.postMessage({fnName: 'regSeasonalFoodData', startMonth: startMonth, endMonth: endMonth, keyword: keyword}, '*');
		}
	} catch (e) {
		$s.error(e);
		alert(MSG_NOT_IN_PARENT);		// 제철식품관 관리 화면에서 진행해주세요.
	}
}

// 부모화면에서 알림 호출
function openMsg(msg) {
	alert(msg);
	location.reload();
}

//입력 제한
function inputCheck(inputElement) {
	let beforePosition = inputElement.selectionStart - 1;		// 키 입력 후 위치 - 1 => 입력 전 위치
	let beforeLength = inputElement.value.length;			// 입력 후 길이
//	inputElement.value = inputElement.value.replace(/[^0-9.]/g, '');		// 숫자만
	inputElement.value = inputElement.value.replace(/[^a-zA-Z|ㄱ-ㅎ|ㅏ-ㅣ|가-힣|0-9|,|]/g, '');		// 알파벳,한글,숫자, ',' 만 입력 가능
	let afterLength = inputElement.value.length;			// 입력 전 길이
	if (beforeLength > afterLength) {		// 다르면 가능한 입력 값이 아님
		inputElement.setSelectionRange(beforePosition, beforePosition);		// 기존 위치로 커서 이동
	}
}

//부모화면에서 알림 호출
function confirmMsg(msg) {
	return confirm(msg);
}


</script>
</body>
</html>
