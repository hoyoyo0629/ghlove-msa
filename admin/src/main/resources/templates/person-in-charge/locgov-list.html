<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>지자체담당자관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/locgov-charger/list.jsp 이식(메뉴 4402 지자체담당자관리).
     검색구분(시스템권한은 지자체명 포함/아이디/이름/휴대폰) + 등록일 범위(기본 오늘, 전체 포함) +
     사용여부(전체/사용/중지) + 화면출력 + 컬럼(권한에 따라 9 또는 10).

     ★ 구조갭 정리의 나머지 절반 - 4501(운영관리자)과 함께 /admin/person-in-charge 한 화면에
     scope 탭으로 통합돼 있던 것을 AS-IS대로 분리했다.
     ★ AS-IS는 진입(GET) 시 조회하지 않는다 - 검색해야(POST) 조회된다.

     AS-IS 권한 분기(adminRoleType):
     - SYS(ROLE_ADMIN_1~4): 지자체명 검색옵션·컬럼이 있고 **지자체명이 링크**다(아이디·이름은 평문).
     - LOC(ROLE_ADMIN_5·6): 자기 지자체만 보이고 지자체명 컬럼이 없으며 아이디·이름이 링크다.

     AS-IS 비활성 상태 보존: 삭제 버튼은 권한 조건을 통과해도 style="display:none;"이라
     **화면에 보이지 않는다**. 숨긴 채로 그대로 옮겼다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_4402')}">지자체담당자관리</span></h3>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/person-in-charge/locgov}">
	<input type="hidden" id="sort" name="sort" th:value="${searchParam.sort}"/>
	<input type="hidden" id="orderBy" name="orderBy" th:value="${searchParam.orderBy}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08">
							<select id="srchKey" name="srchKey" title="지자체명" class="wd-150">
								<option th:if="${adminRoleType == 'SYS'}" value="LOCGOV_NM"
								        th:selected="${searchParam.srchKey == 'LOCGOV_NM'}">지자체명</option>
								<option value="LOGIN_ID" th:selected="${searchParam.srchKey == 'LOGIN_ID'}">아이디</option>
								<option value="USER_NAME" th:selected="${searchParam.srchKey == 'USER_NAME'}">이름</option>
								<option value="PHONE_NUMBER" th:selected="${searchParam.srchKey == 'PHONE_NUMBER'}">휴대폰</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분"
							       class="input_txt required _filter half" th:value="${searchParam.srchValue}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">등록일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="srchStartCreated" name="srchStartCreated" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartCreated}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndCreated" name="srchEndCreated" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndCreated}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
								<a href="javascript:void(0);" class="btn_date all-1" th:text="${msg.get('M00039')}">전체</a>
							</span>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">사용여부</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input type="radio" id="srchStatusCode0" name="srchStatusCode" value="" th:checked="${#strings.isEmpty(searchParam.srchStatusCode)}"/>
								<label for="srchStatusCode0">전체</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchStatusCode9" name="srchStatusCode" value="9" th:checked="${searchParam.srchStatusCode == '9'}"/>
								<label for="srchStatusCode9">사용</label>
							</div>
							<div class="input-form">
								<input type="radio" id="srchStatusCode2" name="srchStatusCode" value="2" th:checked="${searchParam.srchStatusCode == '2'}"/>
								<label for="srchStatusCode2">중지</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/person-in-charge/locgov'">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<table class="board_list_table" summary="담당자관리">
		<caption>담당자관리</caption>
		<colgroup>
			<col style="width:5%;">
		</colgroup>
		<thead>
			<tr>
				<th scope="col"><input type="checkbox" id="check_all"></th>
				<th scope="col">No.</th>
				<th th:if="${adminRoleType == 'SYS'}" scope="col">지자체명</th>
				<th scope="col">회원구분</th>
				<th scope="col">아이디</th>
				<th scope="col">이름</th>
				<th scope="col">휴대폰</th>
				<th scope="col">등록일</th>
				<th scope="col">사용여부</th>
				<th scope="col">중지일자</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item, i : ${list}" style="background:#fff;">
				<td><input type="checkbox" th:value="${item.userId}" th:id="'check_' + ${item.userId}"></td>
				<td th:text="${pagination.itemNumber - i.count}">0</td>
				<!-- SYS에서는 지자체명이 링크다 -->
				<td th:if="${adminRoleType == 'SYS'}">
					<a th:href="|javascript:chargerEdit('${item.userId}')|"
					   th:text="${locgovNames.containsKey(item.locgovCode)} ? ${locgovNames.get(item.locgovCode)} : ${item.locgovCode}"></a>
				</td>
				<td th:text="${item.authority == 'ROLE_ADMIN_5'} ? '주관리자' : '-'"></td>
				<!-- LOC에서는 아이디·이름이 링크다 -->
				<th:block th:if="${adminRoleType == 'LOC'}">
					<td><a th:href="|javascript:chargerEdit('${item.userId}')|" th:text="${item.loginId}"></a></td>
					<td><a th:href="|javascript:chargerEdit('${item.userId}')|" th:text="${item.userName}"></a></td>
				</th:block>
				<th:block th:unless="${adminRoleType == 'LOC'}">
					<td th:text="${item.loginId}"></td>
					<td th:text="${item.userName}"></td>
				</th:block>
				<td th:text="${item.phoneNumber}"></td>
				<td th:text="${@opDate.ymd(item.createdDate)}"></td>
				<td th:text="${item.asIsStatusCode == '2'} ? '중지' : '사용'"></td>
				<td th:text="${item.asIsStatusCode == '2'} ? ${item.denyDate} : ''"></td>
			</tr>
			<tr th:if="${#lists.isEmpty(list)}" style="background:#fff;">
				<td th:colspan="${adminRoleType == 'SYS'} ? 10 : 9">담당자 정보가 존재하지 않습니다.</td>
			</tr>
		</tbody>
	</table>
	<!-- AS-IS도 이 삭제 버튼은 style="display:none;"으로 숨겨져 있다(권한 조건은 통과해도) -->
	<div class="btn_all btn_right"
	     th:if="${adminRoleType == 'SYS' or (adminRoleType == 'LOC' and adminRoleGrade == 'M')}">
		<div class="flex_box gap-08">
			<button type="button" class="btn btn-defualt btn-mini" onclick="chargerDelete();" style="display:none;">삭제</button>
		</div>
	</div>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
<!--// List -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
<!-- AS-IS는 GET /op_security_logout으로 로그아웃하지만 TO-BE의 /admin/logout은 POST라서
     본인 계정 삭제 후 로그아웃은 이 폼을 submit한다. -->
<form id="logoutForm" method="post" th:action="@{/admin/logout}"></form>

<script type="text/javascript">
	$(function(){
		displayChange();
		displaySelected();
		checkedEventSet("check_", "check_all");
		datepickerChange();
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartCreated"]' , 'input[name="srchEndCreated"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	function checkedEventSet(groupId, groupHeaderId) {
		var childObjs = $("input[id^='"+groupId+"']").not("[id='"+groupHeaderId+"']");

		$("#"+groupHeaderId).click(function(){
			$(childObjs).prop("checked", $(this).is(":checked"));
		});

		$(childObjs).click(function() {
			if($(childObjs).length == $("input[id^='"+groupId+"']:checked").not("[id='"+groupHeaderId+"']").length) {
				$("#"+groupHeaderId).prop("checked", true);
			} else {
				$("#"+groupHeaderId).prop("checked", false);
			}
		});
	}

	/**
	 *	함 수 명 : chargerDelete
	 *	기	능  : 지자체 담당자 삭제 (AS-IS에서도 버튼이 숨겨져 호출되지 않는다)
	 */
	function chargerDelete() {
		var userIdList = new Array;

		$("input[id^='check_']:checked").not("[id='check_all']").map(function(index, item) {
			userIdList.push($(item).val());
		});

		if(userIdList.length == 0) {
			alert("처리할 항목을 선택해 주세요.");
			return false;
		}

		if(confirm("삭제하시겠습니까?")) {
			$.post('/admin/person-in-charge/locgov/delete', {"userIdList": userIdList}, function(response) {
				if(response.isSuccess && response.data) {
					if(response.data.code == "SUCC") {
						alert("삭제되었습니다.");
						if(response.data.isLogout == "Y") {
							$("#logoutForm").submit();
						} else {
							location.reload();
						}
					} else {
						alert("오류가 발생했습니다.");
					}
				}
			});
		}
	}

	/**
	 *	함 수 명 : chargerEdit
	 *	기	능  : 지자체 담당자 상세 조회
	 */
	function chargerEdit(userId) {
		location.href = "/admin/person-in-charge/locgov/edit/"+userId+location.search;
	}

	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	function search() {
		var strStartDate = $("#srchStartCreated").val();
		var strEndDate = $("#srchEndCreated").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndCreated").val();
				$("#srchEndCreated").val("");
				$("#srchEndCreated").focus();
				$("#srchEndCreated").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	function searchEnterKey() {
		$("#srchValue, #srchStartCreated, #srchEndCreated").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
</body>
</html>
