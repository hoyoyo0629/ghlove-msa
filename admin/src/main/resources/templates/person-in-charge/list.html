<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 사후관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D6/D9 관리자 사후관리 - AS-IS LocgovPersonInChargeManagerController(지자체담당자) +
     OperPersonInChargeManagerController(운영담당자) 통합. 신규 등록은 관리자권한요청
     승인큐(/admin/manager-requests) 또는 관리자 계정관리(/admin/managers)에서 하고,
     이 화면은 이미 발급된 계정의 업무규칙(주담당자 인원제한/중지시 자동강등/삭제권한)만
     다룬다. -->
<div class="contents contents_inner">
    <h3>관리자 사후관리</h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="btn_all" style="margin-bottom:16px;" th:unless="${locgovScoped}">
        <div class="flex_box gap-08">
            <a class="btn btn-small" th:classappend="${scope == 'locgov'} ? 'btn-dark-gray' : 'btn-line-gray'"
               th:href="@{/admin/person-in-charge(scope='locgov')}">지자체담당자</a>
            <a class="btn btn-small" th:classappend="${scope == 'operator'} ? 'btn-dark-gray' : 'btn-line-gray'"
               th:href="@{/admin/person-in-charge(scope='operator')}">운영담당자</a>
        </div>
    </div>
    <h4 th:if="${locgovScoped}">지자체담당자 (소속 지자체)</h4>

    <form th:action="@{/admin/person-in-charge}" method="get" id="searchForm">
        <input type="hidden" name="scope" th:value="${scope}">
        <div class="board_write">
            <table class="board_write_table" summary="사후관리 검색조건">
                <colgroup><col style="width:150px;"><col><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">등록일(시작)</td>
                    <td><input type="date" name="fromDate" th:value="${fromDate}"></td>
                    <td class="label">등록일(종료)</td>
                    <td><input type="date" name="toDate" th:value="${toDate}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <table class="board_list_table" summary="사후관리 목록">
        <caption>사후관리 목록</caption>
        <thead>
        <tr>
            <th scope="col">아이디</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">권한</th>
            <th scope="col">소속지자체</th>
            <th scope="col">상태</th>
            <th scope="col">등록일</th>
            <th scope="col">처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${list}">
            <td><a th:href="@{'/admin/person-in-charge/' + ${m.userId} + '/edit'(scope=${scope})}" th:text="${m.loginId}"></a></td>
            <td th:text="${m.userName}"></td>
            <td th:text="${m.email}"></td>
            <td th:text="${m.authority}"></td>
            <td th:text="${m.locgovCode} ?: '-'"></td>
            <td th:text="${m.statusCode == 'ACTIVE' ? '정상' : (m.statusCode == 'LOCKED' ? '중지' : m.statusCode)}"></td>
            <td th:text="${m.createdDate != null and #strings.length(m.createdDate) >= 8}
                          ? ${#strings.substring(m.createdDate,0,4) + '-' + #strings.substring(m.createdDate,4,6) + '-' + #strings.substring(m.createdDate,6,8)}
                          : '-'"></td>
            <td>
                <form th:action="@{'/admin/person-in-charge/' + ${m.userId} + '/delete'}" method="post" style="display:inline;"
                      onsubmit="return confirm('이 계정을 삭제하시겠습니까?');">
                    <input type="hidden" name="scope" th:value="${scope}">
                    <button type="submit" class="small-btn ghost">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(list)}">등록된 담당자가 없습니다.</p>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/admin/person-in-charge(scope=${scope},fromDate=${fromDate},toDate=${toDate},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/admin/person-in-charge(scope=${scope},fromDate=${fromDate},toDate=${toDate},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/admin/person-in-charge(scope=${scope},fromDate=${fromDate},toDate=${toDate},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
