<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 사후관리 수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/person-in-charge(scope=${scope})}">관리자 사후관리</a></div>
    <h3>담당자 정보 수정</h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="담당자 수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">아이디</td>
                <td><input type="text" th:value="${manager.loginId}" readonly></td>
            </tr>
            <tr>
                <td class="label">이름</td>
                <td><input type="text" name="userName" th:value="${manager.userName}" form="editForm"></td>
            </tr>
            <tr>
                <td class="label">이메일</td>
                <td><input type="email" name="email" th:value="${manager.email}" form="editForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>권한</td>
                <td>
                    <select name="authority" required form="editForm">
                        <option th:each="role : ${roles}" th:if="${scope == 'locgov'} ? (${role.authority == 'ROLE_ADMIN_5' or role.authority == 'ROLE_ADMIN_6'}) : (${role.authority == 'ROLE_ADMIN_1' or role.authority == 'ROLE_ADMIN_2' or role.authority == 'ROLE_ADMIN_3' or role.authority == 'ROLE_ADMIN_4'})"
                                th:value="${role.authority}" th:text="${role.roleName}"
                                th:selected="${role.authority == manager.authority}"></option>
                    </select>
                    <p class="hint" style="color:#888;margin-top:4px;" th:if="${scope == 'locgov'}">주담당자(ROLE_ADMIN_5)는 지자체당 최대 2명까지 지정할 수 있습니다. 주담당자가 중지상태가 되면 자동으로 부담당자로 강등됩니다.</p>
                    <p class="hint" style="color:#888;margin-top:4px;" th:unless="${scope == 'locgov'}">행안부 주담당자(ROLE_ADMIN_3)는 전체 최대 2명까지 지정할 수 있습니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label">소속지자체</td>
                <td><input type="text" th:value="${manager.locgovCode} ?: '-'" readonly></td>
            </tr>
            <tr>
                <td class="label">상태</td>
                <td>
                    <select name="statusCode" form="editForm">
                        <option value="ACTIVE" th:selected="${manager.statusCode == 'ACTIVE'}">정상</option>
                        <option value="LOCKED" th:selected="${manager.statusCode == 'LOCKED'}">중지</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="editForm" th:action="@{'/admin/person-in-charge/' + ${manager.userId}}" method="post">
        <input type="hidden" name="scope" th:value="${scope}">
    </form>
    <div class="btn_all btn_center">
        <button type="submit" form="editForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
