<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>배송업체 등록/수정 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/delivery-company/form.jsp 이식. 배송업체명·대표연락처·배송 조회 URL·
     사용유무 4항목이고, 전송방법(sendFlag 라디오)과 송장번호 파라미터는 AS-IS에서 주석처리돼
     노출되지 않는다(sendFlag는 hidden으로만 넘긴다) - 비활성 상태까지 그대로 맞췄다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

            <h3><span th:text="${msg.get('M00670')}">배송업체 등록/수정</span></h3> <!-- 배송업체 등록/수정 -->
            <form id="deliveryCompany" method="post" enctype="multipart/form-data"
                  th:action="${deliveryCompany != null}
                             ? @{'/admin/delivery-companies/edit/' + ${deliveryCompany.deliveryCompanyId}}
                             : @{/admin/delivery-companies/create}">
                <input type="hidden" id="kind" th:value="${kind}" />
                <input type="hidden" id="sendFlag" name="sendFlag" th:value="${deliveryCompany != null} ? ${deliveryCompany.sendFlag} : ''" />
                <input type="hidden" id="deliveryNumberParameter" name="deliveryNumberParameter" th:value="${deliveryCompany != null} ? ${deliveryCompany.deliveryNumberParameter} : ''" />
                <div class="board_write">
                    <table class="board_write_table">
                        <caption th:text="${msg.get('M00055')}"></caption> <!-- 전체주문 내역 -->
                        <colgroup>
                            <col style="width:150px;" />
                            <col style="width:auto;" />
                        </colgroup>
                        <tbody>
                             <tr>
                                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00665')}">배송업체명</span></td> <!-- 배송 업체명 -->
                                <td>
                                    <div class="flex_box gap-08">
                                        <input type="text" id="deliveryCompanyName" name="deliveryCompanyName" class="required full"
                                               th:value="${deliveryCompany != null} ? ${deliveryCompany.deliveryCompanyName} : ''" th:title="${msg.get('M00665')}" />
                                    </div>
                                </td>
                             </tr>
                             <tr>
                                <td class="label" th:text="${msg.get('M00666')}">대표연락처</td> <!-- 대표연락처 -->
                                <td>
                                    <div class="flex_box gap-08">
                                        <input type="text" id="telNumber" name="telNumber" class="full"
                                               th:value="${deliveryCompany != null} ? ${deliveryCompany.telNumber} : ''" th:title="${msg.get('M00666')}" />
                                    </div>
                                </td>
                             </tr>
                             <tr>
                                <td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00671')}">배송 조회 URL</span></td> <!-- 배송 조회 URL -->
                                <td>
                                    <div class="flex_box gap-08">
                                        <input type="text" id="deliveryCompanyUrl" name="deliveryCompanyUrl" class="required full"
                                               th:value="${deliveryCompany != null} ? ${deliveryCompany.deliveryCompanyUrl} : ''" th:title="${msg.get('M00671')}" />
                                    </div>
                                </td>
                             </tr>
                            <!-- AS-IS도 아래 두 행은 주석처리되어 있다(전송방법 M00672 / 송장번호 파라미터 M00673) -->
                             <tr>
                                <td class="label" th:text="${msg.get('M00669')}">사용유무</td> <!-- 사용유무 -->
                                <td>
                                    <div class="flex_box gap-12 item-center">
                                        <div class="input-form">
                                            <input type="radio" id="useFlagY" name="useFlag" value="Y"
                                                   th:checked="${deliveryCompany == null or deliveryCompany.useFlag == null or deliveryCompany.useFlag == 'Y'}" /><label for="useFlagY" th:text="${msg.get('M00083')}">사용</label> <!-- 사용 -->
                                        </div>
                                        <div class="input-form">
                                            <input type="radio" id="useFlagN" name="useFlag" value="N"
                                                   th:checked="${deliveryCompany != null and deliveryCompany.useFlag == 'N'}" /><label for="useFlagN" th:text="${msg.get('M00089')}">사용안함</label> <!-- 사용안함 -->
                                        </div>
                                    </div>
                                </td>
                             </tr>
                        </tbody>
                    </table>
                </div> <!-- // board_write -->

                <div class="btn_all btn_center">
                    <div class="flex_box gap-08">
                        <button type="submit" class="btn btn-active"><span th:text="${msg.get('M00101')}">저장</span></button> <!-- 저장 -->
                        <a th:href="@{/admin/delivery-companies}" class="btn btn-default"><span th:text="${msg.get('M00037')}">취소</span></a> <!-- 취소 -->
                    </div>
                </div>
            </form>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript">
$(function() {

	$('#deliveryCompany').validator(function() {
		if (confirm("배송업체 정보를 " + $('#kind').val() + "하시겠습니까?")) {

		} else {
			return false;
		}
	});

});

</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
