<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>답례품제공자 공지사항 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/sellerNotice/form.jsp 이식(메뉴 5114 등록·수정).
     ★ AS-IS는 등록과 수정이 같은 화면이고 noticeId 유무로 버튼만 갈린다:
     - noticeId != 0 → 상단 [수정][삭제][목록]
     - noticeId == 0 → 하단 [등록][취소]

     AS-IS verbatim:
     - 표는 상단공지 / 제목 / 내용 / 첨부파일 / 게시여부 다섯 줄이다.
     - 내용 textarea 클래스가 editor-content 하나다(자료실은 w90이 더 붙는다).
     - 게시여부는 .input-form으로 감싼 라디오이고 등록 시 '게시'가 기본 선택이다.
     - 첨부는 1건만 받는다(input에 multiple이 없고 JS가 중복 선택을 막는다).
     - 등록 confirm 문구가 "공지를 등록하시겠습니까?"다.
     - 취소 버튼 클래스의 btn-defualt 오타도 AS-IS 그대로다.

     AS-IS 잔재라 옮기지 않은 것: 정의가 없는 goToDetail() 호출(목록으로 보낸다),
     화면 아래 숨은 searchParam 폼(검색조건 유지용인데 이 화면에서 쓰이지 않는다). -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('M00269')}">공지사항</span></h3>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c00; margin-bottom:12px;"></p>

<form id="sysNoticeSellerDto" method="post" enctype="multipart/form-data"
      th:action="${sysNoticeSellerDto != null}
                 ? @{'/admin/seller-notices/edit/' + ${sysNoticeSellerDto.noticeId}}
                 : @{/admin/seller-notices/create}">

	<div class="btn_all btn_right mb15" th:if="${sysNoticeSellerDto != null}">
		<div class="flex_box gap-08">
			<button type="submit" class="btn btn-dark-gray btn-mini">수정</button>
			<!-- th:onclick은 Thymeleaf 3.1 제한에 걸려 빌드 가드가 막는다 - th:attr로 쓴다 -->
			<button type="button" class="btn btn-dark-gray btn-mini"
					th:attr="onclick=|deleteNotice(${sysNoticeSellerDto.noticeId});|">삭제</button>
			<button type="button" class="btn btn-dark-default btn-mini"
					onclick="location.href='/admin/seller-notices'">목록</button>
		</div>
	</div>

	<div class="board_write">
		<table class="board_write_table" th:attr="summary=${msg.get('M00269')}">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">상단공지</td>
					<td>
						<div class="flex_box gap-08 item-center">
							<div class="checkbox">
								<input type="checkbox" id="noticeFlag" name="noticeFlag" value="Y"
									   th:checked="${sysNoticeSellerDto != null and sysNoticeSellerDto.noticeFlag == 'Y'}"/>
								<label for="noticeFlag" th:text="${msg.get('M00083')}">사용</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00275')}">제목</span></td>
					<td>
						<div>
							<input type="text" id="subject" name="subject" th:title="${msg.get('M00275')}"
								   class="input_txt required _filter half" maxlength="255"
								   th:value="${sysNoticeSellerDto != null} ? ${sysNoticeSellerDto.subject} : ''"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span><span th:text="${msg.get('M00006')}">내용</span></td>
					<td>
						<!-- smart_editor2 area -->
						<div>
							<textarea id="content" name="content" cols="30" rows="20" class="editor-content"
									  th:title="${msg.get('M00006')}"
									  th:text="${sysNoticeSellerDto != null} ? ${sysNoticeSellerDto.content} : ''"></textarea>
						</div>
						<!-- smart_editor2 area -->
					</td>
				</tr>
				<tr>
					<td class="label" th:text="${msg.get('M01699')}">첨부파일</td>
					<td>
						<div class="flex_box item-center">
							<span class="input_file_txt">파일 등록 : </span>
							<input type="file" name="detailImageFiles" onchange="addFile(this);"/>
						</div>
						<div>
							<p style="color:red;">※ 첨부파일은 1개(50MB 이하) / jp(e)g, png, ppt(x), xlsx, hwp(x), doc(x), pdf,  bmp, gif, zip, 7z만 가능합니다.</p>
						</div>
						<div class="file-list-title">
							<div class="file_camera" th:each="file : ${files}" th:id="'fileId_' + ${file.fileId}">
								<a th:attr="onclick=|downloadItemImage(${file.fileId});|" href="javascript:;"
								   th:text="${file.orgnlAtchFileNm}"></a>
								<a th:attr="onclick=|deleteItemImage(${file.fileId});|" href="javascript:;">
									<img th:src="@{/content/images/btn/file_close.gif}" alt="close">
								</a>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>게시여부</td>
					<td>
						<div class="flex_box gap-12">
							<div class="input-form">
								<input type="radio" id="displayFlagY" name="displayFlag" value="Y" title="게시여부" class="required"
									   th:checked="${sysNoticeSellerDto == null or sysNoticeSellerDto.displayFlag == 'Y'}"/>
								<label for="displayFlagY">게시</label>
							</div>
							<div class="input-form">
								<input type="radio" id="displayFlagN" name="displayFlag" value="N" title="게시여부" class="required"
									   th:checked="${sysNoticeSellerDto != null and sysNoticeSellerDto.displayFlag == 'N'}"/>
								<label for="displayFlagN">중지</label>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="btn_all btn_center" th:if="${sysNoticeSellerDto == null}">
			<div class="flex_box gap-08">
				<button type="submit" class="btn btn-dark-gray btn-small"><span>등록</span></button>
				<button type="button" class="btn btn-defualt btn-small"
						onclick="location.href='/admin/seller-notices'" th:text="${msg.get('M00037')}">취소</button>
			</div>
		</div>
	</div>
</form>

    </div>
    </div>
</div>
</div>

<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('content')}"></div>

<script type="text/javascript" th:inline="javascript">
var redirectMessage = /*[[${redirectMessage}]]*/ null;
var isEdit = /*[[${sysNoticeSellerDto != null}]]*/ false;

$(function() {
	if (redirectMessage) {
		alert(redirectMessage);
	}

	try {
		$('#sysNoticeSellerDto').validator(function() {
			Common.getEditorContent("content");

			if ($('#content').val().toLowerCase() == '<p>&nbsp;</p>' || $('#content').val() == '') {
				alert($.validator.messages['text'].format($('#content').attr('title')));
				return false;
			}
		});
	} catch (e) {
		alert(e.message);
	}

	$("#sysNoticeSellerDto").on("submit", function(e) {
		if (!isEdit && !confirm("공지를 등록하시겠습니까?")) {
			e.preventDefault();
		}
	});
});

/*
 * 함 수 명 : addFile
 * 기 능 : 첨부파일 유효성 검사
 */
function addFile(obj) {
	let size = 50 * 1024 * 1024;
	let fileTypes = ['jpg', 'jpeg', 'gif', 'bmp', 'png', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'pdf', 'tif', 'tiff', 'hwp', 'hwpx', 'zip', '7z'];

	if ($('.file_camera').length > 0) {
		alert("이미 등록된 파일이이 있습니다.");
		$("input:file[name='detailImageFiles']").val('');
		return false;
	}

	for (const file of obj.files) {
		let type = file.name.split('.').pop().toLowerCase();

		if (file.size > size) {
			alert("첨부파일 용량은 최대 50MB 까지 가능합니다.");
			$("input:file[name='detailImageFiles']").val('');
			return false;
		} else if ($.inArray(type, fileTypes) == -1) {
			alert("등록할 수 없는 첨부파일 입니다.")
			$("input:file[name='detailImageFiles']").val('');
			return false;
		}
	}
}

function downloadItemImage(fileId) {
	location.href = '/admin/seller-notices/file-download/' + fileId;
}

function deleteItemImage(fileId) {
	var message = '파일이 실제로 삭제됩니다.\n삭제하시겠습니까?';
	if (!confirm(message)) {
		return;
	}

	var param = {'fileId': fileId};
	$.post('/admin/seller-notices/delete-item-image', param, function(response) {
		Common.responseHandler(response);
		$("#fileId_" + fileId).remove();
	});
}

function deleteNotice(noticeId) {
	Common.confirm(/*[[${msg.get('M00196')}]]*/ '삭제하시겠습니까?', function() {
		$.post(url("/admin/seller-notices/delete/" + noticeId), {}, function(response) {
			Common.responseHandler(response, function() {
				alert(/*[[${msg.get('M00205')}]]*/ '삭제 되었습니다.');
				location.href = "/admin/seller-notices";
			});
		});
	});
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
