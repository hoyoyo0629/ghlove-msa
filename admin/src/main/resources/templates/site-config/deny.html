<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>가입거부 블랙리스트 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3><span>가입거부 블랙리스트</span></h3>
    <div th:replace="~{fragments/site-config-nav :: tabs('deny')}"></div>
    <p class="success" th:if="${param.message}" th:text="${param.message}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="가입거부 블랙리스트">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label">거부 IP</td>
                <td>
                    <textarea id="deniedIp" name="deniedIp" rows="4" th:text="${config.deniedIp}" form="denyForm"></textarea>
                    <p style="font-size:12px;color:#666;">콤마(,)로 구분하여 입력. 해당 IP에서는 회원가입이 차단됩니다.</p>
                </td>
            </tr>
            <tr>
                <td class="label">거부 이메일 도메인</td>
                <td>
                    <textarea id="deniedEmailDomain" name="deniedEmailDomain" rows="4" th:text="${config.deniedEmailDomain}" form="denyForm"></textarea>
                    <p style="font-size:12px;color:#666;">콤마(,)로 구분하여 입력. 예: mailinator.com,test.com</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <form id="denyForm" th:action="@{/site-config/deny}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="denyForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
