<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>주문임시저장 설정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <h3><span>주문임시저장 설정</span></h3>
    <div th:replace="~{fragments/site-config-nav :: tabs('order-temp')}"></div>
    <p class="success" th:if="${redirectMessage}" th:text="${redirectMessage}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="주문임시저장 설정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr><td class="label">임시저장 데이터 보관일(일)</td><td><input type="number" id="retentionPeriod" name="retentionPeriod" th:value="${config.retentionPeriod}" form="orderTempForm"></td></tr>
            <tr><td class="label">구매확정 요청 기준(일)</td><td><input type="text" id="confirmPurchaseRequestDate" name="confirmPurchaseRequestDate" th:value="${config.confirmPurchaseRequestDate}" form="orderTempForm"></td></tr>
            <tr><td class="label">구매 자동확정 기준(일)</td><td><input type="text" id="confirmPurchaseDate" name="confirmPurchaseDate" th:value="${config.confirmPurchaseDate}" form="orderTempForm"></td></tr>
            <tr><td class="label">임시저장 처리방식 코드</td><td><input type="number" id="alternateSystem" name="alternateSystem" th:value="${config.alternateSystem}" form="orderTempForm"></td></tr>
            </tbody>
        </table>
    </div>

    <form id="orderTempForm" th:action="@{/site-config/order-temp}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="orderTempForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
