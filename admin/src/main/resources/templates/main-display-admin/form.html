<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인 진열상품 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>메인 진열상품 관리</h3>
    <p style="color:#666; margin-bottom:16px;">TEMPLATE_ID(뷰타입_카테고리팀코드 조합, 예: md_best) 단위로 메인화면에 노출할 답례품을 등록합니다. 저장하면 해당 TEMPLATE_ID의 기존 목록이 전량 교체됩니다.</p>

    <form th:action="@{/admin/main-display}" method="get" style="margin-bottom:16px;">
        <label>TEMPLATE_ID: <input type="text" name="templateId" th:value="${templateId}"></label>
        <button type="submit" class="small-btn">불러오기</button>
    </form>

    <table class="board_list_table" style="margin-bottom:16px;">
        <thead><tr><th>순서</th><th>답례품ID</th><th>답례품명</th></tr></thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${i.displayOrder}"></td>
            <td th:text="${i.itemId}"></td>
            <td th:text="${i.itemName}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(items)}">등록된 진열상품이 없습니다.</p>

    <form th:action="@{/admin/main-display}" method="post">
        <input type="hidden" name="templateId" th:value="${templateId}">
        <div class="board_write">
            <table class="board_write_table">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">답례품 ID 목록 (전체교체)</td>
                    <td>
                        <textarea name="itemIds" rows="4" placeholder="쉼표 또는 줄바꿈으로 구분: 1001, 1002, 1003"
                                  th:text="${itemIdsCsv}"></textarea>
                        <p class="s_txt">입력한 순서대로 노출순위가 매겨집니다. 여기 없는 기존 항목은 삭제됩니다.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_center">
            <button type="submit" class="btn btn-dark-gray btn-small">저장(전체교체)</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
