<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>브랜드 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <div class="location"><a th:href="@{/brand}">브랜드관리</a></div>
    <h3><span th:text="${brand.brandId()} != null ? '브랜드 수정' : '브랜드 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table" summary="브랜드 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>브랜드명</td>
                <td><input type="text" id="brandName" name="brandName" th:value="${brand.brandName()}" required form="brandForm"></td>
            </tr>
            <tr>
                <td class="label">지자체코드</td>
                <td><input type="text" id="locgovCode" name="locgovCode" th:value="${brand.locgovCode()}" placeholder="예: 11230" form="brandForm"></td>
            </tr>
            <tr>
                <td class="label">브랜드 소개</td>
                <td><textarea id="brandContent" name="brandContent" rows="6" th:text="${brand.brandContent()}" form="brandForm"></textarea></td>
            </tr>
            <tr>
                <td class="label">공개</td>
                <td><input type="checkbox" name="displayFlag" value="Y" th:checked="${brand.displayFlag() == 'Y'}" form="brandForm"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="brandForm" th:action="${brand.brandId()} != null ? @{'/brand/' + ${brand.brandId()}} : @{/brand}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="brandForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
