<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메뉴 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/menus}">메뉴관리</a></div>
    <h3><span th:text="${menu} != null ? '메뉴 수정' : '메뉴 등록'"></span></h3>
    <p th:if="${errorMessage}" style="color:#c00;" th:text="${errorMessage}"></p>

    <div class="board_write">
        <table class="board_write_table" summary="메뉴 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr th:if="${menu} == null">
                <td class="label">상위 그룹</td>
                <td>
                    <select id="parentId" name="parentId" form="menuForm">
                        <option value="" th:selected="${selectedParentId} == null">(없음 - 새 최상위 그룹으로 등록)</option>
                        <option th:each="t : ${topLevelMenus}" th:value="${t.menuId}" th:text="${t.menuName}"
                                th:selected="${selectedParentId} != null and ${selectedParentId} == ${t.menuId}"></option>
                    </select>
                </td>
            </tr>
            <tr th:if="${menu} != null">
                <td class="label">상위 그룹</td>
                <td th:text="${menu.menuParentId} != null ? ${menu.menuParentId} : '(최상위 그룹)'"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>메뉴명</td>
                <td><input type="text" id="menuName" name="menuName" th:value="${menu} != null ? ${menu.menuName} : ''" required form="menuForm"></td>
            </tr>
            <tr>
                <td class="label">URL(경로)</td>
                <td>
                    <input type="text" id="menuUrl" name="menuUrl" th:value="${menu} != null ? ${menu.menuUrl} : ''" placeholder="/admin/example" form="menuForm">
                    <p class="s_txt">최상위 그룹은 보통 URL 없이(빈칸) 등록합니다. 하위메뉴는 이 화면의 실제 컨트롤러 경로를 넣어야 접근권한이 매칭됩니다.</p>
                </td>
            </tr>
            <tr th:if="${menu} != null">
                <td class="label">노출순서</td>
                <td><input type="number" id="menuSeq" name="menuSeq" th:value="${menu.menuSeq}" form="menuForm"></td>
            </tr>
            <tr>
                <td class="label">지자체 담당자 접근허용</td>
                <td>
                    <label><input type="checkbox" name="grantLocgovMain" th:checked="${rights} != null and ${#lists.contains(rights, 'ROLE_ADMIN_5')}" form="menuForm"> 주담당자(ROLE_ADMIN_5)</label>
                    <label style="margin-left:12px;"><input type="checkbox" name="grantLocgovSub" th:checked="${rights} != null and ${#lists.contains(rights, 'ROLE_ADMIN_6')}" form="menuForm"> 부담당자(ROLE_ADMIN_6)</label>
                    <p class="s_txt">시스템/행안부 담당자(ROLE_ADMIN_1~4)는 별도 설정 없이 항상 모든 메뉴에 접근 가능합니다.</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="menuForm" th:action="${menu} != null ? @{'/admin/menus/' + ${menu.menuId}} : @{/admin/menus}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="menuForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
