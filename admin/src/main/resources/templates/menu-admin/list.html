<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>메뉴관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/menu/list.jsp 이식. 카테고리 전환(관리자 OP_MENU / 답례품관리자
     OP_MENU_SELLER) + 계층 전개 목록(메뉴타입에 따라 들여쓰기) + 등록/수정 팝업 + 삭제 ajax.
     하위메뉴·메뉴경로 컬럼은 AS-IS처럼 숨겨 두고 JS가 값만 읽어 쓴다.
     AS-IS처럼 페이저 없이 트리 전체를 보여준다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

    <!-- 상단타이틀 -------------------------------------------------------------------- -->
        <h3><span>메뉴관리</span></h3>
    <!-- 상단타이틀 -------------------------------------------------------------------- -->
<div>

      <!-- 코드 데이터  -->
    <!-- 조회 부 -------------------------------------------------------------------- -->
    <form id="menuParam" method="post" th:action="@{/admin/menus}" enctype="multipart/form-data">
        <table class="board_write_table"  summary="메뉴목록">
            <colgroup>
                <col style="width:220px;" />
                <col style="width:*;" />
            </colgroup>
            <tbody>
                 <tr>
                    <td class="label" th:text="${msg.get('M01223')}">검색구분</td> <!-- 검색구분 -->
                    <td>
                        <div>
                            <select id="where" name="where" th:title="${msg.get('M00054')}" onchange="fnMenuSearch()"> <!-- 화면 선택 -->
                                <option value="OPMANAGER" th:selected="${where == 'OPMANAGER'}">관리자</option> <!-- 관리자 -->
                                <option value="SELLER" th:selected="${where == 'SELLER'}">답례품관리자</option> <!-- 답례품관리자 -->
                            </select>
                            <!-- AS-IS도 검색어 입력은 주석처리되어 있다 -->
                        </div>
                    </td>
                 </tr>
            </tbody>
        </table>

        <!-- 버튼시작 -->
        <div class="btn_all">
            <div class="btn_right">
                <div class="flex_box gap-08">
                    <button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/menus';" th:text="${msg.get('M00047')}">초기화</button> <!-- 초기화 -->
                    <button type="submit" class="btn btn-dark-gray btn-mini" th:text="${msg.get('M00048')}">검색</button> <!-- 검색 -->
                </div>
            </div>
        </div>
        <!-- 버튼 끝-->

    </form>
    <!-- 조회 부 -------------------------------------------------------------------- -->

        <form id="listForm">
            <div class="board_write" th:style="${not #lists.isEmpty(menuList)} ? 'height:500px; margin:20px 0px; overflow:auto' : 'margin:20px 0px;'">
                        <!-- [AS-IS 결함 수정] AS-IS는 summary/caption에 ${op:message('MENU_1415')}
                             (=지방부과로그관리)를 써서 엉뚱한 문구가 들어간다. MENU_1409도 문구표에
                             "엑셀 다운로드 사유관리"로 잘못 등록돼 있어 코드로 못 쓴다 - h3와 같은
                             리터럴 "메뉴관리"로 맞췄다(약관관리 제목과 같은 판단). -->
                        <table class="board_list_table" summary="메뉴관리" style="margin:0px 0px;">
                            <caption>메뉴관리</caption>
                            <colgroup>
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                                <col style="" />
                            </colgroup>
                            <thead>
                                <tr>
                                    <th scope="col">메뉴ID</th>
                                    <th scope="col">메뉴명</th>
                                    <th scope="col">메뉴타입</th>
                                    <th scope="col">페이지 URL</th>
                                    <th scope="col">메뉴순서</th>
                                    <th scope="col">노출여부</th>
                                    <th scope="col">메뉴상태</th>
                                    <th scope="col" style="display:none;">하위메뉴</th>
                                    <th scope="col">변경</th>
                                    <th scope="col" style="display:none;">메뉴경로</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${menuList}">
                                    <td th:text="${item.row.menuId}"></td>
                                    <td style="text-align:left;"
                                        th:style="${item.row.menuType == 2} ? 'text-align:left; padding-left: 30px;'
                                                  : (${item.row.menuType == 3} ? 'text-align:left; padding-left: 60px;' : 'text-align:left;')"
                                        th:text="${item.row.menuName}"></td>
                                    <td th:text="${item.row.menuType}"></td>
                                    <td style="text-align:left;">
                                        <div th:text="${item.row.menuUrl}"></div>
                                    </td>
                                    <td th:text="${item.row.menuSeq}"></td>
                                    <td th:text="${item.row.displayFlag}"></td>
                                    <td th:text="${item.statusLabel}"></td>
                                    <td style="display:none;" th:text="${item.row.menuChild}"></td>
                                    <td>
                                        <div class="flex_box juc-center gap-08">
                                            <a th:href="|javascript:fnUpdateMenu('${item.row.menuId}','${item.row.menuPath}')|" class="btn btn-default btn-sm" th:text="${msg.get('M00087')}">수정</a> <!-- 수정 -->
                                            <a th:href="|javascript:fnDeleteMenu('${item.row.menuId}','${item.row.menuChild}')|" class="delete_item btn btn-default btn-sm" th:text="${msg.get('M00074')}">삭제</a> <!-- 삭제 -->
                                        </div>
                                    </td>
                                    <td style="display:none;" th:text="${item.row.menuPath}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

            <div class="no_content" th:if="${#lists.isEmpty(menuList)}" th:text="${msg.get('M00473')}">
                데이터가 없습니다.
            </div>

            <div class="btn_all btn_right">
                <div class="flex_box">
                    <a href="javascript:fnInsertMenu();" class="btn btn-default btn-mini" th:text="${msg.get('M01697')}">생성하기</a>
                </div>
            </div>

        </form>
</div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript">

    $(document).ready(function(){

    });

    // 메뉴 생성하기
    function fnInsertMenu(){
        if($('#where').val() == 'USER') { alert("사용자 메뉴는 시스템관리 > 공통코드관리(MENU_URL)에서 생성합니다."); return false; }
        Common.popup('/admin/menus/create?menuGubun=' + $("#where").val(), 'createMenu', 800, 600, 1);
    }

    // 메뉴 수정
    function fnUpdateMenu(menuId, menuPath) {
        Common.popup('/admin/menus/edit?menuGubun=' + $("#where").val() + "&menuId=" + encodeURIComponent(menuId) + "&menuPath=" + encodeURIComponent(menuPath), 'editMenu', 800, 600, 1);
    }

    // 메뉴리스트 조회
    function fnMenuSearch(){
        $('#menuParam').submit();
    }

    // 메뉴 삭제
    function fnDeleteMenu(menuId, menuChild) {
        if(menuChild > 0) {
            alert("하위메뉴가 존재하여 삭제할 수 없습니다.");
            return false;
        }

        Common.confirm(Message.get("M00196"), function() {
            $.post("/admin/menus/delete", {"menuGubun" : $('#where').val(), "menuId" : menuId}, function(response) {
                Common.responseHandler(response, function() {
                    alert(Message.get("M00633"));
                    fnMenuSearch();
                });
            });
        });
    }
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
