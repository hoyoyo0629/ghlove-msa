<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메뉴관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>메뉴관리</h3>
    <p th:if="${errorMessage}" style="color:#c00;" th:text="${errorMessage}"></p>
    <p><a class="btn" th:href="@{/admin/menus/new}">+ 최상위 그룹 등록</a></p>

    <div th:each="g : ${groups}" style="margin-bottom:24px;">
        <table class="board_list_table">
            <thead>
            <tr>
                <th colspan="5">
                    <span th:text="${g.parent.menuName}"></span>
                    (menu_id: <span th:text="${g.parent.menuId}"></span>)
                    <a class="small-btn" th:href="@{'/admin/menus/' + ${g.parent.menuId} + '/edit'}">그룹 수정</a>
                    <a class="small-btn" th:href="@{'/admin/menus/new'(parentId=${g.parent.menuId})}">+ 하위메뉴 등록</a>
                </th>
            </tr>
            <tr><th>메뉴명</th><th>URL</th><th>순서</th><th>menu_id</th><th>처리</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${g.children}">
                <td th:text="${c.menuName}"></td>
                <td th:text="${c.menuUrl}"></td>
                <td th:text="${c.menuSeq}"></td>
                <td th:text="${c.menuId}"></td>
                <td>
                    <a class="small-btn" th:href="@{'/admin/menus/' + ${c.menuId} + '/edit'}">수정</a>
                    <form th:action="@{'/admin/menus/' + ${c.menuId} + '/delete'}" method="post" class="inline-form"
                          onsubmit="return confirm('삭제하시겠습니까?')">
                        <button type="submit" class="small-btn danger">삭제</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(g.children)}"><td colspan="5" class="empty">하위메뉴 없음</td></tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
