<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UMS 템플릿 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/ums}">통합알림(UMS) 관리</a></div>
    <h3><span th:text="${template} != null ? 'UMS 템플릿 수정' : 'UMS 템플릿 등록'"></span></h3>

    <div class="board_write">
        <table class="board_write_table">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>템플릿코드</td>
                <td><input type="text" name="templateCode" th:value="${template} != null ? ${template.templateCode} : ''" required form="umsForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>템플릿명</td>
                <td><input type="text" name="templateName" th:value="${template} != null ? ${template.templateName} : ''" required form="umsForm"></td>
            </tr>
            <tr>
                <td class="label">야간(21~08시) 발송 허용</td>
                <td><input type="checkbox" name="nightSendFlag" th:checked="${template} != null and ${template.nightSendFlag} == 'Y'" form="umsForm"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h4 style="margin-top:24px;">채널별 설정</h4>
    <table class="board_write_table" th:each="c : ${channels}" style="margin-bottom:16px;">
        <colgroup><col style="width:220px;"><col></colgroup>
        <tbody>
        <tr>
            <td class="label" th:text="${c == 'MESSAGE'} ? 'SMS' : (${c == 'ALIM_TALK'} ? '카카오 알림톡' : 'PUSH')"></td>
            <td>
                <label><input type="checkbox" th:name="${c} + '_enabled'"
                              th:checked="${details.get(c)} != null and ${details.get(c).usedFlag} == 'Y'" form="umsForm"> 사용</label>
            </td>
        </tr>
        <tr>
            <td class="label">제목</td>
            <td><input type="text" th:name="${c} + '_title'" th:value="${details.get(c)} != null ? ${details.get(c).title} : ''" form="umsForm"></td>
        </tr>
        <tr>
            <td class="label">문구</td>
            <td><textarea th:name="${c} + '_message'" rows="3" th:text="${details.get(c)} != null ? ${details.get(c).message} : ''" form="umsForm"></textarea></td>
        </tr>
        </tbody>
    </table>

    <form id="umsForm" th:action="${template} != null ? @{'/admin/ums/' + ${template.id}} : @{/admin/ums}" method="post"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="umsForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
