<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>사용자 권한그룹 관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user-group/list.jsp 이식(1405 사용자 권한그룹 관리).
     5컬럼(그룹명/설명/인원/생성일자/관리기능) + 권한그룹 생성·수정 팝업 + 페이지네이션.
     AS-IS는 관리기능의 삭제 버튼을 JSP에서 주석처리해 두었으므로 여기서도 노출하지 않는다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

      <!-- 상단 타이틀 -->
        <h3><span th:text="${msg.get('MENU_1405')}">사용자 권한그룹 관리</span></h3> <!-- 사용자 권한그룹 관리 -->

        <div class="board_guide" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <!-- 버튼시작 -->
        <div class="btn_all btn_right mb10">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-mini" onclick="fnGrpCreate()" th:text="${msg.get('M01691')}">권한그룹 생성</button>
            </div>
        </div>
        <!-- 버튼 끝-->

      <!-- 조회 목록 -->
      <div class="board_list">
        <table class="board_list_table" summary="사용자 권한 그룹관리">
          <caption th:text="${msg.get('MENU_1405')}">사용자 권한그룹 관리</caption>
          <colgroup>
            <col>
            <col>
            <col style="width:5%;">
            <col style="width:15%;">
            <col style="width:15%;">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" th:text="${msg.get('M00571')}">그룹명</th> <!-- 그룹명 -->
              <th scope="col" th:text="${msg.get('M00998')}">설명</th> <!-- 설명 -->
              <th scope="col" th:text="${msg.get('M01694')}">인원</th> <!-- 인원 -->
              <th scope="col" th:text="${msg.get('M01692')}">생성일자</th> <!-- 생성일 -->
              <th scope="col" th:text="${msg.get('M01693')}">관리기능</th> <!-- 관리기능 -->
            </tr>
          </thead>

          <tbody>
            <tr th:each="row : ${list}" style="background:#fff;">
              <td th:text="${row.role.roleName}"></td>
              <td th:text="${row.role.roleDesc}"></td>
              <td th:text="${row.userCount}">0</td>
              <!-- AS-IS ${op:date(role.createdDate)} = yyyy-MM-dd ([[admin-date-format-opdate-helper]]) -->
              <td th:text="${@opDate.ymd(row.role.createdDate)}"></td>

              <td>
                <div class="flex_box juc-center gap-08">
                  <button type="button" class="btn btn-default btn-sm" th:onclick="|fnGrpUpdate('${row.role.authority}')|" th:text="${msg.get('M00087')}">수정</button> <!-- 수정 -->
                  <!-- AS-IS도 삭제 버튼을 주석처리해 두었다:
                  <button type="button" class="btn btn-default btn-sm" onclick="fnGrpDelete(...)">삭제</button> -->
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="no_content" th:if="${#lists.isEmpty(list)}">
          <p th:text="${msg.get('M00170')}">등록된 내용이 없습니다.</p>
        </div>
      </div>


        <div class="pagination-wrap">
            <div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
                <div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
            </div>
        </div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript">

// 권한그룹 생성
function fnGrpCreate(){
    Common.popup('/admin/roles/create', 'createGroup', 800, 330, 1);
}

// 권한그룹 수정
function fnGrpUpdate(id) {
  Common.popup('/admin/roles/edit?authority=' + encodeURIComponent(id), 'editGroup', 800, 330, 1);
}

// 권한그룹 삭제 - AS-IS도 호출 버튼이 주석처리돼 있어 쓰이지 않는다(엔드포인트는 유지)
function fnGrpDelete(id) {
  Common.confirm(Message.get("M00196"), function() {
        $.post("/admin/roles/delete", {"authority" : id}, function(response) {
            Common.responseHandler(response, function() {
                alert(Message.get("M00205"));
                location.reload();
            });
        });
    });
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
