<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>사용자 권한 관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <style>
      #blog-landing {
      margin-top: 10px;
      position: relative;
      max-width: 100%;
      width: 100%;
      }
      #blog-landing > div {
        position: absolute;
      }
      .section {
        border: 1px solid #ccc;

      }
      .section li {
        padding-bottom: 15px;
      }
      .menu1 {
        font-weight: bold;
        font-size: 14px;
        padding: 10px;
        background: #f4f4f4;
        color: #000;
      }
      .menu2 {
        display: block;
        font-weight: bold;
        font-size: 13px;
        padding: 10px 10px 5px 10px;

        color: #000;
        border-top: 1px solid #eee;

      }
      .menu3 {
        display: block;
        font-size: 12px;
        padding: 2px 10px 2px 15px;
        color: #555;
      }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user-group/role/list.jsp 이식(1404 사용자 권한 관리).
     왼쪽: 권한그룹 목록(클릭 시 그 그룹으로 재조회, 선택행 하이라이트) / 오른쪽: 전체 메뉴트리를
     3단 체크박스로 보여주고 OP_MENU_RIGHT를 편집한다. 4열 masonry 배치는 AS-IS와 동일하게
     pinterest_grid.js가 처리한다. AS-IS는 '지정기부사업자' 그룹을 왼쪽 목록에서 제외한다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

      <!-- 상단 타이틀 -->
        <h3><span th:text="${msg.get('MENU_1404')}">사용자 권한 관리</span></h3> <!-- 사용자 권한 관리 -->

      <form id="userGroupParam" method="get" th:action="@{/admin/roles/matrix}" enctype="multipart/form-data">
      <input type="hidden" name="userAuthority" id="userAuthority" th:value="${authority}" />
      </form>
      <form id="role" method="post" th:action="@{/admin/roles/matrix}" enctype="multipart/form-data">
      <input type="hidden" name="authority" id="authority" th:value="${authority}" />
      <input type="hidden" name="roleName" id="roleName" th:value="${roleName}" />
      <input type="hidden" name="roleDesc" id="roleDesc" th:value="${roleDesc}" />
      <div class="flex_box gap-20">
        <div class="board_list">
          <table class="board_list_table" summary="사용자 권한관리">
            <caption th:text="${msg.get('MENU_1404')}">사용자 권한 관리</caption>
            <colgroup>
              <col style="width:50px;">
              <col style="width:300px;">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">No</th>
                <th scope="col" th:text="${msg.get('M00586')}">그룹</th>
              </tr>
            </thead>
            <tbody id="targetTb">

                <!-- AS-IS도 '지정기부사업자'는 이 목록에서 제외한다. 다만 AS-IS는 그 걸러내기를
                     JSP에서 하고 번호는 그려진 행만 세는 별도 변수(rowNum)로 찍는데, Thymeleaf의
                     th:each + th:if는 건너뛴 행도 i.count에 포함해 첫 행이 2번부터 시작한다.
                     그래서 걸러낸 목록을 서버에서 받는다(RoleAdminService.matrixRoleRows). -->
              <tr class="dyTr" onclick="fnGroupSearch($(this))"
                  th:each="row, i : ${list}">
                    <input type="hidden" th:value="${row.role.authority}" />
                        <td th:text="${i.count}">1</td>
                        <td th:text="${row.role.roleName}"></td>
              </tr>

            </tbody>
          </table>
          <div class="btn_all btn_center">
            <div class="flex_box gap-08 juc-center">
              <button type="submit" class="btn btn-dark-gray btn-mini" th:text="${msg.get('M00101')}">저장</button> <!-- 저장 -->
            </div>
          </div>
        </div>


        <div class="board_write half mt10">
          <table class="board_write_table" summary="">
            <colgroup>
              <col style="width:150px;">
              <col style="">
            </colgroup>
            <tbody>
              <tr>
                <td class="label" valign="top" style="padding-top: 15px; font-size: 13px">메뉴권한</td>
                <td>
                  <div style="padding: 15px 10 15px 15px">
                    <p><label><input type="checkbox" class="check-all" /> 전체선택</label></p>

                    <div id="blog-landing" class="input_wrap col-w-7" style="height: 100vh;">

                      <!-- 트리는 AS-IS getAllMenuList가 내려준 그대로 3단으로 중첩돼 온다
                           (미사용 메뉴·빈 묶음은 쿼리 단계에서 이미 빠져 있다 - 화면에서 걸러내지 않는다). -->
                      <div class="section" th:each="menu1 : ${matrix != null} ? ${matrix.topMenus} : ${#lists.toList({})}">
                        <div  class="menu1">
                          <label><input type="checkbox" class="check-all" /> <span th:text="${menu1.menuName}"></span></label>
                        </div>
                        <ul>
                          <li th:each="menu2 : ${menu1.children}">
                            <span class="menu2">
                              <label><input type="checkbox" class="check-all" /> <span th:text="${menu2.menuName}"></span></label>
                            </span>

                            <span class="menu3" th:each="menu3 : ${menu2.children}">
                              <label><input type="checkbox" name="menuIds" th:value="${menu3.menuId}"
                                            th:checked="${matrix.checkedMenuIds.contains(menu3.menuId)}" /> <span th:text="${menu3.menuName}"></span></label>
                            </span>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      </form>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<script type="text/javascript" th:src="@{/content/modules/pinterest_grid.js}"></script>
<script type="text/javascript">

$(function(){
  $('#blog-landing').pinterest_grid({
      no_columns: 4,
      padding_x: 10,
      padding_y: 10,
      margin_bottom: 50,
      single_column_breakpoint: 700
  });

  $('.check-all').on('click', function(e) {
        var isChecked = $(this).prop('checked');
        var $target = $(this).parent().parent().parent().find('input[type=checkbox]');
        $target.prop('checked', isChecked);
    });

  // init 조회 - AS-IS는 선택된 권한이 없으면 목록 첫 행으로 재조회한다.
  // TO-BE는 서버(RoleAdminController.matrix)가 같은 선택을 해서 내려주므로 재조회가 필요 없다.

  // init 하이라이트
  fnLineColor();

});

// 사용자 권한 선택시 조회
function fnGroupSearch(target){
  if(target == null){
    var tr = $("#targetTb tr:first");
    $('#authority').val(tr.children('input').val());
    $('#userAuthority').val(tr.children('input').val());
  }else{
    $('#authority').val(target.children('input').val());
    $('#userAuthority').val(target.children('input').val());
  }

  $('#userGroupParam').submit();
}

// 사용자 권한 테이블 하이라이트
function fnLineColor(){
  $("#targetTb tr").css({"background-color":"#ffffff","color":"#000000"});
  var target = $('#userAuthority').val();
  $("#targetTb tr").each(function(){
    if($(this).find('input').val() == target){
      $(this).css({"background-color":"#E4F7BA","color":"#000000"});
    }
  });
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
