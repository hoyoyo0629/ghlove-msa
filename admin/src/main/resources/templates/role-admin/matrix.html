<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메뉴권한 편집 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D10 역할별 메뉴트리×권한 체크박스 매트릭스. 시스템/행안부(ROLE_ADMIN_1~4)는
     MenuService.UNRESTRICTED_ROLES라 이 매트릭스와 무관하게 항상 전체접근이지만(체크
     여부와 상관없이 실제로는 항상 통과), 그 외 역할(지자체5/6, 오프라인7/8, 신규 역할)은
     여기서 체크한 메뉴만 접근할 수 있다. -->
<div class="contents contents_inner">
    <div class="location"><a th:href="@{/admin/roles}">역할·메뉴권한 관리</a></div>
    <h3>메뉴권한 편집 - <span th:text="${role.roleName}"></span> (<span th:text="${role.authority}"></span>)</h3>

    <p class="hint" style="color:#888;margin-bottom:12px;" th:if="${role.authority == 'ROLE_ADMIN_1' or role.authority == 'ROLE_ADMIN_2' or role.authority == 'ROLE_ADMIN_3' or role.authority == 'ROLE_ADMIN_4'}">
        이 역할은 시스템/행안부 담당자로 항상 전체 메뉴에 접근할 수 있습니다(메뉴권한 체크와 무관).
    </p>

    <form th:action="@{'/admin/roles/' + ${role.authority} + '/matrix'}" method="post">
        <table class="board_list_table" summary="메뉴권한 매트릭스">
            <caption>메뉴권한 매트릭스</caption>
            <thead>
            <tr>
                <th scope="col">상위메뉴</th>
                <th scope="col">하위메뉴(체크된 메뉴만 접근가능)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="top : ${matrix.topMenus()}">
                <td th:text="${top.menuName}"></td>
                <td>
                    <label th:each="child : ${matrix.childrenByParent().get(top.menuId)}" style="display:inline-block;margin:2px 12px 2px 0;">
                        <input type="checkbox" name="menuIds" th:value="${child.menuId}"
                               th:checked="${matrix.checkedMenuIds().contains(child.menuId)}">
                        <span th:text="${child.menuName}"></span>
                    </label>
                    <span th:if="${#lists.isEmpty(matrix.childrenByParent().get(top.menuId))}" style="color:#aaa;">-</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="btn_all btn_center" style="margin-top:16px;">
            <button type="submit" class="btn btn-dark-gray btn-small">저장</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
