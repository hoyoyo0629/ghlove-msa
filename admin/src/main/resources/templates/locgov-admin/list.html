<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>지자체관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/locgov/list.jsp 이식(메뉴 4401 지자체관리).
     검색구분(지자체명/담당자명/연락처) + 등록일 범위 + 화면출력 + 8컬럼 + 등록.

     ★ AS-IS는 진입(GET) 시 조회하지 않는다 - 검색해야(POST) 조회된다.
     ★ 이 목록은 SYS(ROLE_ADMIN_1~4)만 본다. 지자체 담당자(5·6)는 목록 없이 자기 지자체의
        수정화면(등록돼 있으면) 또는 등록화면으로 바로 간다(컨트롤러에서 처리).

     AS-IS verbatim:
     - 등록일 범위에 **기본값이 없고**, 날짜버튼에 '전체'가 없다(오늘/1주일/한달/3개월/1년).
     - colgroup col 1개(컬럼 8개)인데 빈 목록 행의 colspan은 9다(AS-IS 불일치 - 그대로 둔다).
     - 지자체 칸만 상세 링크다(담당자명·연락처는 평문).
     - 포인트 지급률 칸을 누르면 변경이력 팝업(600x675)이 열린다. 포맷은 #.##다.
     - 예산·인구는 #,###.## 포맷이고 값이 없으면 빈칸.
     - **삭제 버튼은 2022.11.18부터 주석처리**되어 있다 - 주석 상태 그대로 옮겼다.
     - 체크박스 컬럼이 없는데도 checkedEventSet()이 남아 있다(삭제 버튼과 함께 죽은 코드).

     정렬은 g_locgov.ordering이다(donation 검색 API가 그 순서로 내려준다). -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_4401')}">지자체관리</span></h3>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/locgovs}">
	<input type="hidden" id="sort" name="sort" th:value="${searchParam.sort}"/>
	<input type="hidden" id="orderBy" name="orderBy" th:value="${searchParam.orderBy}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08">
							<select id="srchKey" name="srchKey" title="구분" class="wd-150">
								<option value="LOCGOV_NM" th:selected="${searchParam.srchKey == 'LOCGOV_NM'}">지자체명</option>
								<option value="CHARGER_NM" th:selected="${searchParam.srchKey == 'CHARGER_NM'}">담당자명</option>
								<option value="CHARGER_CTTPC" th:selected="${searchParam.srchKey == 'CHARGER_CTTPC'}">연락처</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분"
							       class="input_txt required _filter half" th:value="${searchParam.srchValue}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">등록일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="srchStartCreated" name="srchStartCreated" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartCreated}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndCreated" name="srchEndCreated" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndCreated}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
							</span>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/locgovs';">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<table class="board_list_table" summary="지자체관리">
		<caption>지자체관리</caption>
		<colgroup>
			<col style="width:5%;">
		</colgroup>
		<thead>
			<tr>
				<th scope="col">No.</th>
				<th scope="col">지자체</th>
				<th scope="col">예산(백만원)</th>
				<th scope="col">인구(명)</th>
				<th scope="col">담당자명</th>
				<th scope="col">연락처</th>
				<th scope="col">포인트 지급률</th>
				<th scope="col">등록일</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item, i : ${list}" style="background:#fff;">
				<td th:text="${pagination.itemNumber - i.count}">0</td>
				<td><a th:href="|javascript:locgovEdit('${item.locgovCode}');|" th:text="${item.locgovText}"></a></td>
				<td th:text="${item.locgovBudgetAmtText}"></td>
				<td th:text="${item.locgovPopltnCoText}"></td>
				<td th:text="${item.chargerNm}"></td>
				<td th:text="${item.chargerCttpc}"></td>
				<td>
					<a th:href="|javascript:pointListPopup('${item.locgovCode}');|"
					   th:text="${item.pointRateText}"></a>
				</td>
				<td th:text="${@opDate.ymd(item.frstRegistPnttm)}"></td>
			</tr>
			<tr th:if="${#lists.isEmpty(list)}">
				<td colspan="9">지자체관리 정보가 없습니다.</td>
			</tr>
		</tbody>
	</table>
	<div class="btn_all btn_right">
		<div class="flex_box gap-08">
			<button type="button" class="btn btn-dark-gray btn-mini" onclick="locgovCreate();">등록</button>
			<!-- 2022.11.18 주석처리 -->
			<!-- <button type="button" class="btn btn-dark-gray btn-mini" onclick="locgovDelete();">삭제</button> -->
		</div>
	</div>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
<!--// List -->

<!-- 날짜 셋팅 영역 -->
<div style="display: none;">
	<span id="today" th:text="${searchDates.today}"></span>
	<span id="week" th:text="${searchDates.week}"></span>
	<span id="month1" th:text="${searchDates.month1}"></span>
	<span id="month3" th:text="${searchDates.month3}"></span>
	<span id="year1" th:text="${searchDates.year1}"></span>
</div>
<!--// 날짜 셋팅 영역  -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript" th:inline="javascript">
	$(function(){

		// 한 페이지 출력 갯수 변경 이벤트
		displayChange();

		// 선택된 페이지 출력 갯수 셋팅
		displaySelected();

		// 체크박스 이벤트 (체크&해제) - AS-IS에 남아 있는 죽은 코드(체크박스 컬럼이 없다)
		checkedEventSet();

		// 날짜 변경 이벤트
		datepickerChange();

		// 검색 enter key
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartCreated"]' , 'input[name="srchEndCreated"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	/**
	 *	함 수 명 : displayChange
	 *	기	능  : 한 페이지 출력 갯수 변경 이벤트
	 */
	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	/**
	 *	함 수 명 : displaySelected
	 *	기	능  : 선택된 페이지 출력 갯수 셋팅
	 */
	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	/**
	 *	함 수 명 : checkedEvent
	 *	기	능  : 체크&해제 이벤트 셋팅
	 */
	function checkedEventSet() {
		var childObjs = $("input[id^='check_']").not("[id='check_all']");

		// 체크박스 '전체' 체크&해지
		$("#check_all").click(function(){
			$(childObjs).prop("checked", $(this).is(":checked"));
		});

		// '개별' 체크박스에 따른 '전체' 체크박스 체크&해지
		$(childObjs).click(function() {
			if($(childObjs).length == $("input[id^='check_']:checked").not("[id='check_all']").length) {
				$("#check_all").prop("checked", true);
			} else {
				$("#check_all").prop("checked", false);
			}
		});
	}

	/**
	 *	함 수 명 : locgovCreate
	 *	기	능  : 지자체 등록
	 */
	function locgovCreate() {
		location.href = "/admin/locgovs/create"+location.search;
	}

	/**
	 *	함 수 명 : locgovEdit
	 *	기	능  : 지자체 수정
	 */
	function locgovEdit(locgovCode) {
		if(!locgovCode) return false;
		location.href = "/admin/locgovs/edit/"+locgovCode+location.search;
	}

	/**
	 *	함 수 명 : locgovDelete
	 *	기	능  : 지자체 삭제 (AS-IS에서도 버튼이 주석처리돼 호출되지 않는다)
	 */
	function locgovDelete() {
		var locgovCodeList = new Array;

		// 선택된 지역코드 셋팅
		$("input[id^='check_']:checked").not("[id='check_all']").map(function(index, item) {
			locgovCodeList.push($(item).val());
		});

		if(locgovCodeList.length == 0) {
			alert("삭제할 지자체를 선택해주세요.");
			return false;
		}

		if(confirm("삭제하시겠습니까?")) {
			$.post('/admin/locgovs/delete', {"locgovCodeList": locgovCodeList}, function(response) {
				if(response.isSuccess && response.data) {
					if(response.data == "SUCC") {
						alert("삭제되었습니다.");
						location.reload();
					} else if(response.data == "NOT_DEL") {
						alert("삭제할 수 없는 지자체가 선택되었습니다.");
					} else {
						alert("오류가 발생했습니다.");
					}
				}
			});
		}
	}

	/**
	 *	함 수 명 : pointListPopup
	 *	기	능  : 포인트 지급률 변경이력 (팝업) 활성화
	 *	파라미터  : locgovCode - 지자체코드
	 */
	function pointListPopup(locgovCode) {
		var today = new Date();
		var year = today.getFullYear();
		var url = '/admin/locgovs/popup/point/list/'+locgovCode+'?stdrYear='+year;
		var popupName = 'locgovPointHistory';

		// 상세 팝업 활성화
		Common.popup(url, popupName, 600, 675 ,1, 0, 0);
	}

	/**
	 *	함 수 명 : datepickerChange
	 *	기	능  : 날짜 변경 이벤트
	 */
	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	/**
	 *	함 수 명 : search
	 *	기	능  : 검색
	 */
	function search() {
		var strStartDate = $("#srchStartCreated").val();
		var strEndDate = $("#srchEndCreated").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndCreated").val();
				$("#srchEndCreated").val("");
				$("#srchEndCreated").focus();
				$("#srchEndCreated").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	/**
	 *	함 수 명 : searchEnterKey
	 *	기	능  : 검색 엔터키 이벤트
	 */
	function searchEnterKey() {
		$("#srchValue, #srchStartCreated, #srchEndCreated").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
</body>
</html>
