<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>기부혜택증 기준 등록 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/swiper.min.css}"><!-- 추가 250804 -->

<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/lclgvHnrUser/lclgvHnrUserMng/form.jsp 이식(메뉴 19102 기부혜택증 설정).

     ★ 구조갭 해소: TO-BE는 19101(목록)·19102(설정 폼)가 같은 URL이었다 - AS-IS는 별개 화면이라
        /admin/honor-users/form/{지자체코드}로 분리했다.
     ★ 지자체 담당자(ROLE_ADMIN_5·6)는 목록 없이 바로 이 화면으로 오고, 남의 지자체를 열면
        자기 것으로 되돌려진다. 목록 버튼도 시스템·행안부에만 보인다(AS-IS c:if).

     AS-IS verbatim:
     - h3가 "{지자체명} 기부혜택증 기준 등록"이다(수정 화면인데 '등록'이다).
     - **골드·실버 등급 기부금액 입력칸은 주석처리**되어 있고 '발급기준금액' 하나만 쓴다.
     - 발급기준(선정구분)은 라디오 + 공통코드의 detail 설명문을 그대로 옆에 찍고,
       물음표 아이콘을 누르면 안내 이미지(honor_rule4.png) 팝업이 뜬다.
     - 기부혜택증 명칭 뒤에 "(권장길이 : 8자)" 안내가 붙는다.
     - 발급자 혜택은 스마트에디터이고, 그 위에 "동영상 사용은 권고하지 않습니다." 안내가 있다.
     - 이미지 설명표: "시각장애인을 위한 이미지 설명을 입력해주세요. ※이미지 등록 수와 이미지
       설명 항목 수가 반드시 일치해야 함" + 행 추가/삭제. 순번칸은 readonly다.
     - 메인 이미지는 multiple 업로드(권장 720x500)이고 업로드된 이미지 옆에 '삭제하기',
       오른쪽에 '기본 이미지'(default_honor_img.png)를 같이 보여준다.
     - 버튼은 [미리보기][수정] + (시스템·행안부)[목록]이고, 미리보기는 기부혜택증 카드 모양
       모달이다(swiper).

     저장은 donation API로 간다(기부혜택증 설정·이미지설명이 donation 소유). -->
<div class="admin_wrap">

<script type="text/javascript" th:inline="javascript">
	var lclgvCd = [[${lclgvCd}]];

	$(function() {
		// 이미지 설명 행 추가/삭제
		$(document).on('click', '.add-item-option2', function() {
			addImageExplainRow();
		});
		$(document).on('click', '.delete-item-option2', function(e) {
			e.preventDefault();
			$(this).closest('tr').remove();
			renumberImageExplainRows();
		});

		// 미리보기 모달 닫기(배경 클릭)
		$("#modal-benefit").on('click', function(e) {
			if (e.target === this) { closeBenefitModal(); }
		});
	});

	/**
	 *	함 수 명 : addImageExplainRow
	 *	기	능  : 이미지 설명 행 추가
	 */
	function addImageExplainRow() {
		var seq = $("#item-options2 tr").length + 1;
		var html = '<tr>'
			+ '<td><input type="text" maxlength="200" title="이미지 설명 순서" value="' + seq + '" readonly/></td>'
			+ '<td><textarea name="imageExplains"></textarea></td>'
			+ '<td><a href="#" class="btn btn-dark-gray btn-sm delete-item-option2">삭제</a></td>'
			+ '</tr>';
		$("#item-options2").append(html);
	}

	/**
	 *	함 수 명 : renumberImageExplainRows
	 *	기	능  : 삭제 후 순번 다시 매기기(AS-IS 순번칸은 readonly라 화면이 직접 채운다)
	 */
	function renumberImageExplainRows() {
		$("#item-options2 tr").each(function(index) {
			$(this).find('input[type=text]').val(index + 1);
		});
	}

	/**
	 *	함 수 명 : popupHnrGuide / closePopUp
	 *	기	능  : 발급기준 안내 이미지 팝업
	 */
	function popupHnrGuide() {
		$("#hnrUserSlctnSeImg_popup").show();
	}

	function closePopUp() {
		$("#hnrUserSlctnSeImg_popup").hide();
	}

	//메인 이미지 업로드 미리보기
	function changePcImgFile(event) {
		let inputElement = document.getElementById('prjImages');
		let files = inputElement.files;
		let displayAddFile = document.getElementById('uploadPcImg');

		displayAddFile.setAttribute("src", '/content/images/common/no-image-gray.gif');

		if (files && files.length > 0) {
			let file = files[0];
			if (file.type && file.type.indexOf('image/') > -1) {
				let reader = new FileReader();
				reader.onload = function(e) {
					displayAddFile.setAttribute("src", e.target.result);
				};
				reader.readAsDataURL(file);
			} else {
				const dataTransfer = new DataTransfer();
				inputElement.files = dataTransfer.files;
				alert("이미지 파일만 업로드 가능합니다.");
			}
		}
	}

	/**
	 *	함 수 명 : deleteItemFile
	 *	기	능  : 대표이미지 삭제 (AS-IS deleteItemFile - 삭제 건수를 돌려준다)
	 */
	function deleteItemFile(type) {
		if ($("#uploadedPcImg").attr('src') == '/content/images/common/no-image-gray.gif') {
			alert("삭제할 파일이 없습니다.");
			return;
		}
		if(confirm('파일이 실제로 삭제됩니다.\n정말 삭제하시겠습니까?')) {
			$.post('/admin/honor-users/form/deleteItemFile', {lclgvCd : lclgvCd}, function (response) {
				if (response > 0) {
					$("#uploadedPcImg").attr("src","/content/images/common/no-image-gray.gif");
				} else {
					alert("실패했습니다.");
				}
			});
		}
	}

	/**
	 *	함 수 명 : moveListPage
	 *	기	능  : 목록 이동 (시스템·행안부만)
	 */
	function moveListPage() {
		location.href = "/admin/honor-users";
	}

	/**
	 *	함 수 명 : modalBenefit
	 *	기	능  : 기부혜택증 미리보기 - 입력한 명칭·이미지를 카드에 얹어 보여준다
	 */
	function modalBenefit() {
		$("#preview_hnrUserStngTtl").text($("#hnrUserStngTtl").val());

		var uploaded = $("#uploadPcImg").attr('src');
		if (uploaded && uploaded.indexOf('no-image-gray') < 0) {
			$("#preview_prjImages").attr('src', uploaded);
		} else {
			$("#preview_prjImages").attr('src', $("#uploadedPcImg").attr('src'));
		}

		var now = new Date();
		var yyyy = now.getFullYear();
		var mm = ('0' + (now.getMonth() + 1)).slice(-2);
		var dd = ('0' + now.getDate()).slice(-2);
		$("#issueDate").text(yyyy + '-' + mm + '-' + dd);
		$("#validDate").text(yyyy + '-' + mm + '-' + dd + ' ~ ' + (yyyy + 1) + '-' + mm + '-' + dd);
		$("#countdownTime").text(now.toLocaleTimeString());

		$("#modal-benefit").show();
	}

	function closeBenefitModal() {
		$("#modal-benefit").hide();
	}
</script>
</body>
</html>
