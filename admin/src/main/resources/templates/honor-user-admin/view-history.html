<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>기부혜택증 열람현황목록 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/lclgvHnrUser/lclgvHnrUserViewHist/list.jsp 이식(메뉴 19103).
     검색: 기간(기본 오늘) + 지자체(시도→시군구) + 사용자명 / 6컬럼 / 엑셀.

     ★ AS-IS는 진입(GET) 시 조회하지 않는다 - 검색해야(POST) 조회된다.
     ★ 집계 화면이다: (열람일자, 회원, 지자체)로 묶어 **열람횟수**를 센다.
     ★ 지자체 담당자(ROLE_ADMIN_5·6)에게는 **지자체 검색칸 자체가 없고** 자기 지자체로 강제
        스코프된다(AS-IS c:if + 컨트롤러 둘 다 그렇게 한다).

     AS-IS verbatim:
     - h3가 "기부혜택증 열람현황목록"이다.
     - 날짜버튼이 오늘/1주일/**15일**/한달/3개월/1년이다(15일이 있는 화면은 드물다).
     - 출력개수 10/50/100/200/500.
     - 표 caption/summary가 "지자체 기부혜택증 기준 목록"이다(열람현황인데 - 복사 흔적).
     - 사용자명·열람횟수에 숫자포맷 함수를 쓴다(사용자명은 문자라 그대로 나온다).
     - 빈 목록 문구 "조회 정보가 존재하지 않습니다."(colspan 6).

     MSA 분담: 열람이력·지자체는 donation, **사용자명은 member**다. AS-IS가 OP_USER를
     INNER JOIN하므로 회원을 못 찾은 행은 버린다(컨트롤러에서 처리). -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<div class="item_list">
<h3><span>기부혜택증 열람현황목록</span></h3>

<form id="searchForm" method="post" th:action="@{/admin/honor-users/view-history}">
	<input type="hidden" id="page" name="page" th:value="${searchParam.page}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<caption></caption>
			<colgroup>
				<col style="width:100px;" />
				<col style="width:auto;" />
			</colgroup>
			<tbody>
				<tr>
					<td class="label" th:text="${msg.get('M01347')}">기간</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="startDate" name="startDate" class="term datepicker" th:title="${msg.get('M00507')}" th:value="${searchParam.startDate}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="endDate" name="endDate" class="term datepicker" th:title="${msg.get('M00509')}" th:value="${searchParam.endDate}" /></span>
							<span class="day_btns">
								<a href="javascript:;" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:;" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:;" class="btn_date day-15" th:text="${msg.get('M00028')}">15일</a>
								<a href="javascript:;" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:;" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:;" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
							</span>
						</div>
					</td>
				</tr>
				<tr th:if="${locgovSearchVisible}">
					<td class="label">지자체</td>
					<td>
						<div class="flex_box gap-08">
							<select id="upperLocgovCode" name="upperLocgovCode" class="wd-150" onchange="wdrChange(this.value)">
								<option value="">-전체-</option>
								<option th:each="p : ${provinces}" th:value="${p.key}" th:text="${p.value}"
								        th:selected="${p.key == searchParam.upperLocgovCode}"></option>
							</select>
							<select id="lclgvCd" name="lclgvCd" class="wd-150">
								<option value="">-시·군·구-</option>
							</select>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">사용자명</td>
					<td>
						<div class="flex_box gap-08">
							<input type="text" id="userName" name="userName" title="사용자명"
							       class="input_txt required _filter half" th:value="${searchParam.userName}"/>
						</div>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/honor-users/view-history'">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="excelDownload();">엑셀</button>
			</div>
		</div>
	</div>

	<div class="count_title mt-40">
		<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
		<span>
			<select id="itemsPerPage" name="itemsPerPage" title="화면 출력수" onchange="search();">
				<option value="10" th:selected="${searchParam.itemsPerPage == 10}">10개 출력</option>
				<option value="50" th:selected="${searchParam.itemsPerPage == 50}">50개 출력</option>
				<option value="100" th:selected="${searchParam.itemsPerPage == 100}">100개 출력</option>
				<option value="200" th:selected="${searchParam.itemsPerPage == 200}">200개 출력</option>
				<option value="500" th:selected="${searchParam.itemsPerPage == 500}">500개 출력</option>
			</select>
		</span>
	</div>
</form>

<div class="board_list">
	<table class="board_list_table" summary="지자체 기부혜택증 기준 목록">
		<caption>지자체 기부혜택증 기준 목록</caption>
		<colgroup>
			<col style="width:10%;">
			<col style="width:10%">
			<col style="width:20%;">
			<col style="width:20%;">
			<col style="width:10%;">
			<col style="width:*">
		</colgroup>
		<thead>
			<tr>
				<th>No.</th>
				<th>열람일자</th>
				<th>시도</th>
				<th>지자체</th>
				<th>사용자명</th>
				<th>열람횟수</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item : ${list}">
				<td th:text="${item.rowNumber}">0</td>
				<td th:text="${item.viewYm}"></td>
				<td th:text="${item.upperLocgovNm}"></td>
				<td th:text="${item.lclgvCdNm}"></td>
				<td th:text="${item.userName}"></td>
				<td th:text="${#numbers.formatInteger(item.viewCnt, 0, 'COMMA')}">0</td>
			</tr>
			<tr th:if="${#lists.isEmpty(list)}">
				<td colspan="6">조회 정보가 존재하지 않습니다.</td>
			</tr>
		</tbody>
	</table>
</div>

<div class="pagination-wrap">
	<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
</div>
</div><!-- /.item_list -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript" th:inline="javascript">
	var changeYn = "N";
	var selectedUpperLocgovCode = [[${searchParam.upperLocgovCode}]];
	var selectedLclgvCd = [[${searchParam.lclgvCd}]];
	var allLocgovs = /*[[${locgovs}]]*/ [];
	if(!allLocgovs) { allLocgovs = []; }

	$("select[name='upperLocgovCode']").on('focus', function () {

	}).change(function() {
		changeYn = "Y";
	})

	$(function() {
		if (selectedUpperLocgovCode) {
			wdrChange(selectedUpperLocgovCode);
		}

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="startDate"]' , 'input[name="endDate"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	/**
	 *	함 수 명 : wdrChange
	 *	기	능  : 지자체(시도) 변경 - 시군구 목록을 다시 채운다
	 */
	function wdrChange(value) {
		$("#lclgvCd option").remove();

		if (!value) {
			$('#lclgvCd').append('<option value="">-시·군·구-</option>');
			return;
		}

		$('#lclgvCd').append('<option value="">-전체-</option>');
		$.each(allLocgovs, function(index, item) {
			if (item.upperLocgovCode == value) {
				$('#lclgvCd').append('<option value="' + item.locgovCode + '">' + item.locgovNm + '</option>');
			}
		});

		if (selectedLclgvCd && changeYn == 'N') {
			$("#lclgvCd").val(selectedLclgvCd);
		}
	}

	//검색
	function search() {
		$("#page").val(1);
		$("#searchForm").submit();
	}

	/**
	 *	함 수 명 : excelDownload
	 *	기	능  : 기부혜택증 열람현황 엑셀 (AS-IS는 xlsx, TO-BE는 CSV)
	 */
	function excelDownload() {
		var params = new URLSearchParams();
		params.set("startDate", $("#startDate").val());
		params.set("endDate", $("#endDate").val());
		if($("#upperLocgovCode").length) { params.set("upperLocgovCode", $("#upperLocgovCode").val()); }
		if($("#lclgvCd").length) { params.set("lclgvCd", $("#lclgvCd").val()); }
		params.set("userName", $("#userName").val());

		location.href = "/admin/honor-users/view-history/export?" + params.toString();
	}
</script>
</body>
</html>
