<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- AS-IS opmanager/i18n/shop-statistics/include/date-list.jsp 이식.
     AS-IS도 일자별/월별/년도별 세 화면이 이 조각 하나를 공유하고 viewType 으로만 갈린다.

     ★ AS-IS 규칙
     - 2단 헤더 17칸: 일자·주문방법(rowspan2) + 결제 6 + 취소 6 + 합계 3.
     - 취소 수치는 전부 음수로 들어온다(건수까지). 그래서 "합계 = 판매 + 취소"가 순액이다.
     - 소계 노출이 'N'일 때만 표에 odd-even 줄무늬가 붙는다.
     - 일자 칸은 viewType 에 따라 드릴다운이 다르다:
         month → 일자별 화면으로 (startDate=YYYYMM01, endDate=YYYYMM99 - "99"도 AS-IS 그대로다)
         day   → AS-IS가 onclick 을 주석처리해 둬서 아무 동작도 하지 않는다
     - 주문방법(DEVICE_TYPE)은 TO-BE 주문표에 없는 값이라 "-"로 둔다(2026-10-13 사용자 결정). -->
<th:block th:fragment="table(dateList, total, displaySubtotal, viewType)">
<table class="board_list_table stats" th:classappend="${displaySubtotal != 'Y'} ? 'odd-even' : ''">
	<thead>
		<tr>
			<th rowspan="2">일자</th>
			<th rowspan="2">주문방법</th>
			<th colspan="6" class="division">결제</th>
			<th colspan="6" class="division">취소</th>
			<th colspan="3" class="division">합계</th>
		</tr>
		<tr>
			<th class="division">건수</th>
			<th>상품판매가</th>
			<th>할인</th>
			<th class="strong">판매액</th>
			<th class="strong">배송비</th>
			<th class="strong">소계</th>

			<th class="division">건수</th>
			<th>상품판매가</th>
			<th>할인</th>
			<th class="strong">판매액</th>
			<th class="strong">배송비</th>
			<th class="strong">소계</th>

			<th class="strong division">판매액</th>
			<th class="strong">배송비</th>
			<th class="strong">합계</th>
		</tr>
	</thead>
	<tbody>
		<th:block th:each="row, i : ${dateList}">
			<tr th:class="${i.count % 2 == 0} ? 'even' : ''">
				<!-- AS-IS는 주문방법 수만큼 rowspan 을 건다. 지금은 일자당 1행이라 1이다. -->
				<td rowspan="1">
					<!-- 년도별 → 그 해의 월별 화면으로 (AS-IS year.jsp 의 action 그대로) -->
					<a th:if="${viewType == 'year'}" href="javascript:;"
					   th:attr="onclick=|location.href='/shop-statistics/sales/month?startYear=${row.searchDate}&startMonth=01&endYear=${row.searchDate}&endMonth=12'|"
					   th:text="${row.searchDate}">-</a>
					<!-- ★AS-IS는 endDate 로 ${searchDate}99(없는 날짜)를 넘긴다. 조회는 되지만
						 일자별 화면 기간칸에 "20261099" 가 그대로 찍혀서, 사용자 지적으로
						 실제 말일을 넘기도록 바꿨다(조회 범위는 동일). -->
					<a th:if="${viewType == 'month'}" href="javascript:;"
					   th:attr="onclick=|location.href='/shop-statistics/sales/day?startDate=${row.searchDate}01&endDate=${@opDate.monthEnd(row.searchDate)}'|"
					   th:text="${@opDate.ym(row.searchDate)}">-</a>
					<a th:if="${viewType == 'day'}" href="javascript:;"
					   th:text="${@opDate.ymd(row.searchDate)}">-</a>
				</td>
				<td>-</td>
				<td class="division number" th:text="${#numbers.formatInteger(row.saleCount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.itemPrice, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.discountAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.saleAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.shipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.payAmount, 0, 'COMMA')}">0</td>

				<td class="division number" th:text="${#numbers.formatInteger(row.cancelCount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelItemPrice, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelDiscountAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelShipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelPayAmount, 0, 'COMMA')}">0</td>

				<td class="division number" th:text="${#numbers.formatInteger(row.totalAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.totalShipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.totalPayAmount, 0, 'COMMA')}">0</td>
			</tr>
			<!-- AS-IS: 소계 노출이 'Y'면 일자마다 소계줄이 붙는다. 주문방법이 한 줄뿐이라
				 값은 위 행과 같지만, AS-IS도 그룹이 하나면 같은 값이 나온다. -->
			<tr class="sub-total" th:if="${displaySubtotal == 'Y'}">
				<td colspan="2">소계</td>
				<td class="division number" th:text="${#numbers.formatInteger(row.saleCount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.itemPrice, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.discountAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.saleAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.shipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.payAmount, 0, 'COMMA')}">0</td>

				<td class="division number" th:text="${#numbers.formatInteger(row.cancelCount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelItemPrice, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelDiscountAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelShipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.cancelPayAmount, 0, 'COMMA')}">0</td>

				<td class="division number" th:text="${#numbers.formatInteger(row.totalAmount, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.totalShipping, 0, 'COMMA')}">0</td>
				<td class="number" th:text="${#numbers.formatInteger(row.totalPayAmount, 0, 'COMMA')}">0</td>
			</tr>
		</th:block>

		<tr class="total" th:if="${total != null and !#lists.isEmpty(dateList)}">
			<td colspan="2">합계</td>
			<td class="division number" th:text="${#numbers.formatInteger(total.saleCount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.itemPrice, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.discountAmount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.saleAmount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.shipping, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.payAmount, 0, 'COMMA')}">0</td>

			<td class="division number" th:text="${#numbers.formatInteger(total.cancelCount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.cancelItemPrice, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.cancelDiscountAmount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.cancelAmount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.cancelShipping, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.cancelPayAmount, 0, 'COMMA')}">0</td>

			<td class="division number" th:text="${#numbers.formatInteger(total.totalAmount, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.totalShipping, 0, 'COMMA')}">0</td>
			<td class="number" th:text="${#numbers.formatInteger(total.totalPayAmount, 0, 'COMMA')}">0</td>
		</tr>
	</tbody>
</table>
</th:block>

<!-- AS-IS 의 요약줄(.sort_area) - 세 화면 문구가 완전히 같다. -->
<th:block th:fragment="summary(total)">
<div class="sort_area mt30">
	<div class="left">
		<span>총 주문건수 : <span class="font_b" th:text="${total != null} ? ${#numbers.formatInteger(total.totalCount, 0, 'COMMA')} : '0'">0</span>건
			(판매 : <span th:text="${total != null} ? ${#numbers.formatInteger(total.saleCount, 0, 'COMMA')} : '0'">0</span>건,
			 취소 : <span th:text="${total != null} ? ${#numbers.formatInteger(total.cancelCount, 0, 'COMMA')} : '0'">0</span>건)</span>
		| <span>총 결제금액 : <span class="font_b" th:text="${total != null} ? ${#numbers.formatInteger(total.totalPayAmount, 0, 'COMMA')} : '0'">0</span>원</span>
	</div>
</div>
</th:block>

</body>
</html>
