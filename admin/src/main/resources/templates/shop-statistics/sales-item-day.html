<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품별 판매 (기간별 랭킹) - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>상품별 판매 (기간별 랭킹)</h1>
    <form method="get" th:action="@{/shop-statistics/sales/item/day}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd">
        <span>~</span>
        <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd">
        <button type="submit" class="btn">조회</button>
    </form>
    <table>
        <thead>
        <tr><th>상품ID</th><th>상품명</th><th>결제건수</th><th>결제포인트</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.itemId()}"></td>
            <td th:text="${row.itemName()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">조회된 데이터가 없습니다.</p>
</div>
</body>
</html>
