<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원별 매출 통계 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>회원별 매출 통계</h1>
    <table>
        <thead>
        <tr><th>회원ID</th><th>회원명</th><th>결제건수</th><th>결제포인트</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.userId()}"></td>
            <td th:text="${row.userName()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td><a class="small-btn" th:href="@{'/shop-statistics/sales/user/user-order'(userId=${row.userId()})}">상세</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">구매 내역이 있는 회원이 없습니다.</p>
</div>
</body>
</html>
