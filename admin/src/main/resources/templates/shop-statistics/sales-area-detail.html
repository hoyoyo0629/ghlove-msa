<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지역별 통계 상세 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <p><a th:href="@{/shop-statistics/sales/area}">&larr; 지역별 통계</a></p>
    <h1 th:text="${locgovCode} + ' 주문내역'"></h1>
    <table>
        <thead>
        <tr><th>주문번호</th><th>상품명</th><th>수량</th><th>결제포인트</th><th>상태</th><th>주문일시</th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.orderId()}"></td>
            <td th:text="${o.itemName()}"></td>
            <td th:text="${o.quantity()}"></td>
            <td th:text="${#numbers.formatInteger(o.pointAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${o.status()}"></td>
            <td th:text="${o.createdDate()}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(orders)}">주문 내역이 없습니다.</p>
</div>
</body>
</html>
