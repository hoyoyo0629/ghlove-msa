<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>연간통계 현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>연간통계 현황</h1>
    <table>
        <thead>
        <tr><th>연도</th><th>기부건수</th><th>기부금액</th><th>답례품건수</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${yearlyStats}">
            <td th:text="${row.year()} + '년'"></td>
            <td th:text="${row.donationCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.donationAmount(), 0, 'COMMA')} + '원'"></td>
            <td th:text="${row.giftCount()} + '건'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
