<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>결제타입별 매출 통계 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>결제타입별 매출 통계</h1>
    <p style="color:#666; margin-bottom:16px;">이 서비스는 전액 포인트결제이므로 결제타입은 "포인트" 단일 유형입니다.</p>

    <form method="get" th:action="@{/shop-statistics/sales/payment}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="text" name="startDate" th:value="${startDate}" placeholder="yyyyMMdd">
        <span>~</span>
        <input type="text" name="endDate" th:value="${endDate}" placeholder="yyyyMMdd">
        <button type="submit" class="btn">조회</button>
    </form>

    <div th:each="pt : ${stats}">
        <h3 th:text="${pt.payType()}"></h3>
        <table>
            <thead>
            <tr><th>일자</th><th>결제건수</th><th>결제포인트</th><th>취소건수</th><th>취소포인트</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${pt.byDay()}">
                <td th:text="${row.period()}"></td>
                <td th:text="${row.payCount()} + '건'"></td>
                <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
                <td th:text="${row.cancelCount()} + '건'"></td>
                <td th:text="${#numbers.formatInteger(row.cancelAmount(), 0, 'COMMA')} + 'P'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
