<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지자체별 구매현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>지자체별 구매현황</h1>

    <form method="get" th:action="@{/shop-statistics/sales/locgov}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="number" name="year" th:value="${year}" style="width:100px;">
        <button type="submit" class="btn">조회</button>
    </form>

    <table>
        <thead>
        <tr><th>지자체</th><th>결제건수</th><th>결제포인트</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.locgovName()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td><a class="small-btn" th:href="@{'/shop-statistics/sales/locgov/detail'(locgovCode=${row.locgovCode()}, year=${year})}">상세</a></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">해당 연도 데이터가 없습니다.</p>
</div>
</body>
</html>
