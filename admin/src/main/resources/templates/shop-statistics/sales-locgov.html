<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>답례품 구매현황(답례품별) - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/shop-statistics/sales/locgov.jsp 이식.
     locgov(ROLE_ADMIN_5~6, 자기 지자체 고정) 이거나 mois가 목록에서 지자체를 고른 상태 -
     그 지자체의 답례품별 집계. 년/월 select + 검색구분(답례품명/상호명)+검색어, 정렬가능
     6칸, 답례품명 클릭 시 회원별 상세 팝업(sales/locgov/detail). [목록] 버튼은 mois만 보인다
     (locgov 역할은 목록 자체가 없다). 엑셀은 AS-IS 주석처럼 "개인정보 없어서 팝업 없이". -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span>답례품 구매현황</span></h3>
<form id="statisticsParam" th:object="${statisticsParam}" method="post" th:action="@{/shop-statistics/sales/locgov}">
    <input type="hidden" name="locgovCode" th:value="${statisticsParam.locgovCode}">
    <input type="hidden" id="orderBy" th:field="*{orderBy}">
    <input type="hidden" id="isDesc" th:field="*{isDesc}">
    <div class="board_write">
        <table class="board_write_table">
            <colgroup>
                <col style="width:220px;">
                <col>
                <col style="width:220px;">
                <col>
            </colgroup>
            <tbody>
                <tr>
                    <td class="label">년도</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select id="year" name="year" title="년도" class="wd-150">
                                <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == statisticsParam.year}"></option>
                            </select>
                            <select id="locgovSearchMonth" name="locgovSearchMonth" title="월" class="wd-150">
                                <option value="" th:selected="${statisticsParam.locgovSearchMonth == ''}">전체</option>
                                <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:text="${m} + '월'"
                                        th:selected="${statisticsParam.locgovSearchMonth == #strings.toString(m)}"></option>
                            </select>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">검색구분</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select id="where" name="where" title="검색구분" class="wd-150">
                                <option value="ITEM_NAME" th:selected="${statisticsParam.where == 'ITEM_NAME'}">답례품명</option>
                                <option value="COMPANY_NAME" th:selected="${statisticsParam.where == 'COMPANY_NAME'}">상호명</option>
                            </select>
                            <input type="text" id="query" name="query" class="input_txt" th:value="${statisticsParam.query}">
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="btn_all btn_left">
            <ul class="list-bullet point">
                <li>검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.</li>
            </ul>
        </div>
        <div class="btn_all btn_right">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-mini"
                        th:attr="onclick=|location.href='/shop-statistics/sales/locgov?locgovCode=${statisticsParam.locgovCode}';|">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-mini">검색</button>
            </div>
        </div>
    </div>

    <div class="count_title mt-40 flex_box juc-sbt item-center">
        <h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
        <div class="flex_box gap-08">
            <span>
                <select id="itemsPerPage" name="itemsPerPage" title="화면출력" onchange="$('#statisticsParam').submit();">
                    <option value="10" th:selected="${statisticsParam.itemsPerPage == 10}">10개 출력</option>
                    <option value="20" th:selected="${statisticsParam.itemsPerPage == 20}">20개 출력</option>
                    <option value="50" th:selected="${statisticsParam.itemsPerPage == 50}">50개 출력</option>
                    <option value="100" th:selected="${statisticsParam.itemsPerPage == 100}">100개 출력</option>
                </select>
            </span>
        </div>
    </div>
</form>

<div class="board_list">
    <table class="board_list_table">
        <caption></caption>
        <colgroup>
            <col style="width:50px;">
            <col style="width:150px;">
            <col style="width:250px;">
            <col style="width:200px;">
            <col style="width:150px;">
            <col style="width:150px;">
            <col style="width:150px;">
            <col style="width:150px;">
            <col style="width:150px;">
            <col style="width:150px;">
        </colgroup>
        <thead>
            <tr>
                <th scope="col" class="col-md-1" rowspan="2">No.</th>
                <th scope="col" class="col-md-2" rowspan="2">답례품 코드</th>
                <th scope="col" class="col-md-2" rowspan="2">답례품명</th>
                <th scope="col" class="col-md-2" rowspan="2">상호명</th>
                <th scope="col" class="col-md-3" colspan="2">주문</th>
                <th scope="col" class="col-md-3" colspan="2">반품/환불</th>
                <th scope="col" class="col-md-3" colspan="2">합계</th>
            </tr>
            <tr>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'orderCase');">건수 <span id="orderCase"></span></a></th>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'orderPoint');">금액(p) <span id="orderPoint"></span></a></th>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'claimCase');">건수 <span id="claimCase"></span></a></th>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'claimPoint');">금액(p) <span id="claimPoint"></span></a></th>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'sumCase');">건수 <span id="sumCase"></span></a></th>
                <th scope="col" class="col-md-1"><a href="javascript:;" onclick="orderBySelect(event, 'sumPoint');">금액(p) <span id="sumPoint"></span></a></th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(dateList)}">
                <td colspan="9">조회 정보가 존재하지 않습니다.</td>
            </tr>
            <tr th:each="row, i : ${dateList}" style="background:#fff;">
                <td><div th:text="${pagination.itemNumber - i.count}">0</div></td>
                <!-- ★AS-IS "답례품 코드"(OP_ITEM.ITEM_USER_CODE)는 TO-BE 답례품 모델에 그 필드가
                     없다(gift.Gift 엔티티 미포팅) - 주문방법(DEVICE_TYPE)과 같은 사정으로 "-"
                     로 비워둔다(2026-10-14, docs/memory/admin-sales-locgov-port.md 참고). -->
                <td><div>-</div></td>
                <td class="tleft">
                    <div>
                        <a href="javascript:;" th:attr="onclick=|detailPopupOpen(${row.itemId})|" th:text="${row.itemName}"></a>
                    </div>
                </td>
                <td><div th:text="${row.companyName}"></div></td>
                <td><div th:text="${#numbers.formatInteger(row.saleCount, 0, 'COMMA')}">0</div></td>
                <td><div th:text="${#numbers.formatInteger(row.saleAmount, 0, 'COMMA')}">0</div></td>
                <td><div th:text="${#numbers.formatInteger(row.cancelCount, 0, 'COMMA')}">0</div></td>
                <td><div th:text="${#numbers.formatInteger(row.cancelAmount, 0, 'COMMA')}">0</div></td>
                <td><div th:text="${#numbers.formatInteger(row.sumCount, 0, 'COMMA')}">0</div></td>
                <td><div th:text="${#numbers.formatInteger(row.sumAmount, 0, 'COMMA')}">0</div></td>
            </tr>
        </tbody>
    </table>
    <div class="btn_all btn_right">
        <div class="flex_box gap-08">
            <button type="button" class="btn btn-dark-gray btn-mini" onclick="downloadExcel()">엑셀</button>
            <button type="button" class="btn btn-default btn-mini" th:if="${role == 'mois'}"
                    onclick="location.href='/shop-statistics/sales/locgov'">목록</button>
        </div>
    </div>
    <div class="pagination-wrap">
        <div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript">
/*<![CDATA[*/
    var orderBy = /*[[${statisticsParam.orderBy}]]*/ '';
    var isDesc = /*[[${statisticsParam.isDesc}]]*/ false;
    var SH_YEAR = /*[[${statisticsParam.year}]]*/ '';

    $(function () {
        initOrderby();
    });

    function downloadExcel() {
        // 개인정보 없어서 팝업 없이 다운로드 되도록 수정(AS-IS 주석 그대로)
        Shop.downloadExcelOrder("/shop-statistics/sales/locgov/download-excel", $('#statisticsParam').serialize(), false);
        alert('다운로드가 시작되었습니다.');
    }

    function detailPopupOpen(itemId) {
        var popupWidth = 700;
        var popupHeight = 580;
        var popupY = (window.screen.height / 2) - (popupHeight / 2);
        var popupX = (window.screen.width / 2) - (popupWidth / 2);
        popupX += window.screenLeft;

        window.open('/shop-statistics/sales/locgov/detail?itemId=' + itemId + '&year=' + SH_YEAR,
            'pop', 'toolbar=no, menubar=no, location=no, resizable=no, scrollbars=no, status=no, titlebar=no, width=' + popupWidth + ',height=' + popupHeight + ', left=' + popupX + ', top=' + popupY);
    }

    function initOrderby() {
        if (orderBy) {
            if (isDesc) {
                $("#" + orderBy).addClass("sort_arrow d_down");
            } else {
                $("#" + orderBy).addClass("sort_arrow d_up");
            }
        }
    }

    function orderBySelect(event, tagId) {
        if (event) {
            event.preventDefault();
        }
        let oldTagId = getOrderbyTagId();
        if (oldTagId == tagId) {
            isDesc = !isDesc;
        } else {
            if (oldTagId) { $("#" + oldTagId).removeClass(); }
            isDesc = true;
        }
        $("#" + tagId).removeClass();
        if (isDesc) {
            $("#" + tagId).addClass("sort_arrow d_down");
        } else {
            $("#" + tagId).addClass("sort_arrow d_up");
        }
        $("#isDesc").val(isDesc);
        $("#orderBy").val(tagId);
        $("#statisticsParam").submit();
    }

    function getOrderbyTagId() {
        if ($("#orderCase").attr('class')) { return "orderCase"; }
        if ($("#orderPoint").attr('class')) { return "orderPoint"; }
        if ($("#claimCase").attr('class')) { return "claimCase"; }
        if ($("#claimPoint").attr('class')) { return "claimPoint"; }
        if ($("#sumCase").attr('class')) { return "sumCase"; }
        if ($("#sumPoint").attr('class')) { return "sumPoint"; }
        return "";
    }
/*]]>*/
</script>

    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
