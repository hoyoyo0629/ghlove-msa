<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>농협 사업자 답례품 현황 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>농협 사업자 답례품 현황</h1>
    <p style="color:#666; margin-bottom:16px;">계좌 은행명에 "농협"이 포함된 판매자 기준입니다.</p>
    <table>
        <thead>
        <tr><th>판매자ID</th><th>판매자명</th><th>결제건수</th><th>결제포인트</th><th>취소건수</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.sellerId()}"></td>
            <td th:text="${row.sellerName()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${row.cancelCount()} + '건'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">농협 계좌를 등록한 판매자가 없습니다.</p>
</div>
</body>
</html>
