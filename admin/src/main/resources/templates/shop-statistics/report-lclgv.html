<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>지자체 현황 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/shop-statistics/report/lclgv.jsp 이식. 지자체별 누계 현황(report-mctpv.html)과 같은 틀에 시/도→시/군/구 select가 더해진다.

     ★ AS-IS 특징(그대로 옮김)
     - 표 3개(지자체별 기부금 현황 / 2000만원 / 지자체별 답례품 제공현황)를 한 페이지에 다 그려 두고 탭 버튼 3개가 보이는 표를 바꾼다.
       첫 진입(GET)은 표를 비워 두고 검색(POST)에서 채운다. 기본 탭은 3번(1·2번이 아니면 3번).
     - 월 select는 display:none(직전월까지만 조회 가능). 년도에 맞춰 JS monthChange가 채운다.
     - 지자체 칸: 시스템/행안부는 시/도 select + 시/군/구 select(시/도를 고르면 options-by-lclgv를 POST로 불러 채운다).
       지자체 담당자(ROLE_ADMIN_5/6)는 select 대신 자기 소속 이름만 보이고 조회 범위가 소속으로 고정된다.
     - 표는 높이 700px 스크롤 박스, 시/도·지자체 두 열은 왼쪽 고정(sticky). 단위는 천원(원 단위를 천원으로 반올림).
     - 기부금 두 탭(전체·2000만원)은 값 0과 전년대비 '0'을 "-"로 찍고, 답례품 탭은 0 그대로.
     - 탭 전환 JS(AS-IS 그대로): 1·3번 탭은 "기부금 표의 마지막 행", 2번 탭은 "답례품 표의 마지막 행"에서 기준년·시/도·지자체를 읽는다.
       1·2번 탭의 지자체 select 복원식은 AS-IS 오타(shLclgv가 비면 #shMctpv를 비우고, 아니면 #shLclgv에 시/도 코드를 넣음)가 있지만
       바로 뒤 searchSigungu()가 시/도·시/군/구를 다시 맞춰 주므로 결과는 같다 - 그대로 옮겼다.
     - AS-IS 시/도 option 마크업의 stray `}"` 문자와 3번 탭의 쓰이지 않는 변수(lclgvCd/mctpvCd에 목록 toString)는 옮기지 않았다.
     - "엑셀" 버튼은 report/lclgv/excel-download(총괄 현황과 같은 14개 시트 파일)를 부른다 - 폼의 시/도·지자체 선택이 그대로 실린다.
     - 검색 버튼의 onclick="search()"는 정의된 곳이 없는 함수라 AS-IS에서도 ReferenceError(제출은 그대로 됨) - 옮기지 않았다. -->

<!-- AS-IS JSP가 EL로 문자열에 끼워 넣던 값들(현재 년월·검색 조건·탭·표 마지막 행의 기준년/시/도/지자체 코드) - data 속성으로 넘긴다 -->
<div id="rptData" style="display:none"
     th:attr="data-now-year=${nowYear}, data-now-month=${nowMonth}, data-search-year=${statisticsParam.shYear}, data-search-month=${statisticsParam.shMonth}, data-sh-mctpv=${statisticsParam.shMctpv}, data-sh-lclgv=${statisticsParam.shLclgv}, data-tab=${tabId}"
     th:with="aodLast=${#lists.isEmpty(lclgvAodStats) ? null : lclgvAodStats[#lists.size(lclgvAodStats) - 1]},
              gdsLast=${#lists.isEmpty(lclgvGdsStats) ? null : lclgvGdsStats[#lists.size(lclgvGdsStats) - 1]}">
    <span id="rptAod" th:if="${aodLast != null}" th:attr="data-yr=${aodLast.crtrYr()}, data-mctpv=${aodLast.mctpvCd()}, data-lclgv=${aodLast.lclgvCd()}"></span>
    <span id="rptGds" th:if="${gdsLast != null}" th:attr="data-yr=${gdsLast.crtrYr()}, data-mctpv=${gdsLast.mctpvCd()}, data-lclgv=${gdsLast.lclgvCd()}"></span>
</div>

<script type="text/javascript" th:src="@{/content/modules/op.chart.js}"></script>
<script type="text/javascript">
	function excelDownload() {
		Shop.downloadExcelOrder("/shop-statistics/report/lclgv/excel-download", $('#statisticsParam').serialize(), false);
	}

	/* 탭 버튼: 표 3개 중 하나만 보이게(단위 캡션도 같이) + 선택 탭 버튼 색(#00215A, 나머지 #004CCE) */
	function showTab(n) {
		var tables = ["tbLclgvAodStats", "tbLclgvAodMaxStats", "tbLclgvGdsStats"];
		var captions = ["divCaptionForLclgvAod", "divCaptionForLclgvAodMax", "divCaptionForLclgvGds"];
		for (var i = 0; i < 3; i++) {
			document.getElementById(tables[i]).style.display = (i + 1 == n) ? "" : "none";
			document.getElementById(captions[i]).style.display = (i + 1 == n) ? "" : "none";
			document.getElementById("btn_tab" + (i + 1)).setAttribute("style", "background-color:" + ((i + 1 == n) ? "#00215A" : "#004CCE"));
		}
	}

	/* AS-IS는 표 목록을 도는 루프의 var로 마지막 행의 기준년/시도/지자체 코드를 읽는다. 목록이 비어 있으면 undefined. */
	function lastRowOf(spanId, key) {
		var v = $("#" + spanId).attr("data-" + key);
		return v === undefined || v === "" ? undefined : v;
	}

	/* 기준년: 조회된 행이 없으면(첫 진입·데이터 없는 달) 서버가 정해 준 기본/검색 년도(직전월의 년)를 그대로 선택한다 */
	function crtrYrOf(spanId) {
		var v = lastRowOf(spanId, "yr");
		return v === undefined ? $('#rptData').attr('data-search-year') : v;
	}

	/* 탭 1·2 공통(AS-IS 오타까지 그대로): shLclgv가 비면 #shMctpv를 비우고, 아니면 #shLclgv에 "시/도 코드"를 넣는다 */
	function selectTabTypo(n, spanId) {
		showTab(n);
		var crtrYr = crtrYrOf(spanId);
		var mctpv = lastRowOf(spanId, "mctpv");
		var lclgv = lastRowOf(spanId, "lclgv");
		var crtrMm = $('#rptData').attr('data-search-month');
		var shMctpv = $('#rptData').attr('data-sh-mctpv') || "";
		var shLclgv = $('#rptData').attr('data-sh-lclgv') || "";
		if(shMctpv == "") {
			$("#shMctpv").val("").prop("selected", true)
		} else {
			$("#shMctpv").val(mctpv).prop("selected", true)
		}
		if(shLclgv == "") {
			$("#shMctpv").val("").prop("selected", true)
		} else {
			$("#shLclgv").val(mctpv).prop("selected", true)
		}
		var tabId = "" + n;
		$('#tabId').val(tabId);
		monthChange(crtrYr, crtrMm);
		searchSigungu(shMctpv, shLclgv, tabId);
	}

	$("#btn_tab1").click(function() { selectTabTypo(1, "rptAod"); })
	$("#btn_tab2").click(function() { selectTabTypo(2, "rptGds"); })

	$("#btn_tab3").click(function() {
		showTab(3);
		var crtrYr = crtrYrOf("rptAod");
		var mctpv = lastRowOf("rptAod", "mctpv");
		var lclgv = lastRowOf("rptAod", "lclgv");
		var crtrMm = $('#rptData').attr('data-search-month');
		var shMctpv = $('#rptData').attr('data-sh-mctpv') || "";
		var shLclgv = $('#rptData').attr('data-sh-lclgv') || "";
		if(shMctpv == "") {
			$("#shMctpv").val("").prop("selected", true)
		} else {
			$("#shMctpv").val(mctpv).prop("selected", true)
		}
		if(shLclgv == "") {
			$("#shLclgv").val("").prop("selected", true)
		} else {
			$("#shLclgv").val(lclgv).prop("selected", true)
		}
		var tabId = "3";
		$('#tabId').val(tabId);
		monthChange(crtrYr, crtrMm);
		searchSigungu(shMctpv, shLclgv, tabId);
	})

	document.addEventListener("DOMContentLoaded", function(){
		var tabVal = $('#rptData').attr('data-tab');
		if(tabVal == "1") {
			$("#btn_tab1").trigger("click");
		} else if(tabVal == "2") {
			$("#btn_tab2").trigger("click");
		}  else {
			$("#btn_tab3").trigger("click");
		}
	});

	function monthChange(year, month) {
		$("#shYear").val(year).prop("selected", true);
		var nowYear = $('#rptData').attr('data-now-year');
		var nowMonth = $('#rptData').attr('data-now-month');
		var searchYear = $('#rptData').attr('data-search-year');
		var searchMonth = $('#rptData').attr('data-search-month');

		Common.loading.display = false;
		$("#shMonth option").remove();
		if ($("#shYear").val() != "") {
			if(year == nowYear) {
				for (var i = 1; i < parseInt(nowMonth); i++) {
		            var options = '<option value="' + i + '">' + i + '</option>';
		            $('#shMonth').append(options);
		        }
				if(year == searchYear) {
					$("#shMonth").val(month).prop("selected", true);
				} else {
					$("#shMonth").val(parseInt(nowMonth)-1).prop("selected", true);
				}
			} else {
				for (var i = 1; i <= 12; i++) {
		            var options = '<option value="' + i + '">' + i + '</option>';
		            $('#shMonth').append(options);
		        }
				if(year == searchYear) {
					$("#shMonth").val(month).prop("selected", true);
				} else {
					$("#shMonth").val(12).prop("selected", true);
				}
			}
		} else {
	        $('#shMonth').append('<option value="">검색월</option>');
		}
	}

	function searchSigungu(mctpv, lclgv, tabId) {
		$("#shMctpv").val(mctpv).prop("selected", true);
		$("#shLclgv option").remove();
		if ($("#shMctpv").val() != "") {
			$.post(url("/shop-statistics/report/lclgv/options-by-lclgv"), {'mctpv' : mctpv, 'tabId' : tabId}, function(response) {
				$('#shLclgv').append('<option value="">시,군,구</option>');
				for (var i = 0; i < response.length; i++) {
		            var options = '<option value="' + response[i].lclgvCd + '">' + response[i].lclgvNm + '</option>';
		            $('#shLclgv').append(options);
		        }
				$("#shLclgv").val(lclgv).prop("selected", true);
		    });
		} else {
