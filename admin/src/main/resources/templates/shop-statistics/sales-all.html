<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>답례품 구매현황 전체 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <h3>답례품 구매현황 전체</h3>

    <form method="get" th:action="@{/shop-statistics/sales/all}" class="field" style="display:flex; gap:8px; align-items:center;">
        <input type="text" name="year" th:value="${summary.year()}" placeholder="yyyy">
        <button type="submit" class="btn">조회</button>
    </form>

    <h4 th:text="${summary.year()} + '년 합계'"></h4>
    <table class="board_list_table">
        <thead>
        <tr><th>결제건수</th><th>결제포인트</th><th>취소건수</th><th>취소포인트</th></tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${summary.yearTotal().payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(summary.yearTotal().payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${summary.yearTotal().cancelCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(summary.yearTotal().cancelAmount(), 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>

    <h4>월별 현황</h4>
    <table class="board_list_table">
        <thead>
        <tr><th>월</th><th>결제건수</th><th>결제포인트</th><th>취소건수</th><th>취소포인트</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${summary.monthly()}">
            <td th:text="${row.period()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
            <td th:text="${row.cancelCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.cancelAmount(), 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
