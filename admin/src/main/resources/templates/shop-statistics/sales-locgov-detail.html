<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>지자체별 구매현황 상세 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <p><a th:href="@{'/shop-statistics/sales/locgov'(year=${year})}">&larr; 지자체별 구매현황</a></p>
    <h1 th:text="${locgovCode} + ' - ' + ${year} + '년 회원별 구매현황'"></h1>
    <table>
        <thead>
        <tr><th>회원ID</th><th>회원명</th><th>결제건수</th><th>결제포인트</th></tr>
        </thead>
        <tbody>
        <tr th:each="row : ${stats}">
            <td th:text="${row.userId()}"></td>
            <td th:text="${row.userName()}"></td>
            <td th:text="${row.payCount()} + '건'"></td>
            <td th:text="${#numbers.formatInteger(row.payAmount(), 0, 'COMMA')} + 'P'"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(stats)}">데이터가 없습니다.</p>
</div>
</body>
</html>
