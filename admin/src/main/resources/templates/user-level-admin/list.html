<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원등급 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D11 회원등급 관리 (AS-IS UserLevelManagerController). GROUP_CODE 라이브 데이터가 전부
     'default' 단일값이라 그룹 CRUD는 스코프아웃하고 등급 CRUD만 제공한다. -->
<div class="contents contents_inner">
    <h3>회원등급 관리</h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="btn_all btn_right" style="margin-bottom:16px;">
        <a class="btn btn-dark-gray btn-small" th:href="@{/admin/user-levels/new}">+ 등급 등록</a>
    </div>

    <table class="board_list_table" summary="회원등급목록">
        <caption>회원등급목록</caption>
        <thead>
        <tr>
            <th scope="col">단계</th>
            <th scope="col">등급명</th>
            <th scope="col">기준금액</th>
            <th scope="col">할인율</th>
            <th scope="col">적립률</th>
            <th scope="col">배송쿠폰</th>
            <th scope="col">처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${levels}">
            <td th:text="${l.depth}"></td>
            <td><a th:href="@{'/admin/user-levels/' + ${l.levelId} + '/edit'}" th:text="${l.levelName}"></a></td>
            <td th:text="${#numbers.formatInteger(l.priceStart,0,'COMMA')} + ' ~ ' + ${#numbers.formatInteger(l.priceEnd,0,'COMMA')} + '원'"></td>
            <td th:text="${l.discountRate} + '%'"></td>
            <td th:text="${l.pointRate} + '%'"></td>
            <td th:text="${l.shippingCouponCount} + '장'"></td>
            <td>
                <form th:action="@{'/admin/user-levels/' + ${l.levelId} + '/delete'}" method="post" style="display:inline;"
                      onsubmit="return confirm('이 등급을 삭제하시겠습니까?');">
                    <button type="submit" class="small-btn ghost">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(levels)}">등록된 회원등급이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
