<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>상품검색 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<!-- AS-IS opmanager/i18n/item/find-item.jsp(layout=base) 이식 - 상품검색 팝업(1000x600). Shop.findItem(targetId)이 열고,
     [추가]는 opener.Shop.addRelationItem(targetId, item)으로 연 화면의 목록(#targetId)에 넣는다.
     ★ AS-IS 그대로: 소속 지자체가 없는 관리자는 404, 정상·공개 상품 중 그 지자체(사용 판매자) 상품만.
     ★ 숨은 상품 옵션 칸(item_options)은 AS-IS 목록 쿼리가 옵션 컬럼을 고르지 않아(주석 처리된 블록) 채워질 값이 없다 - 빈 틀만 둔다. -->
<body>

	<!-- 개발 영역 -->
    <!-- 답례품 등록 popup -->
    <div class="popup_wrap">
        <div id="pop_header">
            <h1 class="popup_title" th:text="${msg.get('M01185')}">상품검색</h1> <!-- 답례품검색 -->
			<a href="javascript:self.close();" class="btn_close"><img src="/content/opmanager/images/btn/btn_close.png" alt="닫기"></a>
		</div>

        <div class="popup_contents">
			<!-- AS-IS form:form(action 없음) = 현재 주소 그대로(?targetId=..) 로 POST -->
			<form id="itemParam" th:action="@{/item/find-item(targetId=${itemParam.targetId})}" method="post">
				<!-- form:hidden으로 하면 targetId가 페이지 이동할 때마다 prod,prod,prod,...로 붙음 -->
				<input type="hidden" id="targetId" th:value="${itemParam.targetId}" />
				<input id="conditionType" name="conditionType" type="hidden" th:value="${itemParam.conditionType}"/>

	            <div class="board_write">
	                <table class="board_write_table" summary="관련답례품등록">
	                    <colgroup>
	                        <col style="width:220px;">
	                    </colgroup>
	                    <tbody>
	                        <tr>
	                            <td class="label" th:text="${msg.get('M00270')}">카테고리</td> <!-- 카테고리 -->
	                            <td>
	                                <div class="flex_box gap-08">
	                                	<select id="categoryGroupId" name="categoryGroupId" class="category" title="1차 카테고리">
	                                		<option value="0" th:text="${msg.get('= 1차 카테고리 =')}">= 1차 카테고리 =</option>		<!-- 선택 -->
	                                		<th:block th:each="categoriesTeam : ${categoryTeamGroupList}">
												<th:block th:if="${categoriesTeam.flag == 'Y'}">
													<th:block th:each="categoriesGroup : ${categoriesTeam.groups}">
														<option th:if="${categoriesGroup.flag == 'Y'}" th:value="${categoriesGroup.id}" th:text="${categoriesGroup.name}"
														        th:selected="${itemParam.categoryGroupId == categoriesGroup.id}"></option>
													</th:block>
												</th:block>
											</th:block>
	                                	</select>

	                                	<select id="categoryClass1" name="categoryClass1" class="category" title="2차 카테고리">
										</select>

										<select id="categoryClass2" name="categoryClass2" class="category" title="3차 카테고리">
										</select>
	                                </div>
	                            </td>
	                        </tr>
	                        <tr>
	                            <td class="label" th:text="${msg.get('M00011')}">검색구분</td>    <!-- 검색구분 -->
	                            <td>
	                                <div class="flex_box gap-08">
										<select id="where" name="where" th:title="${msg.get('M00011')}" class="wd-150">    <!-- 검색구분 -->
											<option value="ITEM_NAME" th:selected="${itemParam.where == 'ITEM_NAME'}" th:text="${msg.get('M00018')}">상품명</option> <!-- 답례품명 -->
											<option value="ITEM_USER_CODE" th:selected="${itemParam.where == 'ITEM_USER_CODE'}" th:text="${msg.get('M00019')}">상품번호</option> <!-- 답례품번호 -->
										</select>
										<input id="query" name="query" class="input_txt required _filter full" th:title="${msg.get('M00022')}" type="text" th:value="${itemParam.query}"/> <!-- 검색어 -->
	                                </div>
	                            </td>
	                        </tr>
	                        <tr th:style="${itemParam.targetId == 'set'} ? 'display:none'">
								<td class="label">판매자</td>
								<td>
									<div>
										<select name="sellerId" th:title="${msg.get('M01630')}" class="wd-150"> <!-- 판매자선택 -->
											<option value="0" th:text="${msg.get('M00039')}">전체</option> <!-- 전체 -->
											<option th:each="list : ${sellerList}" th:value="${list.sellerId}" th:text="${list.sellerName}"
											        th:attr="selected=${itemParam.sellerId == list.sellerId ? 'selected' : null}"></option>
										</select>
									</div>
								</td>
							</tr>
	                    </tbody>
	                </table>
	            </div>

	            <div class="btn_all btn_right">
	                <div class="flex_box gap-08">
	                    <button type="button" class="btn btn-dark-gray btn-mini"
	                        th:attr="onclick=|location.href='/item/find-item?targetId=${itemParam.targetId}';|" th:text="${msg.get('M00047')}">초기화</button>		<!-- 초기화 -->
	                    <button type="submit" class="btn btn-dark-gray btn-mini" th:text="${msg.get('M00048')}">검색</button>		<!-- 검색 -->
	                </div>
	            </div>
			</form>

            <!-- 조회 결과 테이블 -->
            <div class="board_list">
                <table class="board_list_table" summary="답례품 등록">
                    <caption>답례품 등록</caption>
                    <colgroup>
                        <col style="width:50px;" th:if="${itemParam.targetId != 'favProd'}">
                        <col style="width:500px;">
                        <col style="width:200px;">
                        <col style="width:200px;">
                        <col style="width:150px;">
                        <col style="width:150px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col" th:if="${itemParam.targetId != 'favProd'}"><input type="checkbox" id="check_all"></th>
                            <th th:text="${msg.get('M00018')}">상품명</th>	<!-- 답례품명 -->
                            <th th:text="${msg.get('M00783')}">상품코드</th>	<!-- 답례품코드 -->
                            <th th:text="${msg.get('M00786')}">판매가격</th>	<!-- 판매자 -->
                            <th th:text="${msg.get('M00104')}">상호명</th>	<!-- 상호명 -->
                            <th th:text="${msg.get('M01630')}">판매자명</th>	<!-- 판매자명 -->
                        </tr>
                    </thead>
                    <tbody class="sortable">
                        <tr th:each="row : ${list}" th:with="item=${row.item}" th:id="|item_${item.itemId}|">
                            <!-- 체크박스 -->
                            <td th:if="${itemParam.targetId != 'favProd'}">
                                <div>
                                    <input type="checkbox" name="id" th:value="${item.itemId}" />

									<span class="item_info" style="display:none;">
										<span class="item_names" th:text="${item.itemName}"></span>
										<span class="item_user_code" th:text="${item.itemUserCode}"></span>
										<span class="seller_name" th:text="${item.sellerName}"></span>
										<span class="item_sale_price" th:text="${item.salePrice}"></span>
										<span class="brand" th:text="${item.brand}"></span>
										<span class="item_price" th:text="${item.itemPrice}"></span>
										<span class="minus_spot_discount" th:text="${item.minusSpotDiscount}"></span>
										<span class="except_spot_discount" th:text="${item.exceptSpotDiscount}"></span>
										<span class="present_price" th:text="${item.presentPrice}"></span>
                                        <span class="item_commission_rate" th:text="${item.displayCommissionRate}"></span>
										<span class="display_flag" th:text="${item.displayFlag}"></span>
										<span class="data_status_code" th:text="${item.dataStatusCode}"></span>
										<span class="order_min_quantity" th:text="${item.orderMinQuantity}"></span>
										<span class="order_max_quantity" th:text="${item.orderMaxQuantity}"></span>
										<span class="item_option_flag" th:text="${item.itemOptionFlag}"></span>
										<span class="stock_flag" th:text="${item.stockFlag}"></span>
										<span class="stock_quantity" th:text="${item.stockQuantity}"></span>
										<span class="item_sold_out_flag" th:text="${item.itemSoldOutFlag}"></span>
										<span class="sold_out" th:text="${item.soldOut}"></span>
									</span>

									<span class="item_options" style="display:none;">

									</span>
                                </div>
                            </td>
                            <!-- // 체크박스 -->
                            <!-- 답례품명 -->
                            <td class="left break-word">
                                    <div class="flex_box item-center gap-08">
                                        <img th:src="${row.imageSrc}" class="item_image" alt="답례품이미지" />
                                        <div>
                                        	<span style="color:#e84700" class="mr5">
                                        		<th:block th:if="${item.dataStatusCode == '1'}">
                                        			<th:block th:if="${item.itemSoldOutFlag == 'Y'}">[품절]</th:block>
													<th:block th:if="${item.displayFlag == 'N'}">[비공개]</th:block>
												</th:block>
												<th:block th:unless="${item.dataStatusCode == '1'}">
													<a th:href="|javascript:Manager.itemLog('${item.itemId}')|">[비공개]</a>
												</th:block>
                                        	</span>
                                        	<th:block th:if="${itemParam.targetId == 'favProd'}">
                                        		<a th:href="|javascript:addSelectItem('${item.itemId}');|" th:text="${item.itemName}"></a>
												<span class="item_info" style="display:none;">
													<span class="item_names" th:text="${item.itemName}"></span>
													<span class="item_user_code" th:text="${item.itemUserCode}"></span>
													<span class="seller_name" th:text="${item.sellerName}"></span>
													<span class="item_sale_price" th:text="${item.salePrice}"></span>
													<span class="brand" th:text="${item.brand}"></span>
													<span class="item_price" th:text="${item.itemPrice}"></span>
													<span class="minus_spot_discount" th:text="${item.minusSpotDiscount}"></span>
													<span class="except_spot_discount" th:text="${item.exceptSpotDiscount}"></span>
													<span class="present_price" th:text="${item.presentPrice}"></span>
			                                        <span class="item_commission_rate" th:text="${item.displayCommissionRate}"></span>
													<span class="display_flag" th:text="${item.displayFlag}"></span>
													<span class="data_status_code" th:text="${item.dataStatusCode}"></span>
													<span class="order_min_quantity" th:text="${item.orderMinQuantity}"></span>
													<span class="order_max_quantity" th:text="${item.orderMaxQuantity}"></span>
													<span class="item_option_flag" th:text="${item.itemOptionFlag}"></span>
													<span class="stock_flag" th:text="${item.stockFlag}"></span>
													<span class="stock_quantity" th:text="${item.stockQuantity}"></span>
													<span class="item_sold_out_flag" th:text="${item.itemSoldOutFlag}"></span>
													<span class="sold_out" th:text="${item.soldOut}"></span>
												</span>
                                        	</th:block>
                                        	<th:block th:if="${itemParam.targetId != 'favProd'}" th:text="${item.itemName}"></th:block>
                                       	</div>
                                    </div>
                                <!-- </a> -->
                            </td>
                            <!-- // 답례품명 -->
                            <!-- 답례품코드 -->
                            <td>
                                <div th:text="${item.itemUserCode}"></div>
                            </td>
                            <!-- // 답례품코드 -->
                            <!-- 판매가 -->
                            <td>
                                <div th:text="${(item.salePrice == null ? '0' : #numbers.formatInteger(item.salePrice, 1, 'COMMA')) + '원'}"></div>
                            </td>
                            <!-- // 판매가 -->
                            <!-- 상호명 -->
                            <td>
                                <div th:text="${item.companyName}"></div>
                            </td>
                            <!-- // 상호명 -->
                            <!-- 판매자 -->
                            <td>
                                <div th:text="${item.sellerName}"></div>
                            </td>
                            <!-- // 판매자 -->
                        </tr>
                    </tbody>
                </table>

				<div class="no_content" th:if="${#lists.isEmpty(list)}">
					<th:block th:text="${msg.get('M00473')}">데이터가 없습니다.</th:block> <!-- 데이터가 없습니다. -->
				</div>
                <!-- 페이지네이션 -->
                <div class="pagination-wrap">
                    <div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
                </div>
                <!-- // 페이지네이션 -->
            </div> <!-- // board_list -->
            <!-- // 조회 결과 테이블 -->

            <p class="popup_btns">
                <button type="button" class="btn btn-active" onclick="javascript:addCheckedRelationItem();" th:if="${itemParam.targetId != 'favProd'}" th:text="${msg.get('M00192')}">추가</button> <!-- 추가 -->
                <button type="button" class="btn btn-default" onclick="javascript:self.close();" th:text="${msg.get('M00569')}">닫기</button>	<!-- 닫기 -->
            </p>
        </div>
    </div>
    <!-- // 답례품 등록 popup -->
    <!-- // 개발 영역 -->


<script type="text/javascript" th:inline="javascript">
var FIND_ITEM = {
	categoryGroupId: /*[[${itemParam.categoryGroupId}]]*/ 0,
	categoryClass1: /*[[${itemParam.categoryClass1}]]*/ '',
	categoryClass2: /*[[${itemParam.categoryClass2}]]*/ '',
	categoryClass3: /*[[${itemParam.categoryClass3}]]*/ '',
	categoryClass4: /*[[${itemParam.categoryClass4}]]*/ ''
};
</script>
<script type="text/javascript">
$(function() {
	// 팀/그룹 ~ 4차 카테고리 이벤트
	ShopEventHandler.categorySelectboxChagneEvent();

	Shop.activeCategoryClass(String(FIND_ITEM.categoryGroupId), FIND_ITEM.categoryClass1, FIND_ITEM.categoryClass2, FIND_ITEM.categoryClass3, FIND_ITEM.categoryClass4);
});

function addRelationItem(itemId, messageDisplay) {
	var display = true;
	if (messageDisplay == false) {
		display = false;
	}

	var targetId = $('#targetId').val();

	// 추천 테마 상품 갯수 확인
	if (targetId === 'mainTheme') {
		if(!opener.Shop.isAvilableRelationItemCount(targetId, 4)){
			Message.danger("한 테마에 상품은 최대 4개까지 등록 가능합니다.");
			return;
		}
	}

	if (targetId === 'related') {
		if(!opener.Shop.isAvilableRelationItemCount(targetId, 20)){
			Message.danger("관련상품은 최대 20개까지 등록 가능합니다.");
			return;
		}
	}

	if (targetId === 'set') {
		if(!opener.Shop.isAvilableRelationItemCount(targetId, 10)){
			Message.danger("세트상품은 최대 10개까지 등록 가능합니다.");
			return;
		}
	}

	if (targetId === 'favProd') {
		if(!opener.Shop.isAvilableRelationItemCount(targetId, 1)){
			Message.danger("상품은 최대 1개까지 등록 가능합니다.");
			return;
		}
	}

	if (opener.Shop.isAddedRelationItem(targetId, itemId)) {
		if (display) {
			var message = Message.get("M01215");	// 이미 추가한 상품입니다.
			Message.danger(message);
		}
		return;
	}

	var $item = $('#item_' + itemId);

	var item = {
		'itemId' : itemId,
		'itemName' : $item.find('.item_names').text(),
		'itemUserCode' : $item.find('.item_user_code').html(),
		'itemImage' : $item.find('.item_image').attr('src'),
		'itemSalePrice' : $item.find('.item_sale_price').text(),
		'brand' : $item.find('.brand').text(),
		'itemPrice' : $item.find('.item_price').text(),
		'presentPrice' : $item.find('.present_price').text(),
		'sellerName' : $item.find('.seller_name').text(),
		'minusSpotDiscount' : $item.find('.minus_spot_discount').text(),
		'exceptSpotDiscount' : $item.find('.except_spot_discount').text(),
		'itemOptions' : [],
        'commissionRate' : $item.find('.item_commission_rate').text(),
		'displayFlag'	 : $item.find('.display_flag').text(),
		'dataStatusCode' : $item.find('.data_status_code').text(),
		'orderMinQuantity' : $item.find('.order_min_quantity').text(),
		'orderMaxQuantity' : $item.find('.order_max_quantity').text(),
		'itemOptionFlag' : $item.find('.item_option_flag').text(),
		'stockFlag' : $item.find('.stock_flag').text(),
		'stockQuantity' : $item.find('.stock_quantity').text(),
		'itemSoldOutFlag' : $item.find('.item_sold_out_flag').text(),
		'soldOut' : $item.find('.sold_out').text(),
		'targerId' : targetId
	};

	// 상품 옵션 정보
	var itemOptionGroups = [];

	$item.find('span.itemOptionGroup').each(function() {
		var itemOptionGroup = {};
		itemOptionGroup.itemId = $(this).find('span.groupItemId').text();
		itemOptionGroup.optionType = $(this).find('span.groupOptionType').text();
		itemOptionGroup.optionTitle = $(this).find('span.optionTitle').text();

		var itemOptions = [];
		$(this).find('span.itemOption').each(function() {

			var itemOption = {};
			$(this).find('span').each(function() {

				itemOption[$(this).attr('class')] = $(this).text();
			});
			itemOptions.push(itemOption);

		});

		itemOptionGroup.itemOptions = itemOptions;
		itemOptionGroups.push(itemOptionGroup);

	});

	item.itemOptionGroups = itemOptionGroups;

	opener.Shop.addRelationItem(targetId, item);

	if (display) {
		Message.success(Message.get("M01217"));	// 추가하였습니다.
	}
}

// 체크한 상품 일괄 추가
function addCheckedRelationItem() {
	var targetId = $('#targetId').val();
	if ($('input[name=id]:checked').size() == 0) {
		var message = Message.get("M01216");	// 추가할 상품을 선택해 주세요.
		alert(message);
		$('#check_all').focus();
		return;
	}

	// 추천 테마 상품 갯수 확인
	if (targetId == 'mainTheme') {
		if($('input[name=id]:checked').size() > 4) {
			Message.danger("한 테마에 상품은 최대 4개까지 등록 가능합니다.");
			return;
		}
	}

	if (targetId == 'related') {
		if($('input[name=id]:checked').size() > 20) {
			Message.danger("관련상품등록은 최대 20개까지 등록 가능합니다.");
			return;
		}
	}

	$('input[name=id]:checked').each(function() {
		var itemId = $(this).val();
		addRelationItem(itemId, false);
	});

	// Message.success(Message.get("M01217"));	// 추가하였습니다.
	alert(Message.get("상품이 추가되었습니다."));
}

//체크한 상품 추가
function addSelectItem(itemId) {
	addRelationItem(itemId, false);
	alert(Message.get("상품이 추가되었습니다."));
	self.close();
}

</script>
</body>
</html>
