<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 문의 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>1:1 문의 관리</h1>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>분류</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>비밀글</th>
            <th>답변상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${inquiries}">
            <td th:text="${row.qna().qnaId}"></td>
            <td th:text="${row.qna().qnaGroup}"></td>
            <td><a th:href="@{'/qna-admin/' + ${row.qna().qnaId}}" th:text="${row.qna().subject}"></a></td>
            <td th:text="${row.qna().userName}"></td>
            <td th:text="${row.qna().createdDate}"></td>
            <td th:text="${row.qna().secretFlag == 'Y'} ? '비밀글' : '-'"></td>
            <td>
                <span class="pill" th:classappend="${row.answer() != null} ? 'on' : 'off'"
                      th:text="${row.answer() != null} ? '답변완료' : '답변대기'"></span>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(inquiries)}">1:1문의 정보가 존재하지 않습니다.</p>
</div>
<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
