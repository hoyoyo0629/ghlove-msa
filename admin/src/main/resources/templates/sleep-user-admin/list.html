<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴면회원 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- D5 휴면회원 조회/해제 (AS-IS opmanager/user/sleep-user - SleepUserManagerController).
     최종로그인일 범위 기본값이 오늘이라 처음 진입하면 보통 빈 목록이다 - 휴면회원은 정의상
     최근 로그인이 없어서다(AS-IS와 동일한 UX, 운영자가 기간을 넓혀 조회). -->
<div class="contents contents_inner">
    <h3>휴면회원 관리</h3>

    <p th:if="${wakeupCount != null}" class="dev-code" style="background:#eef4ff;color:#1a73e8;padding:10px;border-radius:4px;">
        <span th:text="${wakeupCount}"></span>건이 휴면 해제되었습니다.
    </p>

    <form th:action="@{/admin/sleep-users}" method="get" id="searchForm">
        <div class="board_write">
            <table class="board_write_table" summary="휴면회원 검색조건">
                <colgroup><col style="width:150px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">최종로그인일자</td>
                    <td>
                        <div class="flex_box gap-08">
                            <input type="date" name="fromDate" th:value="${fromDate}">
                            <span class="wave">~</span>
                            <input type="date" name="toDate" th:value="${toDate}">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">검색조건</td>
                    <td>
                        <div class="flex_box gap-08">
                            <select name="srchKey">
                                <option value="LOGIN_ID" th:selected="${srchKey == 'LOGIN_ID' or srchKey == null}">아이디</option>
                                <option value="USER_NAME" th:selected="${srchKey == 'USER_NAME'}">이름</option>
                            </select>
                            <input type="text" name="srchValue" th:value="${srchValue}" placeholder="검색어">
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="btn_all btn_right" style="margin-bottom:16px;">
            <div class="flex_box gap-08">
                <button type="button" class="btn btn-dark-gray btn-small" onclick="searchClear()">초기화</button>
                <button type="submit" class="btn btn-dark-gray btn-small">검색</button>
            </div>
        </div>
    </form>

    <div class="count_title mt-40">
        <h5>총 <span th:text="${totalCount}" th:remove="tag"></span>건</h5>
    </div>

    <form th:action="@{/admin/sleep-users/wakeup}" method="post" id="wakeupForm" onsubmit="return confirm('선택한 회원을 휴면 해제하시겠습니까?');">
        <input type="hidden" name="fromDate" th:value="${fromDate}">
        <input type="hidden" name="toDate" th:value="${toDate}">
        <table class="board_list_table" summary="휴면회원목록">
            <caption>휴면회원목록</caption>
            <thead>
            <tr>
                <th scope="col"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                <th scope="col">아이디</th>
                <th scope="col">이름</th>
                <th scope="col">최종로그인일</th>
                <th scope="col">가입일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${list}">
                <td><input type="checkbox" name="userIds" th:value="${s.userId}" class="row-check"></td>
                <td th:text="${s.loginId}"></td>
                <td th:text="${s.userName}"></td>
                <td th:text="${s.loginDate != null and #strings.length(s.loginDate) >= 8}
                              ? ${#strings.substring(s.loginDate,0,4) + '-' + #strings.substring(s.loginDate,4,6) + '-' + #strings.substring(s.loginDate,6,8)}
                              : '-'"></td>
                <td th:text="${s.createdDate != null and #strings.length(s.createdDate) >= 8}
                              ? ${#strings.substring(s.createdDate,0,4) + '-' + #strings.substring(s.createdDate,4,6) + '-' + #strings.substring(s.createdDate,6,8)}
                              : ''"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(list)}">조건에 맞는 휴면회원이 없습니다.</p>
        <div class="btn_all btn_center" th:unless="${#lists.isEmpty(list)}" style="margin-top:16px;">
            <button type="submit" class="btn btn-dark-gray btn-small">선택 휴면해제</button>
        </div>
    </form>

    <div class="pagination-wrap" th:if="${totalPages > 1}">
        <div class="pagination">
            <a th:if="${currentPage > 0}" class="prev"
               th:href="@{/admin/sleep-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${currentPage - 1},size=${size})}">이전</a>
            <span th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <strong th:if="${p == currentPage}" th:text="${p + 1}"></strong>
                <a th:unless="${p == currentPage}"
                   th:href="@{/admin/sleep-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${p},size=${size})}"
                   th:text="${p + 1}"></a>
            </span>
            <a th:if="${currentPage < totalPages - 1}" class="next"
               th:href="@{/admin/sleep-users(fromDate=${fromDate},toDate=${toDate},srchKey=${srchKey},srchValue=${srchValue},page=${currentPage + 1},size=${size})}">다음</a>
        </div>
    </div>
</div>

<script th:inline="none">
function searchClear() {
    location.href = /*[[@{/admin/sleep-users}]]*/ '/admin/sleep-users';
}
function toggleAll(checkbox) {
    var boxes = document.querySelectorAll('.row-check');
    boxes.forEach(function (b) { b.checked = checkbox.checked; });
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
