<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴면회원관리 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/user/sleep-user/list.jsp 이식(메뉴 4107).
     검색구분(아이디/이름, **정확히 일치**) + 최종 방문일 범위(기본 오늘, 날짜버튼에 전체(all-1) 포함) +
     화면출력 + 8컬럼(체크박스/No./최종 방문일/아이디/이름/주소/기부누적액/포인트잔액) + 휴면회원 해제.

     ★ AS-IS는 진입(GET) 시 목록을 조회하지 않는다 - 빈 목록/0건을 내려주고 검색해야(POST) 조회된다.
     ★ 기부누적액은 donation, 포인트잔액은 point 소유라 현재 페이지 userId를 모아 일괄 조회해 채운다.

     AS-IS verbatim:
     - h3는 MENU_4107 문구값 "휴면회원관리".
     - 표 summary/caption이 **"휴먼회원관리"** 오타다(휴면→휴먼). 그대로 둔다.
     - colgroup에 col이 2개뿐인데 컬럼은 8개다.
     - 금액은 `#,###.##` 형식이고 값이 없으면 '-'.
     - 빈 목록 행에는 다른 화면과 달리 style="background:#fff;"가 없다.
     - "휴면회원 해제" 버튼은 목록이 비어 있어도 항상 노출된다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_4107')}">휴면회원관리</span></h3>

<!-- Search -->
<form id="searchForm" class="opmanager-search-form clear" method="post" th:action="@{/admin/sleep-users}">
	<input type="hidden" id="sort" name="sort" th:value="${searchParam.sort}"/>
	<input type="hidden" id="orderBy" name="orderBy" th:value="${searchParam.orderBy}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>

	<div class="board_write">
		<table class="board_write_table" summary="">
			<colgroup>
				<col style="width:220px;">
			</colgroup>
			<tbody>
				<tr>
					<td class="label">검색구분</td>
					<td>
						<div class="flex_box gap-08 item-center">
							<select id="srchKey" name="srchKey" title="아이디" class="wd-150">
								<option value="LOGIN_ID" th:selected="${searchParam.srchKey == 'LOGIN_ID'}">아이디</option>
								<option value="USER_NAME" th:selected="${searchParam.srchKey == 'USER_NAME'}">이름</option>
							</select>
							<input type="text" id="srchValue" name="srchValue" title="검색구분"
							       class="input_txt required _filter wd-200" th:value="${searchParam.srchValue}"/>
							<p class="tip">※ “이름, 아이디”는 정확하게 입력해야 합니다.</p>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label">최종 방문일</td>
					<td>
						<div>
							<span class="datepicker"><input type="text" id="srchStartLoginDate" name="srchStartLoginDate" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.srchStartLoginDate}" /></span>
							<span class="wave">~</span>
							<span class="datepicker"><input type="text" id="srchEndLoginDate" name="srchEndLoginDate" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.srchEndLoginDate}" /></span>
							<span class="day_btns">
								<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
								<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
								<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
								<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
								<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
								<a href="javascript:void(0);" class="btn_date all-1" th:text="${msg.get('M00039')}">전체</a>
							</span>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="btn_all btn_left">
			<ul class="list-bullet point">
		        <li>
		            검색 버튼을 클릭하면 조건에 맞는 검색결과를 확인할 수 있습니다.
		        </li>
	        </ul>
	  	</div>
		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="location.href='/admin/sleep-users'">초기화</button>
				<button type="button" class="btn btn-dark-gray btn-mini" onclick="search();">검색</button>
			</div>
		</div>
	</div>
</form>
<!--// Search -->

<!-- List Header -->
<div class="count_title mt-40">
	<h5>총 <span th:text="${#numbers.formatInteger(count, 0, 'COMMA')}" th:remove="tag">0</span>건</h5>
	<span>
		<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
			<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
			<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
			<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
			<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
		</select>
	</span>
</div>
<!--// List Header -->

<!-- List -->
<div class="board_list">
	<!-- AS-IS 오타 그대로("휴먼회원관리") -->
	<table class="board_list_table" summary="휴먼회원관리">
		<caption>휴먼회원관리</caption>
		<colgroup>
			<col style="width:5%;">
			<col style="width:5%;">
		</colgroup>
		<thead>
			<tr>
				<th scope="col"><input type="checkbox" id="check_all" /></th>
				<th scope="col">No.</th>
				<th scope="col">최종 방문일</th>
				<th scope="col">아이디</th>
				<th scope="col">이름</th>
				<th scope="col">주소</th>
				<th scope="col">기부누적액</th>
				<th scope="col">포인트잔액</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item, i : ${list}" style="background:#fff;">
				<td><input type="checkbox" th:value="${item.userId}" th:id="'check_' + ${item.userId}"></td>
				<td th:text="${pagination.itemNumber - i.count}">0</td>
				<td th:text="${@opDate.ymd(item.loginDate)}"></td>
				<td th:text="${item.loginId}"></td>
				<td th:text="${item.userName}"></td>
				<td th:text="${item.address} + ' ' + (${item.addressDetail} ?: '')"></td>
				<td th:text="${item.totalCntrAmt == null} ? '-' : ${#numbers.formatDecimal(item.totalCntrAmt, 1, 'COMMA', 2, 'POINT')}">-</td>
				<td th:text="${item.totalCntrBlcePoint == null} ? '-' : ${#numbers.formatDecimal(item.totalCntrBlcePoint, 1, 'COMMA', 2, 'POINT')}">-</td>
			</tr>
			<!-- AS-IS도 이 행에는 background 스타일이 없다 -->
			<tr th:if="${#lists.isEmpty(list)}">
				<td colspan="8">휴면회원 정보가 존재하지 않습니다.</td>
			</tr>
		</tbody>
	</table>
	<div class="btn_all btn_right">
		<div class="flex_box gap-08">
			<button type="button" class="btn btn-dark-gray btn-mini" onclick="wakeupSleepUser();">휴면회원 해제</button>
		</div>
	</div>
	<div class="pagination-wrap" th:if="${not #lists.isEmpty(list)}">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>
</div>
<!--// List -->
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript">
	$(function(){

		// 한 페이지 출력 갯수 변경 이벤트
		displayChange();

		// 선택된 페이지 출력 갯수 셋팅
		displaySelected();

		// 체크박스 이벤트 (체크&해제)
		checkedEventSet();

		// 날짜 변경 이벤트
		datepickerChange();

		// 검색 enter key
		searchEnterKey();

		Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="srchStartLoginDate"]' , 'input[name="srchEndLoginDate"]');
		EventHandler.calendarStartDateAndEndDateVaild();
	});

	/**
	 *	함 수 명 : displayChange
	 *	기	능  : 한 페이지 출력 갯수 변경 이벤트
	 */
	function displayChange() {
		$("#displayCount").on('change', function(){
			$("#itemsPerPage").val($(this).val());
			search();
		});
	}

	/**
	 *	함 수 명 : displaySelected
	 *	기	능  : 선택된 페이지 출력 갯수 셋팅
	 */
	function displaySelected(){
		$("#displayCount").val($("#itemsPerPage").val());
	}

	/**
	 *	함 수 명 : checkedEvent
	 *	기	능  : 체크&해제 이벤트 셋팅
	 */
	function checkedEventSet() {
		var childObjs = $("input[id^='check_']").not("[id='check_all']");

		// 체크박스 '전체' 체크&해지
		$("#check_all").click(function(){
			$(childObjs).prop("checked", $(this).is(":checked"));
		});

		// '개별' 체크박스에 따른 '전체' 체크박스 체크&해지
		$(childObjs).click(function() {
			if($(childObjs).length == $("input[id^='check_']:checked").not("[id='check_all']").length) {
				$("#check_all").prop("checked", true);
			} else {
				$("#check_all").prop("checked", false);
			}
		});
	}

	/**
	 *	함 수 명 : wakeup
	 *	기	능  : 휴면회원 해제
	 */
	function wakeupSleepUser() {
		var userIdList = new Array();

		// 선택된 사용자 셋팅
		$("input[id^='check_']:checked").not("[id='check_all']").map(function(index, item) {
			userIdList.push($(item).val());
		});

		if(userIdList.length == 0) {
			alert("해제할 휴면회원을 선택해 주세요.");
			return false;
		}

		if(confirm("선택한 휴면회원의 휴면을 해제하시겠습니까?")) {
			$.post("/admin/sleep-users/wakeup", {"userIdList" : userIdList}, function(response) {
				if(response.isSuccess && response.data) {
					if(response.data == "SUCC") {
						alert("휴면회원 해제되었습니다.");
						location.reload();
					} else {
						alert("오류가 발생했습니다.");
					}
				}
			});
		}
	}

	/**
	 *	함 수 명 : datepickerChange
	 *	기	능  : 날짜 변경 이벤트
	 */
	function datepickerChange() {
		if($("input.datepicker").length) {
			$("input.datepicker").keyup(function(e) {
				if(e && e.target && e.target.value) {
					var value = e.target.value.replace(/[^0-9]/g, "");
					if(value.length > 8) { value = value.slice(0, 8); }
					e.target.value = value;
				}
			});
		}
	}

	/**
	 *	함 수 명 : search
	 *	기	능  : 검색
	 */
	function search() {
		var strStartDate = $("#srchStartLoginDate").val();
		var strEndDate = $("#srchEndLoginDate").val();

		if(strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
			var startDate = new Date(strStartDate.substr(0, 4), strStartDate.substr(4, 2), strStartDate.substr(6, 2));
			var endDate = new Date(strEndDate.substr(0, 4), strEndDate.substr(4, 2), strEndDate.substr(6, 2));

			if(startDate > endDate) {
				alert("종료일이 시작일보다 빠릅니다.");
				var value = $("#srchEndLoginDate").val();
				$("#srchEndLoginDate").val("");
				$("#srchEndLoginDate").focus();
				$("#srchEndLoginDate").val(value);
				return false;
			}
		}

		$("#searchForm").submit();
	}

	/**
	 *	함 수 명 : searchEnterKey
	 *	기	능  : 검색 엔터키 이벤트
	 */
	function searchEnterKey() {
		$("#srchValue, #srchStartLoginDate, #srchEndLoginDate").on('keydown', function(e){
			if (e.keyCode == '13') {
				search();
			}
		});
	}
</script>
</body>
</html>
