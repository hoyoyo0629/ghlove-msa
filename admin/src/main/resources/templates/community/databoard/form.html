<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>자료실 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/community/databoard/form.jsp 이식(메뉴 11402 자료실 등록·수정).
     ★ AS-IS는 등록과 수정이 <b>이 템플릿 하나</b>를 공유한다(edit도 form.jsp를 돌려준다).
     글이 새 글인지로 라벨·버튼이 갈린다(AS-IS는 rpstrId == 0으로 판정, TO-BE는 detail == null).

     AS-IS verbatim:
     - 상단공지 체크박스는 시스템·행안부 관리자(ROLE_ADMIN_1~4)에만 보인다.
     - 첨부 라벨이 등록이면 "파일 등록 : ", 수정이면 "파일 수정 : "이다.
     - 첨부는 <b>보안 점검 모달 없이 그냥 file input</b>이고 파라미터 이름이 detailImageFiles[]다.
     - 안내문구 "※ 첨부파일은 1개(50MB 이하) / jp(e)g, png, ppt(x), xlsx, hwp(x), doc(x), pdf,  bmp, gif, zip, 7z만 가능합니다."
       (pdf 뒤 공백 두 칸까지 그대로)
     - 기존 첨부는 파일명 + X(삭제)로 보이고 X는 ajax로 바로 지운다.
     - 버튼은 등록이면 M00088("등록")/취소(목록으로), 수정이면 M00087("수정")/취소다.
     - 폼 id는 cmntyRpstrDto 다(화면 스크립트가 그 id로 validator를 건다).
     - AS-IS 상단공지 라벨에 디버그 흔적($\{noticeYn} 출력)이 남아 있는데 모델에 없는 값이라
       화면에는 아무것도 찍히지 않는다 - 옮기지 않았다.
     - 쓰이지 않는 hidden databoardParam 도 옮기지 않았다(값을 넣는 곳이 없다).

     ★ 체크박스 초기상태는 서버에서 'Y'일 때만 체크해 내려준다(AS-IS는 value에 현재값을 넣어
       항상 체크로 그리는 구조 - 결과는 같다). 다른 게시판 수정화면과 같은 처리. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span th:text="${msg.get('MENU_11402')}">자료실</span></h3>

<form id="cmntyRpstrDto" method="post" enctype="multipart/form-data"
	  th:action="${detail == null} ? @{/community/databoard/create} : @{'/community/databoard/edit/' + ${detail.rpstrId}}">
	<input type="hidden" id="rpstrId" name="rpstrId" th:value="${detail != null ? detail.rpstrId : ''}"/>

	<div class="board_write">
		<table class="board_write_table" th:attr="summary=${msg.get('M00269')}">
			<colgroup>
				<col style="width: 220px;">
			</colgroup>
			<tbody>
				<tr th:if="${role == 'ROLE_ADMIN_1' or role == 'ROLE_ADMIN_2' or role == 'ROLE_ADMIN_3' or role == 'ROLE_ADMIN_4'}">
					<td class="label">상단공지</td>
					<td>
						<div class="flex_box gap-08">
							<div class="checkbox">
								<input type="checkbox" id="noticeYn1" name="noticeYn" value="Y"
									   th:checked="${detail != null and detail.noticeYn == 'Y'}"/>
								<label for="noticeYn1" th:text="${msg.get('M00083')}">사용</label>
							</div>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>
						<span th:text="${msg.get('M00275')}">제목</span></td>
					<td>
						<div>
							<input type="text" id="rpstrTtl" name="rpstrTtl" th:title="${msg.get('M00275')}"
								   class="input_txt required _filter half" maxlength="255"
								   th:value="${detail != null ? detail.rpstrTtl : ''}"/>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label" th:text="${msg.get('M01699')}">첨부파일</td>
					<!-- 첨부파일 -->
					<td>
						<div class="flex_box item-center">
							<span class="input_file_txt" th:if="${detail == null}">파일 등록 : </span>
							<span class="input_file_txt" th:unless="${detail == null}">파일 수정 : </span>
							<input type="file" name="detailImageFiles[]" onchange="addFile(this);"/>
							<!-- accept=".pdf,.jpg,.jpeg,.gif,.png,.docx,.xlsx,.pptx,.hwp,.zip"  -->
						</div>
						<div>
							<p style="color:red;">※ 첨부파일은 1개(50MB 이하) / jp(e)g, png, ppt(x), xlsx, hwp(x), doc(x), pdf,  bmp, gif, zip, 7z만 가능합니다.</p>
						</div>
						<div class="file_camera" th:each="file : ${fileList}" th:id="'file_camera_' + ${file.fileId}">
							<a th:href="|javascript:downloadItemImage(${file.fileId});|" th:text="${file.orgnlAtchFileNm}"></a>
							<a th:href="|javascript:deleteItemImage(${file.fileId});|">
								<img th:src="@{/content/images/btn/file_close.gif}" alt="close">
							</a>
						</div>
					</td>
				</tr>
				<tr>
					<td class="label"><span class="required_mark">*</span>
						<span th:text="${msg.get('M00006')}">내용</span></td>
					<td>
						<!-- smart_editor2 area -->
						<div class="smart_editor2-wrap">
							<textarea id="rpstrCn" name="rpstrCn" cols="30" rows="20" maxlength="300"
									  class="w90 editor-content" th:title="${msg.get('M00006')}"
									  th:text="${detail != null ? detail.rpstrCn : ''}"></textarea>
						</div> <!-- smart_editor2 area -->
					</td>
				</tr>
			</tbody>
		</table>

		<div class="btn_all btn_center" th:if="${detail == null}">
			<div class="flex_box gap-08">
				<button type="submit" class="btn btn-dark-gray btn-small">
					<span th:text="${msg.get('M00088')}">등록</span>
				</button>
				<button type="button" class="btn btn-defualt btn-small"
						onclick="location.href='/community/databoard/list'"
						th:text="${msg.get('M00037')}">취소</button>
			</div>
		</div>
		<div class="btn_all btn_center" th:unless="${detail == null}">
			<div class="flex_box gap-08">
				<button type="submit" class="btn btn-dark-gray btn-small" th:text="${msg.get('M00087')}">수정</button>
				<button type="button" class="btn btn-defualt btn-small" onclick="goToDetail()"
						th:text="${msg.get('M00037')}">취소</button>
			</div>
		</div>

	</div>

</form>

    </div>
    </div>
</div>
</div>

<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('rpstrCn')}"></div>

<script type="text/javascript" th:inline="javascript">
var rpstrId = /*[[${detail != null ? detail.rpstrId : null}]]*/ null;

$(function() {
	try{
		$('#cmntyRpstrDto').validator(function() {
			Common.getEditorContent("rpstrCn");

			if ($('#rpstrCn').val().toLowerCase() == '<p>&nbsp;</p>' || $('#rpstrCn').val() == '') {
				alert($.validator.messages['text'].format(/*[[${msg.get('M00006')}]]*/ '내용'));
				return false;
			}

			$('#rpstrCn')[0].value = encodeURIComponent($('#rpstrCn')[0].value);
		});
	} catch(e) {
		alert(e.message);
	}
});

/*
 * 함 수 명 : addFile
 * 기 능 : 첨부파일 유효성 검사
 */
function addFile(obj){
	let size = 50 * 1024 * 1024;
	let fileTypes = ['jpg', 'jpeg', 'gif', 'bmp', 'png', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'pdf', 'tif', 'tiff', 'hwp', 'hwpx','zip', '7z'] // 파일 확장자 , 이후에도 확장자 추가 가능

	if ($('.file_camera').length > 0) {
		alert("이미 등록된 파일이 있습니다.");
		$("input:file[name='detailImageFiles[]']").val('');
		return false;
	}

	for (const file of obj.files) {
		let type = file.name.split('.').pop().toLowerCase(); // 파일 확장자 가져오기

		if(file.size > size) {
			alert("첨부파일 용량은 최대 50MB 까지 가능합니다.");
			$("input:file[name='detailImageFiles[]']").val('');
			return false;
		}else if($.inArray(type, fileTypes) == -1) {
			alert("등록할 수 없는 첨부파일 입니다.")
			$("input:file[name='detailImageFiles[]']").val('');
			return false;
		}
	}
}

function downloadItemImage(fileId) {
	location.href = '/community/databoard/file-download/'+fileId
}

function deleteItemImage(fileId) {
	var message = '파일이 실제로 삭제됩니다.\n삭제하시겠습니까?';
	if (!confirm(message)) {
		return;
	}

	var param = {'fileId': fileId};
	$.post('/community/databoard/delete-item-image', param, function(response){
		Common.responseHandler(response);
		$("#file_camera_"+fileId).remove();
		alert("파일이 삭제되었습니다.");
	});
}

function goToDetail(){
	location.href = '/community/databoard/detail/' + rpstrId;
}
</script>
</body>
</html>
