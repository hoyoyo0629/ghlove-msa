<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>내부문의 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <div class="location"><a th:href="@{/admin/internal-inquiry}">내부문의 관리</a></div>

    <!-- ============ 문의 작성 (지자체 담당자) ============ -->
    <div th:if="${mode == 'new'}">
        <h3>문의 작성</h3>
        <div class="board_write">
            <table class="board_write_table" summary="내부문의 작성">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">문의유형</td>
                    <td>
                        <select id="qnaGroup" name="qnaGroup" form="inquiryForm">
                            <option th:each="e : ${qnaGroups}" th:value="${e.key}" th:text="${e.value}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label"><span class="required_mark">*</span>제목</td>
                    <td><input type="text" id="subject" name="subject" required form="inquiryForm"></td>
                </tr>
                <tr>
                    <td class="label"><span class="required_mark">*</span>질문</td>
                    <td><textarea id="question" name="question" rows="10" required form="inquiryForm"></textarea></td>
                </tr>
                </tbody>
            </table>
        </div>
        <form id="inquiryForm" th:action="@{/admin/internal-inquiry}" method="post"></form>
        <div class="btn_all btn_center">
            <button type="submit" form="inquiryForm" class="btn btn-dark-gray btn-small">등록</button>
        </div>
    </div>

    <!-- ============ 문의 상세 + 답변 (본사) ============ -->
    <div th:if="${mode == 'detail'}">
        <h3>문의 상세</h3>
        <div class="board_write">
            <table class="board_write_table" summary="내부문의 상세">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">문의유형</td>
                    <td th:text="${qnaGroups.get(inquiry.qnaGroup)} ?: ${inquiry.qnaGroup}"></td>
                </tr>
                <tr>
                    <td class="label">등록자</td>
                    <td th:text="${inquiry.userName}"></td>
                </tr>
                <tr>
                    <td class="label">등록일</td>
                    <td th:text="${inquiry.createdDate != null ? #temporals.format(inquiry.createdDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
                </tr>
                <tr>
                    <td class="label">제목</td>
                    <td th:text="${inquiry.subject}"></td>
                </tr>
                <tr>
                    <td class="label">질문</td>
                    <td style="white-space:pre-wrap;" th:text="${inquiry.question}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h3 style="margin-top:24px;">답변</h3>
        <!-- 본사 운영자만 답변 작성/수정, 지자체 담당자는 읽기전용 -->
        <div th:if="${canAnswer}" class="board_write">
            <table class="board_write_table" summary="내부문의 답변">
                <colgroup><col style="width:220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label">제목</td>
                    <td><input type="text" name="title" th:value="${answer != null ? answer.title : inquiry.subject}" form="answerForm"></td>
                </tr>
                <tr>
                    <td class="label"><span class="required_mark">*</span>답변내용</td>
                    <td><textarea name="answer" rows="8" required form="answerForm" th:text="${answer != null ? answer.answer : ''}"></textarea></td>
                </tr>
                </tbody>
            </table>
            <form id="answerForm" th:action="@{'/admin/internal-inquiry/' + ${inquiry.qnaAdminId} + '/answer'}" method="post"></form>
            <div class="btn_all btn_center">
                <button type="submit" form="answerForm" class="btn btn-dark-gray btn-small" th:text="${answer != null ? '답변 수정' : '답변 등록'}"></button>
            </div>
        </div>
        <div th:unless="${canAnswer}">
            <p th:if="${answer == null}" class="empty">아직 답변이 등록되지 않았습니다.</p>
            <div th:if="${answer != null}" class="board_write">
                <table class="board_write_table">
                    <colgroup><col style="width:220px;"><col></colgroup>
                    <tbody>
                    <tr><td class="label">답변일</td><td th:text="${answer.answerDate != null ? #temporals.format(answer.answerDate, 'yyyy-MM-dd HH:mm') : ''}"></td></tr>
                    <tr><td class="label">내용</td><td style="white-space:pre-wrap;" th:text="${answer.answer}"></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
