<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객센터 자료실 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>고객센터 자료실 관리</h3>
    <p><a class="btn" th:href="@{/admin/data-board/new}">+ 자료 등록</a></p>

    <table class="board_list_table">
        <thead>
        <tr><th>제목</th><th>공지</th><th>등록자</th><th>조회수</th><th>등록일</th><th>사용여부</th></tr>
        </thead>
        <tbody>
        <tr th:each="b : ${boards}">
            <td><a th:href="@{'/admin/data-board/' + ${b.dataId} + '/edit'}" th:text="${b.subject}"></a></td>
            <td th:text="${b.noticeFlag == 'Y' ? '공지' : ''}"></td>
            <td th:text="${b.userName}"></td>
            <td th:text="${b.hits}"></td>
            <td th:text="${b.createdDate != null and #strings.length(b.createdDate) >= 8}
                          ? ${#strings.substring(b.createdDate,0,4) + '-' + #strings.substring(b.createdDate,4,6) + '-' + #strings.substring(b.createdDate,6,8)}
                          : ''"></td>
            <td th:text="${b.useYn == 'Y' ? '사용' : '중지'}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(boards)}">등록된 자료가 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
