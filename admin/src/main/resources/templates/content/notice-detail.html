<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${notice.subject} + ' - 공지사항 - 고향사랑e음 (admin service)'">공지사항 보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/default_ali.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-status.css}">
    <link rel="stylesheet" th:href="@{/css/data_v.css}">
    <link rel="stylesheet" th:href="@{/css/ct_nov.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<!-- AS-IS notice/detail.html 재현. -->
<section>
    <div class="page-title-box">
        <span class="ali_breadcrumb">
            <a th:href="@{'http://localhost:8081/'}"><img class="icon-img" th:src="@{/images/icon/cli-icon_home.png}" alt="홈으로"></a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            고객센터
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            <a th:href="@{/notices}">공지사항</a>
            <span class="txt-arrow"><span class="sr-only">&gt;</span></span>
            공지사항 보기
        </span>
        <h2 class="page-title-txt">공지사항 보기</h2>
    </div>
</section>

<div th:replace="~{fragments/customer-lnb :: customer-lnb('notices')}"></div>

<div class="contents-wrap" id="contents">
    <div class="center">
        <div class="s-contents list-page-wrapper">
            <div class="list-page-area">
                <div class="list-page-body notice">
                    <div class="page-title" th:text="${notice.subject}"></div>
                    <div class="page-info">
                        <div class="page-info-list">
                            <div class="date-created" th:text="'등록일  ' + ${displayDate}"></div>
                            <div class="views" th:text="'조회 ' + ${displayHits}"></div>
                        </div>
                    </div>
                    <div class="page-contents" th:utext="${notice.content}"></div>
                </div>
            </div>
            <div class="btn-box">
                <button type="button" class="blueBtn u-confirm" onclick="location.href=this.dataset.url" th:attr="data-url=@{/notices}">
                    목록<span><img th:src="@{/images/icon/cli-icon_btn-hover-arrow.png}" alt=""></span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
