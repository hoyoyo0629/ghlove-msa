<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/new.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>공지사항 관리</h1>
    <p><a class="btn" th:href="@{/admin/notices/new}">+ 공지 등록</a></p>

    <div class="category-nav">
        <a th:href="@{/admin/notices}" th:classappend="${selectedCategory == null} ? 'active'">전체</a>
        <a th:each="c : ${categoryLabels}" th:href="@{/admin/notices(category=${c.key})}"
           th:classappend="${selectedCategory == c.key} ? 'active'" th:text="${c.value}"></a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>분류</th>
            <th>지자체</th>
            <th>제목</th>
            <th>등록일</th>
            <th>조회수</th>
            <th>상태</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="n : ${notices}">
            <td th:text="${n.noticeId}"></td>
            <td th:text="${categoryLabels.get(n.categoryCode)} ?: ${n.categoryCode}"></td>
            <td th:text="${n.locgovCode != null} ? (${locgovNames.get(n.locgovCode)} ?: ${n.locgovCode}) : '전체'"></td>
            <td><a th:href="@{'/notices/' + ${n.noticeId}}" th:text="${n.subject}"></a></td>
            <td th:text="${n.createdDate}"></td>
            <td th:text="${n.hits} ?: 0"></td>
            <td>
                <span class="pill" th:classappend="${n.useYn == 'Y'} ? 'on' : 'off'"
                      th:text="${n.useYn == 'Y'} ? '게시중' : '중지'"></span>
            </td>
            <td>
                <a class="small-btn" th:href="@{'/admin/notices/' + ${n.noticeId} + '/edit'}">수정</a>
                <form th:action="@{'/admin/notices/' + ${n.noticeId} + '/toggle'}" method="post" class="inline-form">
                    <button type="submit" class="small-btn ghost" th:text="${n.useYn == 'Y'} ? '중지' : '게시'"></button>
                </form>
                <form th:action="@{'/admin/notices/' + ${n.noticeId} + '/delete'}" method="post" class="inline-form"
                      onsubmit="return confirm('삭제하시겠습니까?')">
                    <button type="submit" class="small-btn ghost">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(notices)}">등록된 공지사항이 없습니다.</p>
</div>
<div th:replace="~{fragments/floating-buttons :: floating-buttons}"></div>
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
