<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공통코드 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>공통코드 관리</h1>
    <!-- 각 서비스(member/donation/point/gift/order)는 자체 DB에 공통코드 사본을
         갖고 있어 여기서 직접 수정할 수 없습니다. 이 화면은 admin 서비스 자체가
         쓰는 코드유형(공지 카테고리, 팝업 유형, 정산 상태 등)을 관리합니다. -->

    <div class="card-grid">
        <a class="card" th:each="entry : ${codeTypeCounts}" th:href="@{'/codes/' + ${entry.key}}">
            <div class="type" th:text="${entry.key}"></div>
            <div class="count" th:text="${entry.value} + '개 코드'"></div>
        </a>
    </div>
    <p class="empty" th:if="${#maps.isEmpty(codeTypeCounts)}">등록된 코드유형이 없습니다.</p>
</div>
</body>
</html>
