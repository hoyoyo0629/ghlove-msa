<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap narrow">
    <h1>코드 수정<span class="badge">admin</span></h1>

    <form th:action="@{'/codes/' + ${code.codeType} + '/' + ${code.id}}" method="post">
        <div class="field">
            <label>코드유형</label>
            <input type="text" th:value="${code.codeType}" disabled>
        </div>
        <div class="field">
            <label>코드 ID</label>
            <input type="text" th:value="${code.id}" disabled>
        </div>
        <div class="field">
            <label for="label">라벨</label>
            <input type="text" id="label" name="label" th:value="${code.label}" required>
        </div>
        <div class="field">
            <label for="detail">설명 (선택)</label>
            <textarea id="detail" name="detail" rows="2" th:text="${code.detail}"></textarea>
        </div>
        <div class="field">
            <label for="ordering">정렬순서 (선택)</label>
            <input type="number" id="ordering" name="ordering" step="1" th:value="${code.ordering}">
        </div>
        <button type="submit" class="btn full">저장</button>
    </form>

    <div class="links">
        <a th:href="@{'/codes/' + ${code.codeType}}">목록으로</a>
    </div>
</div>
</body>
</html>
