<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 등록 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap narrow">
    <h1>코드 등록<span class="badge">admin</span></h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/codes}" method="post">
        <div class="field">
            <label for="codeType">코드유형</label>
            <input type="text" id="codeType" name="codeType" th:value="${codeType}" required placeholder="예: NOTICE_CATEGORY">
        </div>
        <div class="field">
            <label for="id">코드 ID</label>
            <input type="text" id="id" name="id" required placeholder="예: GENERAL">
        </div>
        <div class="field">
            <label for="label">라벨</label>
            <input type="text" id="label" name="label" required placeholder="예: 공지">
        </div>
        <div class="field">
            <label for="detail">설명 (선택)</label>
            <textarea id="detail" name="detail" rows="2"></textarea>
        </div>
        <div class="field">
            <label for="ordering">정렬순서 (선택)</label>
            <input type="number" id="ordering" name="ordering" step="1">
        </div>
        <button type="submit" class="btn full">등록</button>
    </form>

    <div class="links">
        <a th:href="@{/codes}">목록으로</a>
    </div>
</div>
</body>
</html>
