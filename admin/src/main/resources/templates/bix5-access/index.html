<!DOCTYPE html>
<!--/* AS-IS '기부현황 대시보드'(opmanager menu, menu_url=/opmanager/bix5-access)는 서버 핸들러가
       전혀 없어 클릭 시 404 → ghlove-web public/error/404.html 로 떨어진다. 즉 AS-IS에서 이 기능은
       "메뉴는 있으나 눌러보면 페이지 오류"인 상태다. [[as-is-parity-includes-disabled-state]] 원칙대로
       TO-BE도 메뉴만 노출하고, 클릭하면 AS-IS와 동일한 404 페이지를 404 상태로 보여준다(verbatim 복사:
       ghlove-web/src/main/resources/public/error/404.html). img만 TO-BE 정적경로(/images)로 조정. */-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <META http-equiv="Expires" content="-1">
	<META http-equiv="Pragma" content="no-cache">
	<META http-equiv="Cache-Control" content="No-Cache">
    <title>페이지 오류</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            word-break: keep-all;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        .error404 {
            background-color: #f5f5f5;
            min-height: 100%;
            text-align: center;
            line-height: 1em;
        }

        .center {
            max-width: 1280px;
            margin: 0 auto;
            min-width: 360px;
        }

        .page-title-box {
            padding-top: 80px;
            text-align: center;
            position: relative;
            margin-bottom: 60px;
        }

        .page-title-box .page-title-txt {
            font-size: 50px;
            color: #00215A;
            margin-top: 16px;
            margin-bottom: 32px;
            line-height: 1.1em;
        }

        .error404 img {
            max-width: 100%;
        }

        .error404 #sub_contents {
            max-width: 700px;
        }

        .error404 #sub_contents .error_inner {
            background-color: #fff;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.16);
            padding: 60px;
        }

        .error404 #sub_contents .error_inner p {
            margin-bottom: 60px;
        }

        .page-title-box p {
            color: #878787;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5em;
        }

        @media screen and (max-width:768px) {
            .error404 {
                background-color: #fff;
            }

            .page-title-box {
                margin-bottom:16px;
                padding-top: 130px;
            }

            .page-title-box .page-title-txt {
                margin: 0 auto;
                width: 80%;
                font-size: 40px;

            }

            .error404 #sub_contents .error_inner {
                box-shadow: none;
                padding:0 20px;
            }
        }
    </style>
</head>

<body class="error404">
    <div class="center">
        <div class="page-title-box">
            <h2 class="page-title-txt">페이지가 존재하지 않습니다.</h2>
        </div>
        <div id="sub_contents" class="center">
            <div class="page-title-box error_inner">
                <p>죄송합니다만 지정하신페이지는 찾을수 없습니다.<br>이미 삭제되었던지,주소가 잘못되었을 가능성이 있습니다. </p>
                <img src="/images/error404.png" alt="페이지에러">
            </div>
        </div>
        <!--// sub_contents  E-->
    </div>
</body>

</html>
