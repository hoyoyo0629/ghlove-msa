<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 사용내역 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="contents contents_inner">
    <h3>포인트 사용내역</h3>
    <p style="color:#666; margin-bottom:12px;">
        전체 지자체의 포인트 발생(EARN/RESTORE)·사용(USE/REVERSE)·소멸(EXPIRE) 트랜잭션 로그입니다.
        최근 500건까지 표시합니다. (기부 건별 발생-사용-잔액은 <a th:href="@{/give-point}">기부포인트현황</a> 참고)
    </p>

    <form method="get" th:action="@{/point-history}" class="field" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <input type="number" name="userId" th:value="${userId}" placeholder="회원ID" style="width:100px;">
        <select name="locgovCode">
            <option value="">전체 지자체</option>
            <option th:each="l : ${locgovs}" th:value="${l.locgovCode()}" th:text="${l.locgovNm()}" th:selected="${l.locgovCode() == locgovCode}"></option>
        </select>
        <select name="txnType">
            <option value="">전체 유형</option>
            <option value="EARN" th:selected="${txnType == 'EARN'}">적립(EARN)</option>
            <option value="USE" th:selected="${txnType == 'USE'}">사용(USE)</option>
            <option value="REVERSE" th:selected="${txnType == 'REVERSE'}">사용취소(REVERSE)</option>
            <option value="RESTORE" th:selected="${txnType == 'RESTORE'}">복원(RESTORE)</option>
            <option value="EXPIRE" th:selected="${txnType == 'EXPIRE'}">소멸(EXPIRE)</option>
        </select>
        <input type="date" name="fromDate" th:value="${fromDate}">
        ~
        <input type="date" name="toDate" th:value="${toDate}">
        <button type="submit" class="btn">조회</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr><th>ID</th><th>회원</th><th>지자체</th><th>유형</th><th>포인트</th><th>잔여</th><th>사유</th><th>참조키</th><th>일시</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.ledgerId()}"></td>
            <td th:text="${nameByUserId.get(r.userId())} + ' (#' + ${r.userId()} + ')'"></td>
            <td th:text="${r.locgovCode()}"></td>
            <td th:text="${r.txnType()}"></td>
            <td th:text="${#numbers.formatInteger(r.pointAmount(), 0, 'COMMA')} + 'P'"
                th:style="${r.pointAmount() != null and r.pointAmount() < 0 ? 'color:#c0392b;' : 'color:#1a6b3c;'}"></td>
            <td th:text="${r.remainingAmount() != null ? (#numbers.formatInteger(r.remainingAmount(), 0, 'COMMA') + 'P') : '-'}"></td>
            <td th:text="${r.reason()}"></td>
            <td th:text="${r.refKey()}"></td>
            <td th:text="${r.createdDate()}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">해당 조건의 이력이 없습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
