<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>연계 로그 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <h3>연계 로그 관리 (국세청 부과·수납)</h3>
    <p style="color:#666; margin-bottom:12px;">세외수입 부과(電子기부금영수증) 및 국세청 등록 연계 이력입니다.</p>

    <!--/* AS-IS는 성공·실패 구분 없이 flash 메시지 하나만 쓴다(my-cert.html 주석 참고). */-->
    <p class="message" th:if="${redirectMessage}" th:text="${redirectMessage}" style="color:#1a6b3c; margin-bottom:12px;"></p>

    <form th:action="@{/log/levy/backfill}" method="post" style="margin-bottom:16px;"
          onsubmit="return confirm('완료된 기부 건 중 연계 이력이 없는 건을 채웁니다. 실행하시겠습니까?')">
        <button type="submit" class="btn">이력 백필 실행</button>
    </form>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>기부일련번호</th><th>부과번호</th><th>부과일시</th>
            <th>수납여부</th><th>수납일시</th>
            <th>국세청 상태</th><th>국세청 접수번호</th><th>국세청 등록일시</th><th>오류메시지</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${logs}">
            <td th:text="${l.cntrSn()}"></td>
            <td th:text="${l.bugaNo()}"></td>
            <td th:text="${l.bugaDate()}"></td>
            <td th:text="${l.sunapYn()} == 'Y' ? '수납완료' : '미수납'"></td>
            <td th:text="${l.sunapDate()}"></td>
            <td th:text="${l.ntsStatus()}"></td>
            <td th:text="${l.ntsReceiptNo()}"></td>
            <td th:text="${l.ntsRegisteredDate()}"></td>
            <td th:text="${l.ntsErrorMessage()}" style="color:#c0392b;"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(logs)}">연계 로그가 존재하지 않습니다.</p>

    <h4 style="margin-top:32px;">시도 이력 (성공/실패 전체)</h4>
    <p style="color:#666; margin-bottom:12px;">부과·수납·국세청 등록 각 호출마다 남는 감사 이력입니다. 재시도로 여러 행이 쌓일 수 있습니다.</p>
    <table class="board_list_table">
        <thead>
        <tr><th>ID</th><th>기부일련번호</th><th>지자체코드</th><th>연계 유형</th><th>결과</th><th>일시</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${relayLogs}">
            <td th:text="${r.relayLogId()}"></td>
            <td th:text="${r.cntrSn()}"></td>
            <td th:text="${r.cntrLocgovCode()}"></td>
            <td th:text="${r.relayType() == 'BUGA' ? '세외수입 부과' : (r.relayType() == 'SUNAP' ? '세외수입 수납확인' : '국세청 전자기부금영수증 등록')}"></td>
            <td th:text="${r.relayResultCode() == 'SUCCESS' ? '성공' : '실패'}"
                th:style="${r.relayResultCode() == 'SUCCESS' ? 'color:#1a6b3c;' : 'color:#c0392b;'}"></td>
            <td th:text="${@opDate.ymdHms(r.frstRegistPnttm())}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(relayLogs)}">시도 이력이 존재하지 않습니다.</p>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
