<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 메뉴사용이력 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>관리자 메뉴사용이력</h1>
    <p style="color:#666; margin-bottom:12px;">
        조회(GET)는 제외하고 등록·수정·삭제 등 상태변경 요청만 기록합니다. 최근 200건까지 표시합니다.
    </p>
    <p th:if="${loginId}">
        <strong th:text="${loginId}"></strong> 님의 이력만 표시 중 - <a th:href="@{/log/manager-action}">전체 보기</a>
    </p>

    <table>
        <thead>
        <tr><th>ID</th><th>아이디</th><th>메서드</th><th>요청 URI</th><th>IP</th><th>일시</th></tr>
        </thead>
        <tbody>
        <tr th:each="l : ${logs}">
            <td th:text="${l.actionLogId}"></td>
            <td th:text="${l.loginId}"></td>
            <td th:text="${l.requestMethod}"></td>
            <td th:text="${l.requestUri}"></td>
            <td th:text="${l.remoteAddr}"></td>
            <td th:text="${l.createdDate}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(logs)}">액션 이력이 존재하지 않습니다.</p>
</div>
</body>
</html>
