<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>엑셀다운로드 로그 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<!-- AS-IS opmanager/log의 exceldownload-log 재현. 관리자가 회원/주문/통계 등에서 엑셀(CSV)을
     다운로드할 때마다 사유를 입력하고 그 이력을 남기는 개인정보 접근·이용 감사로그다. 실제
     다운로드는 각 도메인을 소유한 서비스에서 일어나므로("출처" 열 참고) 이 화면은 그 이력을
     한데 모아 조회만 한다(ExcelDownloadLogAdminController 참고). -->
<div class="contents contents_inner">
    <h3>엑셀다운로드 로그</h3>
    <p style="color:#666; margin-bottom:12px;">관리자가 개인정보가 포함된 엑셀(CSV)을 다운로드할 때마다 입력한 사유와 이력입니다.</p>

    <table class="board_list_table">
        <thead>
        <tr>
            <th>출처</th><th>담당자ID</th><th>담당자명</th><th>다운로드 사유</th>
            <th>검색조건</th><th>다운로드 건수</th><th>일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.source()}"></td>
            <td th:text="${r.managerId()}"></td>
            <td th:text="${r.managerName()}"></td>
            <td th:text="${r.downloadReason()}"></td>
            <td th:text="${r.searchCondition()}"></td>
            <td th:text="${r.rowCount()}"></td>
            <td th:text="${r.createdDate()}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">엑셀다운로드 이력이 존재하지 않습니다.</p>
</div>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
