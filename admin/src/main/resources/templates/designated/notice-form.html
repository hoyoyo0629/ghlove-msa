<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>공지사항입력 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
</head>
<!-- AS-IS opmanager/designated-donation/notice/form.jsp 이식(2026-10-08 실화면 대조).
     AS-IS는 /notice/form/{prjId}/{noticeId} 이고 noticeId 가 0이면 신규등록이다.

     AS-IS 실화면에서 확인한 것들 - 임의로 바꾸지 말 것:
       · 화면 제목은 "공지사항입력"이다("{사업명} 공지사항"이 아니다)
       · 첫 행은 `*제목` ‖ `*공개 여부`(공개/비공개 라디오) 두 쌍이다
       · "파일 첨부" 섹션(h3) - 안내문구 2줄이 빨간색이고 multiple 이다
       · "내용" 섹션(h3) - 에디터
       · 에디터 아래에 시각장애인용 "이미지 설명" 표(순번/이미지 설명/삭제) + [+ 추가]
       · 버튼은 오른쪽 정렬 [등록|수정] [목록] -->
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumbTail('공지사항입력')}"></div>

    <h3 class="custom">공지사항입력</h3>

    <form id="noticeForm" method="post" enctype="multipart/form-data"
          th:action="${notice != null}
                     ? @{/designated-projects/{id}/notices/{nid}/update(id=${projectId},nid=${notice.prjNoticeId})}
                     : @{/designated-projects/{id}/notices(id=${projectId})}"></form>

    <div class="item_info_wrap">
    <div class="item_list">
    <div class="board_write">
        <table class="board_write_table" summary="공지사항 입력">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: auto;" />
                <col style="width: 120px" />
                <col style="width: auto;" />
            </colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td>
                    <div class="flex_box gap-12 item-center">
                        <input type="text" id="subject" name="subject" class="input_txt required _filter wd-500"
                               required maxlength="100" title="제목" form="noticeForm"
                               th:value="${notice != null} ? ${notice.prjNoticeSubject} : ''">
                    </div>
                </td>
                <td class="label"><span class="required_mark">*</span>공개 여부</td>
                <td>
                    <div class="flex_box gap-12 item-center">
                        <div class="input-form"><span class="radio">
                            <input type="radio" id="rls_y" name="rlsYn" value="Y" form="noticeForm"
                                   th:checked="${notice == null or notice.rlsYn != 'N'}"/>
                            <label for="rls_y">공개</label></span></div>
                        <div class="input-form"><span class="radio">
                            <input type="radio" id="rls_n" name="rlsYn" value="N" form="noticeForm"
                                   th:checked="${notice != null and notice.rlsYn == 'N'}"/>
                            <label for="rls_n">비공개</label></span></div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </div>

    <div class="item_list mt70">
        <h3><span>파일 첨부</span></h3>
        <div class="board_write">
            <table class="board_write_table item_image_info">
                <colgroup><col style="width: 220px;"><col></colgroup>
                <tbody>
                <tr>
                    <td class="label"><p>첨부파일</p></td>
                    <td>
                        <div class="flex_box item-center" style="display: block;">
                            <!-- AS-IS 안내문구 그대로(확장자 목록 포함) -->
                            <p class="text-info text-sm" style="margin-bottom: 10px;">
                                * 여러 개의 파일을 드래그하거나 선택한 후 한 번에 등록할 수 있습니다.<br />
                                * 첨부가능 확장자 : jpg, jpeg, gif, bmp, png, doc, docx, xls, xlsx, ppt, pptx, pdf, tif, tiff, hwp, hwpx, zip<br />
                            </p>
                            <input type="file" id="files" name="files" multiple="multiple"
                                   class="full input_file" form="noticeForm">
                        </div>
                        <!-- 이미 올라간 첨부: 원본 파일명 + x 삭제(AS-IS deletePrjNoticeFile) -->
                        <div th:if="${noticeFiles != null and !#lists.isEmpty(noticeFiles)}">
                            <div th:each="f : ${noticeFiles}" th:id="'file_' + ${f.fileSeq}">
                                <span th:text="${f.orgnflNm}"></span>
                                <!-- 삭제는 저장과 별개로 즉시 반영된다(AS-IS도 ajax로 바로 지운다).
                                     noticeForm 안에 두면 공지 저장과 섞이므로 전용 폼을 쓴다. -->
                                <form method="post" style="display:inline;"
                                      th:action="@{/designated-projects/{id}/notices/{nid}/files/{seq}/delete(id=${projectId},nid=${notice.prjNoticeId},seq=${f.fileSeq})}"
                                      onsubmit="return confirm('첨부파일을 삭제하시겠습니까?');">
                                    <button type="submit"
                                            style="background:none; border:0; padding:0; cursor:pointer; margin-left:10px;">
                                        <img th:src="@{/content/opmanager/images/icon/icon_x.gif}" alt="삭제"
                                             style="width:15px;height:15px;">
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="item_list mt70">
        <h3><span>내용</span></h3>
        <textarea id="content" name="content" cols="30" rows="20" class="editor-content"
                  style="width:99%;" title="내용" form="noticeForm"
                  th:text="${notice != null} ? ${notice.prjNoticeCn} : ''"></textarea>

        <!-- AS-IS: 에디터 아래 시각장애인용 이미지 설명 표 -->
        <div class="item-option-table2">
            <div>
                <p class="text-info text-sm">* 시각 장애인을 위한 이미지 설명을 입력하여 주시길 부탁드립니다. *</p>
                <table class="inner-table tbl-option active" id="imgExplnTable">
                    <colgroup>
                        <col style="width: 100px;"/>
                        <col/>
                        <col style="width: 50px;"/>
                    </colgroup>
                    <thead>
                    <tr>
                        <th style="text-align:center;">순번</th>
                        <th style="text-align:center;">이미지 설명</th>
                        <th>삭제</th>
                    </tr>
                    </thead>
                    <tbody id="imgExplnBody">
                    <tr th:each="e, i : ${imgExplns}">
                        <td><input type="text" class="img-seq" th:value="${i.count}" readonly form="noticeForm"></td>
                        <td><textarea name="imgExplns" form="noticeForm" th:text="${e}"></textarea></td>
                        <td><a href="javascript:;" class="btn btn-dark-gray btn-sm" onclick="removeImgExpln(this)">삭제</a></td>
                    </tr>
                    </tbody>
                </table>
                <div class="item-options-info">
                    <div class="btn_all btn_right">
                        <div class="flex_box">
                            <button type="button" class="btn btn-gradient btn-sm add-item-option2"
                                    onclick="addImgExpln()"><span>+ 추가</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div><!-- /.item_info_wrap -->

    <div id="buttons" class="btn_all btn_right">
        <div class="flex_box gap-08">
            <button type="submit" form="noticeForm" class="btn btn-dark-gray btn-mini"
                    th:text="${notice != null} ? '수정' : '등록'">등록</button>
            <button type="button" class="btn btn-default"
                    th:attr="onclick=|location.href='@{/designated-projects/{id}/notices(id=${projectId})}'|">목록</button>
        </div>
    </div>

    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<!-- AS-IS form.jsp 끝의 <module:smarteditorInit/> + <module:smarteditor id="prjNoticeCn"/> 대응.
     TO-BE는 커뮤니티 폼들이 쓰는 조각이 이미 있다(fragments/smarteditor). -->
<div th:replace="~{fragments/smarteditor :: init}"></div>
<div th:replace="~{fragments/smarteditor :: editor('content')}"></div>

<script th:inline="none">
/* AS-IS 이미지 설명표의 [+ 추가] / [삭제]. 순번은 항상 1부터 다시 매긴다(AS-IS도 readonly). */
function addImgExpln() {
	var tbody = document.getElementById('imgExplnBody');
	var tr = document.createElement('tr');
	tr.innerHTML = '<td><input type="text" class="img-seq" readonly form="noticeForm"></td>'
		+ '<td><textarea name="imgExplns" form="noticeForm"></textarea></td>'
		+ '<td><a href="javascript:;" class="btn btn-dark-gray btn-sm" onclick="removeImgExpln(this)">삭제</a></td>';
	tbody.appendChild(tr);
	renumberImgExpln();
}

function removeImgExpln(el) {
	var tr = el.closest('tr');
	tr.parentNode.removeChild(tr);
	renumberImgExpln();
}

function renumberImgExpln() {
	var rows = document.getElementById('imgExplnBody').getElementsByTagName('tr');
	for (var i = 0; i < rows.length; i++) {
		var seq = rows[i].getElementsByClassName('img-seq')[0];
		if (seq) { seq.value = i + 1; }
	}
}

document.addEventListener('DOMContentLoaded', renumberImgExpln);

/* AS-IS notice/form.jsp 의 validator(submitHandler) 이식.
   TO-BE에는 제출 검증이 통째로 없어서, 상세설명에 사진을 넣고도 이미지 설명 없이
   등록이 됐다(2026-10-13 사용자 지적). 문구는 AS-IS 그대로다.
   ※ AS-IS가 주석처리해 둔 500KB 용량 검사는 켜지 않는다. */

/* AS-IS scrollButtons - 바닥 근처가 아니면 버튼 영역을 화면에 고정한다. */
function scrollButtons() {
	$(window).scroll(function () {
		var scrollBottom = $(document).height() - $(window).height() - $(window).scrollTop();
		if (scrollBottom < 170) {
			$('#buttons').removeClass('fixed_button');
		} else {
			$('#buttons').addClass('fixed_button');
		}
	});
}

/* 상세설명 에디터(iframe 안의 iframe)에 들어간 이미지들. 에디터가 아직 안 떴으면 빈 배열. */
function editorImages() {
	var outer = document.getElementById('editor_frame');
	if (!outer) {
		return [];
	}
	var outerDoc = outer.contentDocument || outer.contentWindow.document;
	var inner = outerDoc.querySelector("#smart_editor2_content iframe");
	if (!inner) {
		return [];
	}
	var innerDoc = inner.contentDocument || inner.contentWindow.document;
	return innerDoc.querySelectorAll("img");
}

$(function() {
	scrollButtons();

	$('#noticeForm').on('submit', function(e) {
		if (!validateNoticeForm()) {
			e.preventDefault();
			// op.common.js 가 모든 form 의 submit 에서 로딩막을 띄운다(1683행).
			// 여기서 막으면 그 막이 남아 화면을 덮으므로 반드시 내려 준다.
			Common.loading.hide();
			return false;
		}
	});
});

function validateNoticeForm() {
	if (!$('input[name=rlsYn]:checked').val()) {
		alert('공개여부 항목을 입력해주세요.');
		$('#rls_y').focus();
		return false;
	}

	// 첨부파일 갯수 제한
	var files = document.getElementById('files');
	if (files && files.files && files.files.length > 10) {
		alert('파일은 최대 10까지 등록할 수 있습니다.');
		$(files).focus();
		return false;
	}

	// AS-IS: 공백만 든 이미지 설명 줄은 저장 전에 걷어낸다(IMG_EXPLN 이 not null)
	$('#imgExplnBody tr').each(function() {
		var v = $(this).find('textarea').val();
		if (!v || v.trim() === '') {
			$(this).remove();
		}
	});
	renumberImgExpln();

	// AS-IS: 상세설명 이미지 개수와 이미지 설명 개수가 같아야 저장된다
	var rows = $('#imgExplnBody tr');
	var optionSize = rows.length;
	var images = editorImages();
	var imageSize = images.length;

	if (optionSize == 0 && imageSize > 0) {
		alert("시각 장애인을 위한 이미지 설명을 입력 부탁드립니다.");
		return false;
	}
	if (optionSize != imageSize) {
		alert('상세설명에 올리신 사진의 갯수와 \n이미지 설명의 갯수를 동일하게 맞추어 주셔야 합니다. \n현재 작성하신 이미지 설명 갯수: ' + optionSize + ' , 상세설명에 올리신 이미지 갯수: ' + imageSize + ' ');
		return false;
	}

	// 설명을 이미지 alt 로 넣는다(저장되는 본문에 들어간다)
	for (var i = 0; i < imageSize; i++) {
		images[i].setAttribute("alt", $(rows[i]).find('textarea').val());
	}

	// 에디터 내용을 textarea 로 옮긴다(alt 를 넣은 뒤여야 alt 가 같이 저장된다)
	Common.getEditorContent("content");

	var content = $('#content').val();
	if (!content || content.toLowerCase() == '<p>&nbsp;</p>') {
		alert("내용을 입력해 주세요.");
		return false;
	}
	return true;
}
</script>
<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
