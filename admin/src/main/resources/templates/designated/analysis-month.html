    <!-- op.common.js 전역 ajax beforeSend가 xhr.setRequestHeader(Common.getCsrfHeader(), Common.getCsrf())로
         CSRF 헤더를 붙인다. AS-IS opmanager 레이아웃은 이 두 meta(_csrf_header/_csrf)를 Spring Security에서
         채워 내려줬다. TO-BE admin은 Spring Security/CSRF가 없어 meta가 없으면 getCsrfHeader()가 ''를 반환→
         setRequestHeader('','')가 SyntaxError로 터져 모든 $.post가 발사 전 취소된다(차트 안 뜸·콘솔만 에러).
         admin은 CSRF 미사용이라 유효한 헤더명만 넣고 토큰은 빈 값으로 둔다(서버는 이 헤더를 무시). -->
    <meta name="_csrf_header" content="X-CSRF-TOKEN">
    <meta name="_csrf" content="">

<!-- op.common.js의 전역 ajax beforeSend가 로딩 스피너(Spinner, spin.min.js)를 쓰므로 반드시 먼저 로드.
     없으면 beforeSend에서 'Spinner is not defined'로 모든 $.post가 중단돼 차트가 안 뜬다(AS-IS 로드순서 동일). -->
<script type="text/javascript" th:src="@{/content/modules/chart.min.js}"></script>
<script type="text/javascript" th:src="@{/content/modules/op.chart.js}"></script>
<script th:inline="javascript">
/*<![CDATA[*/

    // 시도→시군구 캐스케이딩용 전체 지자체 목록(서버 재왕복 대신 로컬 필터 - 차트/집계 로직과 무관).
    var ALL_LOCGOVS = /*[[${allLocgovs}]]*/ [];

    let changeYn = "N";
    let locgovChart;
    let chartLoadingYn = true;

    $(function () {
        $("select[name='shWdr']").change(function() { changeYn = "Y"; });
        fnSearch();
    });

    // 지자체 변경(시도 선택 → 시군구 옵션 재구성). AS-IS는 ajax였으나 로컬 필터로 동일 동작.
    function wdrChange(value) {
        $("#shLocgovCode option").remove();
        if (value != "") {
            $('#shLocgovCode').append('<option value="">-전체-</option>');
            for (var i = 0; i < ALL_LOCGOVS.length; i++) {
                if (ALL_LOCGOVS[i].upperLocgovCode == value) {
                    $('#shLocgovCode').append('<option value="' + ALL_LOCGOVS[i].locgovCode + '">' + ALL_LOCGOVS[i].locgovNm + '</option>');
                }
            }
        } else {
            $('#shLocgovCode').append('<option value="">-시,군,구-</option>');
        }
    }

    function fnSearch() {
        designatedLocgovMonthCampaign();
        designatedLocgovMonthAmountRaised();
        designatedLocgovMonthAmount();
    }

    // 사업구분별 사업 진행건 비율
    function designatedLocgovMonthCampaign() {
        const labelArr = [];
        const dataArr = [];
        const backgroundColorArr = [];
        $.post('/designated-projects/analysis/month/campaign', {"shWdr" : $('#shWdr').val(),  "shLocgovCode" : $('#shLocgovCode').val(), "selYear" : $("#selYear").val(), "prjStatus" : $("input[name='prjStatus']:checked").val()}, function(response) {
            if (response.isSuccess) {
                let label = '';
                let prjBsns = '';
                let backgroundColor = '';
                label = '취약계층';
                prjBsns = response.data[0].prjBsns100;
                backgroundColor = 'rgb(255, 99, 132)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '문화/예술';
                prjBsns = response.data[0].prjBsns200;
                backgroundColor = 'rgb(54, 162, 235)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '자원봉사';
                prjBsns = response.data[0].prjBsns300;
                backgroundColor = 'rgb(255, 205, 86)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '복리증진';
                prjBsns = response.data[0].prjBsns400;
                backgroundColor = 'rgb(32, 169, 59)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                $('#tdCampaign1_1').text(response.data[0].columnTpDesc);
                $('#tdCampaign1_2').text(response.data[0].prjBsns100 + '%');
                $('#tdCampaign1_3').text(response.data[0].prjBsns200 + '%');
                $('#tdCampaign1_4').text(response.data[0].prjBsns300 + '%');
                $('#tdCampaign1_5').text(response.data[0].prjBsns400 + '%');
                $('#tdCampaign1_6').text(response.data[0].prjBsnsTot + '%');

                $('#tdCampaign2_1').text(response.data[1].columnTpDesc);
                $('#tdCampaign2_2').text(response.data[1].prjBsns100 + '건');
                $('#tdCampaign2_3').text(response.data[1].prjBsns200 + '건');
                $('#tdCampaign2_4').text(response.data[1].prjBsns300 + '건');
                $('#tdCampaign2_5').text(response.data[1].prjBsns400 + '건');
                $('#tdCampaign2_6').text(response.data[1].prjBsnsTot + '건');

                let p = $('#designatedLocgovMonthCampaignChart').parent('div');
                const ele = $('#designatedLocgovMonthCampaignChart').clone();
                p.empty();
                p.append(ele);
                const context = document.getElementById('designatedLocgovMonthCampaignChart').getContext('2d');
                const chartData = {
                      labels: labelArr,
                      datasets: [{
                        label: '',
                        data: dataArr,
                        backgroundColor: backgroundColorArr,
                        hoverOffset: 4
                      }]
                };

                try {
                    const c = new Chart(context, {
                        type : 'pie',
                        data : chartData
                    });
                } catch (e) {
                    $.log(e);
                    checkChartLib();
                }
            } else {
                alert(response.errorMessage);
            }
        });
    }

    function designatedLocgovMonthAmountRaised() {
        const labelArr = [];
        const dataArr = [];
        const backgroundColorArr = [];
        $.post('/designated-projects/analysis/month/amountraised', {"shWdr" : $('#shWdr').val(),  "shLocgovCode" : $('#shLocgovCode').val(), "selYear" : $("#selYear").val(), "prjStatus" : $("input[name='prjStatus']:checked").val()}, function(response) {
            if (response.isSuccess) {
                let label = '';
                let prjBsns = '';
                let backgroundColor = '';

                label = '취약계층';
                prjBsns = response.data[0].prjBsns100;
                backgroundColor = 'rgb(255, 99, 132)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '문화/예술';
                prjBsns = response.data[0].prjBsns200;
                backgroundColor = 'rgb(54, 162, 235)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '자원봉사';
                prjBsns = response.data[0].prjBsns300;
                backgroundColor = 'rgb(255, 205, 86)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

                label = '복리증진';
                prjBsns = response.data[0].prjBsns400;
                backgroundColor = 'rgb(32, 169, 59)';
                labelArr.push(label);
                dataArr.push(prjBsns);
                backgroundColorArr.push(backgroundColor);

    function addChartData(chart, label, data) {
        let length = data.length;
        for (let i = 0 ; i < length ; i++) {
            chart.data.datasets.push(data[i]);
        }
        chart.update();
    }

    function removeChartData(chart) {
        let length = chart.data.datasets.length;
        for (let i = 0 ; i < length ; i++) {
            chart.data.datasets.pop();
        }
        chart.update();
    }
