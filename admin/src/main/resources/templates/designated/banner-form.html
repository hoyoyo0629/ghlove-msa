<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>지정기부 대표배너 등록/수정 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <div class="location"><a th:href="@{/designated-projects/banners}">대표배너 관리</a></div>
    <h3><span th:text="${banner != null} ? '배너 수정' : '배너 등록'"></span></h3>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c0392b; margin-bottom:12px;"></p>

    <div class="board_write">
        <table class="board_write_table" summary="대표배너 등록/수정">
            <colgroup><col style="width:220px;"><col></colgroup>
            <tbody>
            <tr>
                <td class="label"><span class="required_mark">*</span>제목</td>
                <td><input type="text" id="title" name="title" required maxlength="255"
                           th:value="${banner != null} ? ${banner.title} : ''" form="bannerForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark">*</span>노출순서 (1~15)</td>
                <td><input type="number" id="displayOrder" name="displayOrder" required min="1" max="15"
                           th:value="${banner != null} ? ${banner.displayOrder} : ''" form="bannerForm"></td>
            </tr>
            <tr>
                <td class="label">링크 URL</td>
                <td><input type="text" id="linkUrl" name="linkUrl" th:value="${banner != null} ? ${banner.linkUrl} : ''" form="bannerForm"></td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark" th:if="${banner == null}">*</span>PC 이미지 (1280x400)</td>
                <td>
                    <input type="file" id="pcImage" name="pcImage" accept="image/*" th:required="${banner == null}" form="bannerForm">
                    <!-- AS-IS /banner/delete - 배너가 아니라 이 이미지만 비운다(deleteFlag=pc) -->
                    <div th:if="${banner != null and banner.fileNamePc != null and !banner.fileNamePc.isEmpty()}" style="margin-top:8px;">
                        <img th:src="@{${banner.fileNamePc}}" style="max-width:300px;" alt="PC 이미지">
                        <a th:href="|javascript:deleteImage(${banner.reprstBannerId}, 'pc');|" style="margin-left:6px;">
                            <img src="/content/images/btn/file_close.gif" alt="이미지 삭제"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label"><span class="required_mark" th:if="${banner == null}">*</span>모바일 이미지 (768x280)</td>
                <td>
                    <input type="file" id="mobileImage" name="mobileImage" accept="image/*" th:required="${banner == null}" form="bannerForm">
                    <div th:if="${banner != null and banner.fileNameMobile != null and !banner.fileNameMobile.isEmpty()}" style="margin-top:8px;">
                        <img th:src="@{${banner.fileNameMobile}}" style="max-width:200px;" alt="모바일 이미지">
                        <a th:href="|javascript:deleteImage(${banner.reprstBannerId}, 'mobile');|" style="margin-left:6px;">
                            <img src="/content/images/btn/file_close.gif" alt="이미지 삭제"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">배너 내용 (선택, HTML)</td>
                <td><textarea id="bannerContent" name="bannerContent" rows="4" form="bannerForm"
                              th:text="${banner != null} ? ${banner.bannerContent} : ''"></textarea></td>
            </tr>
            </tbody>
        </table>
    </div>
    <form id="bannerForm" th:action="${banner != null} ? @{/designated-projects/banners/{id}(id=${banner.reprstBannerId})} : @{/designated-projects/banners}"
          method="post" enctype="multipart/form-data"></form>
    <div class="btn_all btn_center">
        <button type="submit" form="bannerForm" class="btn btn-dark-gray btn-small">저장</button>
    </div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript">
/* AS-IS /banner/delete - 이름은 삭제지만 배너 행이 아니라 이미지 파일명만 비운다. */
function deleteImage(id, deleteFlag) {
	if (!confirm("이미지를 삭제하시겠습니까?")) {
		return;
	}
	$.post('/designated-projects/banners/delete',
			{'representativeBannerId': id, 'deleteFlag': deleteFlag},
			function(response) {
		Common.responseHandler(response, function() {
			alert("삭제 되었습니다.");
			location.reload();
		});
	});
}
</script>
</body>
</html>
