<!-- AS-IS opmanager/i18n/designated-donation/list.jsp 이식(메뉴 17101 특정사업 기부 목록).

     AS-IS verbatim:
     - h3가 "특정사업에 기부하기 목록"이다.
     - 검색조건 6종: 지자체(광역+시군구, <b>ROLE_ADMIN_1~4에게만 보인다</b>) / 사업구분 /
       기간(날짜버튼 오늘·1주일·한달·3개월·1년) / 사업명 / 상태(전체·진행·종료·대기) / 공개여부.
     - 검색표 아래에 요약표(tbl-summary) 4칸: 총 목표금액 / 총 모금액 / 총 모금 달성율 / 총 기부건수.
     - 출력수 select가 <b>10/50/100/200/500</b>이다(다른 화면과 다르다).
     - 컬럼 16개: 체크박스/ID/[지자체명]/모금상태/사업구분/사업명(이미지+링크)/기부건수/시작일/
       종료일/목표금액/모금액/달성율/공개여부/사업부서/공지사항/승인이력/미리보기.
     - 하단 왼쪽 일괄처리 4종: 진행(승인처리)[ROLE_ADMIN_1~5만]/종료/공개/비공개.
       오른쪽: 엑셀. (신규등록은 AS-IS 실화면에 안 나와 숨겼다 - 아래 버튼 영역 주석 참고)
     - 빈 목록 문구는 M00473("데이터가 없습니다.")이고 표 밖 .no_content 다.

     ★ 모금상태는 저장값이 아니라 <b>다시 계산된</b> 값이다 - 진행이어도 목표금액을 넘었거나
       종료일이 지났으면 종료로 보여준다(donation DesignatedAdminService.search 주석).
     ★ AS-IS 결함 보정: 사업명 입력칸이 query로 전송되는데 목록 SQL은 searchKeyword를 봐서
       AS-IS에서는 사업명 검색이 전혀 걸리지 않는다 - TO-BE는 걸리게 했다.
     ★ 아직 없는 것(원장의 다음 단계): 엑셀 다운로드, 미리보기. 버튼은 AS-IS 자리에 두되
       미구현 안내를 띄운다(없는 화면으로 보내 404를 만드는 것보다 낫다).
       승인이력 팝업과 공지사항 화면은 2026-10-08에 이식 완료. -->

<script type="text/javascript" th:inline="javascript">
var allLocgovs = /*[[${allLocgovs}]]*/ [];
var selectedLocgovCode = /*[[${searchParam.locgovCode}]]*/ null;
var selectedUpperLocgovCode = /*[[${searchParam.upperLocgovCode}]]*/ null;

$(function() {
	Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="prjStDt"]' , 'input[name="prjEdDt"]');
	EventHandler.calendarStartDateAndEndDateVaild();

	if (selectedUpperLocgovCode) {
		wdrChange(selectedUpperLocgovCode);
	}

	$('#itemsPerPage').on('change', function() {
		$('#page').val('1');
		$('#designatedSearchParam').submit();
	});

	$('#check_all').on('click', function() {
		$("#listForm input[name='id']").prop('checked', $(this).is(':checked'));
	});
});

/* AS-IS wdrChange - 광역을 고르면 그 하위 시군구만 남긴다. */
function wdrChange(upperLocgovCode) {
	var $locgov = $('#locgovCode');
	$locgov.find('option').not(':first-child').remove();
	if (!upperLocgovCode) {
		return;
	}
	for (var i = 0; i < allLocgovs.length; i++) {
		var l = allLocgovs[i];
		if (l.upperLocgovCode === upperLocgovCode) {
			$locgov.append($('<option></option>').attr('value', l.locgovCode).text(l.locgovNm));
		}
	}
	if (selectedLocgovCode) {
		$locgov.val(selectedLocgovCode);
	}
}

/* AS-IS checkDate - 시작일이 종료일보다 늦으면 막는다. */
function checkDate() {
	var strStartDate = $('#prjStDt').val();
	var strEndDate = $('#prjEdDt').val();
	if (strStartDate && strStartDate.length == 8 && strEndDate && strEndDate.length == 8) {
		if (strStartDate > strEndDate) {
			alert("종료일이 시작일보다 빠릅니다.");
			return false;
		}
	}
	$('#page').val('1');
	$('#designatedSearchParam').submit();
}

/* AS-IS updateListDataLabel - 체크한 사업의 모금상태('2'/'9') 또는 공개여부('Y'/'N')를 한꺼번에 바꾼다. */
function updateListDataLabel(value) {
	var ids = $("#listForm input[name='id']:checked");
	if (ids.length == 0) {
		alert("처리할 항목을 선택해 주세요.");
		return false;
	}
	if (!confirm("선택한 " + ids.length + "건을 처리하시겠습니까?")) {
		return false;
	}
	$.post('/designated-projects/bulk-update', $('#listForm').serialize() + '&value=' + value, function(response) {
		Common.responseHandler(response, function() {
			alert("처리되었습니다.");
			location.reload();
		});
	});
}

/* 아직 이식하지 않은 기능 - 없는 화면으로 보내지 않고 안내만 한다(원장의 다음 단계). */
/* AS-IS list.jsp 의 popupType·showLog·openPreview 그대로.
   공지사항만 팝업이 아니라 페이지 이동이다(AS-IS도 <a href>). */
var popupType = "toolbar=no,width=1510,height=700,top=150px,left=250px,directories=no,menubar=no,scrollbars=yes,location=no";

function showLog(el) {
	window.open('/designated-projects/' + el.getAttribute('data-id') + '/approval-log',
			'dsgncntrConfirmPopup', popupType);
}

function openPreview(el) {
	Common.popup('/designated-projects/' + el.getAttribute('data-id') + '/preview', "preview", 1600, 800, 0, 0, 0);
}

function notReady(name) {
	alert(name + " 기능은 아직 준비되지 않았습니다.");
}
</script>
