<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <meta charset="UTF-8">
    <title>지정기부 대표배너 관리 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/bootstrap/css/bootstrap.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/opmanager_print.css}" media="print">
    <link rel="stylesheet" type="text/css" th:href="@{/content/opmanager/css/fileUploadModal.css}">

</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/designated-donation/banner/list.jsp 재현 - PC/모바일 이미지 분리,
     최대 15슬롯 노출순서 관리. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>
    <div class="location"><a th:href="@{/designated-projects}">지정기부 관리</a></div>
    <h3><span>지정기부 대표배너 관리</span></h3>
    <div class="btn_all btn_right" style="margin-bottom:16px;">
        <a th:href="@{/designated-projects/banners/new}" class="btn btn-dark-gray btn-small">배너 등록</a>
    </div>

    <!-- AS-IS: 노출순서는 행마다 입력칸으로 고쳐 [순서변경]으로 한꺼번에 저장한다
         (id[]와 ordering[]을 같은 인덱스로 짝지어 ajax 전송). -->
    <form id="bannerOrderForm">
        <table class="board_list_table" summary="지정기부대표배너관리">
            <thead><tr><th scope="col">순서</th><th scope="col">PC 이미지</th><th scope="col">모바일 이미지</th><th scope="col">제목</th><th scope="col">사용여부</th><th scope="col">관리</th></tr></thead>
            <tbody>
            <tr th:each="b : ${banners}">
                <td>
                    <input type="hidden" name="id" th:value="${b.reprstBannerId}"/>
                    <input type="text" name="ordering" class="input_txt _number" style="width:60px;text-align:center;"
                           maxlength="2" th:value="${b.displayOrder}" title="노출순서"/>
                </td>
                <td><img th:if="${b.fileNamePc}" th:src="@{${b.fileNamePc}}" style="height:40px;" alt="PC 이미지"></td>
                <td><img th:if="${b.fileNameMobile}" th:src="@{${b.fileNameMobile}}" style="height:40px;" alt="모바일 이미지"></td>
                <td th:text="${b.title}"></td>
                <td th:text="${b.useYn == 'Y'} ? '사용' : '미사용'"></td>
                <td>
                    <a th:href="@{/designated-projects/banners/{id}/edit(id=${b.reprstBannerId})}" class="small-btn">수정</a>
                    <button type="button" class="small-btn ghost" style="margin-left:4px;"
                            th:attr="onclick=|toggleBanner(${b.reprstBannerId})|"
                            th:text="${b.useYn == 'Y'} ? '미사용으로' : '사용으로'"></button>
                </td>
            </tr>
            </tbody>
        </table>
    </form>
    <p class="empty" th:if="${#lists.isEmpty(banners)}">등록된 배너가 없습니다.</p>

    <div class="btn_all btn_right" th:if="${not #lists.isEmpty(banners)}">
        <div class="flex_box gap-08">
            <button type="button" class="btn btn-dark-gray btn-mini" onclick="changeOrdering();">순서변경</button>
        </div>
    </div>

    <!-- 사용여부 전환은 POST다 - 행마다 폼을 두지 않고 하나를 재사용한다 -->
    <form id="toggleForm" method="post" style="display:none;"></form>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript">
/* AS-IS /banner/change-ordering - 순서 일괄 변경(ajax, JSON 응답). */
function changeOrdering() {
	if (!confirm("노출순서를 저장하시겠습니까?")) {
		return;
	}
	$.post('/designated-projects/banners/change-ordering', $('#bannerOrderForm').serialize(), function(response) {
		Common.responseHandler(response, function() {
			alert("저장되었습니다.");
			location.reload();
		});
	});
}

function toggleBanner(id) {
	var $form = $('#toggleForm');
	$form.attr('action', '/designated-projects/banners/' + id + '/toggle').submit();
}
</script>
</body>
</html>
