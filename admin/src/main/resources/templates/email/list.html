<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 발송 - 고향사랑e음 (admin service)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: admin-nav()}"></div>

<div class="wrap">
    <h1>이메일 발송</h1>
    <p><a class="btn" th:href="@{/email/new}">+ 메일 작성</a></p>

    <table>
        <thead>
        <tr><th>ID</th><th>제목</th><th>대상</th><th>상태</th><th>발송일시</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${emails}">
            <td><a th:href="@{'/email/' + ${e.emailId}}" th:text="${e.emailId}"></a></td>
            <td><a th:href="@{'/email/' + ${e.emailId}}" th:text="${e.subject}"></a></td>
            <td th:text="${e.authTarget == 'A' ? '전체 관리자' : (e.authTarget == 'D' ? 'ROLE_ADMIN' : 'ROLE_OPERATOR')}"></td>
            <td th:text="${e.status == 'S' ? '발송완료' : (e.status == 'F' ? '일부실패' : '작성중')}"></td>
            <td th:text="${e.sendDate}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(emails)}">발송한 메일이 없습니다.</p>
</div>
</body>
</html>
