<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>이메일 발송 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/mail/list.jsp 이식. 검색구분(제목/내용)+검색어 · 등록일 범위 ·
     화면출력(10/20/50/100) · 6컬럼(No./제목/발송일/발송 상태/발송자/등록 일자) · 페이징 · 발송 버튼.

     AS-IS 자체 결함 3건 - 셋 다 사용자 확인 후 고쳤다(2026-10-03):
     1) [고침] 검색어가 동작하지 않았다. 쿼리(sqlEmailWhere)는 searchType이 'S'/'C'일 때만 제목
        LIKE를 걸지만 이 화면 select가 보내는 값은 SUBJECT/CONTENT라 어느 분기도 타지 않고,
        게다가 'C'(내용) 분기마저 CONTENT가 아니라 SUBJECT를 LIKE한다.
        → 화면 값대로 제목은 SUBJECT, 내용은 CONTENT를 보도록 바로잡았다.
     2) [살림] 검색 버튼이 `onclick="search();"`인데 이 JSP에도, 공통 JS에도 search()가 없어
        AS-IS에서는 눌러도 에러만 난다(= 동작하는 등록일 범위 검색조차 쓸 수 없다). 폼 submit으로 뒀다.
     3) [살림] 화면출력 select에 change 핸들러가 없어 AS-IS에서는 바꿔도 아무 일이 없다.
        같은 운영관리 목록화면(community/databoard/list.jsp 등)의 방식대로 itemsPerPage로 넘긴다.

     h3는 AS-IS가 `<h3><span></span></h3>`로 비어 있어 제목이 아예 안 보인다 - 같은 기능의
     form.jsp/detail.jsp가 쓰는 리터럴("이메일 발송")로 채웠다(약관관리 제목과 같은 처리). -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<h3><span>이메일 발송</span></h3>

<form id="searchParam" method="post" th:action="@{/email/list}">
	<input type="hidden" id="query" name="query" th:value="${searchParam.query}"/>
	<input type="hidden" id="itemsPerPage" name="itemsPerPage" th:value="${searchParam.itemsPerPage}"/>
	<div class="board_write">
		<table class="board_write_table" summary="이메일발송">
			<colgroup>
				<col style="width:220px;">
				<col>
			</colgroup>
			<tbody>
			<tr>
				<td class="label">검색구분</td>
				<td>
					<div class="flex_box gap-08">
						<select id="searchType" name="searchType" title="검색구분" class="wd-150">
							<!-- AS-IS도 "전체" option은 주석처리된 상태다 -->
							<option value="SUBJECT" th:selected="${searchParam.searchType == 'SUBJECT'}">제목</option>
							<option value="CONTENT" th:selected="${searchParam.searchType == 'CONTENT'}">내용</option>
						</select>
						<input type="text" id="searchContent" name="searchContent"
						       class="input_txt required _filter full" th:title="${msg.get('M00021')}"
						       th:value="${searchParam.searchContent}"/>
					</div>
				</td>
			</tr>
			<tr>
				<td class="label" th:text="${msg.get('M00202')}">등록일</td>
				<td>
					<div class="search-date">
						<span class="datepicker"><input type="text" id="searchStartDate" name="searchStartDate" class="datepicker optional " th:title="${msg.get('M00507')}" th:value="${searchParam.searchStartDate}" /></span>
						<span class="wave">~</span>
						<span class="datepicker"><input type="text" id="searchEndDate" name="searchEndDate" class="datepicker optional " th:title="${msg.get('M00509')}" th:value="${searchParam.searchEndDate}" /></span>

						<span class="day_btns">
							<a href="javascript:void(0);" class="btn_date today" th:text="${msg.get('M00026')}">오늘</a>
							<a href="javascript:void(0);" class="btn_date week-1" th:text="${msg.get('M00027')}">1주일</a>
							<a href="javascript:void(0);" class="btn_date month-1" th:text="${msg.get('M00029')}">한달</a>
							<a href="javascript:void(0);" class="btn_date month-3" th:text="${msg.get('M00030')}">3개월</a>
							<a href="javascript:void(0);" class="btn_date year-1" th:text="${msg.get('M00031')}">1년</a>
						</span>
					</div>
				</td>
			</tr>
			</tbody>
		</table>

		<div class="btn_all btn_right">
			<div class="flex_box gap-08">
				<button type="button" class="btn btn-default btn-mini" onclick="location.href='/email/list'" th:text="${msg.get('M00047')}">초기화</button>
				<button type="submit" class="btn btn-dark-gray btn-mini" th:text="${msg.get('M00048')}">검색</button>
			</div>
		</div>
	</div>

	<div class="count_title mt-40">
		<h5>
			총 <span th:text="${#numbers.formatInteger(pagination.totalItems, 0, 'COMMA')}" th:remove="tag">0</span>건
		</h5>
		<span>
			<select name="displayCount" id="displayCount" th:title="${msg.get('M00239')}">
				<option value="10" th:text="${msg.get('M00240')}">10개 출력</option>
				<option value="20" th:text="${msg.get('M00241')}">20개 출력</option>
				<option value="50" th:text="${msg.get('M00242')}">50개 출력</option>
				<option value="100" th:text="${msg.get('M00243')}">100개 출력</option>
			</select>
		</span>
	</div>
</form>

<div class="board_list">
	<table class="board_list_table" summary="">
		<caption></caption>
		<colgroup>
			<col style="width:50px;">
			<col style="width:500px;">
			<col style="width:100px;">
			<col style="width:100px;">
			<col style="width:150px;">
			<col style="width:100px;">
		</colgroup>
		<thead>
		<tr>
			<th scope="col">No.</th>
			<th scope="col">제목</th>
			<th scope="col">발송일</th>
			<th scope="col">발송 상태</th>
			<th scope="col">발송자</th>
			<th scope="col">등록 일자</th>
		</tr>
		</thead>
		<tbody>
			<!-- AS-IS는 No. 칸에 행번호가 아니라 EMAIL_ID를 찍는다 - 그대로 둔다 -->
			<tr th:each="email : ${list}" style="background:#fff;">
				<td th:text="${email.emailId}"></td>
				<td style="text-align:left;">
					<a th:href="@{'/email/' + ${email.emailId}}" th:text="${email.subject}"></a>
				</td>
				<td th:text="${email.sendDateText}"></td>
				<td th:text="${email.statusName}"></td>
				<td th:text="${email.userName}"></td>
				<td th:text="${email.frstRegistPnttmText}"></td>
			</tr>
		</tbody>
	</table>

	<div class="no_content" th:if="${#lists.isEmpty(list)}">
		등록된 발송이력이 없습니다.
	</div>

	<div class="pagination-wrap">
		<div th:replace="~{fragments/pagination :: manager(${pagination})}"></div>
	</div>

	<div class="btn_all btn_right">
		<div class="flex_box gap-08">
			<a th:href="@{/email/form}" class="btn btn-dark-gray btn-mini">발송</a>
		</div>
	</div>
</div>
    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->
<div th:replace="~{fragments/footer :: admin-footer}"></div>

<script type="text/javascript" th:inline="javascript">
$(function(){
	Common.DateButtonEvent.set('.day_btns > a[class^=btn_date]', '', 'input[name="searchStartDate"]' , 'input[name="searchEndDate"]');
	EventHandler.calendarStartDateAndEndDateVaild();

	// AS-IS에는 없는 바인딩(위 주석 3번) - 다른 운영관리 목록화면과 같은 방식
	$("#displayCount").val([[${searchParam.itemsPerPage}]]);
	$("#displayCount").on('change', function() {
		$("#itemsPerPage").val($(this).val());
		$("#searchParam").submit();
	});
});
</script>
</body>
</html>
