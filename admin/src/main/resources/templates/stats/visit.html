<!DOCTYPE html>
<html lang="ko" class="opmanager" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>접속통계 - 고향사랑e음 (admin service)</title>
    <th:block th:replace="~{fragments/opmanager-head :: headContent}"></th:block>
    <style>
        .tbl-summary { border-right: 1px solid #dedede; border-bottom: 1px solid #dedede; }
        .tbl-summary th, .tbl-summary td { border-left: 1px solid #dedede; border-top: 1px solid #dedede; text-align: center; }
        .tbl-summary th { background: #f4f4f4; padding: 10px; color: #000; }
        .tbl-summary td { padding: 22px; font-size: 20px; font-family: verdana; }
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-nav :: header()}"></div>

<!-- AS-IS opmanager/i18n/stats/visit/index.jsp 이식.
     요약 6칸(전체/오늘/어제/월별최대/일별최대/일별최소) · 검색기간(시작년~종료년 select) · 월별 접속통계 가로막대
     (월 이름 클릭 시 그 달의 일별 막대만 ajax 교체) · 이번 달 일별 접속통계 세로막대.
     GET은 막대를 비워 두고(AS-IS 빈 목록 하드코딩) 검색(POST)에서 채운다. 엑셀 버튼은 AS-IS도 ROLE_EXCEL
     (판매자 전용)에게만 보여 운영자 화면에는 없다.
     ※AS-IS 월별 막대 안에 "ß" 한 글자가 오타로 박혀 있다(</c:choose>ß) - 화면에 그대로 찍히는 쓰레기
     글자라 옮기지 않았다. -->
<div class="admin_wrap">
<div id="container">
    <div th:replace="~{fragments/admin-nav :: lnb()}"></div>
    <div class="contents">
    <div class="contents_inner">
        <div th:replace="~{fragments/admin-nav :: breadcrumb()}"></div>

<div class="statistics_web">
    <h3><span>접속통계</span></h3>
    <div class="">
        <table class="tbl-summary">
            <thead>
                <tr>
                    <th>전체</th>
                    <th>오늘</th>
                    <th>어제</th>
                    <th>월별최대</th>
                    <th>일별최대</th>
                    <th>일별최소</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td th:text="${#numbers.formatInteger(summary.total(), 0, 'COMMA')}">0</td>
                    <td th:text="${#numbers.formatInteger(summary.today(), 0, 'COMMA')}">0</td>
                    <td th:text="${#numbers.formatInteger(summary.yesterday(), 0, 'COMMA')}">0</td>
                    <td th:text="${#numbers.formatInteger(summary.monthMax(), 0, 'COMMA')}">0</td>
                    <td th:text="${#numbers.formatInteger(summary.dayMax(), 0, 'COMMA')}">0</td>
                    <td th:text="${#numbers.formatInteger(summary.dayMin(), 0, 'COMMA')}">0</td>
                </tr>
            </tbody>
        </table>

        <div class="btn_all" style="margin-top: 20px">
            <form id="searchParam" method="post" th:action="@{/stats/visit/index}">
                <fieldset>
                    <legend class="hidden">검색</legend>
                    <div class="left">
                        <span>검색기간: </span>
                        <select id="startDate" name="startDate">
                            <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                    th:selected="${#strings.toString(y) == searchParam.startDate}"></option>
                        </select>
                        <span class="wave">~</span>
                        <select id="endDate" name="endDate">
                            <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                    th:selected="${#strings.toString(y) == searchParam.endDate}"></option>
                        </select>

                        <div class="btn_all btn_right">
                            <div class="flex_box gap-08">
                                <button type="submit" class="btn btn-dark-gray btn-mini" style="margin-left: 1%;"><span class="glyphicon glyphicon-search"></span>검색 </button>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>

    <h4>월별 접속통계</h4>
    <div class="chart_horizontal chart_detail">
        <ul>
            <li th:each="monthStats : ${list}">
                <p class="name"><a href="javascript:;" th:attr="onclick=|getDayStats('${monthStats.yearMonth()}')|" th:text="${monthStats.title()}"></a></p>
                <div class="bar_wrap">
                    <p class="bar yellow" th:style="'width: ' + ${monthStats.percent()} + '%'">
                        <span th:if="${monthStats.percentValue() < 70.0}" class="number"
                              th:title="${#numbers.formatInteger(monthStats.monthCount(), 0, 'COMMA')} + ' (' + ${monthStats.percent()} + '%)'"
                              th:text="${#numbers.formatInteger(monthStats.monthCount(), 0, 'COMMA')} + ' (' + ${monthStats.percent()} + '%)'"></span>
                        <span th:unless="${monthStats.percentValue() < 70.0}" class="number number_over"
                              th:title="${#numbers.formatInteger(monthStats.monthCount(), 0, 'COMMA')} + ' (' + ${monthStats.percent()} + '%)'"
                              th:text="${#numbers.formatInteger(monthStats.monthCount(), 0, 'COMMA')} + ' (' + ${monthStats.percent()} + '%)'"></span>

                        <span class="tip"></span>
                    </p>
                </div>
            </li>
        </ul>
        <div th:if="${#lists.isEmpty(list)}" class="no_content">데이터가 없습니다.</div>
        <div class="bar_bg">
            <div class="grid">
                <div></div><div></div><div></div><div></div><div></div>
                <div></div><div></div><div></div><div></div><div></div>
            </div>
            <p class="label label_0">0</p>
            <p class="label label_50">50%</p>
            <p class="label label_100">100%</p>
        </div>
    </div>

    <div id="day_stats">
        <h4 class="mb50">
            <span th:text="${currentYear}" th:remove="tag"></span>년
            <span th:text="${currentMonth}" th:remove="tag"></span>월
            일별 접속통계
        </h4>
        <div class="chart_vertical daily">
            <table>
                <tr>
                    <td th:each="dayStats : ${dayStatsList}"><div>
                        <p class="name" th:text="${dayStats.displayDay()}"></p>
                        <div class="bar_wrap">
                            <p class="bar" th:style="'height: ' + ${dayStats.percent()} + '%'">
                                <span class="number"><span th:text="${dayStats.percent()}" th:remove="tag"></span>%<br />(<span th:text="${#numbers.formatInteger(dayStats.visitCount(), 0, 'COMMA')}" th:remove="tag"></span>)</span>
                            </p>
                        </div>
                    </div></td>
                </tr>
            </table>
            <div class="bar_bg">
                <div class="grid">
                    <div><p>100%</p></div>
                    <div><p>80%</p></div>
                    <div><p>60%</p></div>
                    <div><p>40%</p></div>
                    <div><p>20%</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function getDayStats(yearMonth) {
        $.get("/stats/visit/day", {'yearMonth': yearMonth}, function (response) {
            $('#day_stats').html(response);
        }, 'html');
    }
</script>

    </div><!-- /.contents_inner -->
    </div><!-- /.contents -->
</div><!-- /#container -->
</div><!-- /.admin_wrap -->

<div th:replace="~{fragments/footer :: admin-footer}"></div>
</body>
</html>
