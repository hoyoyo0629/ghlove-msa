<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 오류</title>
    <link rel="icon" href="/static/favicon.ico">
    <!-- <link rel="stylesheet" href="/static/css/defualt_ali.css"> -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            word-break: keep-all;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        .error404 {
            background-color: #f5f5f5;
            min-height: 100%;
            text-align: center;
            line-height: 1em;
        }

        .center {
            max-width: 1280px;
            margin: 0 auto;
            min-width: 360px;
        }

        .page-title-box {
            padding-top: 80px;
            text-align: center;
            position: relative;
            margin-bottom: 60px;
        }

        .page-title-box .page-title-txt {
            font-size: 50px;
            color: #00215A;
            margin-top: 16px;
            margin-bottom: 32px;
            line-height: 1.1em;
        }

        .error404 img {
            max-width: 100%;
        }

        .error404 #sub_contents {
            max-width: 700px;
        }

        .error404 #sub_contents .error_inner {
            background-color: #fff;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.16);
            padding: 60px;
        }

        .error404 #sub_contents .error_inner p {
            margin-bottom: 60px;
        }

        .page-title-box p {
            color: #878787;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5em;
        }

        @media screen and (max-width:768px) {
            .error404 {
                background-color: #fff;
            }

            .page-title-box {
                margin-bottom:16px;
                padding-top: 130px;
            }
            
            .page-title-box .page-title-txt {
                margin: 0 auto;
                width: 80%;
                font-size: 40px;

            }

            .error404 #sub_contents .error_inner {
                box-shadow: none;
                padding:0 20px;
            }
        }
    </style>
</head>

<body class="error404">
    <div class="center">
        <div class="page-title-box">
            <h2 class="page-title-txt">license invalid</h2>
        </div>
        <div id="sub_contents" class="center">
            <div class="page-title-box error_inner">
                
                <img src="../images/error404.png" alt="페이지에러">
            </div>
        </div>
        <!--// sub_contents  E-->
    </div>
</body>

</html>
