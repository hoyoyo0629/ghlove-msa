server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: admin
  datasource:
    url: jdbc:postgresql://localhost:15432/admindb
    username: admindb
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: admin-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read as raw JSON string and parsed manually (see the *StatsListener classes) -
      # admin doesn't share Java event classes with donation/order across the service
      # boundary. admin is consume-only here (builds a local stats ReadModel), so unlike
      # gift/point/order it never needs a spring.kafka.producer section.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 외부 연계시스템 통합 지점 (매직라인4웹 PKI, 카카오 알림톡, NH농협 데이터 연계).
# enabled=false(또는 ocsp-enabled=false)인 동안은 실제 외부망 호출 없이 로컬
# 검증/모크 로그로만 동작 - 방화벽이 열리면 값만 채우면 된다.
ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081
  point-service:
    base-url: http://localhost:8083
  gift-service:
    base-url: http://localhost:8084
  order-service:
    base-url: http://localhost:8085
  integrations:
    magicline:
      ocsp-enabled: false
    ums:
      enabled: false
      api-url: https://ums.example.com
      client-id: ""
    nh:
      enabled: false
      jdbc-url: jdbc:postgresql://nh-internal-host:5432/nhapi
      username: ""
      password: ""
    smart-delivery:
      enabled: false
      api-url: https://info.sweettracker.co.kr
      api-key: ""
    email:
      enabled: false
      smtp-host: ""
      from-address: noreply@ilovegohyang.go.kr

admin:
  upload:
    dir: ./uploads/admin

logging:
  level:
    com.ghlove.admin: DEBUG
