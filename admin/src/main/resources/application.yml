server:
  port: 8086
  servlet:
    session:
      # 세션ID를 URL에 붙이지 않는다(;ADMIN_SESSION=...). 기본값은 쿠키가 확인되지 않은 첫
      # 요청의 리다이렉트에 세션ID를 끼워 넣어 주소창·리퍼러·로그에 노출된다(member와 동일 설정).
      tracking-modes: cookie
      # ★ 쿠키는 포트를 구분하지 않는다. 기본 이름(JSESSIONID)을 쓰면 localhost에서 같이 띄운
      #   admin(8086)과 member(8081)가 서로의 세션 쿠키를 덮어써서, 운영자 화면에서 버튼을
      #   누르면 느닷없이 로그인 페이지로 튕긴다(2026-10-06 실측: admin·member 동시 사용 시 재현).
      #   AS-IS는 단일 애플리케이션이라 없던 문제이고, MSA로 쪼개면서 생긴 것이라 서비스별로
      #   쿠키 이름을 분리한다.
      cookie:
        name: ADMIN_SESSION
      # AS-IS SessionListener가 모든 세션에 setMaxInactiveInterval(30*60)을 건다 - 같은 값.
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: admin
  servlet:
    multipart:
      # AS-IS application-production.yml 그대로(50MB). 설정이 없으면 스프링 기본이 파일 1MB라
      # 1MB 넘는 업로드가 컨트롤러에 닿기도 전에 413이 된다 - 매뉴얼·자료실·커뮤니티 첨부는
      # 서비스 로직이 50MB를 허용하므로 그 규칙에 도달하려면 이 값이어야 한다.
      # (AS-IS 개발 프로필은 20MB지만 그 값으로는 50MB 규칙에 못 닿는다.)
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:15432/ghlove_core?currentSchema=admin
    username: admindb
    password: ghlove
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # SQL은 아래 logging 의 org.hibernate.SQL 로거로 일원화(System.out 중복 출력 방지)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: admin-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read as raw JSON string and parsed manually (see the *StatsListener classes) -
      # admin doesn't share Java event classes with donation/order across the service
      # boundary. admin is consume-only here (builds a local stats ReadModel), so unlike
      # gift/point/order it never needs a spring.kafka.producer section.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 외부 연계시스템 통합 지점 (매직라인4웹 PKI, 카카오 알림톡, NH농협 데이터 연계).
# enabled=false(또는 ocsp-enabled=false)인 동안은 실제 외부망 호출 없이 로컬
# 검증/모크 로그로만 동작 - 방화벽이 열리면 값만 채우면 된다.
ghlove:
  # SFR-010: member 서비스가 로그인 시 발급하는 공유 JWT를 이 값으로 검증한다 - member의
  # application.yml과 반드시 동일해야 한다.
  jwt:
    secret: "ghlove-msa-local-dev-shared-jwt-secret-key-32bytes-min!!"
  # order 서비스의 관리자 전용 API(주문/클레임 처리)를 호출할 때 관리자 신원 헤더와 함께
  # 싣는 공유시크릿 - order의 application.yml과 반드시 동일해야 한다. order의
  # AdminApiAuthInterceptor가 이 값으로 "이 호출이 실제 admin 서비스에서 왔는지"를 검증한다.
  internal:
    admin-secret: "ghlove-msa-local-dev-internal-admin-secret-do-not-expose!!"
  donation-service:
    base-url: http://localhost:8082
  member-service:
    base-url: http://localhost:8081
  point-service:
    base-url: http://localhost:8083
  gift-service:
    base-url: http://localhost:8084
  order-service:
    base-url: http://localhost:8085
  # SFR-010 민간개방 API - Kong Admin API. KONG_DATABASE=off(DB-less)에서는 컨슈머 등
  # 개별 엔티티 CRUD가 아예 막혀있어(POST/PUT 전부 "operation unsupported") POST /config로
  # 선언적 설정 전체를 재적용하는 방식만 쓸 수 있다 - declarative-config-path는 그 베이스가
  # 되는 정적 라우팅 파일(admin 프로세스가 Windows 호스트에서 직접 도는 것 기준 상대경로).
  # Kong 자체는 로컬에서 우리가 직접 띄운 인프라라 다른 integrations.*처럼 enabled=false
  # 모크 게이팅을 두지 않는다 - Kong이 안 떠 있으면 그냥 그대로 에러.
  kong:
    admin-url: http://localhost:8001
    declarative-config-path: ../infra/kong/kong-local.yaml
  integrations:
    magicline:
      ocsp-enabled: false
    ums:
      enabled: false
      api-url: https://ums.example.com
      client-id: ""
    nh:
      enabled: false
      jdbc-url: jdbc:postgresql://nh-internal-host:5432/nhapi
      username: ""
      password: ""
    smart-delivery:
      enabled: false
      api-url: https://info.sweettracker.co.kr
      api-key: ""
    email:
      enabled: false
      smtp-host: ""
      from-address: noreply@ilovegohyang.go.kr
    # 대량 메일발송(EMS) - AS-IS ems.host / ems.send.*. 내부망 전용이라 개발환경에서는 끈다.
    ems:
      enabled: false
      host: http://127.0.0.1:1/api/sendMail.do
      send-username: 고향사랑e음
      send-email: webmatser@ilovegohyang.go.kr
    # 국민비서(IPS) 문자발송 연계 - AS-IS sms.ips.*(세 값은 AS-IS 전 프로파일 동일값 그대로다).
    # 발송은 TIF_IPS_SNDNG_M에 한 행 적재하는 것으로 끝나고 ESB가 집어가 실제 문자를 보낸다.
    # 그래서 개발환경에서는 끈다 - AS-IS 소스에도 같은 이유의 로컬 가드가 들어가 있다
    # ("이 테이블 적재분은 국민비서 연계로 실제 문자가 나갈 수 있어").
    sms-ips:
      enabled: false
      svc-grp-id: "812"
      prvc-idntfc-se-cd: C0090001
      esb-if-id: IF_P01_MIS_IPS_ALM08
  # 도로명주소 검색 팝업(/admin/juso-popup) - 행정안전부 주소검색 API. 브라우저에서 JSONP로
  # 직접 호출하는 클라이언트 전용 위젯이고, AS-IS는 이 세 값을 juso-popup.jsp 안에 상수로
  # 박아 뒀다(아래 기본값이 AS-IS 소스의 값 그대로다). 운영 승인키 교체는 여기서 한다.
  # 행정망 내부에서 쓰려면 별도 요청URL이 필요하다(AS-IS 주석: 1588-0061).
  juso:
    confm-key: "U01TX0FVVEgyMDIyMTEyNTE0MTUzMTExMzI1OTc="
    domain: "https://business.juso.go.kr"
    # 1 도로명 / 2 +지번 / 3 +상세건물명 / 4 도로명+지번+상세건물명 (AS-IS는 4)
    result-type: "4"

admin:
  upload:
    dir: ./uploads/admin

# 로컬 개발 전용: P6Spy 가 datasource 를 감싸 파라미터가 인라인된(바로 실행 가능한) SQL 한 줄을
# 로거 'p6spy' 로 찍는다. developmentOnly 의존성이라 운영 bootJar 에는 P6Spy 자체가 없어 무효.
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: false        # 한 줄로 출력(복붙해서 바로 실행하기 좋게)
      log-format: "%(executionTime)ms | %(sqlSingleLine)"

logging:
  level:
    com.ghlove.admin: DEBUG
    p6spy: DEBUG                           # P6Spy 가 찍는 인라인 SQL
    # 아래 Hibernate 로거는 P6Spy 와 중복이라 꺼둔다(P6Spy 없이 순수 Hibernate 로그만 볼 땐 주석 해제)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
